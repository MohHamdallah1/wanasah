name: TEMP archive navigation canonical gate

on:
  push:
    branches:
      - lead/archive-navigation-canonical-access

jobs:
  focused-archive-navigation:
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: test
      SECRET_KEY: ArchiveNavigationLeadGateOnlyKey123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://archive_unit@127.0.0.1:1/archive_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://archive_admin@127.0.0.1:1/archive_unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: Compile adapters and focused tests
        run: |
          python -m py_compile \
            wa_backend/domains/inventory_archive_navigation.py \
            wa_backend/domains/dispatch_archive_navigation.py \
            wa_backend/domains/operations_archive_navigation.py \
            wa_backend/tests/test_archive_navigation_canonical_access.py \
            wa_backend/tests/test_archive_owner_navigation.py
      - name: Focused archive navigation tests
        working-directory: wa_backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_archive_navigation_canonical_access.py
          pytest -q tests/test_archive_owner_navigation.py \
            -k 'not owner_lookup_filters_existing_read_without_changing_default_scope and not operations_focused_read_keeps_historical_unsettled_session_scope'
          pytest -q tests/test_canonical_backoffice_capability_access.py
      - name: Forbidden direct authority audit
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('wa_backend/domains/inventory_archive_navigation.py'),
              Path('wa_backend/domains/dispatch_archive_navigation.py'),
              Path('wa_backend/domains/operations_archive_navigation.py'),
          ]
          for path in files:
              src = path.read_text(encoding='utf-8')
              for token in ('.is_admin', 'actor.company_id', 'access.actor'):
                  assert token not in src, (path, token)
              assert 'BackofficeCapabilityAccess' in src
          PY
      - name: Diff whitespace gate
        run: git diff --check 34f900d7b7859ec2d7789378b66380c3174017a9...HEAD

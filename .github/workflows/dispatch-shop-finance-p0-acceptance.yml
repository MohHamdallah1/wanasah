name: Dispatch Shop Finance P0 PG16 Bearer regression

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/api/dispatch.py"
      - "wa_backend/domains/dispatch_shop_finance_fence.py"
      - "wa_backend/tests/test_dispatch_shop_finance_edit_v1_postgres.py"
      - ".github/workflows/dispatch-shop-finance-p0-acceptance.yml"
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Exact approved base SHA for manual audited comparison"
        required: true
        type: string

permissions:
  contents: read

jobs:
  shop-finance-p0-exact-pg16:
    name: shop-finance-p0-pg16-real-bearer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ENVIRONMENT: test
      SECRET_KEY: Dispatch842FinanceDedicatedTestKey01234567890123456
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_DISPATCH_P0_PG_GATE: "1"
      WANASAH_SHOP_FINANCE_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify current PR base, #842 provenance and exact F06/CI-only file ownership
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess

          base = os.environ["BASE_SHA"]
          historic = "3339296caf9d0442eeab985d772f0c323351a935"
          assert re.fullmatch(r"[0-9a-f]{40}", base), "Finance base must be a real 40hex commit"
          for rev in (base, historic, "HEAD"):
              subprocess.run(["git", "cat-file", "-e", rev + "^{commit}"], check=True)
          def merge_base(a, b):
              return subprocess.check_output(
                  ["git", "merge-base", a, b], text=True,
              ).strip()
          assert merge_base(historic, base) == historic, (
              "Finance #842 historical approved MAIN provenance has been broken"
          )
          assert merge_base(base, "HEAD") == base, (
              "Finance must use the actual PR base (ancestor of HEAD)"
          )
          files = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True,
          ).splitlines())

          # Original #842 subset policy is deliberately preserved for legacy
          # edits. The new F06 and policy paths are admitted only in complete
          # standalone exact groups. No directory, prefix, or wildcard scope.
          finance_842_allowed = {
              "wa_backend/api/dispatch.py",
              "wa_backend/domains/dispatch_shop_finance_fence.py",
              "wa_backend/tests/test_dispatch_shop_finance_edit_v1_postgres.py",
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
          }
          shop_create_f06_exact = {
              ".github/workflows/dispatch-shop-create-f06-acceptance.yml",
              "wa_backend/api/dispatch.py",
              "wa_backend/domains/dispatch_shop_create.py",
              "wa_backend/schemas.py",
              "wa_backend/tests/test_dispatch_shop_create_f06_postgres.py",
          }
          ci_policy_861_exact = {
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
          }
          f06_new = shop_create_f06_exact - finance_842_allowed
          ci_new = ci_policy_861_exact - finance_842_allowed
          assert len(finance_842_allowed) == 4
          assert len(shop_create_f06_exact) == 5 and len(f06_new) == 4
          assert len(ci_policy_861_exact) == 2 and len(ci_new) == 1

          def ownership_mode(candidate):
              if candidate == shop_create_f06_exact:
                  return "SHOP_CREATE_F06_EXACT"
              if candidate == ci_policy_861_exact:
                  return "CI_POLICY_861_EXACT"
              if candidate & f06_new:
                  assert candidate == shop_create_f06_exact, (
                      f"Finance F06 exact scope rejected: "
                      f"missing={sorted(shop_create_f06_exact - candidate)} "
                      f"extra={sorted(candidate - shop_create_f06_exact)}"
                  )
                  return "SHOP_CREATE_F06_EXACT"
              if candidate & ci_new:
                  assert candidate == ci_policy_861_exact, (
                      f"Finance CI-policy #861 exact scope rejected: "
                      f"missing={sorted(ci_policy_861_exact - candidate)} "
                      f"extra={sorted(candidate - ci_policy_861_exact)}"
                  )
                  return "CI_POLICY_861_EXACT"
              assert candidate and candidate <= finance_842_allowed, (
                  f"Historic Finance #842 four-file ownership rejected: "
                  f"extra={sorted(candidate - finance_842_allowed)}"
              )
              return "FINANCE_842_LEGACY_BOUNDED"

          def denied(candidate, label):
              try:
                  ownership_mode(candidate)
              except AssertionError:
                  return
              raise AssertionError(f"{label}: unexpected Finance ownership admission: {sorted(candidate)}")

          # Preserve all original #842 nonempty subsets and its exact four-file
          # provenance, not a new general Dispatch or money write authority.
          finance_items = sorted(finance_842_allowed)
          assert ownership_mode(finance_842_allowed) == "FINANCE_842_LEGACY_BOUNDED"
          for bits in range(1, 1 << len(finance_items)):
              subset = {
                  item for i, item in enumerate(finance_items) if bits & (1 << i)
              }
              assert ownership_mode(subset) == "FINANCE_842_LEGACY_BOUNDED"
          denied(set(), "Empty comparison")

          assert ownership_mode(shop_create_f06_exact) == "SHOP_CREATE_F06_EXACT"
          f06_items = sorted(shop_create_f06_exact)
          f06_partial_denied = 0
          for bits in range(1 << len(f06_items)):
              subset = {
                  item for i, item in enumerate(f06_items) if bits & (1 << i)
              }
              if subset == shop_create_f06_exact:
                  continue
              if subset & f06_new:
                  denied(subset, "Partial F06 with new path")
                  f06_partial_denied += 1
              elif subset:
                  assert ownership_mode(subset) == "FINANCE_842_LEGACY_BOUNDED"
              else:
                  denied(subset, "F06 empty comparison")
          assert f06_partial_denied == 30, f06_partial_denied

          assert ownership_mode(ci_policy_861_exact) == "CI_POLICY_861_EXACT"
          denied({".github/workflows/dispatch-p0-route-stock-safety.yml"}, "CI-only partial")
          assert ownership_mode({
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
          }) == "FINANCE_842_LEGACY_BOUNDED"

          foreign_paths = (
              "wa_backend/api/driver.py",
              "wa_backend/main.py",
              "wa_backend/models.py",
              "wa_backend/services.py",
              "wa_backend/domains/dispatch_shortages_group.py",
              "wa_backend/domains/dispatch_shop_finance_fence.py",
              "wa_backend/domains/inventory/services.py",
              "wa_backend/domains/inventory_costing/service.py",
              "wa_backend/domains/authorization/backoffice_access.py",
              "wa_backend/tests/test_dispatch_shop_finance_edit_v1_postgres.py",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/components/dispatch/ShopFormModal.tsx",
              "dashboard/src/features/dispatch/shopOrder/scope.ts",
              "dashboard/src/features/dispatch/shopForm/useShopFormCommit.ts",
              "dashboard/src/hooks/useAuthFetch.ts",
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/live-stock-inflight-authority-acceptance.yml",
              ".github/workflows/live-stock-g04-outage-recovery.yml",
              "wanasah_frontend/lib/main.dart",
          )
          for label, exact in (
              ("SHOP_CREATE_F06_EXACT", shop_create_f06_exact),
              ("CI_POLICY_861_EXACT", ci_policy_861_exact),
          ):
              for foreign in foreign_paths + (
                  "wa_backend/api/dispatch.py",
                  "wa_backend/schemas.py",
                  ".github/workflows/dispatch-p0-route-stock-safety.yml",
              ):
                  if foreign not in exact:
                      denied(exact | {foreign}, f"{label} foreign {foreign}")
          for mixed in (
              shop_create_f06_exact | finance_842_allowed,
              shop_create_f06_exact | ci_policy_861_exact,
              shop_create_f06_exact | {
                  "dashboard/src/pages/DispatchBoard.tsx",
              },
              ci_policy_861_exact | finance_842_allowed,
              ci_policy_861_exact | {
                  "wa_backend/domains/dispatch_shop_create.py",
              },
          ):
              denied(mixed, "Mixed Finance/Shop/CI owner files")

          mode = ownership_mode(files)
          denied(files | {"wa_backend/domains/inventory/services.py"},
                 "Real PR foreign-file negative")
          print("HISTORIC_842_APPROVED_BASE=" + historic)
          print("ACTUAL_PR_BASE=" + base)
          print("EXACT_TEST_HEAD=" + subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True,
          ).strip())
          print(
              "FINANCE_861_POLICY_SELFTEST=PASS "
              f"finance_842_subsets=15 f06=5 f06_partials={f06_partial_denied} "
              "ci_policy=2 foreign=PASS mixed=PASS"
          )
          print(f"FINANCE_OWNER_SCOPE=PASS mode={mode} files={len(files)}")
          PY
          git diff --check "$BASE_SHA" HEAD --
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused backend test requirements
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Compile bounded money-fence module and focused test
        working-directory: wa_backend
        run: python -m py_compile domains/dispatch_shop_finance_fence.py tests/test_dispatch_shop_finance_edit_v1_postgres.py api/dispatch.py
      - name: Start ONLY disposable local PostgreSQL 16
        run: |
          docker run --detach --name dispatch-842-pg16 \
            --env POSTGRES_USER=p0_dispatch_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec dispatch-842-pg16 pg_isready -U p0_dispatch_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs dispatch-842-pg16
          exit 1
      - name: Create isolated NOBYPASSRLS application role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(uri, autocommit=True) as conn:
              conn.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Full real Alembic migrations
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant DML on disposable schema to restricted role only
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(uri, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Assert fresh PostgreSQL16 and restricted runtime identity
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(uri) as conn:
              name, role, version, superuser, bypass = conn.execute(
                  "SELECT current_database(), current_user, current_setting('server_version_num')::int, "
                  "rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user"
              ).fetchone()
              print("PG16_ROLE_EVIDENCE", name, role, version, superuser, bypass)
              assert name == "wanasah_no_lot_contract_test"
              assert role == "wanasah_app" and 160000 <= version < 170000
              assert not superuser and not bypass
          PY
      - name: Run real FIELD & Backoffice Bearer finance correction and original physical safety PG16
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_dispatch_shop_finance_edit_v1_postgres.py
          tests/test_dispatch_p0_route_stock_safety_postgres.py
          --junitxml=shop-finance-p0-pg16-junit.xml
      - name: Report all PASS/FAIL/ERROR/SKIP and enforce green safety release
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          path = "shop-finance-p0-pg16-junit.xml"
          if not os.path.isfile(path):
              print("PG16 EVIDENCE NOT PRODUCED: no JUnit XML")
              sys.exit(1)
          cases = list(ET.parse(path).getroot().iter("testcase"))
          passed = failed = skipped = errors = 0
          for case in cases:
              bad = case.find("failure")
              error = case.find("error")
              skip = case.find("skipped")
              status = ("FAIL" if bad is not None else
                        "ERROR" if error is not None else
                        "SKIP" if skip is not None else "PASS")
              print(f"CASE {status}: {case.attrib.get('classname')}.{case.attrib.get('name')}")
              if bad is not None:
                  failed += 1
                  print((bad.text or "")[:4000])
              elif error is not None:
                  errors += 1
                  print((error.text or "")[:4000])
              elif skip is not None:
                  skipped += 1
              else:
                  passed += 1
          print(f"PG16_CASES={len(cases)} PASS={passed} FAIL={failed} ERROR={errors} SKIP={skipped}")
          assert len(cases) >= 19, "Expected >=8 real Shop Finance cases and 11 existing physical safety cases"
          assert skipped == 0, "A skip is UNPROVEN, not an accepted PG16 PASS"
          assert failed == errors == 0, "Shop financial P0 and prior stock safety must PASS"
          PY
      - name: Publish JUnit even on regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-finance-p0-pg16-junit-${{ github.run_id }}
          path: wa_backend/shop-finance-p0-pg16-junit.xml
          if-no-files-found: warn
      - name: Show disposable PG logs on startup/migration failure
        if: failure()
        run: docker logs dispatch-842-pg16 2>/dev/null | tail -n 130 || true

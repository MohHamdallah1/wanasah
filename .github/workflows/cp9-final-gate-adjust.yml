name: CP9 bounded final gate adjustments

on:
  push:
    branches:
      - sol/cp9-stocktake-full-closure-wave2

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/cp9-stocktake-full-closure-wave2
      - name: Register referenced metadata and scope CP5 regression to Stocktake
        run: |
          python - <<'PY'
          from pathlib import Path

          pg = Path('wa_backend/tests/test_cp9_stocktake_postgres.py')
          s = pg.read_text(encoding='utf-8')
          anchor = 'from api.warehouse import stocktake as stocktake_api\n'
          addition = 'from domains.sales_evidence import models as _sales_evidence_models  # noqa: F401\n'
          if addition not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('stocktake import anchor changed')
              s = s.replace(anchor, anchor + addition)
          pg.write_text(s, encoding='utf-8')

          wf = Path('.github/workflows/inventory-cp9-stocktake-acceptance.yml')
          w = wf.read_text(encoding='utf-8')
          old = 'run: npm test -- src/test/archive-owner-receivers.test.tsx'
          new = 'run: npm test -- src/test/archive-owner-receivers.test.tsx -t "Stocktake owner focus"'
          if old not in w and new not in w:
              raise SystemExit('CP5 regression command anchor changed')
          w = w.replace(old, new)
          wf.write_text(w, encoding='utf-8')
          PY
          python -m py_compile wa_backend/tests/test_cp9_stocktake_postgres.py
          rm .github/workflows/cp9-final-gate-adjust.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wa_backend/tests/test_cp9_stocktake_postgres.py .github/workflows/inventory-cp9-stocktake-acceptance.yml .github/workflows/cp9-final-gate-adjust.yml
          git commit -m 'CP9: align PostgreSQL metadata and scoped CP5 regression'
          git push origin HEAD:sol/cp9-stocktake-full-closure-wave2

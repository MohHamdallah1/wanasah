# Temporary acceptance gate; remove after a fully green run.
name: Representatives role provisioning acceptance

on:
  push:
    branches:
      - sol/representatives-role-provisioning-acceptance
    paths:
      - ".github/workflows/representatives-role-provisioning-acceptance.yml"

permissions:
  contents: read

jobs:
  role-provisioning-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: representatives_role_admin
          POSTGRES_DB: representatives_role_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U representatives_role_admin -d representatives_role_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: RepresentativesRoleProvisioningSyntheticSecret12345678901234567890
      DATABASE_URL: postgresql+asyncpg://representatives_runtime@127.0.0.1:5432/representatives_role_gate
      DATABASE_URL_MIGRATION: postgresql+asyncpg://representatives_role_admin@127.0.0.1:5432/representatives_role_gate
      WANASAH_REPRESENTATIVES_ROLE_DB_GATE: "1"
      BASE_SHA: bcfd8d1dfa3650651256708e9b151cf3c5fc3a63

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Verify branch scope before validation
        run: |
          python - <<'PY'
          import os
          import subprocess

          allowed = {
              ".github/workflows/representatives-role-provisioning-acceptance.yml",
              "dashboard/src/i18n/representativesVehicles.ts",
              "dashboard/src/pages/inventory/TabInventoryAccess.tsx",
              "dashboard/src/pages/inventory/TabInventoryAccess.representatives.test.ts",
              "wa_backend/tests/test_representatives_role_provisioning_runtime_db.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          print("changed:", *sorted(changed), sep="\n- ")
          if unexpected:
              raise SystemExit(f"Unexpected branch scope: {unexpected}")
          PY

      - name: Install backend test dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1

      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE representatives_runtime LOGIN NOSUPERUSER "
                  "NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Migrate PostgreSQL 16 to head
        working-directory: wa_backend
        run: alembic upgrade head

      - name: Verify Alembic/model head
        working-directory: wa_backend
        run: alembic check

      - name: PostgreSQL Representative role provisioning acceptance
        working-directory: wa_backend
        run: python -m pytest -q tests/test_representatives_role_provisioning_runtime_db.py

      - name: Focused role and authorization regressions
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_inventory_access_canonical_cutover.py
          tests/test_inventory_access_canonical_boundary.py
          tests/test_canonical_backoffice_authorization_dependency.py
          tests/test_representatives_contract.py
          tests/test_representatives_architecture.py

      - name: Compile affected backend
        working-directory: wa_backend
        run: >-
          python -m compileall -q
          api/inventory_permissions.py
          api/representatives
          domains/authorization
          tests/test_representatives_role_provisioning_runtime_db.py

      - name: Install locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      - name: Focused Dashboard RBAC tests
        working-directory: dashboard
        run: >-
          npm test --
          src/pages/inventory/TabInventoryAccess.representatives.test.ts
          src/pages/representatives-vehicles/representatives/representativeAuthorization.test.ts

      - name: Affected Dashboard ESLint
        working-directory: dashboard
        run: >-
          npx eslint
          src/pages/inventory/TabInventoryAccess.tsx
          src/pages/inventory/TabInventoryAccess.representatives.test.ts
          src/i18n/representativesVehicles.ts

      - name: Prepare unmodified Dashboard baseline
        run: |
          mkdir baseline
          git archive --format=tar --output=baseline.tar "$BASE_SHA" dashboard
          tar -xf baseline.tar -C baseline

      - name: Reject new TypeScript diagnostics
        working-directory: dashboard
        run: node scripts/check-types-against-baseline.mjs ../baseline/dashboard

      - name: Production Dashboard build
        working-directory: dashboard
        run: npm run build

      - name: Diff whitespace gate
        run: git diff --check "$BASE_SHA" HEAD

      - name: Final branch scope gate
        run: |
          python - <<'PY'
          import os
          import subprocess

          allowed = {
              ".github/workflows/representatives-role-provisioning-acceptance.yml",
              "dashboard/src/i18n/representativesVehicles.ts",
              "dashboard/src/pages/inventory/TabInventoryAccess.tsx",
              "dashboard/src/pages/inventory/TabInventoryAccess.representatives.test.ts",
              "wa_backend/tests/test_representatives_role_provisioning_runtime_db.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"Unexpected branch scope: {unexpected}")
          PY

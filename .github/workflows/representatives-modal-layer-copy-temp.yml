name: Representatives modal layer and copy acceptance

on:
  push:
    branches:
      - sol/representatives-modal-layer-copy-ux
    paths:
      - .github/workflows/representatives-modal-layer-copy-temp.yml

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_HEAD: 10223fd237775ca1fc70fdd771693a93a8386243
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/representatives-modal-layer-copy-ux
          fetch-depth: 0

      - name: Apply focused Dashboard UX correction
        run: python .github/representatives_modal_apply.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Focused Representatives and shared modal tests
        working-directory: dashboard
        run: npx vitest run src/pages/representatives-vehicles src/components/ui/modal.test.tsx

      - name: Affected ESLint
        working-directory: dashboard
        run: npx eslint src/components/ui/modal.tsx src/components/ui/modal.test.tsx src/pages/representatives-vehicles src/i18n/representativesVehicles.ts

      - name: TypeScript baseline check
        shell: bash
        run: |
          rm -rf baseline
          mkdir baseline
          git archive --format=tar --output=/tmp/dashboard-base.tar "$BASE_HEAD" dashboard
          tar -xf /tmp/dashboard-base.tar -C baseline
          cd dashboard
          node scripts/check-types-against-baseline.mjs ../baseline/dashboard

      - name: Production build
        working-directory: dashboard
        run: npm run build

      - name: Install Playwright test package
        working-directory: dashboard
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Real Chrome modal acceptance
        working-directory: dashboard
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4182 >/tmp/representative-modal-vite.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4182/representative-modal-acceptance.html >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test --config=playwright.modal.config.cjs
          kill "$PID" 2>/dev/null || true
          trap - EXIT

      - name: Scope and semantic preservation gates
        shell: bash
        run: |
          git diff --check "$BASE_HEAD"
          git diff --exit-code "$BASE_HEAD" -- dashboard/src/pages/representatives-vehicles/representatives/usernamePolicy.ts dashboard/src/pages/representatives-vehicles/representatives/usernamePolicy.test.ts
          changed="$(git diff --name-only "$BASE_HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^wa_backend/|^wanasah_frontend/|dashboard/src/pages/representatives-vehicles/vehicles/|alembic/versions/'; then exit 1; fi
          allowed='^(\.github/workflows/representatives-modal-layer-copy-temp\.yml|\.github/representatives_modal_apply\.py|dashboard/representative-modal-acceptance\.html|dashboard/playwright\.modal\.config\.cjs|dashboard/representative-modal\.acceptance\.spec\.cjs|dashboard/src/representative-modal-acceptance\.tsx|dashboard/src/components/ui/modal\.tsx|dashboard/src/components/ui/modal\.test\.tsx|dashboard/src/i18n/representativesVehicles\.ts|dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm\.tsx|dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm\.test\.tsx)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          grep -F 'import { Modal } from "@/components/ui/modal";' dashboard/src/pages/representatives-vehicles/representatives/RepresentativesTab.tsx
          grep -F 'import { Modal } from "@/components/ui/modal";' dashboard/src/pages/representatives-vehicles/representatives/RepresentativeLifecycleActions.tsx
          grep -F 'import { Modal } from "@/components/ui/modal";' dashboard/src/pages/representatives-vehicles/representatives/RepresentativeCredentialAction.tsx
          ! grep -F 'form.debtHint' dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.tsx
          ! grep -F 'هذا الحد هو أقصى مبلغ ذمم جديد في عملية بيع واحدة' dashboard/src/i18n/representativesVehicles.ts

      - name: Commit validated Dashboard changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/src/components/ui/modal.tsx dashboard/src/components/ui/modal.test.tsx dashboard/src/i18n/representativesVehicles.ts dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.tsx dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.test.tsx
          git commit -m 'fix(dashboard): correct representative modal layering and copy'
          git push origin HEAD:sol/representatives-modal-layer-copy-ux

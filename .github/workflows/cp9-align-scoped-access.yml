name: CP9 align scoped access

on:
  push:
    branches:
      - sol/cp9-stocktake-full-closure-wave2

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/cp9-stocktake-full-closure-wave2
      - name: Align scoped access fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wa_backend/tests/test_cp9_stocktake_postgres.py')
          s = p.read_text(encoding='utf-8')
          old_sig = '    async def require(self, code: str, *, location_id: int | None = None):'
          new_sig = '    async def require(self, code: str, location_id: int | None = None, *, any_location: bool = False):'
          old_guard = '        if location_id is None or location_id not in allowed:\n            raise HTTPException(status_code=403, detail="Forbidden")'
          new_guard = '        if any_location:\n            if not allowed:\n                raise HTTPException(status_code=403, detail="Forbidden")\n            return\n        if location_id is None or location_id not in allowed:\n            raise HTTPException(status_code=403, detail="Forbidden")'
          if s.count(old_sig) != 1 or s.count(old_guard) != 1:
              raise SystemExit('ScopedAccess fixture anchors changed')
          p.write_text(s.replace(old_sig, new_sig).replace(old_guard, new_guard), encoding='utf-8')
          PY
          python -m py_compile wa_backend/tests/test_cp9_stocktake_postgres.py
          rm .github/workflows/cp9-align-scoped-access.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wa_backend/tests/test_cp9_stocktake_postgres.py .github/workflows/cp9-align-scoped-access.yml
          git commit -m 'CP9: align PostgreSQL ScopedAccess fixture'
          git push origin HEAD:sol/cp9-stocktake-full-closure-wave2

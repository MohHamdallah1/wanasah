name: "Stocktake V1 #782 operator UX React AR-EN"

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/pages/inventory/stocktake/**"
      - "dashboard/src/pages/inventory/Tab3Stocktake.tsx"
      - "dashboard/e2e/stocktake-v1-ux-776.spec.ts"
      - ".github/workflows/stocktake-v1-operator-782.yml"

permissions:
  contents: read

jobs:
  focused-react-operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Focused AR EN operator and inherited review tests
        working-directory: dashboard
        run: |
          tests=(src/pages/inventory/stocktake/StocktakeOperatorUx782.test.tsx src/pages/inventory/stocktake/StocktakeReviewV1Parity.test.tsx)
          for test_file in src/pages/inventory/stocktake/StocktakeShellLayout.test.tsx src/pages/inventory/stocktake/StocktakeUnifiedWorkspaceV1.test.tsx src/pages/inventory/stocktake/StocktakeCountEntryArithmetic.test.ts src/pages/inventory/stocktake/StocktakeFastCountV1.test.tsx; do
            if [ -f "$test_file" ]; then tests+=("$test_file"); fi
          done
          npm test -- "${tests[@]}"
      - name: TypeScript and owned frontend ESLint
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npx eslint src/pages/inventory/stocktake/StocktakeCycleStartModal.tsx src/pages/inventory/stocktake/StocktakeCountingPanel.tsx src/pages/inventory/stocktake/StocktakeReviewPanel.tsx src/pages/inventory/stocktake/StocktakeOperatorUx782.test.tsx src/pages/inventory/stocktake/hooks/useCycleCountStart.ts src/pages/inventory/stocktake/uiCopy.ts src/pages/inventory/Tab3Stocktake.tsx e2e/stocktake-v1-ux-776.spec.ts
      - name: Exact frontend-only scope and immutable full-count door
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$BASE_SHA" HEAD
          git diff --exit-code "$BASE_SHA" HEAD -- dashboard/src/pages/inventory/stocktake/StocktakeIdlePanel.tsx dashboard/src/pages/inventory/stocktake/StocktakeCountModals.tsx
          python - <<'PY'
          import os
          import subprocess
          base = os.environ["BASE_SHA"]
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          expected = {
              ".github/workflows/stocktake-v1-operator-782.yml",
              "dashboard/e2e/stocktake-v1-ux-776.spec.ts",
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeCycleStartModal.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeOperatorUx782.test.tsx",
              "dashboard/src/pages/inventory/stocktake/hooks/useCycleCountStart.ts",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          shell_789 = {
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeSessionCenter.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeShellLayout.test.tsx",
              "dashboard/e2e/stocktake-shell-782/stocktake-v1-ux-776.spec.ts",
          }
          workspace_788 = {
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeIndependentWait.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeUnifiedWorkspaceV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          ci_782 = {
              ".github/workflows/stocktake-v1-operator-782.yml",
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
              ".github/scripts/live_stock_ci_ownership.py",
          }
          # Owner-approved isolated screenshot density refinements; no prefixes.
          compact_791 = {
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeUnifiedWorkspaceV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          # #792 reuses exactly the previously accepted #789 five-file scope.
          dialog_792 = set(shell_789)
          bridge_793 = set(ci_782) | {"dashboard/e2e/stocktake-v1-ux-776.spec.ts"}
          uom_794 = {
              "wa_backend/api/warehouse/stocktake.py",
              "wa_backend/api/warehouse/stocktake_discovery.py",
              "wa_backend/domains/stocktake/count_uom_read.py",
              "wa_backend/domains/uom_authority.py",
              "wa_backend/tests/stocktake_v1_real_http_pg16_helper.py",
              "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py",
              "wa_backend/tests/test_stocktake_nullable_expiry_serialization.py",
          }
          fast_795 = {
              "dashboard/e2e/stocktake-v1-ux-776.spec.ts",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/inventoryUtils.ts",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountEntryArithmetic.test.ts",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeFastCountV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/countEntry.ts",
              "dashboard/src/pages/inventory/stocktake/discoveredContract.ts",
              "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeCounting.ts",
              "dashboard/src/pages/inventory/stocktake/parsers.ts",
              "dashboard/src/pages/inventory/stocktake/types.ts",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          ci_796 = {
              ".github/workflows/stocktake-v1-operator-782.yml",
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
              ".github/workflows/stocktake-v1-session-read-fence.yml",
          }
          allowed = {frozenset(x): label for label, x in (
              ("OPERATOR_UX_784", expected),
              ("SINGLE_TOOLBAR_789", shell_789),
              ("UNIFIED_WORKSPACE_788", workspace_788),
              ("FINAL_CI_782", ci_782),
              ("COMPACT_COUNT_791", compact_791),
              ("DENSITY_CI_BROWSER_BRIDGE", bridge_793),
              ("UOM_794", uom_794),
              ("FAST_795", fast_795),
              ("CI_796", ci_796),
          )}
          assert len(allowed) == 9
          assert dialog_792 == shell_789
          assert allowed[frozenset(dialog_792)] == "SINGLE_TOOLBAR_789"
          def verify(paths):
              label = allowed.get(frozenset(paths))
              assert label is not None, {"error": "STOCKTAKE_782_SCOPE_FAIL", "changed": sorted(paths)}
              return label
          for label, paths in (
              ("OPERATOR_UX_784", expected),
              ("SINGLE_TOOLBAR_789", shell_789),
              ("UNIFIED_WORKSPACE_788", workspace_788),
              ("FINAL_CI_782", ci_782),
              ("COMPACT_COUNT_791", compact_791),
              ("DENSITY_CI_BROWSER_BRIDGE", bridge_793),
              ("UOM_794", uom_794),
              ("FAST_795", fast_795),
              ("CI_796", ci_796),
          ):
              assert verify(paths) == label
              # Some separately approved exact scopes are subsets of earlier
              # scopes (e.g. compact_791 ⊂ workspace_788). Select a truly
              # unapproved subset deterministically, not hash-order first().
              invalid_subset = next(
                  (paths - {name} for name in sorted(paths)
                   if frozenset(paths - {name}) not in allowed),
                  None,
              )
              assert invalid_subset is not None, label
              for invalid in (set(), invalid_subset,
                              paths | {"wa_backend/services.py"},
                              paths | {"dashboard/src/pages/inventory/Tab4Ledger.tsx"}):
                  try:
                      verify(invalid)
                  except AssertionError:
                      pass
                  else:
                      raise AssertionError("An incomplete or foreign Stocktake scope was accepted")
          print(f"STOCKTAKE_782_FRONTEND_ONLY_AND_FULL_DOOR_IMMUTABLE={verify(changed)}_PASS")
          PY

name: CP9 stabilize actor fixture

on:
  push:
    branches:
      - sol/cp9-stocktake-full-closure-wave2

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/cp9-stocktake-full-closure-wave2
      - name: Snapshot legacy actors outside ORM rollback lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('wa_backend/tests/test_cp9_stocktake_postgres.py')
          s = p.read_text(encoding='utf-8')
          anchor = '        await self.db.commit()\n\n        all_a = {self.a1, self.a2, self.empty, self.va_location}\n'
          replacement = '''        await self.db.commit()

        # Route-level idempotency replay intentionally rolls the transaction back.
        # Keep legacy actor provenance independent from ORM expiration caused by that rollback.
        self.actor_a = SimpleNamespace(
            id=int(actor_a.id), username=str(actor_a.username),
            full_name=str(actor_a.full_name), password_hash=password_hash,
        )
        self.actor_a2 = SimpleNamespace(
            id=int(actor_a2.id), username=str(actor_a2.username),
            full_name=str(actor_a2.full_name), password_hash=password_hash,
        )
        self.actor_b = SimpleNamespace(
            id=int(actor_b.id), username=str(actor_b.username),
            full_name=str(actor_b.full_name), password_hash=password_hash,
        )

        all_a = {self.a1, self.a2, self.empty, self.va_location}
'''
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one post-seed commit anchor, got {s.count(anchor)}')
          p.write_text(s.replace(anchor, replacement), encoding='utf-8')
          PY
          python -m py_compile wa_backend/tests/test_cp9_stocktake_postgres.py
          rm .github/workflows/cp9-stabilize-actor-fixture.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wa_backend/tests/test_cp9_stocktake_postgres.py .github/workflows/cp9-stabilize-actor-fixture.yml
          git commit -m 'CP9: stabilize PostgreSQL actor fixtures across replay rollback'
          git push origin HEAD:sol/cp9-stocktake-full-closure-wave2

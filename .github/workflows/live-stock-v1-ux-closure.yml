name: Live Stock V1 complete UX and accessibility closure

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/pages/inventory/MainInventory.tsx"
      - "dashboard/src/pages/inventory/Tab1LiveStock.tsx"
      - "dashboard/src/pages/inventory/inventory.css"
      - "dashboard/src/pages/inventory/liveStock/**"
      - "dashboard/src/i18n/resources.ts"
      - "dashboard/src/test/live-stock-*.test.ts"
      - "dashboard/src/test/live-stock-*.test.tsx"
      - "dashboard/src/test/inventory-cp7-live-stock.test.tsx"
      - "dashboard/e2e/live-stock-ux-closure.*.ts"
      - ".github/workflows/live-stock-v1-ux-closure.yml"
      - ".github/scripts/live_stock_ci_ownership.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-v1-ux-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ux-accessibility-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      - name: Install disposable browser and focused test peers
        working-directory: dashboard
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps \
            playwright@1.55.0 @testing-library/dom@10.4.1
          npx playwright install --with-deps chromium

      - name: Focused Live Stock frontend tests
        working-directory: dashboard
        run: |
          npx vitest run \
            src/test/live-stock-render-windowing.test.tsx \
            src/test/live-stock-family-cursor.test.tsx \
            src/test/live-stock-ui-stability.test.ts \
            src/test/inventory-cp7-live-stock.test.tsx

      - name: TypeScript application and UX browser proof
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --types node --lib es2022,dom \
            e2e/live-stock-ux-closure.config.ts \
            e2e/live-stock-ux-closure.fixtures.ts \
            e2e/live-stock-ux-closure.spec.ts

      - name: Production build
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174/api
        run: npm run build

      - name: Start isolated built Dashboard
        working-directory: dashboard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/live-stock-v1-ux-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/inventory >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-stock-v1-ux-preview.log
          exit 1

      - name: Chromium UX accessibility and recovery acceptance
        working-directory: dashboard
        run: npx playwright test --config e2e/live-stock-ux-closure.config.ts

      - name: Require visual evidence matrix
        run: |
          count=$(find dashboard/node_modules/.cache/live-stock-ux-closure -type f -name '*.png' | wc -l)
          echo "LIVE_STOCK_UX_SCREENSHOTS=$count"
          test "$count" -ge 5

      - name: Verify focused Live Stock UX ownership policy
        run: |
          python -B .github/scripts/live_stock_ci_ownership.py --selftest
          python -B .github/scripts/live_stock_ci_ownership.py \
            --mode ux \
            --base "${{ github.event.pull_request.base.sha || github.sha }}"

      - name: Publish checklist evidence summary
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Live Stock V1 UX closure evidence
          | Clause | Evidence |
          |---|---|
          | Compact modern responsive surface | Production build + Chromium desktop/tablet/mobile screenshots |
          | Quantity semantics and vehicle disclosure | Focused CP7 + browser source/detail assertions |
          | Search/filter/family reset + keyboard | Chromium keyboard journey |
          | Thousands variable-height rows | 2050-row cursor journey, bounded DOM, unique cursor chain |
          | Multi-batch/source recovery | Two-batch alternate/open/reopen/error/retry journey |
          | Arabic/English + RTL/LTR + light/dark | Five Chromium visual states |
          | Partial failure + revocation | Summary/continuation failure recovery and stale disclosure denial |
          | Other-tab request budget | Zero Live Stock list/summary/family reads while Batches is active |
          | Owner visual acceptance | Screenshot artifact is intentionally left for owner approval |
          EOF

      - name: Upload Chromium screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-v1-ux-visual-evidence
          path: dashboard/node_modules/.cache/live-stock-ux-closure
          if-no-files-found: warn

name: Live Stock G04 real outage and fail-closed recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/live_stock_g04_outage_support.py"
      - "wa_backend/tests/test_live_stock_g04_outage_http.py"
      - "dashboard/e2e/live-stock-g04-outage.*"
      - ".github/workflows/live-stock-g04-outage-recovery.yml"
      - "wa_backend/main.py"
      - "wa_backend/api/authentication/dependencies.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-g04-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-outage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      SECRET_KEY: LiveStockG04DisposablePg16OnlyKey12345678901234567890
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://g04_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_REAL_BROWSER_GATE: "1"
      WANASAH_G04_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://g04_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_OPERATIONAL_BROWSER_STATE: /tmp/live-stock-g04-state.json
      WANASAH_G04_REVOKED_STATE: /tmp/live-stock-g04-revoked.json
      WANASAH_G04_API: http://127.0.0.1:4174
      WANASAH_G04_DB_CONTAINER: live-stock-g04-pg
      R3_BACKEND_ROOT: ${{ github.workspace }}/wa_backend
      VITE_API_URL: http://127.0.0.1:4174
      PYTHON: python

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install focused backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Compile dedicated G04 evidence
        run: |
          python -m py_compile \
            wa_backend/tests/live_stock_g04_outage_support.py \
            wa_backend/tests/test_live_stock_g04_outage_http.py

      - name: Start disposable PostgreSQL16
        run: |
          for attempt in 1 2 3; do
            if docker pull postgres:16; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to pull postgres:16 after bounded retries"
              exit 1
            fi
            sleep 2
          done
          docker run --detach --pull=never --name live-stock-g04-pg \
            --env POSTGRES_USER=g04_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 40); do
            if docker exec live-stock-g04-pg pg_isready -U g04_admin -d wanasah_no_lot_contract_test -p 55439; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Create restricted NOBYPASSRLS runtime role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY

      - name: Fresh schema and scoped runtime grants
        run: |
          cd wa_backend
          alembic upgrade head
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
              db.execute("INSERT INTO permissions(code) VALUES ('inventory.read'), ('location.read'), ('inbound.create') ON CONFLICT(code) DO NOTHING")
          dsn = make_url(os.environ["DATABASE_URL"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn) as db:
              assert db.execute("SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user").fetchone() == (False, False)
              rows = db.execute("SELECT relrowsecurity, relforcerowsecurity FROM pg_class WHERE relname IN ('inventory_balances','inventory_movements')").fetchall()
              assert len(rows) == 2 and all(a and b for a,b in rows)
          print("G04_RUNTIME_ROLE_AND_FORCE_RLS PASS")
          PY

      - name: Reuse canonical operational fixture
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/live_stock_operational_browser_support.py::test_prepare_operational_browser
          --junitxml=/tmp/live-stock-g04-fixture.xml

      - name: Reuse canonical physical Vehicle custody
        run: |
          python dashboard/e2e/live-stock-physical-custody.fixture.py setup
          python dashboard/e2e/live-stock-physical-custody.fixture.py grant
          python dashboard/e2e/live-stock-physical-custody.fixture.py load

      - name: Start actual FastAPI
        working-directory: wa_backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 4174 > /tmp/live-stock-g04-api.log 2>&1 &
          echo $! > /tmp/live-stock-g04-api.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-stock-g04-api.log
          exit 1

      - name: Real PG16 outage, 5xx, revocation and fresh recovery
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_g04_outage_http.py
          --junitxml=/tmp/live-stock-g04-http.xml

      - name: Install locked Dashboard and Chromium
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 @testing-library/dom@10.4.1
          npx playwright install --with-deps chromium

      - name: Typecheck and lint only dedicated G04 browser evidence
        working-directory: dashboard
        run: |
          npx tsc --noEmit --skipLibCheck --target es2022 --module esnext \
            --moduleResolution bundler --types node --lib es2022,dom \
            e2e/live-stock-g04-outage.config.ts e2e/live-stock-g04-outage.spec.ts
          npx eslint e2e/live-stock-g04-outage.config.ts e2e/live-stock-g04-outage.spec.ts

      - name: Build actual Dashboard against actual FastAPI
        working-directory: dashboard
        run: npm run build

      - name: Start isolated built Dashboard
        working-directory: dashboard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/live-stock-g04-dashboard.log 2>&1 &
          echo $! > /tmp/live-stock-g04-dashboard.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/inventory >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-stock-g04-dashboard.log
          exit 1

      - name: Real Chromium outage, dropped network, late response and session recovery
        working-directory: dashboard
        run: npx playwright test --config e2e/live-stock-g04-outage.config.ts

      - name: Require complete no-skip execution and bounded ownership
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess, xml.etree.ElementTree as ET
          for path, expected in [
              ("/tmp/live-stock-g04-fixture.xml", 1),
              ("/tmp/live-stock-g04-http.xml", 1),
              ("dashboard/node_modules/.cache/live-stock-g04-outage.xml", 1),
          ]:
              root = ET.parse(path).getroot()
              cases = list(root.iter("testcase"))
              assert len(cases) == expected, (path, len(cases))
              assert not list(root.iter("skipped")), path
              assert not list(root.iter("failure")) and not list(root.iter("error")), path
              print(f"G04_CASES PASS file={path} cases={len(cases)} skipped=0")

          baseline = os.environ["BASE"]
          assert re.fullmatch(r"[0-9a-f]{40}", baseline)
          base = subprocess.check_output(["git", "merge-base", baseline, "HEAD"], text=True).strip()
          files = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          allowed = {
              ".github/workflows/live-stock-g04-outage-recovery.yml",
              "wa_backend/tests/live_stock_g04_outage_support.py",
              "wa_backend/tests/test_live_stock_g04_outage_http.py",
              "dashboard/e2e/live-stock-g04-outage.config.ts",
              "dashboard/e2e/live-stock-g04-outage.spec.ts",
              "wa_backend/main.py",
              "wa_backend/api/authentication/dependencies.py",
          }
          # #856: six audited D05 paths may trigger this shared main.py
          # G04 workflow. No individual Backend route/service/file is a
          # blanket exception and any missing path or mixed owner is denied.
          d05_shortages_849_exact = {
              ".github/workflows/dispatch-shortage-group-d05-acceptance.yml",
              "wa_backend/api/dispatch_shortages_group.py",
              "wa_backend/domains/dispatch_shortage_visits.py",
              "wa_backend/domains/dispatch_shortages_group.py",
              "wa_backend/main.py",
              "wa_backend/tests/test_dispatch_shortages_group_v1_postgres.py",
          }
          d05_shortages_new = d05_shortages_849_exact - {"wa_backend/main.py"}
          # Maintenance is a separate four-file-only policy. The old G04
          # one-file workflow / auth / UI evidence ownership remains intact.
          ci_policy_856_exact = {
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/live-stock-inflight-authority-acceptance.yml",
              ".github/workflows/live-stock-g04-outage-recovery.yml",
          }
          assert len(d05_shortages_849_exact) == 6
          assert len(d05_shortages_new) == 5
          assert len(ci_policy_856_exact) == 4

          dispatch_d11_881_exact = {
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/dispatch-d11-commercial-preflight.yml",
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              ".github/workflows/dispatch-route-launch-d07-acceptance.yml",
              ".github/workflows/dispatch-shortage-group-d05-acceptance.yml",
              ".github/workflows/live-stock-g04-outage-recovery.yml",
              ".github/workflows/live-stock-inflight-authority-acceptance.yml",
              "dashboard/src/features/dispatch/commercialPreflight/CommercialPreflightPanel.tsx",
              "dashboard/src/features/dispatch/commercialPreflight/contract.ts",
              "dashboard/src/features/dispatch/commercialPreflight/useCommercialPreflight.ts",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/test/dispatch-d11-commercial-preflight.test.tsx",
              "dashboard/src/test/dispatch-route-launch-d07.test.tsx",
              "wa_backend/api/dispatch_commercial_preflight.py",
              "wa_backend/main.py",
              "wa_backend/tests/test_dispatch_commercial_preflight_d11_postgres.py",
          }
          assert len(dispatch_d11_881_exact) == 16

          def ownership_mode(candidate):
              if candidate == dispatch_d11_881_exact:
                  return "DISPATCH_D11_881_EXACT"
              if candidate == ci_policy_856_exact:
                  return "CI_POLICY_856_EXACT"
              if candidate & d05_shortages_new:
                  assert candidate == d05_shortages_849_exact, (
                      f"D05_SHORTAGES_849_EXACT=FAIL "
                      f"missing={sorted(d05_shortages_849_exact - candidate)} "
                      f"extra={sorted(candidate - d05_shortages_849_exact)}"
                  )
                  return "D05_SHORTAGES_849_EXACT"
              # Retain the original G04 exact paths plus existing shared main.py
              # and auth dependency, without broadening any existing allowance.
              assert candidate <= allowed, sorted(candidate - allowed)
              forbidden = [
                  p for p in candidate
                  if p.startswith("dashboard/src/")
                  or p == ".github/scripts/live_stock_ci_ownership.py"
                  or p == "LIVE_STOCK_V1_CLOSURE_PLAN.md"
              ]
              assert not forbidden, forbidden
              return "G04_EXISTING_BOUNDED"

          # Positive and adversarial ownership proofs run AFTER original
          # fixture, real restricted HTTP and Chromium checks. No test skips.
          assert ownership_mode(dispatch_d11_881_exact) == "DISPATCH_D11_881_EXACT"
          for missing in dispatch_d11_881_exact:
              subset = dispatch_d11_881_exact - {missing}
              try:
                  actual = ownership_mode(subset)
              except AssertionError:
                  pass
              else:
                  assert actual != "DISPATCH_D11_881_EXACT"
          for foreign in ("dashboard/src/lib/authStorage.ts", "wa_backend/models.py",
                          "wa_backend/api/dispatch.py", "wanasah_frontend/lib/main.dart"):
              try:
                  ownership_mode(dispatch_d11_881_exact | {foreign})
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"D11 foreign file admitted: {foreign}")
          print("G04_D11_OWNER=PASS exact=16 missing=16 foreign=4")
          assert ownership_mode(d05_shortages_849_exact) == "D05_SHORTAGES_849_EXACT"
          for missing in d05_shortages_849_exact:
              subset = d05_shortages_849_exact - {missing}
              if subset & d05_shortages_new:
                  try:
                      ownership_mode(subset)
                  except AssertionError:
                      pass
                  else:
                      raise AssertionError(f"D05 partial with new path accepted: {missing}")
              else:
                  assert ownership_mode(subset) != "D05_SHORTAGES_849_EXACT"
          for hitchhiker in (
              "wa_backend/api/driver.py",
              "wa_backend/api/dispatch.py",
              "wa_backend/models.py",
              "wa_backend/domains/inventory/services.py",
              "wa_backend/api/warehouse/live_stock.py",
              "wa_backend/api/authentication/dependencies.py",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/pages/inventory/Tab1LiveStock.tsx",
              ".github/scripts/live_stock_ci_ownership.py",
              "wa_backend/domains/dispatch_shortages_group_unreviewed.py",
              "wanasah_frontend/lib/main.dart",
          ):
              try:
                  ownership_mode(d05_shortages_849_exact | {hitchhiker})
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"D05 extra path accepted: {hitchhiker}")
          assert ownership_mode(ci_policy_856_exact) == "CI_POLICY_856_EXACT"
          for missing in ci_policy_856_exact:
              try:
                  ownership_mode(ci_policy_856_exact - {missing})
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"Partial CI_POLICY_856_EXACT accepted: {missing}")
          for hitchhiker in (
              "wa_backend/main.py",
              "wa_backend/api/driver.py",
              "wa_backend/api/dispatch_shortages_group.py",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/hooks/useAuthFetch.ts",
              "dashboard/src/pages/inventory/Tab1LiveStock.tsx",
          ):
              try:
                  ownership_mode(ci_policy_856_exact | {hitchhiker})
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"CI_POLICY_856 extra path accepted: {hitchhiker}")
          # Old G04 owner-approved paths remain allowed, but common main.py
          # alone NEVER admits the five new D05 files as a partial change.
          assert ownership_mode(allowed) == "G04_EXISTING_BOUNDED"
          assert ownership_mode({"wa_backend/main.py"}) == "G04_EXISTING_BOUNDED"
          for mixed in (
              d05_shortages_849_exact | ci_policy_856_exact,
              d05_shortages_849_exact | allowed,
          ):
              try:
                  ownership_mode(mixed)
              except AssertionError:
                  pass
              else:
                  raise AssertionError("Mixed G04/D05/CI ownership accepted")
          print("G04_856_POLICY_SELFTEST PASS d05=6 ci_policy=4 negative=PASS")
          mode = ownership_mode(files)
          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          print(f"G04_SCOPE PASS mode={mode} files={len(files)}")
          PY

      - name: Verify service recovered after all fault injection
        if: always()
        run: |
          docker start live-stock-g04-pg >/dev/null 2>&1 || true
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/ready >/dev/null; then
              echo "G04_FINAL_READY PASS"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/live-stock-g04-api.log
          exit 1

      - name: Retain sanitized G04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-g04-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/live-stock-g04-fixture.xml
            /tmp/live-stock-g04-http.xml
            dashboard/node_modules/.cache/live-stock-g04-outage.xml
            dashboard/node_modules/.cache/live-stock-g04-outage
            /tmp/live-stock-g04-api.log
            /tmp/live-stock-g04-dashboard.log
          if-no-files-found: warn

name: D14 signed financial HTTP PG16
on:
  pull_request:
    branches: [main]
    paths:
      - wa_backend/tests/test_dispatch_d14_settlement_http_postgres.py
      - .github/workflows/dispatch-d14-signed-settlement-http.yml
permissions:
  contents: read
jobs:
  pg16-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: SyntheticD14OnlyKey123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://cp14c_app@127.0.0.1:55452/wanasah_cp14c_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp14c_admin@127.0.0.1:55452/wanasah_cp14c_test
      WANASAH_CP14C_PG_GATE: "1"
      WANASAH_CP14C_PG_URL: postgresql+asyncpg://cp14c_app@127.0.0.1:55452/wanasah_cp14c_test
      WANASAH_CP14C_PG_ADMIN_URL: postgresql+asyncpg://cp14c_admin@127.0.0.1:55452/wanasah_cp14c_test
      WANASAH_DISPATCH_D14_HTTP_GATE: "1"
      PYTHONPATH: ${{ github.workspace }}/wa_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Temporary database
        run: |
          docker run -d --name d14pg -e POSTGRES_USER=cp14c_admin -e POSTGRES_DB=wanasah_cp14c_test -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:55452:55452 postgres:16 -p 55452
          for n in $(seq 1 30); do docker exec d14pg pg_isready -U cp14c_admin -d wanasah_cp14c_test -p 55452 && break; sleep 1; done
      - name: Restricted runtime role
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://cp14c_admin@127.0.0.1:55452/wanasah_cp14c_test',autocommit=True); c.execute('CREATE ROLE cp14c_app LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT'); c.close()"
      - name: Migrations
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Exactly one missing HTTP acceptance
        working-directory: wa_backend
        run: python -m pytest -q -s --tb=short tests/test_dispatch_d14_settlement_http_postgres.py

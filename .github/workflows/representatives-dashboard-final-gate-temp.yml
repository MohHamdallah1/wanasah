name: Temporary representatives dashboard final gate

on:
  push:
    branches:
      - sol/representatives-dashboard-ui
    paths:
      - ".github/workflows/representatives-dashboard-final-gate-temp.yml"

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_API_URL: http://127.0.0.1:8000
      TARGET_SHA: 64de085e3818ccd46a59355088a2b89fa36f86c0
      MAIN_SHA: 5b39474702e1a60347315e8c50cc08bb780a9ce2
    steps:
      - name: Checkout exact final code
        uses: actions/checkout@v4
        with:
          ref: 64de085e3818ccd46a59355088a2b89fa36f86c0
          fetch-depth: 0

      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$MAIN_SHA" "$TARGET_SHA"
          printf 'TARGET_SHA=%s\nMAIN_SHA=%s\n' "$TARGET_SHA" "$MAIN_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Locked frontend dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      - name: Focused representatives dashboard tests
        working-directory: dashboard
        run: >-
          npm test --
          src/pages/representatives-vehicles/RepresentativesVehiclesPage.test.tsx
          src/pages/representatives-vehicles/representatives/RepresentativeCredentialAction.test.tsx
          src/pages/representatives-vehicles/representatives/RepresentativeForm.test.tsx
          src/pages/representatives-vehicles/representatives/RepresentativesTab.test.tsx
          src/pages/representatives-vehicles/representatives/api.test.ts
          src/pages/representatives-vehicles/representatives/contracts.test.ts
          src/pages/representatives-vehicles/representatives/representativeAuthorization.test.ts
          src/pages/representatives-vehicles/representatives/representativeErrorMessage.test.ts
          src/pages/representatives-vehicles/representatives/useRepresentativeDetail.test.tsx
          src/pages/representatives-vehicles/representatives/useRepresentativeInfiniteScroll.test.tsx
          src/pages/representatives-vehicles/representatives/useRepresentatives.test.tsx

      - name: Extract current-main TypeScript baseline
        run: |
          mkdir -p ../baseline
          git archive --format=tar --output=../baseline.tar "$MAIN_SHA" dashboard
          tar -xf ../baseline.tar -C ../baseline

      - name: TypeScript baseline comparison
        working-directory: dashboard
        run: node scripts/check-types-against-baseline.mjs ../baseline/dashboard

      - name: Affected ESLint
        working-directory: dashboard
        run: >-
          npx eslint
          src/pages/representatives-vehicles
          src/App.tsx
          src/components/operations/OperationsSidebar.tsx
          src/i18n/index.ts
          src/i18n/representativesVehicles.ts

      - name: Production Vite build
        working-directory: dashboard
        run: npm run build

      - name: Diff whitespace gate
        run: git diff --check "$MAIN_SHA" "$TARGET_SHA"

      - name: Dashboard scope gate
        shell: bash
        run: |
          changed="$(git diff --name-only "$MAIN_SHA" "$TARGET_SHA")"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(dashboard/src/pages/representatives-vehicles/|dashboard/src/App\.tsx$|dashboard/src/components/operations/OperationsSidebar\.tsx$|dashboard/src/i18n/index\.ts$|dashboard/src/i18n/representativesVehicles\.ts$|\.github/workflows/representatives-dashboard-final-gate-temp\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files outside Dashboard ownership:\n%s\n' "$unexpected"
            exit 1
          fi
          printf 'SCOPE_CHECK=PASS\n'

name: Flutter V1 FIELD seam client adapters

on:
  pull_request:
    paths:
      - "wanasah_frontend/lib/features/visits/**"
      - "wanasah_frontend/lib/features/custody/**"
      - "wanasah_frontend/lib/core/errors/api_failure_exception.dart"
      - "wanasah_frontend/lib/core/serialization/json_contract.dart"
      - "wanasah_frontend/test/features/visits/**"
      - "wanasah_frontend/test/features/custody/**"
      # Run the ownership gate if a retired bucket is reintroduced.
      - "wanasah_frontend/lib/core/field/**"
      - "wanasah_frontend/test/core/field/**"
      - ".github/workflows/flutter-v1-field-seams-client-adapters.yml"

permissions:
  contents: read

jobs:
  field-seams-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Provide CI-only dotenv asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env
      - name: Analyze Flutter
        run: flutter analyze
      - name: Feature ownership boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assert not Path("lib/core/field").exists()
          assert not Path("test/core/field").exists()
          for owner, peer in (("visits", "custody"), ("custody", "visits")):
              for path in Path("lib/features", owner).rglob("*.dart"):
                  imports = [line for line in path.read_text().splitlines() if line.startswith(("import ", "export "))]
                  assert not any("/" + peer + "/" in line for line in imports), path
          for name in ("errors/api_failure_exception.dart", "serialization/json_contract.dart"):
              source = Path("lib/core", name).read_text()
              assert "features/" not in source and "ReturnAmbiguity" not in source, name
          print("FEATURE_OWNERSHIP=PASS; CORE_FIELD_ABSENT")
          PY
      - name: Focused Visits FIELD tests
        run: flutter test test/features/visits
      - name: Focused Custody FIELD tests
        run: flutter test test/features/custody
      - name: Offline durable-command regression
        run: flutter test test/offline_owner_guard_test.dart test/offline_durable_command_test.dart

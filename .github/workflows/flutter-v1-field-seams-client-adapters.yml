name: Flutter V1 FIELD seam client adapters

on:
  pull_request:
    paths:
      - "wanasah_frontend/lib/features/visits/**"
      - "wanasah_frontend/lib/blocs/visit/visit_bloc.dart"
      - "wanasah_frontend/lib/screens/visit_screen.dart"
      - "wanasah_frontend/lib/models/cart_item_model.dart"
      - "wanasah_frontend/lib/features/custody/**"
      - "wanasah_frontend/lib/core/errors/api_failure_exception.dart"
      - "wanasah_frontend/lib/core/serialization/json_contract.dart"
      - "wanasah_frontend/test/features/visits/**"
      - "wanasah_frontend/test/features/custody/**"
      # Run the ownership gate if a retired bucket is reintroduced.
      - "wanasah_frontend/lib/core/field/**"
      - "wanasah_frontend/test/core/field/**"
      - ".github/workflows/flutter-v1-field-seams-client-adapters.yml"

permissions:
  contents: read

jobs:
  field-seams-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Provide CI-only dotenv asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env
      - name: Analyze Flutter
        run: flutter analyze
      - name: Feature ownership boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assert not Path("lib/core/field").exists()
          assert not Path("test/core/field").exists()
          for owner, peer in (("visits", "custody"), ("custody", "visits")):
              for path in Path("lib/features", owner).rglob("*.dart"):
                  imports = [line for line in path.read_text().splitlines() if line.startswith(("import ", "export "))]
                  assert not any("/" + peer + "/" in line for line in imports), path
          for name in ("errors/api_failure_exception.dart", "serialization/json_contract.dart"):
              source = Path("lib/core", name).read_text()
              assert "features/" not in source and "ReturnAmbiguity" not in source, name
          print("FEATURE_OWNERSHIP=PASS; CORE_FIELD_ABSENT")
          PY
      - name: Focused Visits FIELD tests
        run: flutter test test/features/visits
      - name: Focused Custody FIELD tests
        run: flutter test test/features/custody
      - name: Offline durable-command regression
        run: flutter test test/offline_owner_guard_test.dart test/offline_durable_command_test.dart
      - name: Visit correction and accepted decomposition regressions
        run: >-
          flutter test test/core/visit/visit_command_correction_test.dart
          test/features/visits/visit_decomposition_test.dart
          test/features/visits/visit_commercial_decomposition_test.dart
      - name: Pending return custody projection regression
        run: flutter test test/features/custody/pending_return_custody_projection_test.dart
      - name: Accepted local projection integrity regression
        run: flutter test test/core/visit/local_inventory_projection_integrity_test.dart

  backend-contract-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: VisitActionContractSyntheticKey012345678901234567890123456
      DATABASE_URL: postgresql+asyncpg://field_unit@127.0.0.1:1/field_unit
    defaults:
      run:
        working-directory: wa_backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Backend test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Read-only current FIELD authority regressions
        run: python -m pytest -q tests/test_field_return_resolution.py tests/test_field_read_contracts.py
      - name: Execute current VisitUpdateRequest action matrix without a database
        run: |
          python - <<'PY'
          from uuid import uuid4
          from pydantic import ValidationError
          from schemas import VisitUpdateRequest
          sample = {"product_variant_id": 44, "sample_quantity": 2,
                    "sample_packs_quantity": 3, "sample_reason": "Promotion"}
          returned = {"product_variant_id": 44, "quantity": 1,
                      "packs_quantity": 2, "return_type": "Damaged",
                      "resolution_token": "opaque-token"}
          accepted = [
              {"outcome": "Sale", "cart_items": [{"product_variant_id": 44, "quantity": 1}]},
              {"outcome": "Sale", "cart_items": [{"product_variant_id": 44, "packs_quantity": 1}]},
              {"outcome": "NoSale", "notes": "Customer declined"},
              {"outcome": "NoSale", "notes": "Collection", "debt_paid": "12.340"},
              {"outcome": "NoSale", "cart_items": [sample]},
              {"outcome": "Postponed"},
          ]
          for reason in ("Damaged", "Expired", "Factory_Defect"):
              accepted.append({"outcome": "NoSale", "cart_items": [sample],
                               "returns": [dict(returned, return_type=reason)], "debt_paid": "1"})
          rejected = [
              {"outcome": "Sale"},
              {"outcome": "Sale", "cart_items": [sample]},
              {"outcome": "Sale", "returns": [returned]},
              {"outcome": "NoSale"},
              {"outcome": "NoSale", "debt_paid": "1"},
              {"outcome": "NoSale", "notes": "Reason", "cash_collected": "0.001"},
              {"outcome": "NoSale", "cart_items": [{"product_variant_id": 44, "quantity": 1}]},
              {"outcome": "Postponed", "cash_collected": "0.001"},
              {"outcome": "Postponed", "debt_paid": "0.001"},
              {"outcome": "Postponed", "cart_items": [sample]},
              {"outcome": "Postponed", "returns": [returned]},
              {"outcome": "NoSale", "cart_items": [dict(sample, sample_reason=" ")]},
              {"outcome": "NoSale", "cart_items": [dict(sample, sample_reason="x" * 256)]},
              {"outcome": "NoSale", "cart_items": [dict(sample, sample_quantity=-1)]},
              {"outcome": "NoSale", "cart_items": [dict(sample, bonus_quantity=1)]},
              {"outcome": "Sale", "cart_items": [{"product_variant_id": 44, "quantity": 1, "price": "1"}]},
              {"outcome": "Sale", "cart_items": [{"product_variant_id": 44, "quantity": 1, "batch_id": 1}]},
          ]
          for payload in accepted:
              VisitUpdateRequest(request_id=uuid4(), **payload)
          for payload in rejected:
              try:
                  VisitUpdateRequest(request_id=uuid4(), **payload)
              except ValidationError:
                  pass
              else:
                  raise AssertionError(("Unexpectedly accepted", payload))
          print("VISIT_SCHEMA_ACCEPTED=" + str(len(accepted)))
          print("VISIT_SCHEMA_REJECTED=" + str(len(rejected)))
          PY

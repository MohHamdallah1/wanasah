name: Flutter V1 FIELD seam client adapters

on:
  pull_request:
    paths:
      - "wanasah_frontend/lib/core/field/**"
      - "wanasah_frontend/test/core/field/**"
      - ".github/workflows/flutter-v1-field-seams-client-adapters.yml"

permissions:
  contents: read

jobs:
  field-seams-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Provide CI-only dotenv asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env
      - name: Analyze Flutter
        run: flutter analyze
      - name: Focused FIELD seam contract tests
        run: flutter test test/core/field

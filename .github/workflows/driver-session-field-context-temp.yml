name: Driver session field context temp gate

on:
  push:
    branches:
      - codex/driver-session-field-context-cutover
  pull_request:
    paths:
      - "wa_backend/api/driver.py"
      - "wa_backend/tests/test_driver_session_field_context_boundary.py"
      - "wa_backend/tests/test_driver_session_field_context_cutover.py"
      - ".github/workflows/driver-session-field-context-temp.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt
      - name: Run focused runtime and boundary tests
        working-directory: wa_backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: DriverSessionCutoverTempSecret123456789012345678901234
          DATABASE_URL: postgresql+asyncpg://unit@127.0.0.1:1/unit
          DATABASE_URL_MIGRATION: postgresql+asyncpg://unit@127.0.0.1:1/unit
        run: |
          python -m unittest -v \
            tests.test_driver_session_field_context_boundary \
            tests.test_driver_session_field_context_cutover
      - name: Diff whitespace gate
        run: git diff --check

name: Dispatch canonical authorization temporary gate

on:
  push:
    branches:
      - sol/dispatch-canonical-authorization-cutover

permissions:
  contents: read

jobs:
  dispatch-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dispatch_gate
          POSTGRES_DB: wanasah_dispatch_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatch_gate -d wanasah_dispatch_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: DispatchGateOnlyKeyAbc123456789012345678901234567890
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://wanasah_runtime@127.0.0.1:5432/wanasah_dispatch_gate
      DATABASE_URL_MIGRATION: postgresql+asyncpg://dispatch_gate@127.0.0.1:5432/wanasah_dispatch_gate

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==8.3.5

      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("CREATE ROLE wanasah_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          print("RUNTIME_ROLE=OK")
          PY

      - name: Verify single Alembic head and clean bootstrap
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import subprocess
          out = subprocess.check_output(["alembic", "heads"], text=True).strip().splitlines()
          assert len(out) == 1, f"expected one Alembic head, got: {out}"
          assert out[0].startswith("e4c8a1d6b203"), out
          print("ALEMBIC_SINGLE_HEAD=", out[0])
          PY
          alembic upgrade head
          alembic check

      - name: Verify persisted permission catalog
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          expected = {
              "sales_return.create",
              "work_session.read", "work_session.authorize_sale", "work_session.reopen",
              "settlement.read", "settlement.execute",
              "shortage.read", "shortage.create", "shortage.cancel",
              "visit.read", "reconciliation.execute",
          }
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn) as conn:
              rows = {r[0] for r in conn.execute("SELECT code FROM permissions WHERE code = ANY(%s)", (list(expected),)).fetchall()}
          missing = expected - rows
          assert not missing, f"missing permissions: {sorted(missing)}"
          print("PERMISSION_CATALOG=OK")
          PY

      - name: Compile changed authorization surface
        working-directory: wa_backend
        run: |
          python -m py_compile api/dispatch.py dispatch_access.py domains/authorization/capabilities.py tests/test_dispatch_canonical_authorization_cutover.py

      - name: Focused Dispatch and identity tests
        working-directory: wa_backend
        run: |
          python -m pytest -q \
            tests/test_dispatch_canonical_authorization_cutover.py \
            tests/test_dispatch_representatives.py \
            tests/test_dispatch_representatives_boundary.py \
            tests/test_canonical_backoffice_capability_access.py \
            tests/test_canonical_backoffice_authorization_dependency.py \
            tests/test_canonical_backoffice_runtime_compatibility.py \
            tests/test_legacy_backoffice_transport.py

      - name: ASGI dependency smoke for critical Dispatch routes
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import asyncio
          from types import SimpleNamespace
          from fastapi import FastAPI, HTTPException
          import httpx
          from api import dispatch
          from database import get_db
          from api.dependencies import get_current_driver

          app = FastAPI()
          app.include_router(dispatch.router)

          async def fake_db():
              yield SimpleNamespace()

          async def reject_read():
              raise HTTPException(status_code=403, detail="Authorization denied.")

          async def reject_execute():
              raise HTTPException(status_code=403, detail="Authorization denied.")

          async def fake_actor():
              return SimpleNamespace(id=9001)

          app.dependency_overrides[get_db] = fake_db
          app.dependency_overrides[get_current_driver] = fake_actor
          app.dependency_overrides[dispatch._dispatch_read_access] = reject_read
          app.dependency_overrides[dispatch._dispatch_execute_access] = reject_execute

          async def run():
              transport = httpx.ASGITransport(app=app)
              async with httpx.AsyncClient(transport=transport, base_url="http://test") as client:
                  r = await client.get("/dispatch/init")
                  assert r.status_code == 403, r.text
                  r = await client.get("/dispatch/route/1/live_inventory")
                  assert r.status_code == 403, r.text
                  r = await client.post("/dispatch/route", json={})
                  assert r.status_code in {403, 422}, r.text
              print("DISPATCH_ASGI_SMOKE=OK")

          asyncio.run(run())
          PY

      - name: Source authority guard
        run: |
          python - <<'PY'
          from pathlib import Path
          dispatch = Path('wa_backend/api/dispatch.py').read_text(encoding='utf-8')
          access = Path('wa_backend/dispatch_access.py').read_text(encoding='utf-8')
          assert 'get_current_admin' not in dispatch
          assert '.is_admin' not in dispatch
          assert '.is_admin' not in access
          assert 'InventoryAccess' not in dispatch
          assert 'legacy_actor.company_id' not in dispatch
          assert 'legacy_actor.is_admin' not in dispatch
          print('AUTHORITY_SOURCE_GUARD=OK')
          PY

      - name: Diff whitespace gate
        run: git diff --check origin/main...HEAD

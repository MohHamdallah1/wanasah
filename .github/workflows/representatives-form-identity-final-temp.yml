name: Representative form identity gate

on:
  push:
    branches:
      - sol/representatives-form-credential-identity-ux-final
    paths:
      - .github/workflows/representatives-form-identity-final-temp.yml

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_HEAD: 2a064c157854de842d976716f736b85b38cd8fae
      SECRET_KEY: RepresentativeFormIdentityGateSyntheticSecret123456789
      DATABASE_URL: postgresql+asyncpg://contract@127.0.0.1:1/representatives_contract_unavailable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/representatives-form-credential-identity-ux-final
          fetch-depth: 0

      - name: Align legacy contract fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('wa_backend/tests/test_representatives_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('phone_number=None, password="SyntheticRepresentative123"', 'phone_number="+962790000000", password="SyntheticRepresentative123"', 1)
          text = text.replace('request.update(phone_number=None)', 'request.update(phone_number="0791111111")', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1

      - name: Backend representative tests
        working-directory: wa_backend
        run: |
          python -m unittest tests.test_representatives_form_identity_contract tests.test_representatives_architecture tests.test_representatives_contract tests.test_representatives_management_idempotency_symmetry -v
          python -m compileall -q api/representatives domains/representatives domains/identity/credentials.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Dashboard representative tests
        working-directory: dashboard
        run: npx vitest run src/pages/representatives-vehicles

      - name: Dashboard lint
        working-directory: dashboard
        run: npx eslint src/pages/representatives-vehicles src/i18n/representativesVehicles.ts

      - name: TypeScript baseline
        shell: bash
        run: |
          rm -rf baseline
          mkdir baseline
          git archive --format=tar --output=/tmp/dashboard-base.tar "$BASE_HEAD" dashboard
          tar -xf /tmp/dashboard-base.tar -C baseline
          cd dashboard
          node scripts/check-types-against-baseline.mjs ../baseline/dashboard

      - name: Production build
        working-directory: dashboard
        run: npm run build

      - name: Source and scope gates
        shell: bash
        run: |
          grep -F 'phone_number: str = Field(max_length=20)' wa_backend/api/representatives/schemas.py
          grep -F 'normalize_representative_username' wa_backend/domains/representatives/management.py
          grep -F 'normalize_representative_phone' wa_backend/domains/representatives/management.py
          grep -F 'RepresentativePasswordInput' dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.tsx
          grep -F 'RepresentativePasswordInput' dashboard/src/pages/representatives-vehicles/representatives/RepresentativeCredentialAction.tsx
          if grep -R 'confirm_password' dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.tsx dashboard/src/pages/representatives-vehicles/representatives/api.ts; then exit 1; fi
          if grep -R -E 'sessionStorage|localStorage' dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.tsx dashboard/src/pages/representatives-vehicles/representatives/RepresentativePasswordInput.tsx; then exit 1; fi
          if git diff --name-only "$BASE_HEAD" | grep -E '(^|/)vehicles/|wanasah_frontend/|wa_backend/alembic/versions/'; then exit 1; fi
          git diff --check "$BASE_HEAD"

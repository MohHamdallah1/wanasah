name: Representatives adversarial backend execution (temporary)

on:
  push:
    branches: [codex/representatives-adversarial-final-review]
    paths:
      - .github/workflows/representatives-adversarial-review-temp.yml
      - wa_backend/domains/representatives/queries.py
      - wa_backend/tests/test_representatives_architecture.py
      - wa_backend/tests/test_representatives_contract.py

permissions:
  contents: read

jobs:
  representatives-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: representatives_gate
          POSTGRES_DB: representatives_contract_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U representatives_gate -d representatives_contract_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: RepresentativesGateOnlyKeyAbc123456789012345678901234567890
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://wanasah_runtime@127.0.0.1:5432/representatives_contract_ci
      DATABASE_URL_MIGRATION: postgresql+asyncpg://representatives_gate@127.0.0.1:5432/representatives_contract_ci
      WANASAH_REPRESENTATIVES_CONTRACT_DB_URL: postgresql+asyncpg://wanasah_runtime@127.0.0.1:5432/representatives_contract_ci
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and focused test dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Provision restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("CREATE ROLE wanasah_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate isolated PostgreSQL to current Alembic head
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Verify migrated catalog and runtime database authority
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import os
          import psycopg
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn) as conn:
              versions = {row[0] for row in conn.execute("SELECT version_num FROM alembic_version")}
              assert versions == set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads()), versions
              codes = {"representative.read", "representative.manage", "representative.credentials.reset"}
              present = {row[0] for row in conn.execute("SELECT code FROM permissions WHERE code = ANY(%s)", (list(codes),))}
              assert present == codes, "Production migration must supply Representative permissions"
              assert conn.execute("SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname='wanasah_runtime'").fetchone() == (False, False)
              assert conn.execute("SELECT relrowsecurity, relforcerowsecurity FROM pg_class WHERE oid='public.company_principals'::regclass").fetchone() == (True, True)
          print("MIGRATED_HEAD_AND_PERMISSION_CATALOG=PASS; RUNTIME_NOBYPASSRLS=PASS")
          PY
      - name: Compile, Python 3.11 syntax, whitespace and ownership gates
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import py_compile
          import subprocess
          files = ["wa_backend/tests/test_representatives_architecture.py", "wa_backend/tests/test_representatives_contract.py", "wa_backend/domains/representatives/queries.py"]
          for filename in files:
              py_compile.compile(filename, doraise=True)
              ast.parse(Path(filename).read_text(encoding="utf-8-sig"), filename=filename, feature_version=(3, 11))
          base = "81e12a0e13104cb4083762bbd0abbf388ad66b9f"
          allowed = set([".github/workflows/representatives-adversarial-review-temp.yml","dashboard/src/i18n/representativesVehicles.ts","dashboard/src/pages/representatives-vehicles/representatives/RepresentativeCredentialAction.test.tsx","dashboard/src/pages/representatives-vehicles/representatives/RepresentativeDrawer.tsx","dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.test.tsx","dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.tsx","dashboard/src/pages/representatives-vehicles/representatives/RepresentativeLifecycleActions.test.tsx","dashboard/src/pages/representatives-vehicles/representatives/RepresentativeLifecycleActions.tsx","dashboard/src/pages/representatives-vehicles/representatives/RepresentativesTab.test.tsx","dashboard/src/pages/representatives-vehicles/representatives/RepresentativesTab.tsx","dashboard/src/pages/representatives-vehicles/representatives/passwordPolicy.ts","dashboard/src/pages/representatives-vehicles/representatives/representativeErrorMessage.test.ts","dashboard/src/pages/representatives-vehicles/representatives/representativeErrorMessage.ts","dashboard/src/pages/representatives-vehicles/representatives/representativeSessionCache.test.tsx","dashboard/src/pages/representatives-vehicles/representatives/useRepresentativeDetail.test.tsx","dashboard/src/pages/representatives-vehicles/representatives/useRepresentativeDetail.ts","dashboard/src/pages/representatives-vehicles/representatives/useRepresentatives.ts","wa_backend/tests/test_representatives_contract.py"]) | {"wa_backend/domains/representatives/queries.py"}
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          assert changed <= allowed, changed - allowed
          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          print("COMPILE_SYNTAX_DIFF_SCOPE=PASS")
          PY
      - name: Representatives architecture tests
        working-directory: wa_backend
        run: python -m pytest -q tests/test_representatives_architecture.py --junitxml=representatives-architecture.xml
      - name: Representatives HTTP and PostgreSQL contract tests
        working-directory: wa_backend
        run: python -m pytest -q tests/test_representatives_contract.py --junitxml=representatives-contract.xml
      - name: Require every focused test to execute without skips
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for source, report in [
              ("tests/test_representatives_architecture.py", "representatives-architecture.xml"),
              ("tests/test_representatives_contract.py", "representatives-contract.xml"),
          ]:
              expected = sum(isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")
                             for node in ast.walk(ast.parse(Path(source).read_text(encoding="utf-8-sig"))))
              root = ET.parse(report).getroot()
              cases = list(root.iter("testcase"))
              assert len(cases) == expected, (source, len(cases), expected)
              assert not list(root.iter("skipped")), source
              assert not list(root.iter("failure")), source
              assert not list(root.iter("error")), source
              print(f"{source}: {len(cases)} executed; 0 skipped; PASS")
          PY
      - name: Preserve focused execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: representatives-focused-reports
          path: wa_backend/representatives-*.xml
          if-no-files-found: ignore

name: tmp-quality-terminal-simplify

on:
  push:
    branches:
      - fix/whole-product-terminal-simplify-20261007
  workflow_dispatch:

jobs:
  quality-terminal-simplify:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: TemporaryQualityTerminalSimplifySecretKey123456789
      DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Frontend install
        working-directory: dashboard
        run: npm ci

      - name: Frontend focused tests
        working-directory: dashboard
        run: npx vitest run src/test/quality-safety-v1-closure.test.ts src/test/products-lifecycle-guided-recovery.test.ts

      - name: Frontend typecheck
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Frontend production build
        working-directory: dashboard
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wa_backend/requirements.txt

      - name: Backend install
        working-directory: wa_backend
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Backend focused tests
        working-directory: wa_backend
        run: >-
          pytest -q
          tests/test_catalog_recall_cancel_guard.py
          tests/test_whole_product_quality_terminal_completion.py
          tests/test_whole_product_quality_global_contract.py
          tests/test_whole_product_quality_direct_stage.py
          tests/test_whole_product_quality_inplace_constraint.py
          tests/test_whole_product_quality_preview_contract.py
          tests/test_whole_product_quality_stage4_legacy_fifo.py
          tests/test_terminal_disposal_service.py
          tests/test_terminal_vendor_service.py

      - name: Backend compile
        working-directory: wa_backend
        run: python -m py_compile product_lifecycle.py domains/credential_confirmation.py api/catalog.py api/warehouse/whole_product_quality.py

      - name: Diff check
        run: git diff --check HEAD^..HEAD

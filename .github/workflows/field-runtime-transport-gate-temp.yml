name: Field runtime transport temporary gate

on:
  push:
    branches:
      - codex/field-runtime-transport-cutover

jobs:
  focused-field-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest httpx
      - name: Compile changed runtime
        run: |
          python -m py_compile \
            wa_backend/api/driver.py \
            wa_backend/api/authentication/field_compatibility.py \
            wa_backend/api/authentication/dependencies.py
      - name: Focused canonical Field runtime tests
        working-directory: wa_backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_driver_session_field_context_boundary.py \
            tests/test_driver_session_field_context_cutover.py \
            tests/test_legacy_field_transport.py \
            tests/test_legacy_field_transport_boundary.py \
            tests/test_canonical_field_runtime_compatibility.py \
            tests/test_canonical_field_runtime_compatibility_boundary.py \
            tests/test_canonical_field_authorization_subject.py
      - name: Source transport and authority audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          driver = Path('wa_backend/api/driver.py').read_text(encoding='utf-8')
          assert 'legacy_field_transport' not in driver
          assert 'get_legacy_transport_field_context' not in driver
          assert not Path('wa_backend/api/authentication/legacy_field_transport.py').exists()
          assert driver.count('get_current_driver') == 2, 'expected only import + get_visit_details dependency'
          target_names = [
              'start_work_session','end_work_session','toggle_break','update_visit',
              'get_driver_dashboard','respond_to_transfer','batch_respond_to_transfers',
              'get_pending_transfers','add_new_shop','get_products','get_driver_visits','get_active_session',
          ]
          tree = ast.parse(driver)
          funcs = {n.name:n for n in ast.walk(tree) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          for name in target_names:
              src = ast.get_source_segment(driver, funcs[name]) or ''
              assert 'get_current_driver' not in src, name
              assert 'get_legacy_transport_field_context' not in src, name
              assert '.is_admin' not in src, name
              assert 'get_current_field_context' in src, name
          compat = Path('wa_backend/api/authentication/field_compatibility.py').read_text(encoding='utf-8')
          assert 'get_current_field_context' in compat
          assert '.is_admin' not in compat
          PY
      - name: Diff whitespace gate
        run: git diff --check origin/main...HEAD

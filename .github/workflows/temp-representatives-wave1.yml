name: TEMP Representatives Wave 1

on:
  push:
    branches:
      - sol/representatives-backend-management

permissions:
  contents: write

jobs:
  validate-and-wire:
    if: github.event.head_commit.message != 'chore: wire representatives router'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal main router wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('wa_backend/main.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from api import auth, branches, catalog, commercial_policy, driver, dispatch, inventory_stock_policy, offers, pricing, taxation, product_locations, product_tracking, tenant, warehouse, reconciliation, platform_manager, sales_returns, simple_products'
          new_import = 'from api import auth, branches, catalog, commercial_policy, driver, dispatch, inventory_stock_policy, offers, pricing, taxation, product_locations, product_tracking, tenant, warehouse, reconciliation, platform_manager, representatives, sales_returns, simple_products'
          if text.count(old_import) != 1:
              raise SystemExit('representatives main import anchor mismatch')
          text = text.replace(old_import, new_import, 1)
          anchor = 'app.include_router(branches.router)\n'
          if text.count(anchor) != 1:
              raise SystemExit('representatives router include anchor mismatch')
          text = text.replace(anchor, anchor + 'app.include_router(representatives.router)\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Source and compile gates
        run: |
          python -m compileall -q wa_backend/domains/representatives wa_backend/api/representatives wa_backend/domains/authorization/capabilities.py wa_backend/main.py
          python - <<'PY'
          from pathlib import Path
          cap = Path('wa_backend/domains/authorization/capabilities.py').read_text()
          main = Path('wa_backend/main.py').read_text()
          owned = '\n'.join(p.read_text() for root in ('wa_backend/domains/representatives','wa_backend/api/representatives') for p in Path(root).glob('*.py'))
          for code in ('representative.read','representative.manage','representative.credentials.reset'):
              assert code in cap
          assert 'representatives' in main and 'app.include_router(representatives.router)' in main
          for forbidden in ('is_admin', 'InventoryAccess', 'subject_from_legacy_driver'):
              assert forbidden not in owned, forbidden
          assert 'access.company_id' in Path('wa_backend/api/representatives/read.py').read_text()
          assert 'access.company_id' in Path('wa_backend/api/representatives/management.py').read_text()
          assert '@router.post' not in Path('wa_backend/api/representatives/lifecycle.py').read_text()
          assert '@router.post' not in Path('wa_backend/api/representatives/credentials.py').read_text()
          print('REPRESENTATIVES_SOURCE_GATE=PASS')
          PY
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest
      - name: Focused identity authorization regression
        working-directory: wa_backend
        env:
          PYTHONPATH: ${{ github.workspace }}/wa_backend/tests:${{ github.workspace }}/wa_backend
        run: |
          python -m pytest -q \
            tests/test_canonical_auth_core_boundary.py \
            tests/test_canonical_auth_transport_boundary.py \
            tests/test_principal_http_dependencies.py \
            tests/test_canonical_field_runtime_compatibility.py \
            tests/test_identity_login_legacy_compatibility.py \
            tests/test_login_is_admin_retirement_contract.py
      - name: Import smoke
        working-directory: wa_backend
        env:
          ENVIRONMENT: development
        run: |
          python - <<'PY'
          from api.representatives import router
          from domains.representatives import list_representatives, create_representative
          paths = sorted({route.path for route in router.routes})
          assert '/representatives' in paths
          assert '/representatives/{representative_id}' in paths
          print('REPRESENTATIVE_ROUTES=' + ','.join(paths))
          PY
      - name: Diff check
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "wa_backend/main.py"
      - name: Commit minimal wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wa_backend/main.py
          git commit -m 'chore: wire representatives router'
          git push origin HEAD:sol/representatives-backend-management

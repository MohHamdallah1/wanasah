name: TEMP Representatives Wave 1

on:
  push:
    branches:
      - sol/representatives-backend-management

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and compile gates
        run: |
          python -m compileall -q wa_backend/domains/representatives wa_backend/api/representatives wa_backend/domains/authorization/capabilities.py wa_backend/main.py
          python - <<'PY'
          from pathlib import Path
          cap = Path('wa_backend/domains/authorization/capabilities.py').read_text()
          main = Path('wa_backend/main.py').read_text()
          owned = '\n'.join(p.read_text() for root in ('wa_backend/domains/representatives','wa_backend/api/representatives') for p in Path(root).glob('*.py'))
          for code in ('representative.read','representative.manage','representative.credentials.reset'):
              assert code in cap
          company_only = cap.split('COMPANY_ONLY =', 1)[1]
          for code in ('representative.read','representative.manage','representative.credentials.reset'):
              assert code in company_only
          assert 'representatives' in main and 'app.include_router(representatives.router)' in main
          for forbidden in ('is_admin', 'InventoryAccess', 'subject_from_legacy_driver'):
              assert forbidden not in owned, forbidden
          assert 'access.company_id' in Path('wa_backend/api/representatives/read.py').read_text()
          assert 'access.company_id' in Path('wa_backend/api/representatives/management.py').read_text()
          assert '@router.post' not in Path('wa_backend/api/representatives/lifecycle.py').read_text()
          assert '@router.post' not in Path('wa_backend/api/representatives/credentials.py').read_text()
          assert 'password_hash' not in Path('wa_backend/api/representatives/schemas.py').read_text()
          print('REPRESENTATIVES_SOURCE_GATE=PASS')
          PY
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest
      - name: Focused identity authorization regression
        working-directory: wa_backend
        env:
          PYTHONPATH: ${{ github.workspace }}/wa_backend/tests:${{ github.workspace }}/wa_backend
        run: |
          python -m pytest -q \
            tests/test_canonical_auth_core_boundary.py \
            tests/test_canonical_auth_transport_boundary.py \
            tests/test_principal_http_dependencies.py \
            tests/test_canonical_field_runtime_compatibility.py \
            tests/test_identity_login_legacy_compatibility.py \
            tests/test_login_is_admin_retirement_contract.py
      - name: Representative import and contract smoke
        working-directory: wa_backend
        env:
          ENVIRONMENT: development
        run: |
          python - <<'PY'
          from decimal import Decimal
          from api.representatives import router
          from api.representatives.schemas import RepresentativeCreateRequest, RepresentativeUpdateRequest
          from domains.authorization.capabilities import COMPANY_ONLY, PERMISSIONS
          paths = {(route.path, tuple(sorted(route.methods or []))) for route in router.routes}
          assert ('/representatives', ('GET',)) in paths
          assert ('/representatives', ('POST',)) in paths
          assert ('/representatives/{representative_id}', ('GET',)) in paths
          assert ('/representatives/{representative_id}', ('PATCH',)) in paths
          assert {c for c in PERMISSIONS if c.startswith('representative.')} == {
              'representative.read','representative.manage','representative.credentials.reset'
          }
          assert {'representative.read','representative.manage','representative.credentials.reset'} <= COMPANY_ONLY
          req = RepresentativeCreateRequest(request_id='11111111-1111-1111-1111-111111111111', full_name=' Rep ', username=' rep ', password='password1', max_debt_limit=Decimal('12.345'))
          assert req.full_name == 'Rep' and req.username == 'rep'
          patch = RepresentativeUpdateRequest(request_id='22222222-2222-2222-2222-222222222222', phone_number='   ')
          assert patch.phone_number is None
          print('REPRESENTATIVE_CONTRACT_SMOKE=PASS')
          PY
      - name: Scope and diff check
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          allowed_prefixes = ('wa_backend/domains/representatives/','wa_backend/api/representatives/')
          allowed_exact = {'wa_backend/domains/authorization/capabilities.py','wa_backend/main.py','.github/workflows/temp-representatives-wave1.yml'}
          files = subprocess.check_output(['git','diff','--name-only','dea4df8fda1cec099add91d5ebe1ec6cce31cc61...HEAD'], text=True).splitlines()
          bad = [p for p in files if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          assert not bad, bad
          print('BRANCH_SCOPE_GATE=PASS')
          PY

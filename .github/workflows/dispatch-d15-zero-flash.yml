name: Dispatch D15 zero-flash signed Chromium evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-d15-zero-flash.yml"
      - "dashboard/e2e/dispatch-d15-zero-flash.spec.ts"
      - "dashboard/src/features/dispatch/stableUi/**"
      - "dashboard/src/pages/DispatchBoard.tsx"
      - "dashboard/src/components/dispatch/PendingRoutesTable.tsx"
      - "dashboard/src/test/auth-session-consumer-isolation.test.tsx"
      - "dashboard/src/components/operations/DashboardLayout.tsx"
      - "dashboard/src/App.tsx"

permissions:
  contents: read

jobs:
  real-d15-zero-flash:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WANASAH_DISPATCH_D14_BROWSER_GATE: "1"
      WANASAH_DISPATCH_P0_PG_GATE: "1"
      WANASAH_DISPATCH_D07_PG_GATE: "1"
      WANASAH_SHOP_FINANCE_PG_GATE: "1"
      ENVIRONMENT: test
      SECRET_KEY: D14SyntheticRealBrowserPG16Key1234567890123456789012345
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://d14_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://d14_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_DISPATCH_D14_BROWSER_STATE: /tmp/dispatch-d14-browser-private.json
      PYTHONPATH: ${{ github.workspace }}/wa_backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Exact D15 #913 ownership and whitespace
        run: |
          python .github/scripts/dispatch_d15_zero_flash_scope.py --selftest
          python .github/scripts/dispatch_d15_real_content_scope.py --selftest
          git diff --check
      - name: Install canonical dependencies
        run: |
          python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
          python -m py_compile wa_backend/tests/test_dispatch_d14_browser_fixture.py
      - name: Start temporary PostgreSQL16
        run: |
          docker run --detach --name dispatch-d14-pg \
            --env POSTGRES_USER=d14_dispatch_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 postgres:16 -p 55439
          for attempt in $(seq 1 35); do
            if docker exec dispatch-d14-pg pg_isready -U d14_dispatch_admin -d wanasah_no_lot_contract_test -p 55439; then exit 0; fi
            sleep 1
          done
          docker logs dispatch-d14-pg
          exit 1
      - name: Create restricted non-bypass database role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate canonical schema
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant restricted runtime DML
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Seed ONE real PG16 company Shop finance and route-scoped fixture
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_dispatch_d14_browser_fixture.py
          --junitxml=d14-real-pg16.xml
      - name: Start real FastAPI
        working-directory: wa_backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 4174 > /tmp/dispatch-d14-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dispatch-d14-api.log
          exit 1
      - name: Install Dashboard and real Chromium
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build exact MAIN as true BEFORE baseline (read-only Git object)
        env:
          VITE_API_URL: http://127.0.0.1:4174
        run: |
          cp dashboard/src/pages/DispatchBoard.tsx /tmp/d15-zero-flash-head-Board.tsx
          cp dashboard/src/components/operations/DashboardLayout.tsx /tmp/d15-zero-flash-head-Layout.tsx
          cp dashboard/src/components/dispatch/PendingRoutesTable.tsx /tmp/d15-zero-flash-head-Routes.tsx
          cp dashboard/src/App.tsx /tmp/d15-zero-flash-head-App.tsx
          git show 73f790ee94b931fdd5e36b92ced39bb0512855b0:dashboard/src/pages/DispatchBoard.tsx > dashboard/src/pages/DispatchBoard.tsx
          git show 73f790ee94b931fdd5e36b92ced39bb0512855b0:dashboard/src/components/operations/DashboardLayout.tsx > dashboard/src/components/operations/DashboardLayout.tsx
          git show 73f790ee94b931fdd5e36b92ced39bb0512855b0:dashboard/src/components/dispatch/PendingRoutesTable.tsx > dashboard/src/components/dispatch/PendingRoutesTable.tsx
          git show 73f790ee94b931fdd5e36b92ced39bb0512855b0:dashboard/src/features/dispatch/stableUi/DispatchWorkspaceStructure.tsx > dashboard/src/features/dispatch/stableUi/DispatchWorkspaceStructure.tsx
          git show 73f790ee94b931fdd5e36b92ced39bb0512855b0:dashboard/src/App.tsx > dashboard/src/App.tsx
          npm --prefix dashboard run build
      - name: Measure original MAIN initial JS and separate Dispatch bundle
        env:
          D15_BUNDLE_PHASE: before
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, json, os, re
          assets = Path("dashboard/dist/assets")
          html = Path("dashboard/dist/index.html").read_text()
          entry = list(assets.glob("index-*.js"))
          dispatch = list(assets.glob("DispatchBoard-*.js"))
          assert len(entry) == 1, ("unexpected Vite entry", entry)
          assert len(dispatch) == 1, ("DispatchBoard lost its lazy chunk", dispatch)
          preloads = []
          for tag in re.findall(r'<link\b[^>]*>', html):
              if 'modulepreload' not in tag: continue
              url = re.search(r'href=["\x27]([^"\x27]+)', tag)
              if url and url.group(1).endswith(".js"):
                  dest = Path("dashboard/dist") / url.group(1).lstrip("/")
                  assert dest.is_file(), dest
                  preloads.append(dest)
          def stats(path):
              raw = path.read_bytes()
              return {"file": path.name, "raw": len(raw), "gzip": len(gzip.compress(raw, compresslevel=9, mtime=0))}
          critical = [entry[0]] + sorted(set(preloads) - {entry[0]})
          result = {
              "phase": os.environ["D15_BUNDLE_PHASE"],
              "entry": stats(entry[0]),
              "dispatch_chunk": stats(dispatch[0]),
              "critical_files": [stats(p) for p in critical],
              "products_inventory_bootstrap_gzip": sum(stats(p)["gzip"] for p in critical),
              "products_inventory_bootstrap_raw": sum(stats(p)["raw"] for p in critical),
          }
          Path("/tmp/d15-bundle-" + result["phase"] + ".json").write_text(json.dumps(result, indent=2))
          print("D15_BUNDLE=" + json.dumps(result))
          if result["phase"] == "after":
              before = json.loads(Path("/tmp/d15-bundle-before.json").read_text())
              delta = result["products_inventory_bootstrap_gzip"] - before["products_inventory_bootstrap_gzip"]
              print("D15_BUNDLE_DELTA_GZIP_BYTES=" + str(delta))
              assert delta <= 30 * 1024, "Cross-page startup JS regression >30 KiB gzip"
              assert result["entry"]["gzip"] - before["entry"]["gzip"] <= 30 * 1024, "Main entry JS regression >30 KiB gzip"
          PY
      - name: Serve built Dashboard
        working-directory: dashboard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/dispatch-d14-ui.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/dispatch >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dispatch-d14-ui.log
          exit 1
      - name: BEFORE exact MAIN signed PG16 and real Chromium frames
        working-directory: dashboard
        env:
          D15_ZERO_FLASH_ENFORCE: "0"
        run: |
          xvfb-run -a npx playwright test e2e/dispatch-d15-zero-flash.spec.ts --headed --workers=1 --reporter=list --output=node_modules/.cache/dispatch-d15-zero-flash-before
      - name: Restore tested HEAD and build production AFTER
        env:
          VITE_API_URL: http://127.0.0.1:4174
        run: |
          cp /tmp/d15-zero-flash-head-Board.tsx dashboard/src/pages/DispatchBoard.tsx
          cp /tmp/d15-zero-flash-head-Layout.tsx dashboard/src/components/operations/DashboardLayout.tsx
          cp /tmp/d15-zero-flash-head-Routes.tsx dashboard/src/components/dispatch/PendingRoutesTable.tsx
          rm dashboard/src/features/dispatch/stableUi/DispatchWorkspaceStructure.tsx
          cp /tmp/d15-zero-flash-head-App.tsx dashboard/src/App.tsx
          npm --prefix dashboard run build
      - name: Prove Products and Inventory initial transfer has no bundle regression
        env:
          D15_BUNDLE_PHASE: after
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, json, os, re
          assets = Path("dashboard/dist/assets")
          html = Path("dashboard/dist/index.html").read_text()
          entry = list(assets.glob("index-*.js"))
          dispatch = list(assets.glob("DispatchBoard-*.js"))
          assert len(entry) == 1, ("unexpected Vite entry", entry)
          assert len(dispatch) == 1, ("DispatchBoard lost its lazy chunk", dispatch)
          preloads = []
          for tag in re.findall(r'<link\b[^>]*>', html):
              if 'modulepreload' not in tag: continue
              url = re.search(r'href=["\x27]([^"\x27]+)', tag)
              if url and url.group(1).endswith(".js"):
                  dest = Path("dashboard/dist") / url.group(1).lstrip("/")
                  assert dest.is_file(), dest
                  preloads.append(dest)
          def stats(path):
              raw = path.read_bytes()
              return {"file": path.name, "raw": len(raw), "gzip": len(gzip.compress(raw, compresslevel=9, mtime=0))}
          critical = [entry[0]] + sorted(set(preloads) - {entry[0]})
          result = {
              "phase": os.environ["D15_BUNDLE_PHASE"],
              "entry": stats(entry[0]),
              "dispatch_chunk": stats(dispatch[0]),
              "critical_files": [stats(p) for p in critical],
              "products_inventory_bootstrap_gzip": sum(stats(p)["gzip"] for p in critical),
              "products_inventory_bootstrap_raw": sum(stats(p)["raw"] for p in critical),
          }
          Path("/tmp/d15-bundle-" + result["phase"] + ".json").write_text(json.dumps(result, indent=2))
          print("D15_BUNDLE=" + json.dumps(result))
          if result["phase"] == "after":
              before = json.loads(Path("/tmp/d15-bundle-before.json").read_text())
              delta = result["products_inventory_bootstrap_gzip"] - before["products_inventory_bootstrap_gzip"]
              print("D15_BUNDLE_DELTA_GZIP_BYTES=" + str(delta))
              assert delta <= 30 * 1024, "Cross-page startup JS regression >30 KiB gzip"
              assert result["entry"]["gzip"] - before["entry"]["gzip"] <= 30 * 1024, "Main entry JS regression >30 KiB gzip"
          PY
      - name: AFTER same signed PG16 + real Chromium zero-flash and security guard
        working-directory: dashboard
        env:
          D15_ZERO_FLASH_ENFORCE: "1"
        run: |
          xvfb-run -a npx playwright test e2e/dispatch-d15-zero-flash.spec.ts --headed --workers=1 --reporter=list --output=node_modules/.cache/dispatch-d15-zero-flash-after
      - name: AFTER real signed D14 scoped finance, revoke, FIELD and cross-tenant Chromium
        working-directory: dashboard
        run: |
          npx playwright test --config e2e/dispatch-d14-browser.config.ts --workers=1
      - name: Preserve real Browser screenshots traces and checked wire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-d15-zero-flash-${{ github.run_id }}
          path: |
            wa_backend/d14-real-pg16.xml
            dashboard/node_modules/.cache/dispatch-d15-zero-flash-before/
            dashboard/node_modules/.cache/dispatch-d15-zero-flash-after/
            dashboard/node_modules/.cache/dispatch-d14-browser/
            /tmp/dispatch-d14-api.log
            /tmp/dispatch-d14-ui.log
            /tmp/d15-bundle-before.json
            /tmp/d15-bundle-after.json
          if-no-files-found: warn

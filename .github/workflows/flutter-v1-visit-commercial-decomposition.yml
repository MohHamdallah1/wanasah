name: Flutter V1 Visit commercial decomposition
# Gate the feature-owned Visit commercial split before FIELD seam wiring.

on:
  push:
    branches:
      - sol/flutter-v1-visit-commercial-decomposition
  pull_request:
    paths:
      - "wanasah_frontend/lib/blocs/visit/visit_bloc.dart"
      - "wanasah_frontend/lib/features/visits/application/**"
      - "wanasah_frontend/lib/features/visits/data/**"
      - "wanasah_frontend/test/features/visits/**"
      - ".github/workflows/flutter-v1-visit-commercial-decomposition.yml"

permissions:
  contents: read

jobs:
  visit-commercial-decomposition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Prepare CI-only environment asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env

      - name: Resolve dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Focused Visit decomposition tests
        run: >-
          flutter test
          test/features/visits/visit_commercial_decomposition_test.dart
          test/features/visits/visit_decomposition_test.dart
          test/core/visit/visit_command_correction_test.dart

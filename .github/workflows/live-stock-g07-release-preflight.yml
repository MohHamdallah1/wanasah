name: Live Stock G07 final release preflight

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-stock-g07-release-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-g07-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STARTING_MAIN: 96c5ba374995e99b57aa7a004f0c8bf642e10e3b

jobs:
  rollout-pg16:
    name: canonical-v1-v2-rollout-pg16
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      ENVIRONMENT: test
      SECRET_KEY: LiveStockG07RolloutPg16IsolatedOnly123456789012345678
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://g07_rollout_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_LIVE_STOCK_V2_ROLLOUT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://g07_rollout_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove exact branch ancestry and bounded G07 ownership
        run: |
          git merge-base --is-ancestor "$STARTING_MAIN" HEAD
          test "$(git merge-base "$STARTING_MAIN" HEAD)" = "$STARTING_MAIN"
          python - <<'PY'
          import os, subprocess
          start = os.environ["STARTING_MAIN"]
          files = set(subprocess.check_output(
              ["git", "diff", "--name-only", start, "HEAD"], text=True
          ).splitlines())
          expected = {".github/workflows/live-stock-g07-release-preflight.yml"}
          assert files == expected, (files, expected)
          print("G07_SCOPE=PASS files=1 starting_main=" + start)
          PY
          git diff --check "$STARTING_MAIN" HEAD --

      - name: Install focused backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Start disposable PostgreSQL16
        run: |
          docker run --detach --name live-stock-g07-rollout             --env POSTGRES_USER=g07_rollout_admin             --env POSTGRES_DB=wanasah_no_lot_contract_test             --env POSTGRES_HOST_AUTH_METHOD=trust             --publish 127.0.0.1:55439:55439             postgres:16 -p 55439
          for attempt in $(seq 1 40); do
            if docker exec live-stock-g07-rollout pg_isready               -U g07_rollout_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs live-stock-g07-rollout
          exit 1

      - name: Create restricted NOBYPASSRLS runtime role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Fresh schema and scoped runtime grants
        run: |
          cd wa_backend
          alembic upgrade head
          alembic check
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY

      - name: Execute canonical FIFO and MOVING_AVERAGE v1 to v2 readiness
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v2_rollout_readiness_postgres.py
          --junitxml=/tmp/live-stock-g07-rollout.xml

      - name: Reject skips failures or incomplete costing coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/live-stock-g07-rollout.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 2, len(cases)
          assert not list(root.iter("failure"))
          assert not list(root.iter("error"))
          assert not list(root.iter("skipped"))
          print("G07_ROLLOUT_PG16=PASS cases=2 costing=FIFO,MOVING_AVERAGE skipped=0")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g07-rollout-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/live-stock-g07-rollout.xml
          if-no-files-found: error

  restore-pg16:
    name: real-backup-restore-rollback-recovery-pg16
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: LiveStockG07RestorePg16IsolatedOnly123456789012345678
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://g07_restore_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_LIVE_STOCK_V2_RESTORE_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://g07_restore_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_LIVE_STOCK_V2_RESTORE_MANIFEST: /tmp/live-stock-v2-restore-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Start disposable PostgreSQL16
        run: |
          docker run --detach --name live-stock-g07-restore             --env POSTGRES_USER=g07_restore_admin             --env POSTGRES_DB=wanasah_no_lot_contract_test             --env POSTGRES_HOST_AUTH_METHOD=trust             --publish 127.0.0.1:55439:55439             postgres:16 -p 55439
          for attempt in $(seq 1 40); do
            if docker exec live-stock-g07-restore pg_isready               -U g07_restore_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs live-stock-g07-restore
          exit 1

      - name: Create restricted NOBYPASSRLS runtime role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Fresh source schema and scoped runtime grants
        run: |
          cd wa_backend
          alembic upgrade head
          alembic check
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY

      - name: Seed canonical physical truth and persisted v1 restore point
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v2_restore_rehearsal_postgres.py::test_prepare_backup_source
          --junitxml=/tmp/live-stock-g07-restore-source.xml

      - name: Take inspect and hash actual PostgreSQL16 custom backup
        run: |
          docker exec live-stock-g07-restore pg_dump             -U g07_restore_admin -p 55439             -d wanasah_no_lot_contract_test -Fc             > /tmp/live-stock-g07-source.dump
          test -s /tmp/live-stock-g07-source.dump
          sha256sum /tmp/live-stock-g07-source.dump | tee /tmp/live-stock-g07-source.dump.sha256
          docker exec -i live-stock-g07-restore pg_restore -l             < /tmp/live-stock-g07-source.dump > /tmp/live-stock-g07-restore-list.txt
          grep -q "TABLE DATA public inventory_balances" /tmp/live-stock-g07-restore-list.txt
          grep -q "TABLE DATA public inventory_movements" /tmp/live-stock-g07-restore-list.txt
          grep -q "TABLE DATA public inventory_cost_events" /tmp/live-stock-g07-restore-list.txt
          grep -q "TABLE DATA public inventory_live_stock_projection" /tmp/live-stock-g07-restore-list.txt

      - name: Restore to separate disposable database
        run: |
          docker exec live-stock-g07-restore createdb             -U g07_restore_admin -p 55439 wanasah_live_stock_v2_restore_test
          docker exec -i live-stock-g07-restore pg_restore             -U g07_restore_admin -p 55439 --no-owner --exit-on-error             -d wanasah_live_stock_v2_restore_test             < /tmp/live-stock-g07-source.dump

      - name: Execute restored v1 rejection rollback rebuild idempotency and bearer readback
        working-directory: wa_backend
        env:
          DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_live_stock_v2_restore_test
          DATABASE_URL_MIGRATION: postgresql+asyncpg://g07_restore_admin@127.0.0.1:55439/wanasah_live_stock_v2_restore_test
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v2_restore_rehearsal_postgres.py::test_restored_backup_recovers_v1_to_v2_without_authoritative_replay
          --junitxml=/tmp/live-stock-g07-restore-recovery.xml

      - name: Reject skips failures or incomplete restore evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          files = [
              "/tmp/live-stock-g07-restore-source.xml",
              "/tmp/live-stock-g07-restore-recovery.xml",
          ]
          for path in files:
              root = ET.parse(path).getroot()
              cases = list(root.iter("testcase"))
              assert len(cases) == 1, (path, len(cases))
              assert not list(root.iter("failure")), path
              assert not list(root.iter("error")), path
              assert not list(root.iter("skipped")), path
          print("G07_REAL_BACKUP_RESTORE=PASS cases=2 skipped=0 separate_restore_db=1")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g07-restore-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/live-stock-g07-restore-source.xml
            /tmp/live-stock-g07-restore-recovery.xml
            /tmp/live-stock-v2-restore-manifest.json
            /tmp/live-stock-g07-source.dump.sha256
            /tmp/live-stock-g07-restore-list.txt
          if-no-files-found: error

  compatibility:
    name: in-repo-consumer-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard dependencies and build current consumer
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Execute focused Dashboard v2 compatibility contracts
        working-directory: dashboard
        run: >-
          npx vitest run
          src/test/inventory-access.test.ts
          src/test/inventory-cp7-live-stock.test.tsx
          src/test/inventory-cp6-minimum-stock-dashboard.test.tsx
          src/pages/inventory/stocktake/StocktakeCp9Acceptance.test.tsx
          --reporter=verbose

      - name: Inventory tracked runtime cursor consumers and forbid silent new callers
        run: |
          python - <<'PY'
          import subprocess
          out = subprocess.check_output(
              ["git", "grep", "-l", "/warehouse/inventory/cursor?", "--", "dashboard/src"],
              text=True,
          ).splitlines()
          actual = set(out)
          expected = {
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/StockMinimumManager.tsx",
              "dashboard/src/pages/inventory/stocktake/hooks/useCycleCountStart.ts",
          }
          assert actual == expected, {"actual": sorted(actual), "expected": sorted(expected)}
          with open("/tmp/live-stock-g07-consumers.txt", "w", encoding="utf-8") as fh:
              for item in sorted(actual):
                  fh.write(item + "\n")
          print("G07_DASHBOARD_CONSUMERS=PASS count=3")
          print("G07_EXTERNAL_CLIENT_EVIDENCE=UNAVAILABLE repository_search_cannot_certify_external_clients")
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Execute focused FIELD physical custody compatibility
        working-directory: wanasah_frontend
        run: |
          printf 'API_BASE_URL=http://127.0.0.1:8000\nSENTRY_DSN=\n' > .env
          flutter pub get
          flutter test test/features/custody/physical_stock_disclosure_safety_test.dart

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g07-consumers-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/live-stock-g07-consumers.txt
          if-no-files-found: error

  release-package:
    name: operational-go-no-go-package
    runs-on: ubuntu-24.04
    needs: [rollout-pg16, restore-pg16, compatibility]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build precise G07 operational package
        env:
          ROLLOUT_RESULT: ${{ needs.rollout-pg16.result }}
          RESTORE_RESULT: ${{ needs.restore-pg16.result }}
          COMPAT_RESULT: ${{ needs.compatibility.result }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          success = all(os.environ[k] == "success" for k in (
              "ROLLOUT_RESULT", "RESTORE_RESULT", "COMPAT_RESULT"
          ))
          prep = "YES" if success else "NO"
          sha = os.environ["TESTED_SHA"]
          text = f"""# WANASAH Live Stock G07 release-readiness package

Tested SHA: `{sha}`
Starting main: `{os.environ['STARTING_MAIN']}`

## Executed non-production evidence
- Canonical PG16 v1→v2 rollout: {os.environ['ROLLOUT_RESULT']} — FIFO + MOVING_AVERAGE, restricted NOBYPASSRLS runtime role, FORCE RLS/readiness/physical-custody contract enforced by the existing canonical acceptance.
- Real PostgreSQL16 backup→separate restore→rollback→canonical rebuild→fresh bearer readback→second idempotent rebuild: {os.environ['RESTORE_RESULT']}.
- Tracked Dashboard/Flutter consumer compatibility: {os.environ['COMPAT_RESULT']}. Dashboard cursor consumers are MainInventory, StockMinimumManager and CycleCountStart. FIELD custody uses its separate Vehicle custody contract.
- External clients not present in this repository and any production deployment topology are UNAVAILABLE evidence and are not certified here.

## Authorized per-company production sequence — requires separate owner/change approval
1. Freeze the release scope; record approved release SHA, company id, active Warehouse ids, operator, maintenance window and rollback owner.
2. Verify the production-approved backup/snapshot method, source database identity, completion, checksum/catalog evidence and a restore rehearsal to an approved non-production target.
3. Deploy only mutually compatible API/Dashboard/mobile clients. Before rebuild, a real authorized bearer against persisted v1 summaries must receive 503 LIVE_STOCK_PROJECTION_NOT_READY with request id and no stock items.
4. Using only the approved restricted NOBYPASSRLS application role, open ONE company-scoped transaction, establish canonical tenant context and call only rebuild_live_stock_company(company_id=approved_company_id, batch_size=1000).
5. Before commit, assert readiness for every active Warehouse. Any timeout, mismatch, unexpected company/location, lock-budget breach or verification failure means ROLLBACK and NO-GO.
6. Commit only after all Warehouse checks pass. From a fresh transaction and real bearer, verify version=2 READY, Warehouse-only quantities, independent Vehicle/IN_TRANSIT custody, authorization denial paths, and unchanged movement/cost-event/idempotency evidence.
7. If acceptance requires a second rebuild, it must report drifted_keys=0 and summary_repairs=0 with no authoritative stock/cost changes.

## Rollback / NO-GO criteria
- Before commit: any exception, timeout, killed connection, readiness mismatch, source mismatch or authorization uncertainty => rollback transaction; v1 remains fail-closed.
- After commit: any DEGRADED/not-ready state, scope mismatch, Route-based attribution, quantity mismatch, new unexpected movement/cost event, or revoked-access disclosure => stop Live Stock and investigate; do not replay movements or force READY.
- Database restore is a separate incident/change action. Never overwrite post-backup inventory or financial events without explicit reconciliation approval.
- Application rollback to a reader that interprets legacy Vehicle projection as Warehouse stock is unsafe; keep reads fail-closed until compatibility is proven.

## Production p95/p99 measurement procedure — not executed in CI
1. Before release, define owner/SRE-approved latency/error/lock budgets. Undefined budgets => NO-GO.
2. In the approved environment, exercise representative Warehouse sizes, owner/restricted readers, 1/50/200 limits, deep cursors, search/family/negative filters, batch detail/source reads and realistic concurrency.
3. Measure API end-to-end p50/p95/p99 and error rate separately for warm and controlled cold-cache periods; simultaneously capture PostgreSQL query latency, rows, buffers, lock waits, statement timeouts, CPU/IO and pool saturation.
4. Record production release SHA, company/sample scope, request ids, observation window and workload. Synthetic CI timings must never be substituted.
5. Any p95/p99 above the approved budget, material error-rate increase, lock/timeout breach, readiness failure or authority discrepancy => NO-GO/rollback decision.

## Decision
TECHNICAL PREP READY: {prep}
PRODUCTION G07 CLOSED: NO

Production G07 stays OPEN until explicit owner approval plus environment-specific backup/restore, deployment/client compatibility, approved operator authority, size/window/lock evidence, production p95/p99 and post-backup reconciliation evidence are recorded.
"""
          path = Path("/tmp/live-stock-g07-release-readiness.md")
          path.write_text(text, encoding="utf-8")
          print(text)
          if not success:
              raise SystemExit("G07 technical preflight failed; package remains NO-GO")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g07-release-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/live-stock-g07-release-readiness.md
          if-no-files-found: error

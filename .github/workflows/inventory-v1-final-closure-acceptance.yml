name: Inventory V1 combined-candidate final acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Lead-supplied combined candidate: full 40-character commit SHA"
        required: true
        type: string
  push:
    branches: [codex/inventory-v1-closure-acceptance]
    paths:
      - "wa_backend/tests/*inventory_v1*"
      - "dashboard/src/test/inventory-v1-*.test.tsx"
      - ".github/workflows/inventory-v1-final-closure-acceptance.yml"
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/*inventory_v1*"
      - "dashboard/src/test/inventory-v1-*.test.tsx"
      - ".github/workflows/inventory-v1-final-closure-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: inventory-final-${{ github.event.pull_request.head.sha || github.sha }}-${{ inputs.candidate_sha || 'no-candidate' }}
  cancel-in-progress: true

env:
  HARNESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha || '76fa2d10ac2e0b202e196efa12fd02652a96b5f1' }}

jobs:
  acceptance-only-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.HARNESS_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail-closed gate verifier self-tests
        run: python -m unittest discover -s wa_backend/tests -p test_inventory_v1_candidate_gate.py -v
      - name: Compile acceptance only
        run: >-
          python -m py_compile
          wa_backend/tests/test_inventory_v1_final_closure_acceptance_postgres.py
          wa_backend/tests/test_inventory_v1_combined_candidate_postgres.py
          wa_backend/tests/inventory_v1_candidate_gate.py
      - name: Prove exact acceptance-only ownership and unchanged production/plans
        run: |
          python - <<'PY'
          import subprocess
          original = "8231ca07f945feb61737e7b4ac6150846cba60a8"
          assignment = "da045688c1778d1b5c2c2c3da62fb480555b5617"
          allowed = {
              ".github/workflows/inventory-v1-final-closure-acceptance.yml",
              "wa_backend/tests/test_inventory_v1_final_closure_acceptance_postgres.py",
              "wa_backend/tests/test_inventory_v1_combined_candidate_postgres.py",
              "wa_backend/tests/inventory_v1_candidate_gate.py",
              "wa_backend/tests/test_inventory_v1_candidate_gate.py",
              "dashboard/src/test/inventory-v1-final-closure-acceptance.test.tsx",
              "dashboard/src/test/inventory-v1-combined-journey.test.tsx",
              "dashboard/src/test/inventory-v1-combined-quality.test.tsx",
              "docs/verification/INVENTORY_V1_FINAL_CLOSURE_ACCEPTANCE.md",
          }
          for base in (original, assignment):
              subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
              changed = set(subprocess.check_output(
                  ["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
              assert changed <= allowed, sorted(changed - allowed)
              if base == original:
                  assert changed == allowed, sorted(allowed - changed)
              subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          print("ACCEPTANCE_ONLY_SCOPE=PASS")
          PY

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: PostgreSQL 16 (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    env:
      ENVIRONMENT: test
      SECRET_KEY: ClosureAcceptanceSyntheticOnlyAbc12345678901234567890
      DATABASE_URL: postgresql+asyncpg://cp8_app@127.0.0.1:55448/wanasah_cp8_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp8_admin@127.0.0.1:55448/wanasah_cp8_test
      WANASAH_CP8_PG_GATE: "1"
      WANASAH_CP8_PG_URL: postgresql+asyncpg://cp8_app@127.0.0.1:55448/wanasah_cp8_test
      WANASAH_CP8_PG_ADMIN_URL: postgresql+asyncpg://cp8_admin@127.0.0.1:55448/wanasah_cp8_test
      WANASAH_CLOSURE_BASELINE_EVIDENCE: ${{ matrix.mode == 'baseline' && '1' || '0' }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARNESS_SHA }}
          path: harness
      - name: Validate exact requested source identity
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "harness/wa_backend/tests")
          from inventory_v1_candidate_gate import BASE, exact_sha
          sha = BASE if os.environ["MODE"] == "baseline" else exact_sha(os.environ["CANDIDATE_SHA"])
          with open(os.environ["GITHUB_ENV"], "a") as target:
              target.write("SOURCE_SHA=" + sha + "\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0
      - name: Verify source and overlay acceptance tests only
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source merge-base --is-ancestor 8231ca07f945feb61737e7b4ac6150846cba60a8 HEAD
          cp harness/wa_backend/tests/test_inventory_v1_final_closure_acceptance_postgres.py source/wa_backend/tests/
          cp harness/wa_backend/tests/test_inventory_v1_combined_candidate_postgres.py source/wa_backend/tests/
          git -C source diff --exit-code -- . ':!wa_backend/tests'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install candidate dependencies
        run: python -m pip install -r source/wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Start disposable PostgreSQL 16
        run: |
          docker run --detach --name closure-postgres \
            --env POSTGRES_USER=cp8_admin --env POSTGRES_DB=wanasah_cp8_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55448:55448 postgres:16 -p 55448
          for attempt in $(seq 1 30); do
            if docker exec closure-postgres pg_isready -U cp8_admin -d wanasah_cp8_test -p 55448; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Restricted runtime identity
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("CREATE ROLE cp8_app LOGIN NOSUPERUSER NOCREATEDB "
                           "NOCREATEROLE NOINHERIT NOBYPASSRLS")
              assert conn.execute(
                  "SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname='cp8_app'"
              ).fetchone() == (False, False)
          PY
      - name: Fresh candidate Alembic bootstrap
        working-directory: source/wa_backend
        run: alembic upgrade head
      - name: Execute all selected contracts and verify exact JUnit evidence
        run: >-
          python harness/wa_backend/tests/inventory_v1_candidate_gate.py run
          --kind postgres --mode "$MODE" --source source
          --candidate-sha "$CANDIDATE_SHA" --harness-sha "$HARNESS_SHA"
          --output "artifacts/postgres-$MODE.json"
      - name: Prove candidate runtime was not patched by the harness
        if: always() && env.SOURCE_SHA != ''
        run: git -C source diff --exit-code -- . ':!wa_backend/tests'
      - uses: actions/upload-artifact@v4
        if: always() && env.SOURCE_SHA != ''
        with:
          name: closure-postgres-${{ matrix.mode }}
          path: artifacts/
          if-no-files-found: error

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: Dashboard (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    env:
      MODE: ${{ matrix.mode }}
      WANASAH_CLOSURE_BASELINE_EVIDENCE: ${{ matrix.mode == 'baseline' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARNESS_SHA }}
          path: harness
      - name: Validate exact requested source identity
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "harness/wa_backend/tests")
          from inventory_v1_candidate_gate import BASE, exact_sha
          sha = BASE if os.environ["MODE"] == "baseline" else exact_sha(os.environ["CANDIDATE_SHA"])
          with open(os.environ["GITHUB_ENV"], "a") as target:
              target.write("SOURCE_SHA=" + sha + "\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0
      - name: Overlay DOM tests only and verify source identity
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source merge-base --is-ancestor 8231ca07f945feb61737e7b4ac6150846cba60a8 HEAD
          cp harness/dashboard/src/test/inventory-v1-final-closure-acceptance.test.tsx source/dashboard/src/test/
          cp harness/dashboard/src/test/inventory-v1-combined-journey.test.tsx source/dashboard/src/test/
          cp harness/dashboard/src/test/inventory-v1-combined-quality.test.tsx source/dashboard/src/test/
          git -C source diff --exit-code -- . ':!dashboard/src/test'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/dashboard/package-lock.json
      - name: Install candidate Dashboard dependencies
        working-directory: source/dashboard
        run: npm ci
      - name: Lint every acceptance DOM file
        working-directory: source/dashboard
        run: >-
          npx eslint src/test/inventory-v1-final-closure-acceptance.test.tsx
          src/test/inventory-v1-combined-journey.test.tsx
          src/test/inventory-v1-combined-quality.test.tsx
      - name: Execute DOM contracts and verify exact JUnit evidence
        run: >-
          python harness/wa_backend/tests/inventory_v1_candidate_gate.py run
          --kind dashboard --mode "$MODE" --source source
          --candidate-sha "$CANDIDATE_SHA" --harness-sha "$HARNESS_SHA"
          --output "artifacts/dashboard-$MODE.json"
      - name: Prove candidate UI runtime was not patched
        if: always() && env.SOURCE_SHA != ''
        run: git -C source diff --exit-code -- . ':!dashboard/src/test'
      - uses: actions/upload-artifact@v4
        if: always() && env.SOURCE_SHA != ''
        with:
          name: closure-dashboard-${{ matrix.mode }}
          path: artifacts/
          if-no-files-found: error

  final-combined-verdict:
    name: Final combined-candidate verdict
    if: always()
    needs: [acceptance-only-scope, postgres, dashboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARNESS_SHA }}
      - uses: actions/download-artifact@v4
        with:
          pattern: closure-*
          path: evidence
      - name: One authoritative green or red result
        env:
          SCOPE_RESULT: ${{ needs.acceptance-only-scope.result }}
          PG_RESULT: ${{ needs.postgres.result }}
          UI_RESULT: ${{ needs.dashboard.result }}
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "wa_backend/tests")
          from inventory_v1_candidate_gate import exact_sha
          exact_sha(os.environ["CANDIDATE_SHA"])
          for name in ("SCOPE_RESULT", "PG_RESULT", "UI_RESULT"):
              assert os.environ[name] == "success", (name, os.environ[name])
          PY
          python wa_backend/tests/inventory_v1_candidate_gate.py final \
            --candidate-sha "$CANDIDATE_SHA" --harness-sha "$HARNESS_SHA" --reports evidence

name: Inventory CP10 Ledger closure

on:
  push:
    branches:
      - sol/cp10-ledger-full-closure-wave2
  pull_request:
    branches:
      - integration/inventory-wave-2
    paths:
      - "wa_backend/api/warehouse/ledger.py"
      - "wa_backend/api/warehouse/inbound_adjustments.py"
      - "wa_backend/domains/ledger/**"
      - "wa_backend/alembic/versions/f4c10a7e2d31_ledger_permissions.py"
      - "wa_backend/tests/test_cp10_ledger_backend.py"
      - "wa_backend/tests/test_cp10_ledger_postgres.py"
      - "wa_backend/tests/test_cp10_ledger_postgres_multibatch.py"
      - "wa_backend/tests/test_inbound_adjustments_canonical_auth_cutover.py"
      - "dashboard/src/pages/inventory/Tab4Ledger.tsx"
      - "dashboard/src/pages/inventory/ledger/**"
      - "dashboard/src/test/inventory-cp10-ledger-dashboard.test.tsx"
      - "dashboard/src/test/inventory-cp10-ledger-contract.test.ts"
      - "dashboard/src/test/inventory-cp10-ledger-keyboard.test.tsx"
      - ".github/workflows/inventory-cp10-ledger-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp10-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: Cp10SyntheticOnlyKeyAbc123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://cp10_unit@127.0.0.1:1/cp10_unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Backend test dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: CP10 focused Backend acceptance
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_cp10_ledger_backend.py
          tests/test_authorization_core_compatibility.py
      - name: Existing inbound adjustment regression
        working-directory: wa_backend
        run: python -m pytest -q tests/test_inbound_adjustments_canonical_auth_cutover.py
      - name: py_compile changed Backend
        run: >-
          python -m py_compile
          wa_backend/api/warehouse/ledger.py
          wa_backend/api/warehouse/inbound_adjustments.py
          wa_backend/domains/ledger/__init__.py
          wa_backend/domains/ledger/read.py
          wa_backend/domains/ledger/inbound_adjustment.py
          wa_backend/alembic/versions/f4c10a7e2d31_ledger_permissions.py

  postgres-16:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: Cp10PostgresOnlyKeyAbc123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://cp10_app@127.0.0.1:55450/wanasah_cp10_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp10_admin@127.0.0.1:55450/wanasah_cp10_test
      WANASAH_CP10_PG_GATE: "1"
      WANASAH_CP10_PG_URL: postgresql+asyncpg://cp10_app@127.0.0.1:55450/wanasah_cp10_test
      WANASAH_CP10_PG_ADMIN_URL: postgresql+asyncpg://cp10_admin@127.0.0.1:55450/wanasah_cp10_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL acceptance dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Start disposable PostgreSQL 16
        run: |
          docker run --detach --name cp10-postgres \
            --env POSTGRES_USER=cp10_admin \
            --env POSTGRES_DB=wanasah_cp10_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55450:55450 \
            postgres:16 -p 55450
          for attempt in $(seq 1 30); do
            if docker exec cp10-postgres pg_isready -U cp10_admin -d wanasah_cp10_test -p 55450; then exit 0; fi
            sleep 1
          done
          docker logs cp10-postgres
          exit 1
      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              if not conn.execute("SELECT 1 FROM pg_roles WHERE rolname='cp10_app'").fetchone():
                  conn.execute("CREATE ROLE cp10_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate disposable CP10 database
        working-directory: wa_backend
        run: alembic upgrade head
      - name: CP10 PostgreSQL 16 acceptance
        working-directory: wa_backend
        run: >-
          python -m pytest -q -s
          tests/test_cp10_ledger_postgres.py
          tests/test_cp10_ledger_postgres_multibatch.py

  dashboard-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: CP10 focused Ledger Dashboard acceptance
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-cp10-ledger-dashboard.test.tsx
          src/test/inventory-cp10-ledger-contract.test.ts
          src/test/inventory-cp10-ledger-keyboard.test.tsx
      - name: Relevant inventory regressions only
        working-directory: dashboard
        run: >-
          npm test --
          src/pages/inventory/inbound/contracts.test.ts
          src/test/inventory-public-batch-number-parity.test.ts
          src/test/inventory-access-canonical-contract.test.ts
          src/test/catalog-inventory-boundary.test.ts
          src/test/inventory-cp6-minimum-stock-dashboard.test.tsx
      - name: TypeScript noEmit
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: Production Dashboard build
        working-directory: dashboard
        run: npm run build

  dynamic-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve active Wave merge-base
        shell: bash
        run: |
          target="${{ github.event.pull_request.base.ref }}"
          if [ -z "$target" ]; then target="integration/inventory-wave-2"; fi
          git fetch origin "$target" --no-tags
          base="$(git merge-base HEAD "origin/$target")"
          test -n "$base"
          echo "CP10_BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "CP10_TARGET_REF=$target" >> "$GITHUB_ENV"
          echo "CP10_DYNAMIC_BASE=$base"
      - name: Exact bounded CP10 scope audit
        shell: bash
        run: |
          test "$CP10_TARGET_REF" = "integration/inventory-wave-2"
          python - <<'PY'
          import os
          import subprocess
          base = os.environ["CP10_BASE_SHA"]
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          exact = {
              ".github/workflows/inventory-cp10-ledger-acceptance.yml",
              "wa_backend/api/warehouse/ledger.py",
              "wa_backend/api/warehouse/inbound_adjustments.py",
              "wa_backend/alembic/versions/f4c10a7e2d31_ledger_permissions.py",
              "wa_backend/tests/test_cp10_ledger_backend.py",
              "wa_backend/tests/test_cp10_ledger_postgres.py",
              "wa_backend/tests/test_cp10_ledger_postgres_multibatch.py",
              "wa_backend/tests/test_inbound_adjustments_canonical_auth_cutover.py",
              "dashboard/src/pages/inventory/Tab4Ledger.tsx",
              "dashboard/src/test/inventory-cp10-ledger-dashboard.test.tsx",
              "dashboard/src/test/inventory-cp10-ledger-contract.test.ts",
              "dashboard/src/test/inventory-cp10-ledger-keyboard.test.tsx",
          }
          unexpected = {
              path for path in changed
              if path not in exact
              and not path.startswith("wa_backend/domains/ledger/")
              and not path.startswith("dashboard/src/pages/inventory/ledger/")
          }
          assert not unexpected, f"Unexpected CP10 scope: {sorted(unexpected)}"
          forbidden_prefixes = (
              "dashboard/src/pages/inventory/batches/",
              "dashboard/src/pages/inventory/product",
              "dashboard/src/pages/inventory/stocktake/",
              "dashboard/src/pages/inventory/transfers/",
              "wa_backend/api/warehouse/stocktake.py",
              "wa_backend/api/warehouse/transfers.py",
          )
          assert not any(path.startswith(forbidden_prefixes) for path in changed), sorted(changed)
          assert "dashboard/src/pages/inventory/MainInventory.tsx" not in changed
          print(f"CP10_CHANGED_FILES={len(changed)}")
          print("CP10_SCOPE=PASS")
          PY
      - name: Dynamic diff whitespace gate
        run: git diff --check "$CP10_BASE_SHA" HEAD

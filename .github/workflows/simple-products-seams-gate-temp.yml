name: TEMP Simple Products canonical seam gate

on:
  push:
    branches:
      - lead/simple-products-canonical-seams

jobs:
  focused-seams:
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: test
      SECRET_KEY: SimpleProductsLeadGateOnlyKey123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://simple_unit@127.0.0.1:1/simple_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://simple_admin@127.0.0.1:1/simple_unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: Compile seam runtime
        run: |
          python -m py_compile \
            wa_backend/domains/inventory_catalog_presence.py \
            wa_backend/domains/inventory_batch_restrictions/queries.py \
            wa_backend/domains/simple_products/service.py
      - name: Focused seam runtime tests
        working-directory: wa_backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_simple_products_warehouse_filter.py \
            tests/test_product_batch_restrictions.py \
            tests/test_product_import_phase13_runtime.py
          pytest -q tests/test_simple_products*.py
      - name: Canonical seam source audit
        run: |
          python - <<'PY'
          from pathlib import Path
          presence = Path('wa_backend/domains/inventory_catalog_presence.py').read_text(encoding='utf-8')
          batches = Path('wa_backend/domains/inventory_batch_restrictions/queries.py').read_text(encoding='utf-8')
          service = Path('wa_backend/domains/simple_products/service.py').read_text(encoding='utf-8')
          assert 'BackofficeCapabilityAccess' in presence
          assert 'permission_access.location_filter' in presence
          assert 'BackofficeCapabilityAccess' in batches
          assert 'permission_access.allows("inventory.read")' in batches
          assert service.count('actor.company_id') == 1
          assert 'legacy_company_id = actor.company_id' in service
          for name in ('create_product_structures', 'publish_prices', 'publish_initial_prices', 'create_products_and_prices', 'update_prices'):
              start = service.index(f'async def {name}(')
              end = service.index('):', start)
              assert 'company_id: int | None = None' in service[start:end]
          assert 'db, company_id=company_id, specs=specs' in service
          assert 'company_id=company_id,\n    )\n    return prices' in service
          PY
      - name: Diff whitespace gate
        run: git diff --check 2606ee4a3b2b05aa51041211b706205566b0a0ad...HEAD

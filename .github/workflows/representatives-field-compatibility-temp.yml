name: Temporary representatives field compatibility gate

on:
  push:
    branches:
      - sol/representatives-field-compatibility-acceptance
    paths:
      - ".github/workflows/representatives-field-compatibility-temp.yml"

permissions:
  contents: read

jobs:
  flutter-field-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 5d83c5a3f21c49121167b175571892d4fd9ff0c3
      BASE_SHA: b9c18ade8d62c5b23349f2d4c030840940e05cf7
    steps:
      - name: Checkout exact production-fix code
        uses: actions/checkout@v4
        with:
          ref: 5d83c5a3f21c49121167b175571892d4fd9ff0c3
          fetch-depth: 0
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: wanasah_frontend
        run: flutter pub get
      - name: Formatting gate
        working-directory: wanasah_frontend
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/blocs/auth/auth_bloc.dart
          lib/blocs/auth/offline_owner_guard.dart
          test/offline_owner_guard_test.dart
      - name: Focused Flutter analyze
        working-directory: wanasah_frontend
        run: >-
          flutter analyze
          lib/blocs/auth/auth_bloc.dart
          lib/blocs/auth/offline_owner_guard.dart
          test/offline_owner_guard_test.dart
      - name: Prepare local test asset
        working-directory: wanasah_frontend
        run: touch .env
      - name: Offline owner regression
        working-directory: wanasah_frontend
        run: flutter test test/offline_owner_guard_test.dart

  scope-and-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: 5d83c5a3f21c49121167b175571892d4fd9ff0c3
      BASE_SHA: b9c18ade8d62c5b23349f2d4c030840940e05cf7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d83c5a3f21c49121167b175571892d4fd9ff0c3
          fetch-depth: 0
      - name: Diff whitespace gate
        run: git diff --check "$BASE_SHA" "$TARGET_SHA"
      - name: Field compatibility scope gate
        shell: bash
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(wanasah_frontend/lib/blocs/auth/auth_bloc\.dart|wanasah_frontend/lib/blocs/auth/offline_owner_guard\.dart|wanasah_frontend/test/offline_owner_guard_test\.dart)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files outside field compatibility scope:\n%s\n' "$unexpected"
            exit 1
          fi
          printf 'SCOPE_CHECK=PASS\n'

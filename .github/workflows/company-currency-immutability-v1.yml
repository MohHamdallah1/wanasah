name: Company currency immutability V1 PostgreSQL
on:
  pull_request:
    paths:
      - "wa_backend/domains/inventory_costing/purchase_reference/**"
      - "wa_backend/domains/authorization/capabilities.py"
      - "wa_backend/alembic/**"
      - "wa_backend/api/warehouse/inbound.py"
      - "wa_backend/api/warehouse/_shared.py"
      - "wa_backend/schemas.py"
      - "wa_backend/tests/*purchase*reference*"
      - "wa_backend/tests/test_company_currency_immutability_postgres.py"
      - ".github/workflows/company-currency-immutability-v1.yml"
      - ".github/actions/setup-backend-purchase-tests/action.yml"
      - ".github/actions/bootstrap-purchase-reference-pg16/action.yml"
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: purchase_reference_gate
          POSTGRES_DB: wanasah_purchase_reference_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U purchase_reference_gate -d wanasah_purchase_reference_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: PurchaseReferenceGateOnlyKeyAbc123456789012345678901
      DATABASE_URL: postgresql+asyncpg://purchase_reference_runtime@127.0.0.1:5432/wanasah_purchase_reference_gate
      DATABASE_URL_MIGRATION: postgresql+asyncpg://purchase_reference_gate@127.0.0.1:5432/wanasah_purchase_reference_gate
      WANASAH_PURCHASE_REFERENCE_DB_GATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up pinned Backend purchase tests
        uses: ./.github/actions/setup-backend-purchase-tests
      - name: Bootstrap restricted purchase-reference PostgreSQL
        uses: ./.github/actions/bootstrap-purchase-reference-pg16
      - name: Company currency trigger and reference regression acceptance
        working-directory: wa_backend
        run: python -m pytest -q tests/test_company_currency_immutability_postgres.py tests/test_purchase_cost_reference_postgres.py

name: Inventory CP13 Shell Polish Acceptance

on:
  push:
    branches:
      - sol/cp13-inventory-shell-polish-wave2
  pull_request:
    branches:
      - integration/inventory-wave-2
      - main
    paths:
      - "dashboard/src/pages/inventory/InventoryTopDock.tsx"
      - "dashboard/src/pages/inventory/inventoryShellPolish.css"
      - "dashboard/src/test/inventory-cp13-shell-polish.test.tsx"
      - "dashboard/src/pages/inventory/TabWarehouseLocations.tsx"
      - "dashboard/src/pages/inventory/warehouse-locations/presentation/i18n.ts"
      - "dashboard/src/pages/inventory/liveStock/LiveStockFilters.tsx"
      - "dashboard/src/test/live-stock-family-cursor.test.tsx"
      - "dashboard/src/test/inventory-cp12-responsive-contract.test.ts"
      - "dashboard/e2e/inventory-cp14-device-ux.spec.ts"
      - ".github/workflows/inventory-cp13-shell-polish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp13-shell-polish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: npm ci
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps @testing-library/dom@10.4.1

      - name: CP13 shell + CP12 regressions
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-cp13-shell-polish.test.tsx
          src/test/inventory-cp12-i18n.test.tsx
          src/test/inventory-cp12-accessibility.test.tsx
          src/test/inventory-cp12-responsive-contract.test.ts
          src/test/live-stock-family-cursor.test.tsx

      - name: Build Dashboard for focused CP14-D browser regression
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174/api
        run: npm run build

      - name: Install disposable Playwright Chromium runtime
        working-directory: dashboard
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 @testing-library/dom@10.4.1
          npx playwright install --with-deps chromium

      - name: Start Dashboard preview
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174/api
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/cp13-preview.log 2>&1 &
          echo $! > /tmp/cp13-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/inventory >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cp13-preview.log
          exit 1

      - name: CP14-D reusable deep-link and narrow-device regression
        working-directory: dashboard
        env:
          CP14D_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          --config e2e/inventory-cp14-device-ux.config.ts
          --grep "direct tab navigation|narrow phone keeps critical actions"

      - name: Rendered failure diagnostics
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync, existsSync } from "node:fs";
          import { join } from "node:path";
          const root = "dashboard/node_modules/.cache/inventory-cp14-device-ux";
          const walk = dir => readdirSync(dir, { withFileTypes: true }).flatMap(e => e.isDirectory() ? walk(join(dir, e.name)) : [join(dir, e.name)]);
          if (existsSync(root)) for (const path of walk(root).filter(p => p.endsWith("error-context.md"))) {
            console.log(JSON.stringify({ path, rendered: readFileSync(path, "utf8") }));
          }
          JS

      - name: TypeScript noEmit
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --skipLibCheck --target es2022 --module esnext \
            --moduleResolution bundler --types node --lib es2022,dom \
            e2e/inventory-cp14-device-ux.config.ts e2e/inventory-cp14-device-ux.spec.ts

      - name: ESLint CP13 touched TypeScript
        working-directory: dashboard
        run: >-
          npx eslint
          src/pages/inventory/InventoryTopDock.tsx
          src/pages/inventory/TabWarehouseLocations.tsx
          src/pages/inventory/Tab2Inbound.tsx
          src/pages/inventory/warehouse-locations/presentation/i18n.ts
          src/pages/inventory/liveStock/LiveStockFilters.tsx
          src/test/live-stock-family-cursor.test.tsx
          src/test/inventory-cp12-responsive-contract.test.ts
          src/test/inventory-cp13-shell-polish.test.tsx
          e2e/inventory-cp14-device-ux.spec.ts

      - name: Production Dashboard build
        working-directory: dashboard
        env:
          VITE_API_URL: https://api.example.invalid
        run: npm run build

      - name: Bounded CP12 CP13 regression scope and whitespace
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, urllib.request
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_ref = os.environ["BASE"]
          assert re.fullmatch(r"[0-9a-f]{40}", head) and re.fullmatch(r"[0-9a-f]{40}", base_ref)
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{base_ref}...{head}",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              base = json.load(response)["merge_base_commit"]["sha"]
          subprocess.run(["git", "cat-file", "-e", base + "^{commit}"], check=True)
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          allowed = [".github/workflows/inventory-cp13-shell-polish.yml",".github/workflows/inventory-cp6-minimum-stock-dashboard-acceptance.yml",".github/workflows/live-stock-physical-custody-consumers.yml",".github/workflows/live-stock-v1-browser-acceptance.yml",".github/workflows/live-stock-v1-operational-browser.yml",".github/workflows/live-stock-v1-ux-closure.yml","dashboard/e2e/inventory-cp14-device-ux.spec.ts","dashboard/e2e/live-stock-operational.config.ts","dashboard/e2e/live-stock-operational.journey.ts","dashboard/e2e/live-stock-operational.spec.ts","dashboard/e2e/live-stock-operational.support.ts","dashboard/e2e/live-stock-physical-custody.config.ts","dashboard/e2e/live-stock-physical-custody.fixture.py","dashboard/e2e/live-stock-physical-custody.spec.ts","dashboard/e2e/live-stock-ux-closure.fixtures.ts","dashboard/e2e/live-stock-ux-closure.spec.ts","dashboard/e2e/live-stock-v1.fixtures.ts","dashboard/src/components/dashboard/WorkspaceTopBar.css","dashboard/src/i18n/resources.ts","dashboard/src/pages/inventory/InventoryTopDock.tsx","dashboard/src/pages/inventory/MainInventory.tsx","dashboard/src/pages/inventory/StockMinimumManager.tsx","dashboard/src/pages/inventory/Tab1LiveStock.tsx","dashboard/src/pages/inventory/Tab2Inbound.tsx","dashboard/src/pages/inventory/TabWarehouseLocations.tsx","dashboard/src/pages/inventory/inventoryShellPolish.css","dashboard/src/pages/inventory/inventoryTopDockController.ts","dashboard/src/pages/inventory/liveStock/BatchDetailPanel.tsx","dashboard/src/pages/inventory/liveStock/LiveStockFilters.tsx","dashboard/src/pages/inventory/liveStock/LiveStockMobileCards.tsx","dashboard/src/pages/inventory/liveStock/LiveStockTable.tsx","dashboard/src/pages/inventory/liveStock/VehicleCustodyQuantity.tsx","dashboard/src/pages/inventory/liveStock/contracts.ts","dashboard/src/pages/inventory/liveStock/useLiveStockBatchDetail.ts","dashboard/src/pages/inventory/warehouse-locations/presentation/i18n.ts","dashboard/src/test/inventory-access.test.ts","dashboard/src/test/inventory-cp12-responsive-contract.test.ts","dashboard/src/test/inventory-cp13-shell-polish.test.tsx","dashboard/src/test/inventory-cp6-minimum-stock-dashboard.test.tsx","dashboard/src/test/inventory-cp7-live-stock-parity.test.tsx","dashboard/src/test/inventory-cp7-live-stock.test.tsx","dashboard/src/test/live-stock-batch-detail-freshness.test.tsx","dashboard/src/test/live-stock-family-cursor.test.tsx","dashboard/src/test/live-stock-local-failure.test.tsx","dashboard/src/test/live-stock-render-performance.benchmark.test.tsx","dashboard/src/test/live-stock-render-windowing.test.tsx","dashboard/src/test/live-stock-ui01-canonical-alert.test.tsx","dashboard/src/test/live-stock-warm-authority.test.tsx","docs/operations/LIVE_STOCK_OPERATIONAL_BROWSER_EVIDENCE.md","wa_backend/tests/live_stock_operational_browser_support.py"]
          assert changed <= set(allowed), sorted(changed - set(allowed))
          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          print("CP12_CP13_SCOPE PASS", base, len(changed))
          PY

      - name: Upload narrow-screen layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp12-cp13-narrow-layout
          path: dashboard/node_modules/.cache/inventory-cp14-device-ux
          if-no-files-found: warn

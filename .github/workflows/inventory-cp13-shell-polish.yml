name: Inventory CP13 Shell Polish Acceptance

on:
  push:
    branches:
      - sol/cp13-inventory-shell-polish-wave2
  pull_request:
    branches:
      - integration/inventory-wave-2
      - main
    paths:
      - "dashboard/src/pages/inventory/InventoryTopDock.tsx"
      - "dashboard/src/pages/inventory/inventoryShellPolish.css"
      - "dashboard/src/test/inventory-cp13-shell-polish.test.tsx"
      - ".github/workflows/inventory-cp13-shell-polish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp13-shell-polish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: npm ci
        working-directory: dashboard
        run: npm ci

      - name: CP13 shell + CP12 regressions
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-cp13-shell-polish.test.tsx
          src/test/inventory-cp12-i18n.test.tsx
          src/test/inventory-cp12-accessibility.test.tsx
          src/test/inventory-cp12-responsive-contract.test.ts

      - name: Build Dashboard for focused CP14-D browser regression
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174/api
        run: npm run build

      - name: Install disposable Playwright Chromium runtime
        working-directory: dashboard
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Dashboard preview
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174/api
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/cp13-preview.log 2>&1 &
          echo $! > /tmp/cp13-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/inventory >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cp13-preview.log
          exit 1

      - name: CP14-D reusable deep-link and narrow-device regression
        working-directory: dashboard
        env:
          CP14D_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          --config e2e/inventory-cp14-device-ux.config.ts
          --grep "direct tab navigation|narrow phone keeps critical actions"

      - name: Restore clean Dashboard dependency tree
        working-directory: dashboard
        run: npm ci

      - name: TypeScript noEmit
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: ESLint CP13 touched TypeScript
        working-directory: dashboard
        run: >-
          npx eslint
          src/pages/inventory/InventoryTopDock.tsx
          src/test/inventory-cp13-shell-polish.test.tsx

      - name: Production Dashboard build
        working-directory: dashboard
        env:
          VITE_API_URL: https://api.example.invalid
        run: npm run build

      - name: Exact bounded CP13 scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          import json, re, urllib.request
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_ref = os.environ["BASE"]
          assert re.fullmatch(r"[0-9a-f]{40}", head) and re.fullmatch(r"[0-9a-f]{40}", base_ref)
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{base_ref}...{head}",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              base = json.load(response)["merge_base_commit"]["sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", base)
          subprocess.run(["git", "cat-file", "-e", base + "^{commit}"], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("CP13_DIFF_BASE=" + base + "\n")
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", base, "HEAD"], text=True
              ).splitlines()
          )
          allowed = ["dashboard/src/test/inventory-cp13-shell-polish.test.tsx","dashboard/src/components/dashboard/WorkspaceTopBar.css","dashboard/src/pages/inventory/inventoryShellPolish.css","dashboard/src/pages/inventory/InventoryTopDock.tsx","dashboard/src/pages/inventory/inventoryTopDockController.ts","dashboard/src/pages/inventory/liveStock/useLiveStockBatchDetail.ts","dashboard/src/pages/inventory/Tab1LiveStock.tsx","dashboard/src/pages/inventory/liveStock/BatchDetailPanel.tsx","dashboard/src/pages/inventory/MainInventory.tsx","dashboard/e2e/live-stock-ux-closure.fixtures.ts","dashboard/e2e/live-stock-ux-closure.spec.ts","dashboard/src/test/live-stock-batch-detail-freshness.test.tsx","wa_backend/tests/live_stock_operational_browser_support.py","dashboard/e2e/live-stock-operational.support.ts","dashboard/e2e/live-stock-operational.journey.ts","dashboard/e2e/live-stock-operational.spec.ts","dashboard/e2e/live-stock-operational.config.ts",".github/workflows/live-stock-v1-operational-browser.yml",".github/workflows/live-stock-v1-ux-closure.yml",".github/workflows/inventory-cp13-shell-polish.yml","docs/operations/LIVE_STOCK_OPERATIONAL_BROWSER_EVIDENCE.md"]
          assert changed <= set(allowed), f"Unexpected CP13 scope: {sorted(changed - set(allowed))}"
          forbidden = (
              "dashboard/src/pages/inventory/TabBatches.tsx",
              "dashboard/src/pages/inventory/batches/",
              "dashboard/src/pages/inventory/TabWarehouseLocations.tsx",
              "dashboard/src/pages/inventory/warehouse-locations/",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/",
          )
          assert not any(
              path == forbidden[0]
              or path.startswith(forbidden[1])
              or path == forbidden[2]
              or path.startswith(forbidden[3])
              or path == forbidden[4]
              or path.startswith(forbidden[5])
              for path in changed
          ), sorted(changed)
          print("CP13_EXACT_SCOPE=PASS")
          PY

      - name: git diff --check
        shell: bash
        env:
          CP13_REPAIR_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: git diff --check "$CP13_DIFF_BASE" HEAD

name: CP9 final PostgreSQL fixture fix

on:
  push:
    branches:
      - sol/cp9-stocktake-full-closure-wave2

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/cp9-stocktake-full-closure-wave2
      - name: Align final PostgreSQL fixture invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('wa_backend/tests/test_cp9_stocktake_postgres.py')
          s = p.read_text(encoding='utf-8')

          old_sheet = '        sheet = await stocktake_api.get_stocktake_count_sheet(session_id, db=self.db, access=access)\n'
          new_sheet = '        sheet = await stocktake_api.get_stocktake_count_sheet(\n            session_id, db=self.db, access=access, legacy_actor=actor,\n        )\n'
          if s.count(old_sheet) != 1:
              raise SystemExit(f'count-sheet helper match count={s.count(old_sheet)}')
          s = s.replace(old_sheet, new_sheet)

          old_cancel = '''            raw_session = await self.db.get(StocktakeSession, raw_session_id)\n            raw_session.status = "CANCELLED"\n            await self.db.commit()\n'''
          new_cancel = '''            raw_session = await self.db.get(StocktakeSession, raw_session_id)\n            raw_session.status = "CANCELLED"\n            raw_session.cancelled_by = int(self.actor_a.id)\n            raw_session.cancelled_at = utc_now().replace(tzinfo=None)\n            raw_session.cancellation_reason = "CP9 terminal blocker regression"\n            await self.db.commit()\n'''
          if s.count(old_cancel) != 1:
              raise SystemExit(f'cancel audit block match count={s.count(old_cancel)}')
          s = s.replace(old_cancel, new_cancel)

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile wa_backend/tests/test_cp9_stocktake_postgres.py
          rm .github/workflows/cp9-final-fixture-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wa_backend/tests/test_cp9_stocktake_postgres.py .github/workflows/cp9-final-fixture-fix.yml
          git commit -m 'CP9: align final PostgreSQL fixture invariants'
          git push origin HEAD:sol/cp9-stocktake-full-closure-wave2

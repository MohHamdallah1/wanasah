name: Branch canonical cutover temp gate

on:
  pull_request:
    paths:
      - "ARCHITECTURE.md"
      - ".rules"
      - "AGENTS.md"
      - "wa_backend/api/branches.py"
      - "wa_backend/domains/authorization/capabilities.py"
      - "wa_backend/alembic/versions/d3b7e1a4c920_branch_permissions.py"
      - "wa_backend/tests/test_branch_canonical_authorization_cutover.py"
      - ".github/workflows/branch-canonical-cutover-temp.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: branch_gate
          POSTGRES_DB: wanasah_branch_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U branch_gate -d wanasah_branch_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: BranchCutoverTempSecret123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://branch_gate@127.0.0.1:5432/wanasah_branch_gate
      DATABASE_URL_MIGRATION: postgresql+asyncpg://branch_gate@127.0.0.1:5432/wanasah_branch_gate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4
      - name: Upgrade empty database to head
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Verify branch permission rows
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          expected = {"branch.read", "branch.create", "branch.update", "branch.state"}
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn) as conn:
              rows = conn.execute("SELECT code FROM permissions WHERE code LIKE 'branch.%'").fetchall()
          actual = {row[0] for row in rows}
          assert actual == expected, (actual, expected)
          print("BRANCH_PERMISSION_ROWS=OK")
          PY
      - name: Run focused branch authorization tests
        working-directory: wa_backend
        run: python -m unittest -v tests.test_branch_canonical_authorization_cutover
      - name: Diff whitespace gate
        run: git diff --check

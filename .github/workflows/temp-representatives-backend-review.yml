name: TEMP Representatives Backend Review

on:
  push:
    branches: [sol/representatives-backend-management]

permissions:
  contents: read

jobs:
  validate-final:
    runs-on: ubuntu-24.04
    env:
      SECRET_KEY: RepresentativesBackendReviewSecret0123456789ABCdef
      DATABASE_URL: postgresql+asyncpg://wanasah_test:wanasah_test@127.0.0.1:5432/wanasah_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m compileall -q \
            wa_backend/domains/identity/credentials.py \
            wa_backend/domains/representatives \
            wa_backend/api/representatives \
            wa_backend/domains/authorization/capabilities.py \
            wa_backend/alembic/versions/b7a4c2d9e105_representative_permissions.py \
            wa_backend/main.py
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest
      - name: Focused canonical identity auth regression
        working-directory: wa_backend
        env:
          PYTHONPATH: ${{ github.workspace }}/wa_backend/tests:${{ github.workspace }}/wa_backend
        run: |
          python -m pytest -q \
            tests/test_identity_authentication_foundation.py \
            tests/test_canonical_auth_core_boundary.py \
            tests/test_canonical_auth_transport_boundary.py \
            tests/test_principal_http_dependencies.py \
            tests/test_canonical_field_runtime_compatibility.py \
            tests/test_identity_login_legacy_compatibility.py \
            tests/test_login_is_admin_retirement_contract.py
      - name: Representative final contract gate
        run: |
          PYTHONPATH=wa_backend python - <<'PY'
          from decimal import Decimal
          from pathlib import Path
          from pydantic import ValidationError
          from api.representatives import router
          from api.representatives.management import _not_found as management_not_found
          from api.representatives.read import _not_found as read_not_found
          from api.representatives.schemas import RepresentativeCreateRequest, RepresentativeResponse, RepresentativeUpdateRequest
          from domains.identity.credentials import CompanyCredentialValidationError, sensitive_value_fingerprint, validate_company_password
          from domains.representatives.contracts import CreateRepresentativeCommand, RepresentativeRecord
          from domains.representatives.management import _create_request_hash, _update_request_hash
          from domains.representatives.queries import representative_payload

          read_source = Path('wa_backend/api/representatives/read.py').read_text()
          for exact in (
              'search: str | None = Query(default=None, min_length=2, max_length=100)',
              'active: bool | None = Query(default=None)',
              'cursor: str | None = Query(default=None, max_length=512)',
              'limit: int = Query(default=30, ge=1, le=100)',
          ):
              assert exact in read_source, exact
          assert 'status:' not in read_source
          assert read_not_found().status_code == management_not_found().status_code == 404
          assert read_not_found().detail == management_not_found().detail

          assert set(RepresentativeResponse.model_fields) == {
              'id','full_name','username','phone_number','is_active','can_allow_debt','max_debt_limit'
          }
          routes = {(r.path, tuple(sorted(r.methods or []))): r for r in router.routes}
          assert set(routes) == {
              ('/representatives', ('GET',)),
              ('/representatives', ('POST',)),
              ('/representatives/{representative_id}', ('GET',)),
              ('/representatives/{representative_id}', ('PATCH',)),
          }
          assert routes[('/representatives', ('POST',))].status_code == 201
          assert routes[('/representatives', ('POST',))].response_model is RepresentativeResponse
          assert routes[('/representatives/{representative_id}', ('PATCH',))].status_code == 200
          assert routes[('/representatives/{representative_id}', ('PATCH',))].response_model is RepresentativeResponse

          try:
              RepresentativeUpdateRequest(request_id='11111111-1111-1111-1111-111111111111')
              raise AssertionError('request_id-only PATCH must fail')
          except ValidationError:
              pass
          for forbidden in ({'password':'password1'}, {'is_active':False}):
              try:
                  RepresentativeUpdateRequest(
                      request_id='11111111-1111-1111-1111-111111111111',
                      full_name='Rep', **forbidden,
                  )
                  raise AssertionError('generic PATCH accepted forbidden field')
              except ValidationError:
                  pass
          for invalid_debt in (Decimal('-0.001'), Decimal('1000000000.000'), Decimal('1.0001')):
              try:
                  RepresentativeUpdateRequest(
                      request_id='11111111-1111-1111-1111-111111111111',
                      max_debt_limit=invalid_debt,
                  )
                  raise AssertionError('invalid debt accepted')
              except ValidationError:
                  pass

          try:
              validate_company_password('é' * 40)
              raise AssertionError('Identity must enforce bcrypt byte limit')
          except CompanyCredentialValidationError:
              pass
          fp1 = sensitive_value_fingerprint('password1', purpose='test')
          fp2 = sensitive_value_fingerprint('password1', purpose='test')
          fp3 = sensitive_value_fingerprint('password2', purpose='test')
          assert fp1 == fp2 and fp1 != fp3 and 'password1' not in fp1

          base = dict(
              request_id='11111111-1111-1111-1111-111111111111',
              full_name='Rep', username='rep', phone_number=None,
              can_allow_debt=False, max_debt_limit=Decimal('0.000'),
          )
          cmd1 = CreateRepresentativeCommand(password='password1', **base)
          cmd2 = CreateRepresentativeCommand(password='password1', **base)
          cmd3 = CreateRepresentativeCommand(password='password2', **base)
          h1 = _create_request_hash(cmd1, normalized_debt_limit=Decimal('0.000'))
          h2 = _create_request_hash(cmd2, normalized_debt_limit=Decimal('0.000'))
          h3 = _create_request_hash(cmd3, normalized_debt_limit=Decimal('0.000'))
          assert h1 == h2 and h1 != h3
          assert 'password1' not in h1 and 'password2' not in h3
          assert _update_request_hash(7, {'full_name':'A'}) == _update_request_hash(7, {'full_name':'A'})
          assert _update_request_hash(7, {'full_name':'A'}) != _update_request_hash(8, {'full_name':'A'})
          assert _update_request_hash(7, {'full_name':'A'}) != _update_request_hash(7, {'full_name':'B'})

          payload = representative_payload(RepresentativeRecord(
              representative_id=7, full_name='A', username='u', phone_number=None,
              is_active=True, can_allow_debt=False, max_debt_limit=Decimal('0.000')
          ))
          assert set(payload) == set(RepresentativeResponse.model_fields)
          print('REPRESENTATIVES_FINAL_CONTRACT=PASS')
          PY
      - name: Architecture, migration and scope gate
        run: |
          python - <<'PY'
          import ast, subprocess
          from pathlib import Path
          mgmt = Path('wa_backend/domains/representatives/management.py').read_text()
          repo = Path('wa_backend/domains/representatives/repository.py').read_text()
          creds = Path('wa_backend/domains/representatives/credentials.py').read_text()
          ident = Path('wa_backend/domains/identity/credentials.py').read_text()
          schemas = Path('wa_backend/api/representatives/schemas.py').read_text()
          life_api = Path('wa_backend/api/representatives/lifecycle.py').read_text()
          cred_api = Path('wa_backend/api/representatives/credentials.py').read_text()
          queries = Path('wa_backend/domains/representatives/queries.py').read_text()
          assert 'password_fingerprint' in mgmt and '"password": command.password' not in mgmt
          assert 'import bcrypt' not in creds and 'bcrypt.' not in creds and 'Config' not in creds
          assert 'import bcrypt' in ident and 'hmac.new' in ident and '_sensitive_fingerprint_key' in ident
          for direct in ('CompanyPrincipal', 'FieldRepresentative', 'IdentityLegacyDriverMap', 'SystemAuditLog'):
              assert direct not in mgmt, direct
          assert 'create_representative_persistence' in repo
          assert 'classification="FIELD_ONLY"' in repo
          assert 'field_principal_id=principal.id' in repo and 'field_representative_id=profile.id' in repo
          assert 'created_at' not in schemas and 'updated_at' not in schemas
          assert 'func.lower(func.trim(CompanyPrincipal.full_name))' in queries
          assert '_normalized_name_value(record.full_name)' in queries
          assert '@router.post' not in life_api and '@router.post' not in cred_api

          versions = Path('wa_backend/alembic/versions')
          revisions, parents = {}, set()
          for path in versions.glob('*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'))
              revision = down = None
              for node in tree.body:
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target] if isinstance(node, ast.AnnAssign) else []
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id in {'revision','down_revision'}:
                          value = ast.literal_eval(node.value)
                          if target.id == 'revision': revision = value
                          else: down = value
              if revision:
                  assert revision not in revisions, revision
                  revisions[revision] = path.name
                  if isinstance(down, tuple): parents.update(x for x in down if x)
                  elif down: parents.add(down)
          assert sorted(set(revisions) - parents) == ['b7a4c2d9e105']
          migration = (versions / 'b7a4c2d9e105_representative_permissions.py').read_text()
          assert 'down_revision = "f2c7a9d4e611"' in migration
          for code in ('representative.read','representative.manage','representative.credentials.reset'):
              assert migration.count(f"('{code}')") == 1
          assert 'ON CONFLICT (code) DO NOTHING' in migration
          downgrade = migration.split('def downgrade()',1)[1]
          assert 'pass' in downgrade and 'DELETE FROM permissions' not in downgrade

          allowed_prefixes = ('wa_backend/domains/representatives/','wa_backend/api/representatives/')
          allowed_exact = {
              'wa_backend/domains/authorization/capabilities.py',
              'wa_backend/main.py',
              'wa_backend/domains/identity/credentials.py',
              'wa_backend/alembic/versions/b7a4c2d9e105_representative_permissions.py',
              '.github/workflows/temp-representatives-backend-review.yml',
          }
          files = subprocess.check_output(['git','diff','--name-only','8d6ab2663598bb9ae9144bf319863a2bd9eb421e...HEAD'], text=True).splitlines()
          bad = [p for p in files if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          assert not bad, bad
          assert 'wa_backend/api/driver.py' not in files and 'wa_backend/api/dispatch.py' not in files
          print('REPRESENTATIVES_ARCH_MIGRATION_SCOPE=PASS')
          PY
          git diff --check 8d6ab2663598bb9ae9144bf319863a2bd9eb421e...HEAD

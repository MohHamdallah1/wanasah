name: CP15 CP6 policy test debt verification

on:
  push:
    branches:
      - sol/cp15-cp6-policy-test-debt-wave2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: CP6 policy closure
        working-directory: dashboard
        run: npm test -- src/test/inventory-cp6-policy-closure.test.tsx
      - name: CP6 minimum-stock regression
        working-directory: dashboard
        run: npm test -- src/test/inventory-cp6-minimum-stock-dashboard.test.tsx
      - name: CP12 i18n accessibility responsive regressions
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-cp12-i18n.test.tsx
          src/test/inventory-cp12-accessibility.test.tsx
          src/test/inventory-cp12-responsive-contract.test.ts
      - name: TypeScript noEmit
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: Production Dashboard build
        working-directory: dashboard
        run: npm run build
      - name: Final diff whitespace check
        run: git diff --check ace953807f9770d424e88b98653a7626710aaeff HEAD

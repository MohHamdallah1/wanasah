name: Stocktake V1 DISCOVERED real PG16 and AR-EN acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/api/warehouse/stocktake.py"
      - "wa_backend/api/warehouse/stocktake_discovery.py"
      - "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
      - "dashboard/src/pages/inventory/Tab3Stocktake.tsx"
      - "dashboard/src/pages/inventory/stocktake/**"
      - ".github/workflows/stocktake-v1-discovered-pg16-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-16:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: Cp14CPostgresSyntheticOnlyKeyAbc123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://cp14c_app@127.0.0.1:55452/wanasah_cp14c_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp14c_admin@127.0.0.1:55452/wanasah_cp14c_test
      WANASAH_CP14C_PG_GATE: "1"
      WANASAH_CP14C_PG_URL: postgresql+asyncpg://cp14c_app@127.0.0.1:55452/wanasah_cp14c_test
      WANASAH_CP14C_PG_ADMIN_URL: postgresql+asyncpg://cp14c_admin@127.0.0.1:55452/wanasah_cp14c_test
      WANASAH_CP9_PG_GATE: "1"
      WANASAH_VEHICLE_RECON_LOCK_ORDER_DB_GATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL acceptance dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Start disposable PostgreSQL 16
        run: |
          docker run --detach --name cp14c-postgres \
            --env POSTGRES_USER=cp14c_admin \
            --env POSTGRES_DB=wanasah_cp14c_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55452:55452 \
            postgres:16 -p 55452
          for attempt in $(seq 1 30); do
            if docker exec cp14c-postgres pg_isready -U cp14c_admin -d wanasah_cp14c_test -p 55452; then
              exit 0
            fi
            sleep 1
          done
          docker logs cp14c-postgres
          exit 1
      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              if conn.execute(
                  "SELECT 1 FROM pg_roles WHERE rolname='cp14c_app'"
              ).fetchone() is None:
                  conn.execute(
                      "CREATE ROLE cp14c_app LOGIN NOSUPERUSER NOCREATEDB "
                      "NOCREATEROLE NOINHERIT NOBYPASSRLS"
                  )
              flags = conn.execute(
                  "SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname='cp14c_app'"
              ).fetchone()
              assert flags == (False, False), flags
          PY
      - name: Clean Alembic bootstrap
        working-directory: wa_backend
        run: alembic upgrade head
      - name: CP14-C real PostgreSQL16 discovered stock / physical posting acceptance
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_cp14c_stocktake_lifecycle_postgres.py

  dashboard-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked Dashboard install
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Discovered stock AR EN, draft, UOM and authority
        working-directory: dashboard
        run: npm run test -- src/pages/inventory/stocktake/StocktakeDiscoveredV1.test.tsx src/pages/inventory/stocktake/StocktakeSessionReadFence.test.tsx
      - name: TypeScript and exact touched-file lint
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npx eslint src/pages/inventory/Tab3Stocktake.tsx src/pages/inventory/stocktake/StocktakeCountingPanel.tsx src/pages/inventory/stocktake/StocktakeDiscoveredModal.tsx src/pages/inventory/stocktake/StocktakeDiscoveredV1.test.tsx src/pages/inventory/stocktake/discoveredContract.ts src/pages/inventory/stocktake/hooks/useStocktakeCounting.ts src/pages/inventory/stocktake/uiCopy.ts
      - name: Exact owner scope and whitespace
        env:
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BASE_SHA="${PULL_BASE_SHA:-$(git merge-base origin/main HEAD)}"
          git diff --check "$BASE_SHA" HEAD
          BASE_SHA="$BASE_SHA" python - <<'PY'
          import os
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"],
              text=True,
          ).splitlines())
          discovered_764 = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-session-read-fence.yml",
              "wa_backend/api/warehouse/stocktake.py",
              "wa_backend/api/warehouse/stocktake_discovery.py",
              "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeDiscoveredModal.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeDiscoveredV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/discoveredContract.ts",
              "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeCounting.ts",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          keyboard_776 = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-ux-776.yml",
              "dashboard/e2e/stocktake-v1-ux-776.config.ts",
              "dashboard/e2e/stocktake-v1-ux-776.spec.ts",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
          }
          # #779 Review UI parity was merged first. Preserve its exact
          # original ownership case alongside this independent HTTP test.
          review_779 = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
              "dashboard/e2e/stocktake-v1-ux-776.spec.ts",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewV1Parity.test.tsx",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          # Exact test-only #778 scope: reuse CP14C fixture and add one
          # authenticated ASGI bearer journey. No production files allowed.
          http_778 = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py",
              "wa_backend/tests/stocktake_v1_real_http_pg16_helper.py",
          }
          # #782 CI-only correction. This exact one-file PR is independent
          # of the previous business/UX scopes; it cannot admit foreign files.
          ci_782 = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
          }
          # #784 approved operator UX: exact GitHub PR changed-file set.
          # Keep this separate from all historical original PR scopes.
          operator_784 = {
              ".github/workflows/stocktake-v1-operator-782.yml",
              "dashboard/e2e/stocktake-v1-ux-776.spec.ts",
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeCycleStartModal.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeOperatorUx782.test.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/hooks/useCycleCountStart.ts",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          # Independent Worker 1 CI-only PR, not part of #784 UX scope.
          ci_compat_784 = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
          }
          # Owner-approved isolated final #782 visual refinements. Never
          # admit subsets, supersets or cross-worker combinations.
          shell_789 = {
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeSessionCenter.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeShellLayout.test.tsx",
              "dashboard/e2e/stocktake-shell-782/stocktake-v1-ux-776.spec.ts",
          }
          workspace_788 = {
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeIndependentWait.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeUnifiedWorkspaceV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          final_ci_782 = {
              ".github/workflows/stocktake-v1-operator-782.yml",
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
              ".github/scripts/live_stock_ci_ownership.py",
          }
          # Exact density fixes and the CI+historical browser compatibility bridge.
          compact_791 = {
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeUnifiedWorkspaceV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          # #792 has the identical exact file set already approved for #789.
          dialog_792 = set(shell_789)
          bridge_793 = set(final_ci_782) | {"dashboard/e2e/stocktake-v1-ux-776.spec.ts"}
          valid_scopes = {
              frozenset(discovered_764): "DISCOVERED_764",
              frozenset(keyboard_776): "VISIBLE_COUNT_KEYBOARD_776",
              frozenset(review_779): "REVIEW_EVIDENCE_779",
              frozenset(http_778): "REAL_BEARER_HTTP_778",
              frozenset(ci_782): "CI_ONLY_782",
              frozenset(operator_784): "OPERATOR_UX_784",
              frozenset(ci_compat_784): "CI_COMPAT_784",
              frozenset(shell_789): "SINGLE_TOOLBAR_789",
              frozenset(workspace_788): "UNIFIED_WORKSPACE_788",
              frozenset(final_ci_782): "FINAL_CI_782",
              frozenset(compact_791): "COMPACT_COUNT_791",
              frozenset(bridge_793): "DENSITY_CI_BROWSER_BRIDGE",
          }
          foreign_paths = (
              "dashboard/src/pages/inventory/Tab4Ledger.tsx",
              "dashboard/src/pages/inventory/TabBatches.tsx",
              "wa_backend/services.py",
              "wanasah_frontend/lib/main.dart",
          )

          def verify_owner_scope(event_name, files):
              if event_name == "workflow_dispatch":
                  # A manual run on the selected main has no PR diff. Do NOT
                  # reuse this exemption for pull_request events or a run
                  # containing uncommitted/foreign changes.
                  assert not files, {
                      "error": "STOCKTAKE_DISPATCH_DIRTY_SCOPE",
                      "changed": sorted(files),
                  }
                  return "DISPATCH_CLEAN_MAIN"
              assert event_name == "pull_request", {
                  "error": "STOCKTAKE_UNEXPECTED_EVENT",
                  "event": event_name,
              }
              matched = valid_scopes.get(frozenset(files))
              assert matched is not None, {
                  "error": "STOCKTAKE_OWNER_SCOPE_V1_FAIL",
                  "unexpected": sorted(files - discovered_764 - keyboard_776 - review_779 - http_778 - ci_782 - operator_784 - ci_compat_784 - shell_789 - workspace_788 - final_ci_782 - compact_791 - dialog_792 - bridge_793),
                  "changed": sorted(files),
              }
              for foreign in foreign_paths:
                  assert frozenset(files | {foreign}) not in valid_scopes
              return matched

          # Focused cross-event regression inside the existing narrow gate:
          # empty dispatch passes, empty PR or nonempty dispatch fails.
          assert verify_owner_scope("workflow_dispatch", set()) == "DISPATCH_CLEAN_MAIN"
          assert verify_owner_scope("pull_request", ci_782) == "CI_ONLY_782"
          assert verify_owner_scope("pull_request", operator_784) == "OPERATOR_UX_784"
          assert verify_owner_scope("pull_request", ci_compat_784) == "CI_COMPAT_784"
          assert verify_owner_scope("pull_request", shell_789) == "SINGLE_TOOLBAR_789"
          assert verify_owner_scope("pull_request", workspace_788) == "UNIFIED_WORKSPACE_788"
          assert verify_owner_scope("pull_request", final_ci_782) == "FINAL_CI_782"
          assert verify_owner_scope("pull_request", compact_791) == "COMPACT_COUNT_791"
          assert verify_owner_scope("pull_request", dialog_792) == "SINGLE_TOOLBAR_789"
          assert dialog_792 == shell_789
          assert verify_owner_scope("pull_request", bridge_793) == "DENSITY_CI_BROWSER_BRIDGE"
          for event, sample in (
              ("pull_request", set()),
              ("workflow_dispatch", ci_782),
              ("pull_request", ci_782 | {foreign_paths[0]}),
              ("pull_request", operator_784 - {"dashboard/src/pages/inventory/MainInventory.tsx"}),
              ("pull_request", operator_784 | {foreign_paths[0]}),
              ("pull_request", ci_compat_784 | {foreign_paths[0]}),
              ("pull_request", shell_789 - {"dashboard/src/pages/inventory/MainInventory.tsx"}),
              ("pull_request", shell_789 | {foreign_paths[0]}),
              ("pull_request", workspace_788 - {"dashboard/src/pages/inventory/stocktake/uiCopy.ts"}),
              ("pull_request", workspace_788 | {foreign_paths[0]}),
              ("pull_request", shell_789 | workspace_788),
              ("pull_request", final_ci_782 - {".github/scripts/live_stock_ci_ownership.py"}),
              ("pull_request", final_ci_782 | {foreign_paths[0]}),
              ("pull_request", compact_791 - {"dashboard/src/pages/inventory/stocktake/uiCopy.ts"}),
              ("pull_request", compact_791 | {foreign_paths[0]}),
              ("pull_request", dialog_792 - {"dashboard/src/pages/inventory/MainInventory.tsx"}),
              ("pull_request", dialog_792 | {foreign_paths[0]}),
              ("pull_request", bridge_793 - {".github/scripts/live_stock_ci_ownership.py"}),
              ("pull_request", bridge_793 | {foreign_paths[0]}),
              ("pull_request", compact_791 | dialog_792),
          ):
              try:
                  verify_owner_scope(event, sample)
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"Stocktake owner gate accepted forbidden {event}: {sorted(sample)}")

          matched = verify_owner_scope(os.environ["EVENT_NAME"], changed)
          print(f"STOCKTAKE_V1_OWNER_SCOPE={matched}_PASS")
          PY

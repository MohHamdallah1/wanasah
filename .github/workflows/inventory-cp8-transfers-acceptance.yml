  cp3-wave-baseline-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 3f2f860fc8f04306e673de38a39e57ca3edf6df6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Unmodified Wave CP3 terminal actions baseline
        working-directory: dashboard
        run: npm test -- src/test/batch-terminal-actions.test.tsx --reporter=verbose

  dynamic-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Dynamic PR merge-base and exact CP8 scope
        shell: bash
        env:
          TARGET_REF: ${{ github.event.pull_request.base.ref || 'integration/inventory-wave-2' }}
        run: |
          git fetch origin "$TARGET_REF" --no-tags
          base="$(git merge-base HEAD "origin/$TARGET_REF")"
          test -n "$base"
          echo "CP8_BASE_SHA=$base" >> "$GITHUB_ENV"
          python - "$base" <<'PY'
          import subprocess, sys
          base = sys.argv[1]
          changed = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines()
          allowed = {
              ".github/workflows/inventory-cp8-transfers-acceptance.yml",
              "wa_backend/api/warehouse/transfers.py",
              "wa_backend/api/warehouse/transfer_policy.py",
              "dashboard/src/pages/inventory/TabTransfers.tsx",
              "dashboard/src/features/inventory/quality/QualityHandlingDestinationsCard.tsx",
              "dashboard/src/features/inventory/quality/useTransferDestinationPolicy.ts",
              "dashboard/src/test/cp8-quality-destinations.test.tsx",
          }
          def owned(path):
              return path in allowed or path.startswith(("wa_backend/domains/transfers/", "dashboard/src/pages/inventory/transfers/")) or path.startswith("wa_backend/tests/test_cp8_")
          assert all(owned(path) for path in changed), [path for path in changed if not owned(path)]
          deleted = subprocess.check_output(["git", "diff", "--diff-filter=D", "--name-only", base, "HEAD"], text=True).strip()
          assert not deleted, deleted
          print("CP8_SCOPE=PASS", len(changed))
          PY
          git diff --check "$base" HEAD
          git merge-base --is-ancestor dc4fc371020abec02dd7f386ef90d1a4f1dea7aa HEAD
          git merge-base --is-ancestor 3f2f860fc8f04306e673de38a39e57ca3edf6df6 HEAD
          git diff --exit-code dc4fc371020abec02dd7f386ef90d1a4f1dea7aa HEAD -- \
            wa_backend/api/warehouse/transfers.py wa_backend/api/warehouse/transfer_policy.py \
            wa_backend/domains/transfers dashboard/src/pages/inventory/TabTransfers.tsx \
            dashboard/src/pages/inventory/transfers \
            dashboard/src/features/inventory/quality/QualityHandlingDestinationsCard.tsx \
            dashboard/src/features/inventory/quality/useTransferDestinationPolicy.ts

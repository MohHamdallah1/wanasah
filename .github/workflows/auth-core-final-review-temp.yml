name: TEMP Auth core final review

on:
  push:
    branches:
      - lead/auth-core-final-review

jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: test
      SECRET_KEY: AuthCoreGateAa1234567890Bb1234567890Cc1234567890Dd
      DATABASE_URL: postgresql+asyncpg://unit_user@127.0.0.1:1/unit_db
      DATABASE_URL_MIGRATION: postgresql+asyncpg://unit_admin@127.0.0.1:1/unit_db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: Compile auth core runtime and tests
        run: |
          python -m py_compile \
            wa_backend/api/auth.py \
            wa_backend/api/dependencies.py \
            wa_backend/api/authentication/login_orchestration.py \
            wa_backend/api/authentication/login_transport.py \
            wa_backend/api/authentication/login_transport_routes.py \
            wa_backend/token_identity.py \
            wa_backend/tests/test_canonical_auth_core_boundary.py \
            wa_backend/tests/test_canonical_auth_core_cutover.py \
            wa_backend/tests/test_canonical_auth_transport_boundary.py \
            wa_backend/tests/test_canonical_login_no_legacy_boundary.py \
            wa_backend/tests/test_principal_login_route_adapter.py
      - name: Run Codex focused auth core suites
        working-directory: wa_backend
        env:
          PYTHONPATH: .:tests
        run: |
          pytest -q \
            tests/test_canonical_auth_core_boundary.py \
            tests/test_canonical_auth_core_cutover.py \
            tests/test_canonical_auth_transport_boundary.py \
            tests/test_canonical_login_no_legacy_boundary.py \
            tests/test_principal_login_route_adapter.py \
            tests/test_canonical_backoffice_capability_access.py
      - name: Canonical authority source audit
        run: |
          python - <<'PY'
          from pathlib import Path
          auth = Path('wa_backend/api/auth.py').read_text(encoding='utf-8')
          deps = Path('wa_backend/api/dependencies.py').read_text(encoding='utf-8')
          combined = auth + '\n' + deps
          for token in ('.is_admin', 'Driver.is_admin', 'actor.company_id', 'current_admin.company_id'):
              assert token not in combined, token
          assert 'async def get_current_admin()' in deps
          assert 'raise _retired_dependency()' in deps
          assert 'get_current_backoffice_legacy_driver' in deps
          assert 'get_current_field_legacy_driver' in deps
          assert 'login_transport_routes' in auth
          PY
      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD

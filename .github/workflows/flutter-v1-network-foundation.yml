name: Flutter V1 Network foundation acceptance

on:
  pull_request:
    paths:
      - "wanasah_frontend/lib/core/network/**"
      - "wanasah_frontend/test/core/network/**"
      - ".github/workflows/flutter-v1-network-foundation.yml"

permissions:
  contents: read

jobs:
  network-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Provide CI-only dotenv asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env
      - name: Analyze Flutter
        run: flutter analyze
      - name: Focused Network tests
        run: >-
          flutter test
          test/core/network/retry_policy_characterization_test.dart
          test/core/network/api_failure_test.dart
          test/core/network/auth_interceptor_test.dart

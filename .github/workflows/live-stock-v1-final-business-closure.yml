name: Live Stock V1 final business and accounting closure

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/test_live_stock_v1_final_business_closure_postgres.py"
      - "wa_backend/tests/test_costed_driver_sale_correction_real_c2_db.py"
      - ".github/workflows/live-stock-v1-final-business-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-v1-final-business-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  connected-business-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: FinalBusinessClosureOnlyKeyAbc123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://final_business_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_FINAL_BUSINESS_PG_GATE: "1"
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://final_business_admin@127.0.0.1:55439/wanasah_no_lot_contract_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Compile final business acceptance
        working-directory: wa_backend
        run: >-
          python -m py_compile
          tests/test_live_stock_v1_final_business_closure_postgres.py
          tests/test_live_stock_v1_route_sale_unload_postgres.py
          tests/warehouse_transfer_stocktake_support.py

      - name: Start disposable PostgreSQL 16
        run: |
          docker run --detach --name final-business-postgres             --env POSTGRES_USER=final_business_admin             --env POSTGRES_DB=wanasah_no_lot_contract_test             --env POSTGRES_HOST_AUTH_METHOD=trust             --publish 127.0.0.1:55439:55439             postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec final-business-postgres pg_isready               -U final_business_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs final-business-postgres
          exit 1

      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = (
              make_url(os.environ["DATABASE_URL_MIGRATION"])
              .set(drivername="postgresql")
              .render_as_string(hide_password=False)
          )
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Migrate disposable database
        working-directory: wa_backend
        run: alembic upgrade head

      - name: Grant restricted runtime DML
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = (
              make_url(os.environ["DATABASE_URL_MIGRATION"])
              .set(drivername="postgresql")
              .render_as_string(hide_password=False)
          )
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE "
                  "ON ALL TABLES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT USAGE, SELECT, UPDATE "
                  "ON ALL SEQUENCES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "INSERT INTO permissions(code) VALUES "
                  "('inventory.read'), ('inbound.create') "
                  "ON CONFLICT(code) DO NOTHING"
              )
          PY

      - name: Run connected business, reservation and concurrency proof
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v1_final_business_closure_postgres.py
          --junitxml=final-business-postgres.xml

      - name: Reject skips, failures and empty execution
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("final-business-postgres.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No final-business PostgreSQL acceptance executed"
          assert not list(root.iter("skipped")), "Final-business acceptance must not skip"
          assert not list(root.iter("failure")) and not list(root.iter("error")),               "Final-business PostgreSQL acceptance failed"
          print("FINAL_BUSINESS_POSTGRES_EXECUTED=" + str(len(cases)))
          PY

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Retain connected-flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-business-postgres-${{ github.sha }}
          path: wa_backend/final-business-postgres.xml
          if-no-files-found: error

  two-purchase-sale-return-accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: field_gate_admin
          POSTGRES_DB: wanasah_field_contracts
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55475:5432"]
        options: >-
          --health-cmd "pg_isready -U field_gate_admin -d wanasah_field_contracts"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: FinalAccountingClosureOnlyKey123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://field_gate_runtime@127.0.0.1:55475/wanasah_field_contracts
      DATABASE_URL_MIGRATION: postgresql+asyncpg://field_gate_admin@127.0.0.1:55475/wanasah_field_contracts
      WANASAH_FIELD_CONTRACT_PG_GATE: "1"
      PYTHONPATH: ".:tests"

    defaults:
      run:
        working-directory: wa_backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned backend and test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1

      - name: Compile focused accounting acceptance
        run: python -m py_compile tests/test_costed_driver_sale_correction_real_c2_db.py tests/field_contract_postgres_fixture.py

      - name: Create restricted disposable runtime role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://field_gate_admin@127.0.0.1:55475/wanasah_field_contracts",
              autocommit=True,
          ) as db:
              db.execute(
                  "CREATE ROLE field_gate_runtime LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Canonical fresh Alembic schema and parity
        run: |
          alembic upgrade head
          alembic check

      - name: Seed isolated synthetic contract fixture and C2 gates
        run: python -m tests.field_contract_postgres_fixture

      - name: Run two-purchase FIFO and moving-average sale/correction proof
        run: >-
          python -m pytest -q -s
          tests/test_costed_driver_sale_correction_real_c2_db.py
          --junitxml=final-accounting-postgres.xml

      - name: Reject skips, failures and empty execution
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("final-accounting-postgres.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No final-accounting PostgreSQL acceptance executed"
          assert not list(root.iter("skipped")), "Final-accounting acceptance must not skip"
          assert not list(root.iter("failure")) and not list(root.iter("error")),               "Final-accounting PostgreSQL acceptance failed"
          print("FINAL_ACCOUNTING_POSTGRES_EXECUTED=" + str(len(cases)))
          PY

      - name: Retain accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-accounting-postgres-${{ github.sha }}
          path: wa_backend/final-accounting-postgres.xml
          if-no-files-found: error

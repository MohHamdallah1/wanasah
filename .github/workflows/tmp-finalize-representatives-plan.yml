name: Finalize Representatives plan ledger
on:
  push:
    branches:
      - lead/representatives-vehicles-plan-finalize
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lead/representatives-vehicles-plan-finalize
      - name: Update completed Representatives gates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('REPRESENTATIVES_VEHICLES_V1_PLAN.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('**Status:** REPRESENTATIVES IMPLEMENTED — FINAL FIELD/FLUTTER + OWNER ACCEPTANCE PENDING; VEHICLES NOT STARTED', '**Status:** REPRESENTATIVES TECHNICALLY COMPLETE — OWNER UI ACCEPTANCE PENDING; VEHICLES NOT STARTED'),
            ('- [x] Representative concurrency/idempotency runtime acceptance merged.', '- [x] Representative concurrency/idempotency runtime acceptance merged.\n- [x] Representative Roles/permission provisioning and immediate revocation behavior proven on PostgreSQL.\n- [x] Final adversarial Backend↔Dashboard review merged, including cache/retry/error hardening, PostgreSQL cursor-key consistency, and secret-free credential-reset recovery.\n- [x] Final FIELD/Flutter compatibility acceptance merged, including canonical FIELD login/session behavior and fail-closed preservation of unsynced offline work across account switching.\n- [x] Representative audit/security acceptance merged; mutation audit atomicity, replay behavior, tenant isolation, secret redaction, and bcrypt traceback redaction are proven.'),
            ('- [ ] Final FIELD/Flutter compatibility acceptance from the separately assigned worker.\n', ''),
            ('This phase is required because Representatives are not just Dashboard records; they must remain valid field actors. A separate worker owns the final FIELD/Flutter compatibility acceptance; this closure task must not duplicate it.', 'This phase is complete: Representatives remain valid field actors across the merged FIELD/Flutter compatibility boundary.'),
            ('Final integration acceptance remains pending until the assigned worker reports/merges evidence:', 'Final FIELD/Flutter integration acceptance is merged and closed:'),
            ('- [ ] FIELD/Dispatch representative discovery and assignment remain canonical/fail-closed under merged runtime behavior.', '- [x] FIELD/Dispatch representative discovery and assignment remain canonical/fail-closed under merged runtime behavior.'),
            ('- [ ] Route assignment accepts only valid active same-company FIELD representatives under existing rules.', '- [x] Route assignment accepts only valid active same-company FIELD representatives under existing rules.'),
            ('- [ ] WorkSession creation accepts only valid active same-company FIELD representatives under existing rules.', '- [x] WorkSession creation accepts only valid active same-company FIELD representatives under existing rules.'),
            ('- [ ] Sales/returns/collection attribution preserves existing business meaning through canonical FIELD context plus bounded legacy locator compatibility.', '- [x] Sales/returns/collection attribution preserves existing business meaning through canonical FIELD context plus bounded legacy locator compatibility.'),
            ('- [ ] Flutter `/driver/login` compatibility returns/uses canonical FIELD identity without ambiguous cross-channel login.', '- [x] Flutter `/driver/login` compatibility returns/uses canonical FIELD identity without ambiguous cross-channel login.'),
            ('- [ ] Flutter persisted legacy driver locator remains compatible without corrupting local state during the V1 transition.', '- [x] Flutter persisted legacy driver locator remains compatible without corrupting local state during the V1 transition.'),
            ('- [ ] Logout/session invalidation works after Representative deactivate/reset in the real FIELD/Flutter client flow.', '- [x] Logout/session invalidation works after Representative deactivate/reset in the real FIELD/Flutter client flow.'),
            ('- [ ] Offline retry/idempotency payloads continue to attribute the correct representative.', '- [x] Offline retry/idempotency payloads continue to attribute the correct representative.'),
            ('- [ ] Realtime/FIELD authorization does not depend on legacy admin/persona flags.', '- [x] Realtime/FIELD authorization does not depend on legacy admin/persona flags.'),
            ('- [ ] No Dashboard-only capability leaks into FIELD tokens.', '- [x] No Dashboard-only capability leaks into FIELD tokens.'),
            ('- [ ] Newly created representative can immediately authenticate in the real Flutter/FIELD client flow — pending the separate FIELD/Flutter compatibility acceptance.', '- [x] Newly created representative can immediately authenticate in the real Flutter/FIELD client flow.'),
            ('- [ ] newly created representative can login in the real Flutter client.', '- [x] newly created representative can login in the real Flutter client.'),
            ('- [ ] representative can receive route/work session under existing Dispatch rules in the final FIELD/Flutter acceptance pass.', '- [x] representative can receive route/work session under existing Dispatch rules in the final FIELD/Flutter acceptance pass.'),
            ('- [ ] deactivate/reset/logout behavior is accepted end-to-end in the real FIELD client.', '- [x] deactivate/reset/logout behavior is accepted end-to-end in the real FIELD client.'),
            ('- [ ] reactivate restores allowed FIELD login without creating duplicate profile/sidecar/map.', '- [x] reactivate restores allowed FIELD login without creating duplicate profile/sidecar/map.'),
            ('- [ ] Representative created here can login to the real Flutter client and receive Dispatch work — final FIELD/Flutter acceptance pending.', '- [x] Representative created here can login to the real Flutter client and receive Dispatch work.'),
            ('4. [ ] Representatives FIELD/Flutter compatibility integration acceptance — separate worker in progress.', '4. [x] Representatives FIELD/Flutter compatibility integration acceptance completed and merged.'),
            ('The merged Representative administration implementation now satisfies the architecture, HTTP contract, Dashboard, PostgreSQL runtime, tenant-isolation, lifecycle/reset, and idempotency/concurrency gates. Representatives are **not yet owner-complete** because final FIELD/Flutter compatibility acceptance and owner acceptance remain pending. Vehicles must remain gated and unimplemented until those two final Representative gates close.', 'The merged Representative administration implementation now satisfies the architecture, HTTP contract, Dashboard, PostgreSQL runtime, tenant-isolation, lifecycle/reset, idempotency/concurrency, RBAC provisioning, adversarial-review, audit/security, and FIELD/Flutter compatibility gates. Representatives are **technically complete**; only explicit owner UI/wording/behavior acceptance remains before the owner-complete gate is checked. Vehicles remains gated and unimplemented until that final owner gate closes.')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected plan text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/tmp-finalize-representatives-plan.yml
          git diff --check
      - name: Commit finalized plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close Representatives technical acceptance'
          git push
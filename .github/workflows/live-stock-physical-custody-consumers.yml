name: Live Stock physical custody consumer acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/pages/inventory/liveStock/**"
      - "dashboard/src/pages/inventory/StockMinimumManager.tsx"
      - "dashboard/src/i18n/resources.ts"
      - "dashboard/src/test/inventory-access.test.ts"
      - "dashboard/src/test/inventory-cp7-live-stock*.test.tsx"
      - "dashboard/e2e/live-stock-physical-custody.*"
      - ".github/workflows/live-stock-physical-custody-consumers.yml"
      - ".github/workflows/live-stock-v1-operational-browser.yml"
permissions:
  contents: read
jobs:
  composed-api-browser:
    uses: ./.github/workflows/live-stock-v1-operational-browser.yml
    with:
      # Exact accepted integrated main includes #687 and #693; no peer overlay.
      backend_ref: "70e13b3f6f75777d9d3802dddb478446bf868f09"
      accepted_main_ref: "70e13b3f6f75777d9d3802dddb478446bf868f09"
      scenario: physical-custody

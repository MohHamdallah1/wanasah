name: TEMP Product Import Reconciliation review

on:
  push:
    branches:
      - lead/product-import-reconciliation-review

jobs:
  focused:
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: test
      SECRET_KEY: test-only-canonical-review-key-1234567890
      DATABASE_URL: postgresql+asyncpg://u@127.0.0.1:1/db
      DATABASE_URL_MIGRATION: postgresql+asyncpg://u@127.0.0.1:1/db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: Compile
        run: |
          python -m py_compile \
            wa_backend/domains/simple_products/imports/api/router.py \
            wa_backend/domains/inventory_archive_navigation.py \
            wa_backend/domains/dispatch_archive_navigation.py \
            wa_backend/domains/operations_archive_navigation.py \
            wa_backend/api/reconciliation.py \
            wa_backend/tests/test_product_import_phase16_api.py \
            wa_backend/tests/test_product_import_inline_correction.py \
            wa_backend/tests/test_archive_navigation_canonical_access.py \
            wa_backend/tests/test_reconciliation_field_canonical_auth.py
      - name: Focused Product Import and Archive tests
        working-directory: wa_backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_product_import_phase16_api.py \
            tests/test_product_import_inline_correction.py \
            tests/test_archive_navigation_canonical_access.py
      - name: Focused Reconciliation tests
        working-directory: wa_backend
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_reconciliation_field_canonical_auth.py
      - name: Authority audit
        run: |
          python - <<'PY'
          from pathlib import Path
          archive = [
              'wa_backend/domains/inventory_archive_navigation.py',
              'wa_backend/domains/dispatch_archive_navigation.py',
              'wa_backend/domains/operations_archive_navigation.py',
          ]
          for path in archive:
              text = Path(path).read_text(encoding='utf-8')
              for token in ('InventoryAccess','get_current_driver','get_current_admin','.is_admin','actor.company_id','legacy_actor.company_id'):
                  assert token not in text, f'{token}: {path}'
          rec = Path('wa_backend/api/reconciliation.py').read_text(encoding='utf-8')
          for token in ('get_current_driver','get_current_admin','InventoryAccess','.is_admin','current_driver.company_id','current_driver.id','legacy_actor.company_id'):
              assert token not in rec, f'{token}: reconciliation.py'
          router = Path('wa_backend/domains/simple_products/imports/api/router.py').read_text(encoding='utf-8')
          assert 'get_current_backoffice_capability_access' in router
          assert 'access.company_id' in router
          assert 'get_current_driver' not in router
          assert 'get_current_admin' not in router
          assert '.is_admin' not in router
          assert 'actor.company_id' not in router
          assert 'legacy_actor.company_id' not in router
          PY
      - name: Diff check
        run: git diff --check origin/main...HEAD

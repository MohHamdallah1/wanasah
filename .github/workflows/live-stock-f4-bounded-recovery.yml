name: Live Stock F4 bounded due-transition recovery PostgreSQL

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/api/warehouse/live_stock.py"
      - "wa_backend/tests/test_live_stock_f4_bounded_recovery_postgres.py"
      - ".github/workflows/live-stock-f4-bounded-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-f4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  f4-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: F4DisposablePostgresOnlyKeyAbc12345678901234567890
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_F4_PG_GATE: "1"
      WANASAH_R1_PG_GATE: "1"
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies, locked backend environment
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Compile only F4 production and proof
        working-directory: wa_backend
        run: >-
          python -m py_compile api/warehouse/live_stock.py
          tests/test_live_stock_f4_bounded_recovery_postgres.py
      - name: Ephemeral PostgreSQL 16 on hosted runner only
        run: |
          docker run --detach --name f4-postgres \
            --env POSTGRES_USER=cp1_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec f4-postgres pg_isready -U cp1_admin -d wanasah_no_lot_contract_test -p 55439; then exit 0; fi
            sleep 1
          done
          docker logs f4-postgres
          exit 1
      - name: Create restricted non-BYPASSRLS runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql")
          with psycopg.connect(url.render_as_string(hide_password=False), autocommit=True) as conn:
              conn.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Alembic upgrade disposable database only
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Grant isolated test role and permission fixture
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql")
          with psycopg.connect(url.render_as_string(hide_password=False), autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
              conn.execute("INSERT INTO permissions(code) VALUES ('inventory.read'), ('inbound.create') ON CONFLICT(code) DO NOTHING")
          PY
      - name: Real PostgreSQL 10000/10001 boundary and rollback acceptance
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_f4_bounded_recovery_postgres.py
          --junitxml=f4-acceptance.xml
      - name: Directly affected R1 coherent snapshot and authorization regressions
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_r1_snapshot_postgres.py::test_rolled_back_writer_cannot_change_read_response
          tests/test_live_stock_r1_snapshot_postgres.py::test_exact_warehouse_vehicle_and_company_read_permissions
          --junitxml=f4-r1-regression.xml
      - name: Preserve real test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-f4-${{ github.sha }}
          path: |
            wa_backend/f4-acceptance.xml
            wa_backend/f4-r1-regression.xml
          if-no-files-found: warn

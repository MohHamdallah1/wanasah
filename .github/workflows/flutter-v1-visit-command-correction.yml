name: Flutter V1 Visit command correction acceptance

on:
  pull_request:
    paths:
      - "wanasah_frontend/lib/blocs/visit/**"
      - "wanasah_frontend/lib/core/db/local_database.dart"
      - "wanasah_frontend/lib/core/visit/**"
      - "wanasah_frontend/test/core/visit/**"
      - ".github/workflows/flutter-v1-visit-command-correction.yml"

permissions:
  contents: read

jobs:
  visit-command-correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Provide CI-only dotenv asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env
      - name: Analyze Flutter
        run: flutter analyze
      - name: Focused Visit correction tests
        run: flutter test test/core/visit/visit_command_correction_test.dart

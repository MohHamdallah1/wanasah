name: Inventory CP2 Batch Index Acceptance

on:
  push:
    branches:
      - sol/cp2-batch-index-backend-main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp2-batch-index-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wanasah_cp2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wanasah_cp2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: CP2-Batch-Index-Acceptance-Only-Secret-Key-2026-Aa7-Qm9
      DATABASE_URL: postgresql+asyncpg://wanasah_runtime:runtime@127.0.0.1:5432/wanasah_cp2
      DATABASE_URL_MIGRATION: postgresql+psycopg://wanasah_migration:migration@127.0.0.1:5432/wanasah_cp2
      CI_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wanasah_cp2
      CP2_POSTGRES_ACCEPTANCE: "1"
      COST_ZERO: "0.0000"
      CP2_REQUESTED_BASE_SHA: 1629772a9215a4874d4d3c825d05f3cc564c38e4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: Wait for PostgreSQL 16 and provision separate roles
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg

          admin_dsn = os.environ["CI_ADMIN_DATABASE_URL"]
          for attempt in range(30):
              try:
                  with psycopg.connect(admin_dsn, autocommit=True) as conn:
                      conn.execute("SELECT 1")
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)

          with psycopg.connect(admin_dsn, autocommit=True) as conn:
              if conn.execute("SELECT 1 FROM pg_roles WHERE rolname = 'wanasah_migration'").fetchone() is None:
                  conn.execute("CREATE ROLE wanasah_migration LOGIN BYPASSRLS PASSWORD 'migration'")
              if conn.execute("SELECT 1 FROM pg_roles WHERE rolname = 'wanasah_runtime'").fetchone() is None:
                  conn.execute("CREATE ROLE wanasah_runtime LOGIN NOBYPASSRLS PASSWORD 'runtime'")
              conn.execute("ALTER DATABASE wanasah_cp2 OWNER TO wanasah_migration")
              conn.execute("GRANT CONNECT ON DATABASE wanasah_cp2 TO wanasah_runtime")
          print("POSTGRESQL_16=READY migration_bypassrls=True runtime_bypassrls=False")
          PY
      - name: Upgrade real PostgreSQL schema
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Grant restricted runtime DML for acceptance fixture
        run: |
          python - <<'PY'
          import os
          import psycopg
          dsn = os.environ["DATABASE_URL_MIGRATION"].replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(dsn) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_runtime")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_runtime")
              conn.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_runtime")
          print("CP2_RUNTIME_DML=READY ddl_privilege=False")
          PY
      - name: CP2 focused tests
        working-directory: wa_backend
        run: |
          python -m pytest -q \
            tests/test_inventory_batch_index_contract.py \
            tests/test_inventory_batch_index_authorization.py
      - name: CP2 real PostgreSQL acceptance
        working-directory: wa_backend
        run: python -m pytest -q -s tests/test_inventory_batch_index_postgres_acceptance.py
      - name: Legacy Live Stock and quality regressions
        working-directory: wa_backend
        run: |
          python -m pytest -q \
            tests/test_live_stock_batch_detail_disposition_contract.py \
            tests/test_cp7_live_stock_contract.py \
            tests/test_cp8_transfers_backend.py
      - name: CP1 regression
        working-directory: wa_backend
        run: |
          python -m pytest -q \
            tests/test_inbound_lot_expiry_checkpoint1.py \
            tests/test_product_tracking_canonical_auth.py \
            tests/test_supplier_inbound_quality_canonical_auth_cutover.py \
            tests/test_batch_stock_sources_contract.py \
            tests/test_batch_reservation_owner_contract.py \
            tests/test_whole_product_quality_issue_sources.py
      - name: Warehouse route manifest gate
        if: ${{ !cancelled() }}
        working-directory: wa_backend
        run: python scripts/gate_warehouse_route_manifest.py
      - name: CP2 py_compile
        if: ${{ !cancelled() }}
        working-directory: wa_backend
        run: |
          python -m py_compile \
            api/warehouse/__init__.py \
            api/warehouse/batch_index.py \
            schemas.py \
            scripts/gate_warehouse_route_manifest.py \
            tests/test_inventory_batch_index_contract.py \
            tests/test_inventory_batch_index_authorization.py \
            tests/test_inventory_batch_index_postgres_acceptance.py
      - name: Resolve CP2 audit inputs
        if: ${{ !cancelled() }}
        id: audit-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The checkout may be a synthetic merge incorporating unrelated
          # newer main commits. Audit the real PR head against its merge base.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            head_sha="$PR_HEAD_SHA"
            base_sha="$(git merge-base "$PR_BASE_SHA" "$head_sha")"
          else
            head_sha="$GITHUB_SHA"
            base_sha="$CP2_REQUESTED_BASE_SHA"
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Exact CP2 scope audit
        if: ${{ !cancelled() }}
        id: cp2-scope
        env:
          CP2_AUDIT_BASE_SHA: ${{ steps.audit-base.outputs.sha }}
          CP2_AUDIT_HEAD_SHA: ${{ steps.audit-base.outputs.head }}
        run: |
          python - <<'PY'
          import ast
          import os
          import subprocess

          expected = {
              ".github/workflows/inventory-cp2-batch-index-acceptance.yml",
              "wa_backend/api/warehouse/__init__.py",
              "wa_backend/api/warehouse/batch_index.py",
              "wa_backend/schemas.py",
              "wa_backend/scripts/warehouse_route_manifest_extensions.json",
              "wa_backend/scripts/gate_warehouse_route_manifest.py",
              "wa_backend/tests/test_inventory_batch_index_contract.py",
              "wa_backend/tests/test_inventory_batch_index_authorization.py",
              "wa_backend/tests/test_inventory_batch_index_postgres_acceptance.py",
          }
          # Exactly these two workflow definitions may be repaired together;
          # no CP2 runtime/test files can accompany an out-of-scope edit.
          policy_only = {
              ".github/workflows/inventory-cp1-acceptance.yml",
              ".github/workflows/inventory-cp2-batch-index-acceptance.yml",
          }
          cp2_workflow = ".github/workflows/inventory-cp2-batch-index-acceptance.yml"
          shared_schema = "wa_backend/schemas.py"
          cp2_schema_roots = {
              "BatchIndexTrackingMode",
              "BatchIndexDisposition",
              "BatchIndexSellabilityState",
              "BatchIndexSellabilityReason",
              "WarehouseInventoryBatchIndexItem",
              "WarehouseInventoryBatchIndexCursorPage",
              "WarehouseInventoryBatchIndexSummaryResponse",
          }

          def cp2_schema_contract_from_source(source):
              tree = ast.parse(source)
              definitions = {}
              imports = {}
              for node in tree.body:
                  if isinstance(node, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      definitions[node.name] = node
                  elif isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name):
                              definitions[target.id] = node
                  elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                      definitions[node.target.id] = node
                  elif isinstance(node, ast.ImportFrom):
                      for alias in node.names:
                          local_name = alias.asname or alias.name
                          imports[local_name] = (
                              "from",
                              node.module,
                              node.level,
                              alias.name,
                              alias.asname,
                          )
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          # Without "as", Python binds the top-level module name.
                          local_name = alias.asname or alias.name.split(".", 1)[0]
                          imports[local_name] = (
                              "import",
                              alias.name,
                              alias.asname,
                          )

              missing = cp2_schema_roots - set(definitions)
              if missing:
                  raise ValueError(
                      "CP2_SCOPE=FAIL CP2 schema contract symbols missing\n"
                      f"missing={sorted(missing)}"
                  )

              # Follow local declarations recursively and record only imported
              # bindings actually referenced by that reachable CP2 closure.
              pending = list(cp2_schema_roots)
              owned = {}
              owned_imports = {}
              while pending:
                  name = pending.pop()
                  if name in owned:
                      continue
                  node = definitions[name]
                  owned[name] = ast.dump(node, include_attributes=False)
                  referenced = {
                      child.id
                      for child in ast.walk(node)
                      if isinstance(child, ast.Name)
                      and isinstance(child.ctx, ast.Load)
                  }
                  pending.extend(
                      sorted(
                          ref
                          for ref in referenced
                          if ref in definitions and ref not in owned
                      )
                  )
                  for ref in referenced:
                      if ref in imports:
                          owned_imports[ref] = imports[ref]

              declarations = tuple(
                  ("decl", name, owned[name]) for name in sorted(owned)
              )
              imported_bindings = tuple(
                  ("import", name, owned_imports[name])
                  for name in sorted(owned_imports)
              )
              return declarations + imported_bindings

          def cp2_schema_contract(ref):
              try:
                  source = subprocess.check_output(
                      ["git", "show", f"{ref}:{shared_schema}"],
                      text=True,
                  )
              except subprocess.CalledProcessError as exc:
                  raise ValueError(
                      "CP2_SCOPE=FAIL unable to inspect shared schema contract"
                  ) from exc
              return cp2_schema_contract_from_source(source)

          def classify(changed, *, is_pr, cp2_schema_changed=False):
              if not is_pr:
                  if changed != expected:
                      raise ValueError(
                          "CP2_SCOPE=FAIL historical introduction boundary\n"
                          f"missing={sorted(expected - changed)}\n"
                          f"extra={sorted(changed - expected)}"
                      )
                  return "historical"

              cp2_owned = expected - {shared_schema}
              touches_cp2 = bool(changed & cp2_owned) or (
                  shared_schema in changed and cp2_schema_changed
              )
              if not touches_cp2:
                  return "not-applicable"
              if cp2_workflow in changed and changed <= policy_only:
                  return "policy-maintenance"

              # schemas.py is shared infrastructure. It is CP2-owned for this
              # audit only when CP2's reachable schema declarations or an
              # imported binding they actually reference changes. Unrelated
              # schema/import edits must not make CP2 own the whole PR, and
              # they must not hitchhike beside real CP2 work.
              allowed = set(expected)
              if shared_schema in changed and not cp2_schema_changed:
                  allowed.remove(shared_schema)
              invalid = changed - allowed
              if invalid:
                  raise ValueError(
                      "CP2_SCOPE=FAIL maintenance changes outside CP2 ownership\n"
                      f"extra={sorted(invalid)}"
                  )
              return "maintenance"

          # Focused classifier selftests: shared schemas.py changes are ignored
          # only when CP2's own AST contract is unchanged. Genuine CP2 edits
          # remain owned, and unrelated files cannot accompany them.
          synthetic = "\n".join((
              "from pydantic import BaseModel, Field",
              "from typing import Literal",
              "from math import ceil",
              'BatchIndexTrackingMode = Literal["NONE"]',
              'BatchIndexDisposition = Literal["RELEASED"]',
              'BatchIndexSellabilityState = Literal["SELLABLE"]',
              'BatchIndexSellabilityReason = Literal["EXPIRED"]',
              "PositiveDbInt = int",
              "unrelated = 1",
              "class WarehouseInventoryBatchIndexItem(BaseModel):",
              '    batch_id: PositiveDbInt = Field(...)',
              "class WarehouseInventoryBatchIndexCursorPage(BaseModel):",
              "    items: list[WarehouseInventoryBatchIndexItem]",
              "class WarehouseInventoryBatchIndexSummaryResponse(BaseModel):",
              "    total_relevant_batches: int",
              "",
          ))
          synthetic_unrelated = synthetic.replace("unrelated = 1", "unrelated = 2")
          synthetic_unrelated_import = synthetic.replace(
              "from math import ceil",
              "from math import floor",
          )
          synthetic_cp2 = synthetic.replace("PositiveDbInt = int", "PositiveDbInt = str")
          synthetic_base_model_import = synthetic.replace(
              "from pydantic import BaseModel, Field",
              "from pydantic.v1 import BaseModel\nfrom pydantic import Field",
          )
          synthetic_field_import = synthetic.replace(
              "from pydantic import BaseModel, Field",
              "from pydantic import BaseModel\nfrom pydantic.v1 import Field",
          )
          synthetic_literal_import = synthetic.replace(
              "from typing import Literal",
              "from typing_extensions import Literal",
          )
          baseline_contract = cp2_schema_contract_from_source(synthetic)
          assert baseline_contract == cp2_schema_contract_from_source(synthetic_unrelated)
          assert baseline_contract == cp2_schema_contract_from_source(synthetic_unrelated_import)
          assert baseline_contract != cp2_schema_contract_from_source(synthetic_cp2)
          # Reproduces the reviewed false negative: the CP2 class AST is
          # unchanged, but a used imported binding resolves somewhere else.
          assert baseline_contract != cp2_schema_contract_from_source(
              synthetic_base_model_import
          )
          assert baseline_contract != cp2_schema_contract_from_source(
              synthetic_field_import
          )
          assert baseline_contract != cp2_schema_contract_from_source(
              synthetic_literal_import
          )

          positive_cases = (
              ({"wa_backend/api/warehouse/live_stock.py"}, False, "not-applicable"),
              ({"dashboard/src/pages/inventory/MainInventory.tsx"}, False, "not-applicable"),
              ({shared_schema, "wa_backend/api/warehouse/live_stock.py"}, False, "not-applicable"),
              ({"wa_backend/api/warehouse/batch_index.py"}, False, "maintenance"),
              ({shared_schema}, True, "maintenance"),
              (expected, True, "maintenance"),
              (policy_only, False, "policy-maintenance"),
          )
          for names, schema_changed, expected_mode in positive_cases:
              assert classify(
                  names,
                  is_pr=True,
                  cp2_schema_changed=schema_changed,
              ) == expected_mode

          negative_cases = (
              ({"wa_backend/api/warehouse/batch_index.py", "dashboard/unrelated.tsx"}, False),
              ({shared_schema, "wa_backend/api/warehouse/live_stock.py"}, True),
              ({"wa_backend/api/warehouse/batch_index.py", shared_schema}, False),
              ({cp2_workflow, shared_schema}, False),
              ({cp2_workflow, "wa_backend/alembic/versions/unrelated.py"}, False),
              ({cp2_workflow, "docs/unrelated.md"}, False),
          )
          for names, schema_changed in negative_cases:
              try:
                  classify(
                      names,
                      is_pr=True,
                      cp2_schema_changed=schema_changed,
                  )
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"CP2 scope violation escaped: {sorted(names)}")

          assert classify(expected, is_pr=False) == "historical"
          try:
              classify(expected - {shared_schema}, is_pr=False)
          except ValueError:
              pass
          else:
              raise AssertionError("Original nine-file historical boundary weakened")
          print("CP2_POLICY_SELFTEST=PASS")

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only",
                   os.environ["CP2_AUDIT_BASE_SHA"],
                   os.environ["CP2_AUDIT_HEAD_SHA"], "--"],
                  text=True,
              ).splitlines()
          )
          is_pr = os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          cp2_schema_changed = False
          if is_pr and shared_schema in changed:
              cp2_schema_changed = (
                  cp2_schema_contract(os.environ["CP2_AUDIT_BASE_SHA"])
                  != cp2_schema_contract(os.environ["CP2_AUDIT_HEAD_SHA"])
              )
              print(
                  "CP2_SHARED_SCHEMA_CONTRACT_CHANGED="
                  + ("true" if cp2_schema_changed else "false")
              )
          try:
              scope = classify(
                  changed,
                  is_pr=is_pr,
                  cp2_schema_changed=cp2_schema_changed,
              )
          except ValueError as exc:
              raise SystemExit(str(exc)) from None

          if scope == "not-applicable":
              # Non-CP2 PRs retain the exact same functional/PostgreSQL job
              # and check context, but CP2-only ownership policy does not
              # claim authority over their unrelated files.
              print("CP2_SCOPE=NOT_APPLICABLE (no CP2-owned files)")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("applies=false\n")
          else:
              forbidden_prefixes = ("wa_backend/alembic/versions/", "dashboard/")
              if any(path.startswith(forbidden_prefixes) for path in changed):
                  raise SystemExit("CP2_SCOPE=FAIL forbidden runtime expansion")
              print(f"CP2_SCOPE=PASS mode={scope} files={len(changed)}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("applies=true\n")
          PY
      - name: Diff check
        if: ${{ !cancelled() && steps.cp2-scope.outputs.applies == 'true' }}
        run: >-
          git diff --check
          "${{ steps.audit-base.outputs.sha }}"
          "${{ steps.audit-base.outputs.head }}" --

              try:
                  ownership_mode(dispatch_d11_881_exact | {foreign})
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"D11 foreign file admitted: {foreign}")
          print("P0_D11_OWNER=PASS exact=16 missing=16 foreign=4")
          assert ownership_mode(d07_complete_exact) == "D07_COMPLETE_EXACT"
          for missing in d07_complete_exact:
              partial = d07_complete_exact - {missing}
              if partial & d07_unique:
                  try: ownership_mode(partial)
                  except AssertionError: pass
                  else: raise AssertionError(f"D07 partial accepted: {missing}")
              else:
                  assert ownership_mode(partial) != "D07_COMPLETE_EXACT"
          for foreign in ("wa_backend/models.py", "wa_backend/main.py",
                          "dashboard/src/components/dispatch/ShortageModal.tsx"):
              try: ownership_mode(d07_complete_exact | {foreign})
              except AssertionError: pass
              else: raise AssertionError(f"D07 foreign accepted: {foreign}")
          print("DISPATCH_D07_SCOPE_SELFTEST=PASS exact=14 partial=14 foreign=3")

          assert ownership_mode(shop_create_f06_exact) == "SHOP_CREATE_F06_EXACT"
          f06_items = sorted(shop_create_f06_exact)
          f06_partial_denied = 0
          for bits in range(1 << len(f06_items)):
              subset = {
                  item for i, item in enumerate(f06_items) if bits & (1 << i)
              }
              if subset == shop_create_f06_exact:
                  continue
              if subset & shop_create_f06_new:
                  try:
                      ownership_mode(subset)
                  except AssertionError:
                      f06_partial_denied += 1
                  else:
                      raise AssertionError(
                          f"SHOP_CREATE_F06_EXACT partial admitted: {sorted(subset)}"
                      )
              else:
                  assert ownership_mode(subset) != "SHOP_CREATE_F06_EXACT"
          assert f06_partial_denied == 27, f06_partial_denied

          f06_foreign = (
              "wa_backend/api/driver.py",
              "wa_backend/main.py",
              "wa_backend/models.py",
              "wa_backend/services.py",
              "wa_backend/domains/dispatch_shortages_group.py",
              "wa_backend/domains/dispatch_shop_finance_fence.py",
              "wa_backend/domains/inventory/services.py",
              "wa_backend/domains/inventory_costing/service.py",
              "wa_backend/domains/authorization/backoffice_access.py",
              "wa_backend/tests/test_dispatch_shop_finance_edit_v1_postgres.py",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/components/dispatch/ShopFormModal.tsx",
              "dashboard/src/features/dispatch/shopOrder/scope.ts",
              "dashboard/src/hooks/useAuthFetch.ts",
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
              ".github/workflows/live-stock-g04-outage-recovery.yml",
              "wanasah_frontend/lib/main.dart",
          )
          for foreign in f06_foreign:
              assert foreign not in shop_create_f06_exact
              try:
                  ownership_mode(shop_create_f06_exact | {foreign})
              except AssertionError as exc:
                  assert foreign in str(exc)
              else:
                  raise AssertionError(f"F06 foreign admitted: {foreign}")
          for mixed in (
              shop_create_f06_exact | finance_842_exact,
              shop_create_f06_exact | shop_order_843_exact,
              shop_create_f06_exact | shop_form_850_exact,
              shop_create_f06_exact | ci_policy_847_exact,
              shop_create_f06_exact | ci_policy_856_exact,
              shop_create_f06_exact | ci_policy_861_exact,
          ):
              try:
                  ownership_mode(mixed)
              except AssertionError:
                  pass
              else:
                  raise AssertionError("Mixed F06/Finance/Worker/CI admission")
          assert ownership_mode(ci_policy_861_exact) == "CI_POLICY_861_EXACT"
          assert ownership_mode(ci_policy_861_exact - {
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
          }) == "P0_STRICT"  # Pre-existing single workflow, not #861 mode.
          try:
              ownership_mode(ci_policy_861_exact - {
                  ".github/workflows/dispatch-p0-route-stock-safety.yml",
              })
          except AssertionError:
              pass
          else:
              raise AssertionError("CI_POLICY_861 partial with new finance path admitted")
          for foreign in f06_foreign + (
              "wa_backend/api/dispatch.py",
              "wa_backend/schemas.py",
              "wa_backend/tests/test_dispatch_p0_route_stock_safety_postgres.py",
          ):
              if foreign in ci_policy_861_exact:
                  continue
              try:
                  ownership_mode(ci_policy_861_exact | {foreign})
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"CI_POLICY_861 foreign admitted: {foreign}")
          print(
              "DISPATCH_861_POLICY_SELFTEST=PASS "
              f"f06=5 partial_with_new={f06_partial_denied} "
              f"foreign={len(f06_foreign)} mixed=6 ci_policy=2 "
              "prior847=PASS prior856=PASS"
          )

          # #865: exhaustive D05 five-file admission; never an accidental
          # cross-grant to independent F06, ShopForm, Finance or CI policies.
          assert ownership_mode(shortage_group_859_exact) == "SHORTAGE_GROUP_859_EXACT"
          d05_items = sorted(shortage_group_859_exact)
          d05_partial_denied = 0
          for bits in range(1 << len(d05_items)):
              subset = {
                  item for i, item in enumerate(d05_items) if bits & (1 << i)
              }
              if subset == shortage_group_859_exact:
                  continue
              if subset & shortage_group_859_unique:
                  try:
                      ownership_mode(subset)
                  except AssertionError:
                      d05_partial_denied += 1
                  else:
                      raise AssertionError(
                          f"SHORTAGE_GROUP_859_EXACT partial admitted: {sorted(subset)}"
                      )
              else:
                  assert ownership_mode(subset) != "SHORTAGE_GROUP_859_EXACT"
          assert d05_partial_denied == 29, d05_partial_denied

          d05_foreign = (
              "wa_backend/api/driver.py",
              "wa_backend/api/dispatch.py",
              "wa_backend/models.py",
              "wa_backend/services.py",
              "wa_backend/schemas.py",
              "wa_backend/domains/dispatch_shop_create.py",
              "wa_backend/domains/dispatch_shop_finance_fence.py",
              "wa_backend/domains/dispatch_shortages_group.py",
              "wa_backend/domains/authorization/backoffice_access.py",
              "wa_backend/domains/inventory/services.py",
              "wa_backend/tests/test_dispatch_shop_create_f06_postgres.py",
              "wa_backend/tests/test_dispatch_shop_finance_edit_v1_postgres.py",
              ".github/workflows/dispatch-shop-create-f06-acceptance.yml",
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
              "dashboard/src/components/dispatch/ShopFormModal.tsx",
              "dashboard/src/features/dispatch/shopOrder/scope.ts",
              "dashboard/src/features/dispatch/shopForm/useShopFormCommit.ts",
              "dashboard/src/hooks/useAuthFetch.ts",
              "dashboard/src/pages/inventory/Tab1LiveStock.tsx",
              ".github/scripts/live_stock_ci_ownership.py",
              "wanasah_frontend/lib/main.dart",
          )
          for foreign in d05_foreign:
              assert foreign not in shortage_group_859_exact
              try:
                  ownership_mode(shortage_group_859_exact | {foreign})
              except AssertionError:
                  # Another exact prior owner (Finance/ShopOrder/ShopForm)
                  # may reject first; denied is the security invariant.
                  pass
              else:
                  raise AssertionError(f"D05 foreign admitted: {foreign}")
          d05_mixed = (
              shortage_group_859_exact | shop_create_f06_exact,
              shortage_group_859_exact | finance_842_exact,
              shortage_group_859_exact | shop_order_843_exact,
              shortage_group_859_exact | shop_form_850_exact,
              shortage_group_859_exact | ci_policy_847_exact,
              shortage_group_859_exact | ci_policy_856_exact,
              shortage_group_859_exact | ci_policy_861_exact,
          )
          for mixed in d05_mixed:
              try:
                  ownership_mode(mixed)
              except AssertionError:
                  pass
              else:
                  raise AssertionError("Mixed D05/F06/Finance/CI ownership admitted")
          print(
              "DISPATCH_859_SCOPE_SELFTEST=PASS "
              f"exact=5 partial_with_new={d05_partial_denied} "
              f"foreign={len(d05_foreign)} mixed={len(d05_mixed)} "
              "f06_prior=PASS ci861_prior=PASS"
          )

          # Exact-scope positive + adversarial controls, including a partial
          # CP2 contract and tempting Dispatch/auth/runtime hitchhikers.
          assert ownership_mode(cp2_product_gate_required) == "CP2_PRODUCT_GATE_READ_ONLY"
          assert ownership_mode(cp2_product_gate_allowed) == "CP2_PRODUCT_GATE_READ_ONLY"
          for missing in (
              "wa_backend/api/warehouse/batch_index.py",
              "wa_backend/schemas.py",
              "dashboard/src/pages/inventory/batches/batchIndexContracts.ts",
          ):
              try:
                  ownership_mode(cp2_product_gate_required - {missing})
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"Partial CP2 product-gate scope admitted: {missing}")
          for foreign in (
              "wa_backend/api/dispatch.py",
              "wa_backend/services.py",
              "wa_backend/domains/inventory/services.py",
              "wa_backend/domains/inventory_costing/service.py",
              "dashboard/src/features/dispatch/adjustLoad.ts",
              "dashboard/src/lib/authStorage.ts",
              "wa_backend/alembic/versions/foreign.py",
              "flutter_app/lib/main.dart",
          ):
              try:
                  ownership_mode(cp2_product_gate_allowed | {foreign})
              except AssertionError as exc:
                  assert foreign in str(exc)
              else:
                  raise AssertionError(f"CP2 product-gate foreign file admitted: {foreign}")

          mode = ownership_mode(paths)
          unexpected_probe = "wa_backend/domains/inventory/services.py"
          try:
              ownership_mode(paths | {unexpected_probe})
          except AssertionError as exc:
              assert unexpected_probe in str(exc)
          else:
              raise AssertionError("Negative ownership probe unexpectedly passed")
          if mode == "LIVE_STOCK_OWNER_VISUAL":
              for denied in ("wa_backend/api/dispatch.py",
                             "wa_backend/domains/inventory/services.py",
                             "wa_backend/domains/inventory_costing/service.py",
                             "dashboard/src/lib/authStorage.ts"):
                  try:
                      ownership_mode(paths | {denied})
                  except AssertionError as exc:
                      assert denied in str(exc)
                  else:
                      raise AssertionError(f"Owner visual negative probe passed: {denied}")
          if mode == "LIVE_STOCK_WORKER1":
              for forbidden_probe in (
                  "wa_backend/api/dispatch.py",
                  "wa_backend/services.py",
                  "wa_backend/domains/inventory_costing/service.py",
                  "dashboard/src/lib/authStorage.ts",
                  "dashboard/src/features/dispatch/adjustLoad.ts",
              ):
                  try:
                      ownership_mode(paths | {forbidden_probe})
                  except AssertionError as exc:
                      assert forbidden_probe in str(exc)
                  else:
                      raise AssertionError(
                          f"Live Stock Worker1 negative ownership probe passed: {forbidden_probe}"
                      )
          print(f"DISPATCH_P0_OWNERSHIP=PASS mode={mode}")
          PY

  real-dashboard-wire:
    name: dispatch-dashboard-real-http-pg16
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      ENVIRONMENT: test
      SECRET_KEY: P0DispatchRealBrowserPG16Test1234567890123456789012345
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://p0_dispatch_wire_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_DISPATCH_P0_WIRE_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://p0_dispatch_wire_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_DISPATCH_P0_WIRE_STATE: /tmp/dispatch-p0-wire.json
      PYTHONPATH: ${{ github.workspace }}/wa_backend
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install backend and compile isolated wire fixture
        run: |
          python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
          python -m py_compile wa_backend/tests/dispatch_p0_wire_fixture.py
      - name: Start isolated PostgreSQL16
        run: |
          docker run --detach --name dispatch-p0-wire-pg \
            --env POSTGRES_USER=p0_dispatch_wire_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec dispatch-p0-wire-pg pg_isready -U p0_dispatch_wire_admin -d wanasah_no_lot_contract_test -p 55439; then exit 0; fi
            sleep 1
          done
          docker logs dispatch-p0-wire-pg
          exit 1
      - name: Create non-bypass runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate disposable database only
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant ordinary runtime DML with FORCE RLS
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Seed canonical two-lot stock and waiting Route
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/dispatch_p0_wire_fixture.py::test_seed_dispatch_browser
          --junitxml=dispatch-p0-wire-seed.xml
      - name: Start actual FastAPI and verify health
        working-directory: wa_backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 4174 > /tmp/dispatch-p0-wire-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dispatch-p0-wire-api.log
          exit 1
      - name: Install locked Dashboard and Chromium
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build actual Dashboard
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174
        run: npm run build
      - name: Serve actual Dashboard against FastAPI
        working-directory: dashboard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/dispatch-p0-wire-dashboard.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/dispatch >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dispatch-p0-wire-dashboard.log
          exit 1
      - name: Exact real Dashboard to HTTP to PG16 physical acceptance
        working-directory: dashboard
        run: npx playwright test --config e2e/dispatch-p0-wire.config.ts
      - name: Retain real UI request and server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-p0-real-dashboard-wire-${{ github.sha }}
          path: |
            dashboard/node_modules/.cache/dispatch-p0-wire
            wa_backend/dispatch-p0-wire-seed.xml
            /tmp/dispatch-p0-wire-api.log
            /tmp/dispatch-p0-wire-dashboard.log
          if-no-files-found: warn

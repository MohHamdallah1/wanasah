name: Inventory CP6 minimum-stock acceptance

on:
  push:
    branches:
      - codex/cp6-minimum-stock-auth-parity-main
  pull_request:
    branches:
      - main
    paths:
      - "wa_backend/api/inventory_stock_policy.py"
      - "wa_backend/tests/test_inventory_minimum_stock_capability_parity.py"
      - "wa_backend/tests/test_minimum_stock_canonical_authorization_cutover.py"
      - ".github/workflows/inventory-cp6-minimum-stock-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: cp6-minimum-stock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-stock-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: Cp6SyntheticOnlyKeyAbc123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://cp6_unused@127.0.0.1:1/cp6_unused
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned repository and focused test dependencies
        run: python -m pip install -r wa_backend/requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Compile changed Python
        run: >-
          python -m py_compile
          wa_backend/api/inventory_stock_policy.py
          wa_backend/tests/test_inventory_minimum_stock_capability_parity.py
      - name: CP6 parity and existing minimum-stock focused tests
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_inventory_minimum_stock_capability_parity.py
          tests/test_minimum_stock_canonical_authorization_cutover.py
          --junitxml=cp6-minimum-stock-results.xml
      - name: Verify CP6 files without comparing unrelated historical changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || '947d4c9c33aa2c2bdf593d12d33736b9c57aa209' }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          base = subprocess.check_output(
              ["git", "merge-base", os.environ["PR_BASE"], "HEAD"], text=True
          ).strip()
          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines())
          # CP6 owns only its dedicated policy API, parity tests and workflow.
          # Other files in a cross-domain PR are checked by their own CI gates.
          cp6_scope = {
              "wa_backend/api/inventory_stock_policy.py",
              "wa_backend/tests/test_inventory_minimum_stock_capability_parity.py",
              "wa_backend/tests/test_minimum_stock_canonical_authorization_cutover.py",
              ".github/workflows/inventory-cp6-minimum-stock-acceptance.yml",
          }
          touched_cp6 = changed & cp6_scope
          if "wa_backend/api/inventory_stock_policy.py" in touched_cp6:
              assert "wa_backend/tests/test_inventory_minimum_stock_capability_parity.py" in touched_cp6
          assert touched_cp6, "CP6 verification must cover a CP6 file"
          print("CP6_PR_SCOPED_DIFF=PASS; checked files:", sorted(touched_cp6))
          PY
      - name: Preserve focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp6-minimum-stock-results-${{ github.run_id }}
          path: wa_backend/cp6-minimum-stock-results.xml
          if-no-files-found: ignore

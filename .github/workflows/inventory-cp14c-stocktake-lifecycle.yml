name: Inventory CP14-C Stocktake lifecycle acceptance

on:
  push:
    branches:
      - sol/cp14c-stocktake-lifecycle-wave2
    paths:
      - "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
      - ".github/workflows/inventory-cp14c-stocktake-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp14c-stocktake-lifecycle-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-scoped-auth-assertion-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/cp14c-stocktake-lifecycle-wave2
      - name: Align A2 access assertion with independent receiver fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py")
          source = path.read_text(encoding="utf-8")
          old = '''            await a.counter.access(db).require("inventory.read", a.a1)
            with pytest.raises(BackofficeCapabilityAccessRejected):
                await a.counter.access(db).require("inventory.read", a.a2)
'''
          new = '''            await a.counter.access(db).require("inventory.read", a.a1)
            await a.counter.access(db).require("inventory.read", a.a2)
            with pytest.raises(BackofficeCapabilityAccessRejected):
                await a.counter.access(db).require("stocktake.start", a.a2)
'''
          if new in source:
              print("CP14C_SCOPED_AUTH_ASSERTION_ALREADY_ALIGNED=PASS")
          else:
              assert source.count(old) == 1, "CP14-C scoped auth assertion seam changed unexpectedly"
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
              print("CP14C_SCOPED_AUTH_ASSERTION_ALIGNED=PASS")
          PY
          git diff --check
          if git diff --quiet -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py; then
            exit 0
          fi
          test "$(git diff --name-only)" = "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+            await a.counter.access(db).require("inventory.read", a.a2)'
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+                await a.counter.access(db).require("stocktake.start", a.a2)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py
          git commit -m "CP14-C: align scoped auth assertion with receiver fixture"
          git push origin HEAD:sol/cp14c-stocktake-lifecycle-wave2

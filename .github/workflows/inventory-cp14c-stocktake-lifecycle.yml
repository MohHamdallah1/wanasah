name: Inventory CP14-C Stocktake lifecycle acceptance

on:
  push:
    branches:
      - sol/cp14c-stocktake-lifecycle-wave2
    paths:
      - "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
      - ".github/workflows/inventory-cp14c-stocktake-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp14c-stocktake-lifecycle-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-open-stocktake-blocker-fixture:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/cp14c-stocktake-lifecycle-wave2
      - name: Use valid DRAFT session without InventoryLock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py")
          source = path.read_text(encoding="utf-8")
          old = ('            _, blocker_started = await _start(db, a.operator, a.a1)\n'
                 '            blocker_session_id = int(blocker_started["session_id"])\n')
          new = ('            blocker_session = StocktakeSession(\n'
                 '                company_id=a.company_id,\n'
                 '                location_id=a.a1,\n'
                 '                reference_number="CP14C-BLOCKER-" + uuid4().hex[:10],\n'
                 '                stocktake_type="FULL_COUNT",\n'
                 '                status="DRAFT",\n'
                 '                started_by=a.operator.driver_id,\n'
                 '            )\n'
                 '            db.add(blocker_session)\n'
                 '            await db.commit()\n'
                 '            blocker_session_id = int(blocker_session.id)\n')
          if new in source:
              print("CP14C_OPEN_STOCKTAKE_DRAFT_FIX_ALREADY_APPLIED=PASS")
          else:
              assert source.count(old) == 1, "canonical blocker fixture seam changed unexpectedly"
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
              print("CP14C_OPEN_STOCKTAKE_DRAFT_FIX_APPLIED=PASS")
          PY
          git diff --check
          if git diff --quiet -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py; then
            exit 0
          fi
          test "$(git diff --name-only)" = "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+                status="DRAFT",'
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+            blocker_session_id = int(blocker_session.id)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py
          git commit -m "CP14-C: use valid draft stocktake blocker fixture"
          git push origin HEAD:sol/cp14c-stocktake-lifecycle-wave2

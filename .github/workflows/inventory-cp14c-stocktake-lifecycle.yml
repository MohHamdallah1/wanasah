name: Inventory CP14-C Stocktake lifecycle acceptance

on:
  push:
    branches:
      - sol/cp14c-stocktake-lifecycle-wave2
    paths:
      - "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
      - ".github/workflows/inventory-cp14c-stocktake-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp14c-stocktake-lifecycle-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-dispatch-route-identity-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/cp14c-stocktake-lifecycle-wave2
      - name: Preserve route id across blocker rollback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py")
          source = path.read_text(encoding="utf-8")
          old = ('            db.add(route)\n'
                 '            await db.commit()\n'
                 '            with pytest.raises(HTTPException) as dispatch_blocked:\n'
                 '                await _deactivate(db, a, expected_version=1)\n'
                 '            _blocker(dispatch_blocked.value, "OPEN_DISPATCH_ROUTE")\n'
                 '            closed = await dispatch.update_route_status(\n'
                 '                route.id,\n')
          new = ('            db.add(route)\n'
                 '            await db.commit()\n'
                 '            route_id = int(route.id)\n'
                 '            with pytest.raises(HTTPException) as dispatch_blocked:\n'
                 '                await _deactivate(db, a, expected_version=1)\n'
                 '            _blocker(dispatch_blocked.value, "OPEN_DISPATCH_ROUTE")\n'
                 '            closed = await dispatch.update_route_status(\n'
                 '                route_id,\n')
          if new in source:
              print("CP14C_DISPATCH_ROUTE_ID_FIX_ALREADY_APPLIED=PASS")
          else:
              assert source.count(old) == 1, "dispatch route rollback seam changed unexpectedly"
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
              print("CP14C_DISPATCH_ROUTE_ID_FIX_APPLIED=PASS")
          PY
          git diff --check
          if git diff --quiet -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py; then
            exit 0
          fi
          test "$(git diff --name-only)" = "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+            route_id = int(route.id)'
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+                route_id,'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py
          git commit -m "CP14-C: preserve dispatch route id across blocker rollback"
          git push origin HEAD:sol/cp14c-stocktake-lifecycle-wave2

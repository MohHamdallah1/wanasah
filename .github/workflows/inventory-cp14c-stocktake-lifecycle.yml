name: Inventory CP14-C Stocktake lifecycle acceptance

on:
  push:
    branches:
      - sol/cp14c-stocktake-lifecycle-wave2
    paths:
      - "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
      - ".github/workflows/inventory-cp14c-stocktake-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp14c-stocktake-lifecycle-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-dispatch-close-assertion-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/cp14c-stocktake-lifecycle-wave2
      - name: Assert persisted route closure instead of response shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py")
          source = path.read_text(encoding="utf-8")
          old = ('            closed = await dispatch.update_route_status(\n'
                 '                route_id,\n'
                 '                UpdateRouteStatusRequest(status="closed"),\n'
                 '                db,\n'
                 '                a.operator.access(db),\n'
                 '                a.operator.operational_driver,\n'
                 '            )\n'
                 '            assert closed["status"] == "closed"\n')
          new = ('            await dispatch.update_route_status(\n'
                 '                route_id,\n'
                 '                UpdateRouteStatusRequest(status="closed"),\n'
                 '                db,\n'
                 '                a.operator.access(db),\n'
                 '                a.operator.operational_driver,\n'
                 '            )\n'
                 '            closed_route = await db.get(DispatchRoute, route_id)\n'
                 '            assert closed_route is not None and closed_route.status == "closed"\n')
          if new in source:
              print("CP14C_DISPATCH_CLOSE_PERSISTENCE_ASSERTION_ALREADY_APPLIED=PASS")
          else:
              assert source.count(old) == 1, "dispatch close response assertion seam changed unexpectedly"
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
              print("CP14C_DISPATCH_CLOSE_PERSISTENCE_ASSERTION_APPLIED=PASS")
          PY
          git diff --check
          if git diff --quiet -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py; then
            exit 0
          fi
          test "$(git diff --name-only)" = "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+            closed_route = await db.get(DispatchRoute, route_id)'
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+            assert closed_route is not None and closed_route.status == "closed"'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py
          git commit -m "CP14-C: assert persisted dispatch route closure"
          git push origin HEAD:sol/cp14c-stocktake-lifecycle-wave2

name: Inventory CP14-C Stocktake lifecycle acceptance

on:
  push:
    branches:
      - sol/cp14c-stocktake-lifecycle-wave2
    paths:
      - "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
      - ".github/workflows/inventory-cp14c-stocktake-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp14c-stocktake-lifecycle-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-canonical-field-driver-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/cp14c-stocktake-lifecycle-wave2
      - name: Use independent canonical field identity for dispatch route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py")
          source = path.read_text(encoding="utf-8")

          old_import = 'from tests.canonical_actor_fixtures import seed_ordinary_backoffice_fixture\n'
          new_import = 'from tests.canonical_actor_fixtures import seed_field_fixture, seed_ordinary_backoffice_fixture\n'
          if new_import not in source:
              assert source.count(old_import) == 1, "canonical fixture import seam changed unexpectedly"
              source = source.replace(old_import, new_import, 1)

          old_seed = ('                counter = await seed_ordinary_backoffice_fixture(\n'
                      '                    seed, company.id, password=RECOUNT_PASSWORD\n'
                      '                )\n'
                      '                assert operator.context.is_company_owner is False\n')
          new_seed = ('                counter = await seed_ordinary_backoffice_fixture(\n'
                      '                    seed, company.id, password=RECOUNT_PASSWORD\n'
                      '                )\n'
                      '                field = await seed_field_fixture(seed, company.id)\n'
                      '                assert operator.context.is_company_owner is False\n')
          if new_seed not in source:
              assert source.count(old_seed) == 1, "field fixture seed seam changed unexpectedly"
              source = source.replace(old_seed, new_seed, 1)

          old_ns = ('                        counter=counter,\n'
                    '                        branch=branch.id,\n')
          new_ns = ('                        counter=counter,\n'
                    '                        field_driver=field.driver.id,\n'
                    '                        branch=branch.id,\n')
          if new_ns not in source:
              assert source.count(old_ns) == 1, "tenant namespace seam changed unexpectedly"
              source = source.replace(old_ns, new_ns, 1)

          old_route = ('            route = DispatchRoute(\n'
                       '                company_id=a.company_id,\n'
                       '                zone_id=a.zone,\n'
                       '                driver_id=a.operator.driver_id,\n'
                       '                vehicle_id=a.vehicle,\n'
                       '                source_location_id=a.a1,\n'
                       '                dispatch_date=date.today(),\n'
                       '                status="active",\n'
                       '            )\n')
          new_route = ('            route = DispatchRoute(\n'
                       '                company_id=a.company_id,\n'
                       '                zone_id=a.zone,\n'
                       '                driver_id=a.field_driver,\n'
                       '                vehicle_id=a.vehicle,\n'
                       '                source_location_id=a.a1,\n'
                       '                dispatch_date=date.today(),\n'
                       '                status="active",\n'
                       '            )\n')
          if new_route not in source:
              assert source.count(old_route) == 1, "dispatch blocker route seam changed unexpectedly"
              source = source.replace(old_route, new_route, 1)

          path.write_text(source, encoding="utf-8")
          print("CP14C_CANONICAL_FIELD_DRIVER_FIX=PASS")
          PY
          git diff --check
          test "$(git diff --name-only)" = "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py"
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+from tests.canonical_actor_fixtures import seed_field_fixture, seed_ordinary_backoffice_fixture'
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+                field = await seed_field_fixture(seed, company.id)'
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+                        field_driver=field.driver.id,'
          git diff -- wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py | grep -F '+                driver_id=a.field_driver,'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py
          git commit -m "CP14-C: use canonical field driver for dispatch blocker"
          git push origin HEAD:sol/cp14c-stocktake-lifecycle-wave2

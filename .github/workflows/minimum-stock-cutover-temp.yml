name: Minimum stock cutover temp gate

on:
  push:
    branches:
      - sol/canonical-backoffice-capability-access
      - sol/minimum-stock-canonical-authorization-cutover
  pull_request:
    paths:
      - "wa_backend/api/inventory_stock_policy.py"
      - "wa_backend/api/authentication/legacy_backoffice_transport.py"
      - "wa_backend/domains/authorization/capabilities.py"
      - "wa_backend/tests/test_legacy_backoffice_transport.py"
      - "wa_backend/tests/test_minimum_stock_canonical_authorization_cutover.py"
      - ".github/workflows/minimum-stock-cutover-temp.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt
      - name: Run focused runtime tests
        working-directory: wa_backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: MinimumStockCutoverTempSecret123456789012345678901234
          DATABASE_URL: postgresql+asyncpg://unit@127.0.0.1:1/unit
          DATABASE_URL_MIGRATION: postgresql+asyncpg://unit@127.0.0.1:1/unit
        run: |
          python -m unittest -v \
            tests.test_legacy_backoffice_transport \
            tests.test_minimum_stock_canonical_authorization_cutover
      - name: Diff whitespace gate
        run: git diff --check

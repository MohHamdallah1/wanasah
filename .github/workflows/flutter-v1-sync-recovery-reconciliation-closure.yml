name: Flutter V1 Sync Recovery Reconciliation Closure

on:
  push:
    branches:
      - sol/flutter-v1-sync-recovery-reconciliation-closure
  workflow_dispatch:
  pull_request:
    paths:
      - "wanasah_frontend/lib/repositories/sync_repository.dart"
      - "wanasah_frontend/lib/features/recovery/**"
      - "wanasah_frontend/lib/core/sync/**"
      - "wanasah_frontend/test/core/sync/**"
      - "wanasah_frontend/test/features/recovery/**"
      - "wanasah_frontend/test/offline_durable_command_test.dart"
      - "wanasah_frontend/test/offline_owner_guard_test.dart"
      - "wanasah_frontend/test/core/visit/local_inventory_projection_integrity_test.dart"
      - "wanasah_frontend/test/core/visit/visit_command_correction_test.dart"
      - "wanasah_frontend/test/features/custody/transfer_handshake_closure_test.dart"
      - ".github/workflows/flutter-v1-sync-recovery-reconciliation-closure.yml"

permissions:
  contents: read

jobs:
  sync-recovery-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: wanasah_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Prepare CI-only environment asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Sync Recovery focused and regression tests
        run: >-
          flutter test
          test/features/recovery/sync_recovery_reconciliation_closure_test.dart
          test/features/recovery/recovery_behavioral_closure_test.dart
          test/offline_durable_command_test.dart
          test/core/visit/local_inventory_projection_integrity_test.dart
          test/features/custody/transfer_handshake_closure_test.dart
          test/core/sync/durable_command_owner_test.dart
          test/offline_owner_guard_test.dart
          test/core/visit/visit_command_correction_test.dart

name: Live Stock physical v2 rollout readiness PG16

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/test_live_stock_v2_rollout_readiness_postgres.py"
      - "docs/operations/LIVE_STOCK_V2_ROLLOUT_READINESS_RUNBOOK.md"
      - ".github/workflows/live-stock-v2-rollout-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg16-v1-to-v2:
    name: physical-v1-v2-pg16
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      ENVIRONMENT: test
      SECRET_KEY: LiveStockV2RolloutPg16IsolatedTestOnly12345678901234567
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://v2_rollout_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_LIVE_STOCK_V2_ROLLOUT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://v2_rollout_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Compile focused acceptance
        working-directory: wa_backend
        run: python -m py_compile tests/test_live_stock_v2_rollout_readiness_postgres.py
      - name: Start disposable PostgreSQL16
        run: |
          docker run --detach --name live-stock-v2-rollout             --env POSTGRES_USER=v2_rollout_admin             --env POSTGRES_DB=wanasah_no_lot_contract_test             --env POSTGRES_HOST_AUTH_METHOD=trust             --publish 127.0.0.1:55439:55439             postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec live-stock-v2-rollout pg_isready -U v2_rollout_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs live-stock-v2-rollout
          exit 1
      - name: Create restricted NOBYPASSRLS runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Install fresh Alembic schema and check parity
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant runtime DML without bypassing RLS
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Physical projection migration and real HTTP acceptance
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v2_rollout_readiness_postgres.py
          --junitxml=live-stock-v2-rollout.xml
      - name: Reject skips failures or empty rollout execution
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("live-stock-v2-rollout.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 2, f"Expected FIFO + MOVING_AVERAGE: {len(cases)}"
          for item in cases:
              assert not any(item.find(tag) is not None for tag in ("failure", "error", "skipped")), item.attrib
          print(f"LIVE_STOCK_V2_REAL_PG16_AND_HTTP=PASS cases={len(cases)}")
          PY
      - name: Verify ownership and no whitespace regressions
        run: |
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base" HEAD --
          BASE="$base" python - <<'PY'
          import os, subprocess
          files = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE"], "HEAD"], text=True,
          ).splitlines())
          owned = {
              ".github/workflows/live-stock-v2-rollout-readiness.yml",
              "docs/operations/LIVE_STOCK_V2_ROLLOUT_READINESS_RUNBOOK.md",
              "wa_backend/tests/test_live_stock_v2_rollout_readiness_postgres.py",
          }
          # A complete disposable restore-proof pair may accompany the original
          # #700 rollout contract. All other production/business files stay forbidden.
          restore_owned = {
              ".github/workflows/live-stock-v2-restore-rehearsal.yml",
              "wa_backend/tests/test_live_stock_v2_restore_rehearsal_postgres.py",
          }
          def check_scope(candidate):
              has_restore = bool(candidate & restore_owned)
              if has_restore:
                  assert restore_owned <= candidate, "Incomplete V2 restore proof scope"
              allowed = owned | (restore_owned if has_restore else set())
              unexpected = candidate - allowed
              assert not unexpected, f"Unowned V2 rollout changes: {sorted(unexpected)}"
          check_scope(files)
          for probe in ("wa_backend/services.py", "wa_backend/domains/inventory/services.py"):
              try:
                  check_scope(files | {probe})
              except AssertionError as exc:
                  assert probe in str(exc)
              else:
                  raise AssertionError("Unsafe V2 ownership probe passed: " + probe)
          print("LIVE_STOCK_V2_SCOPE=PASS strict_restore_pair=1 negative_probes=2")
          PY
      - name: Retain proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-v2-rollout-${{ github.sha }}
          path: wa_backend/live-stock-v2-rollout.xml
          if-no-files-found: warn

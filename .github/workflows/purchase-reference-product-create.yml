name: Product create purchase reference atomic acceptance
on:
  pull_request:
    paths:
      - "wa_backend/domains/inventory_costing/purchase_reference/**"
      - "wa_backend/api/simple_products.py"
      - "dashboard/src/pages/products/create/**"
      - "dashboard/src/test/product-create-purchase-reference.test.tsx"
      - "wa_backend/alembic/**"
      - "wa_backend/tests/*purchase*reference*"
      - ".github/workflows/purchase-reference-product-create.yml"
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: purchase_reference_gate
          POSTGRES_DB: wanasah_purchase_reference_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U purchase_reference_gate -d wanasah_purchase_reference_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: PurchaseReferenceGateOnlyKeyAbc123456789012345678901
      DATABASE_URL: postgresql+asyncpg://purchase_reference_runtime@127.0.0.1:5432/wanasah_purchase_reference_gate
      DATABASE_URL_MIGRATION: postgresql+asyncpg://purchase_reference_gate@127.0.0.1:5432/wanasah_purchase_reference_gate
      WANASAH_PURCHASE_REFERENCE_DB_GATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and focused test dependencies
        run: python -m pip install -r wa_backend/requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Create restricted disposable runtime role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://purchase_reference_gate@127.0.0.1:5432/wanasah_purchase_reference_gate", autocommit=True) as db:
              db.execute("CREATE ROLE purchase_reference_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate empty database through canonical Alembic graph
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Model migration parity
        working-directory: wa_backend
        run: alembic check
      - name: Focused exact-value and committed PostgreSQL acceptance
        working-directory: wa_backend
        run: python -m pytest -q tests/test_purchase_cost_reference_values.py tests/test_purchase_cost_reference_postgres.py tests/test_purchase_reference_product_create_postgres.py tests/test_simple_products_canonical_cutover.py tests/test_simple_product_family_intent_a2.py

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Product quick-create focused acceptance and existing regressions
        working-directory: dashboard
        run: npx vitest run src/test/product-create-purchase-reference.test.tsx src/test/products-p9-4-create-flow.test.ts src/test/products-create-family-intent-p9.test.ts src/test/products-create-family-mode-runtime-p9.test.tsx
      - name: Exact unmodified foundation TypeScript baseline
        run: |
          mkdir baseline
          git archive --format=tar --output=baseline.tar 822732366b814beab0a6c1690dfcc2e2e249b4ec dashboard
          tar -xf baseline.tar -C baseline
      - name: Reject new TypeScript diagnostics
        working-directory: dashboard
        run: node scripts/check-types-against-baseline.mjs ../baseline/dashboard
      - name: Product create lint
        working-directory: dashboard
        run: npx eslint src/pages/products/create src/test/product-create-purchase-reference.test.tsx
      - name: Dashboard build
        working-directory: dashboard
        run: npm run build
      - name: Exact-base whitespace check
        run: git diff --check 822732366b814beab0a6c1690dfcc2e2e249b4ec HEAD

name: TEMP dispatch field representative cutover gate

on:
  push:
    branches:
      - codex/dispatch-field-representative-cutover

permissions:
  contents: read

jobs:
  focused-dispatch-field-representative:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: DispatchFieldRepresentativeGateOnlyKey123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://dispatch_unit@127.0.0.1:1/dispatch_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://dispatch_admin@127.0.0.1:1/dispatch_unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt
      - name: Dispatch field representative runtime query tests
        working-directory: wa_backend
        run: python -m unittest -v tests.test_dispatch_representatives tests.test_dispatch_representatives_boundary
      - name: Diff whitespace gate
        run: git diff --check

name: Representatives backend runtime acceptance
on:
  push:
    branches:
      - sol/representatives-backend-runtime-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: representatives_gate
          POSTGRES_DB: representatives_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U representatives_gate -d representatives_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: RepresentativesRuntimeAcceptanceSecret123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://representatives_runtime@127.0.0.1:5432/representatives_gate
      DATABASE_URL_MIGRATION: postgresql+asyncpg://representatives_gate@127.0.0.1:5432/representatives_gate
      WANASAH_REPRESENTATIVES_DB_GATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Representatives blocker model preflight
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import models
          targets = [models.Company, models.Zone, models.WorkSession, models.DispatchRoute,
                     models.InventoryTransferHeader, models.StocktakeSession,
                     models.InventoryLocation, models.OperationIdempotency, models.SystemAuditLog]
          for model in targets:
              table = model.__table__
              print(f"MODEL {model.__name__} TABLE {model.__tablename__}")
              for column in table.columns:
                  fks = ",".join(str(fk.target_fullname) for fk in column.foreign_keys)
                  print(f"  COL {column.name}|{column.type}|nullable={column.nullable}|default={column.default}|server_default={column.server_default}|fk={fks}")
              for constraint in table.constraints:
                  print(f"  CONSTRAINT {constraint}")
              for index in table.indexes:
                  print(f"  INDEX {index}")
          PY
      - name: Diff whitespace gate
        run: git diff --check 5b39474702e1a60347315e8c50cc08bb780a9ce2 HEAD

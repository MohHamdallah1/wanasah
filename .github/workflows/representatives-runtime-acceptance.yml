name: Representatives backend runtime acceptance
on:
  push:
    branches:
      - sol/representatives-backend-runtime-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: representatives_gate
          POSTGRES_DB: representatives_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U representatives_gate -d representatives_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: RepresentativesRuntimeAcceptanceSecret123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://representatives_runtime@127.0.0.1:5432/representatives_gate
      DATABASE_URL_MIGRATION: postgresql+asyncpg://representatives_gate@127.0.0.1:5432/representatives_gate
      WANASAH_REPRESENTATIVES_DB_GATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Create restricted runtime database role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE representatives_runtime LOGIN NOSUPERUSER "
                  "NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          print("RUNTIME_ROLE=OK")
          PY
      - name: Build production schema through Alembic
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Reject model and migration drift
        working-directory: wa_backend
        run: alembic check
      - name: PostgreSQL-backed Representatives acceptance
        working-directory: wa_backend
        run: python -m pytest -q tests/test_representatives_runtime_db.py
      - name: Complete focused Representatives tests
        working-directory: wa_backend
        run: python -m pytest -q tests/test_representatives*.py --ignore=tests/test_representatives_runtime_db.py
      - name: Canonical auth and session regressions
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_principal_session_invalidation.py
          tests/test_auth_session_token_contract.py
          tests/test_principal_refresh_sessions.py
          tests/test_driver_session_field_context_cutover.py
      - name: Compile Representatives backend
        working-directory: wa_backend
        run: python -m compileall -q api/representatives domains/representatives tests/test_representatives_runtime_db.py
      - name: Diff whitespace gate
        run: git diff --check 5b39474702e1a60347315e8c50cc08bb780a9ce2 HEAD
      - name: Branch scope gate
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base = "5b39474702e1a60347315e8c50cc08bb780a9ce2"
          allowed = {
              ".github/workflows/representatives-runtime-acceptance.yml",
              "wa_backend/tests/test_representatives_runtime_db.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          print("changed:", *sorted(changed), sep="\n- ")
          if unexpected:
              raise SystemExit(f"Unexpected branch scope: {unexpected}")
          PY

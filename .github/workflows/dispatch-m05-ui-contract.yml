name: M05 focused Dashboard and Flutter execution contract

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/features/dispatch/routeLifecycle/**"
      - "dashboard/src/features/operations/representativeSettlement/vehicleCountRead.ts"
      - "dashboard/src/features/operations/representativeSettlement/VehicleCountReadPanel.tsx"
      - "dashboard/src/test/dispatch-m05-lifecycle.test.ts"
      - "dashboard/tsconfig.m05.json"
      - "dashboard/e2e/dispatch-d08-journey.spec.ts"
      - "dashboard/e2e/dispatch-d12-scale.spec.ts"
      - "wanasah_frontend/lib/features/work_session/**"
      - "wanasah_frontend/lib/features/visits/**"
      - "wanasah_frontend/test/features/work_session/**"
      - "wanasah_frontend/test/features/visits/**"
      - ".github/workflows/dispatch-m05-ui-contract.yml"
  push:
    branches: ["worker2/m05-multi-route-ui-945"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-m05:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Strict M02/M04 typed M05 contract and client source
        run: npx vitest run src/test/dispatch-m05-lifecycle.test.ts
      - name: Dashboard typecheck
        run: npx tsc --noEmit -p tsconfig.m05.json
      - name: Dashboard production build
        env:
          VITE_API_URL: http://127.0.0.1:4174
        run: npm run build

  flutter-m05:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wanasah_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - run: |
          printf 'API_BASE_URL=http://127.0.0.1:8000\nSENTRY_DSN=\n' > .env
          flutter pub get
      - name: Analyze modified FIELD command files
        run: |
          dart analyze lib/features/work_session/data/execution_context.dart
          dart analyze lib/features/work_session/data/field_execution_reader.dart
          dart analyze lib/features/visits/application/visit_submission_service.dart
          dart analyze lib/features/visits/data/local_visit_replay_adapter.dart
      - name: Exact current FIELD period and offline replay acceptance
        run: >-
          flutter test
          test/features/work_session/execution_context_proof_test.dart
          test/features/visits/data/visit_replay_adapter_test.dart

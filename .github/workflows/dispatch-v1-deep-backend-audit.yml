name: Dispatch V1 deep PG16 Bearer audit (tests only)

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/test_dispatch_v1_deep_acceptance_postgres.py"
      - "wa_backend/tests/test_dispatch_v1_residual_acceptance_postgres.py"
      - "wa_backend/tests/dispatch_v1_deep_acceptance_support.py"
      - ".github/workflows/dispatch-v1-deep-backend-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-deep-exact-pg16:
    name: dispatch-deep-pg16-real-bearer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ENVIRONMENT: test
      SECRET_KEY: Dispatch837DedicatedTestOnlySecretKey01234567890123456789
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_DISPATCH_P0_PG_GATE: "1"
      WANASAH_DISPATCH_DEEP_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact approved base and test-only file boundary
        run: |
          python - <<'PY'
          import subprocess
          base = "c71121dabdd7566806f29a768d4fb0af4b5ee78e"
          subprocess.run(["git", "cat-file", "-e", base + "^{commit}"], check=True)
          assert subprocess.check_output(
              ["git", "merge-base", base, "HEAD"], text=True
          ).strip() == base, "Audit must descend from owner-approved exact MAIN"
          files = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines())
          allowed = {
              "wa_backend/tests/test_dispatch_v1_deep_acceptance_postgres.py",
              "wa_backend/tests/test_dispatch_v1_residual_acceptance_postgres.py",
              "wa_backend/tests/dispatch_v1_deep_acceptance_support.py",
              ".github/workflows/dispatch-v1-deep-backend-audit.yml",
          }
          assert files and files <= allowed, f"Test-only PR boundary violated: {sorted(files - allowed)}"
          print(f"EXACT_APPROVED_BASE={base}")
          print("EXACT_TEST_HEAD=" + subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip())
          print("TEST_ONLY_FILES=" + ", ".join(sorted(files)))
          PY
          git diff --check c71121dabdd7566806f29a768d4fb0af4b5ee78e HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused backend test requirements
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Compile new test module only
        working-directory: wa_backend
        run: python -m py_compile tests/test_dispatch_v1_deep_acceptance_postgres.py tests/test_dispatch_v1_residual_acceptance_postgres.py
      - name: Start ONLY disposable local PostgreSQL 16
        run: |
          docker run --detach --name dispatch-837-pg16 \
            --env POSTGRES_USER=p0_dispatch_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec dispatch-837-pg16 pg_isready -U p0_dispatch_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs dispatch-837-pg16
          exit 1
      - name: Create isolated NOBYPASSRLS application role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(uri, autocommit=True) as conn:
              conn.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Full real Alembic migrations
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant DML on disposable schema to restricted role only
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(uri, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Assert fresh PostgreSQL16 and restricted runtime identity
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(uri) as conn:
              name, role, version, superuser, bypass = conn.execute(
                  "SELECT current_database(), current_user, current_setting('server_version_num')::int, "
                  "rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user"
              ).fetchone()
              print("PG16_ROLE_EVIDENCE", name, role, version, superuser, bypass)
              assert name == "wanasah_no_lot_contract_test"
              assert role == "wanasah_app" and 160000 <= version < 170000
              assert not superuser and not bypass
          PY
      - name: Run all red/green independent real Bearer HTTP and existing custody PG gates
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_dispatch_v1_deep_acceptance_postgres.py
          tests/test_dispatch_v1_residual_acceptance_postgres.py
          tests/test_dispatch_p0_route_stock_safety_postgres.py
          --junitxml=dispatch-v1-deep-pg16-junit.xml
      - name: Supplemental real PG16 custody and adjust-load existing gates (unmodified)
        if: always()
        working-directory: wa_backend
        env:
          WANASAH_VEHICLE_LOAD_PG_GATE: "1"
          WANASAH_ADJUST_LOAD_PG_GATE: "1"
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_vehicle_load_v1_postgres.py
          tests/test_dispatch_adjust_load_uom.py
          --junitxml=dispatch-v1-custody-supplement-junit.xml
      - name: Report ALL cases including failures and forbid skips
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          path = "dispatch-v1-deep-pg16-junit.xml"
          if not os.path.isfile(path):
              print("PG16 EVIDENCE NOT PRODUCED: no JUnit XML")
              sys.exit(1)
          cases = list(ET.parse(path).getroot().iter("testcase"))
          passed = failed = skipped = errors = 0
          for case in cases:
              bad = case.find("failure")
              error = case.find("error")
              skip = case.find("skipped")
              status = ("FAIL" if bad is not None else
                        "ERROR" if error is not None else
                        "SKIP" if skip is not None else "PASS")
              print(f"CASE {status}: {case.attrib.get('classname')}.{case.attrib.get('name')}")
              if bad is not None:
                  failed += 1
                  print((bad.text or "")[:4000])
              elif error is not None:
                  errors += 1
                  print((error.text or "")[:4000])
              elif skip is not None:
                  skipped += 1
              else:
                  passed += 1
          print(f"PG16_CASES={len(cases)} PASS={passed} FAIL={failed} ERROR={errors} SKIP={skipped}")
          assert len(cases) >= 29, "Expected 21 preserved prior cases + 8+ residual PG16 cases"
          assert skipped == 0, "A skip is UNPROVEN, not an accepted PG16 PASS"
          # Supplementary direct-domain PG16 fixture is intentionally a SEPARATE
          # test class from real Bearer HTTP. Do not conflate its evidence with
          # authenticated ASGI cases in the primary 30+ matrix.
          supplement = "dispatch-v1-custody-supplement-junit.xml"
          assert os.path.isfile(supplement), "Supplemental PG16 JUnit must exist"
          scases = list(ET.parse(supplement).getroot().iter("testcase"))
          statuses = [
              "SKIP" if c.find("skipped") is not None else
              "ERROR" if c.find("error") is not None else
              "FAIL" if c.find("failure") is not None else "PASS"
              for c in scases
          ]
          for c, status in zip(scases, statuses):
              print(f"SUPPLEMENT_PG16_{status} {c.attrib.get('classname')}.{c.attrib.get('name')}")
          print("SUPPLEMENT_PG16_COUNT", len(scases),
                "PASS", statuses.count("PASS"), "FAIL", statuses.count("FAIL"),
                "ERROR", statuses.count("ERROR"), "SKIP", statuses.count("SKIP"))
          assert scases, "Supplemental PG16 suite did not execute"
          assert statuses.count("SKIP") == 0, "Skipped supplemental case remains UNPROVEN"
          # Deliberately do not convert known FAIL findings into green.
          PY
      - name: Publish full failure-preserving JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-v1-deep-pg16-junit-${{ github.run_id }}
          path: |
            wa_backend/dispatch-v1-deep-pg16-junit.xml
            wa_backend/dispatch-v1-custody-supplement-junit.xml
          if-no-files-found: warn
      - name: Show disposable PG logs on startup/migration failure
        if: failure()
        run: docker logs dispatch-837-pg16 2>/dev/null | tail -n 130 || true

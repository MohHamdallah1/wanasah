name: Dispatch F06 Shop create idempotency real PG16 Bearer

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/api/dispatch.py"
      - "wa_backend/schemas.py"
      - "wa_backend/domains/dispatch_shop_create.py"
      - "wa_backend/tests/test_dispatch_shop_create_f06_postgres.py"
      - ".github/workflows/dispatch-shop-create-f06-acceptance.yml"
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Exact PR base SHA (40 lowercase hex) for strict five-file ownership"
        required: true
        type: string

permissions:
  contents: read

jobs:
  shop-create-f06-pg16:
    name: f06-shop-create-real-pg16-bearer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENVIRONMENT: test
      SECRET_KEY: Dispatch858F06ShopCreatePG16OnlyTestKey123456789
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_DISPATCH_P0_PG_GATE: "1"
      WANASAH_SHOP_FINANCE_PG_GATE: "1"
      WANASAH_SHOP_CREATE_F06_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact five-file F06 code and test ownership
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          base = os.environ["BASE"]
          assert re.fullmatch(r"[0-9a-f]{40}", base)
          merge_base = subprocess.check_output(
              ["git", "merge-base", base, "HEAD"], text=True,
          ).strip()
          assert merge_base == base, "F06 base SHA must be an ancestor of checked HEAD"
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"],
              text=True,
          ).splitlines())
          expected = {
              ".github/workflows/dispatch-shop-create-f06-acceptance.yml",
              "wa_backend/api/dispatch.py",
              "wa_backend/domains/dispatch_shop_create.py",
              "wa_backend/schemas.py",
              "wa_backend/tests/test_dispatch_shop_create_f06_postgres.py",
          }
          d07_complete_exact = {
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              ".github/workflows/dispatch-route-launch-d07-acceptance.yml",
              ".github/workflows/dispatch-shop-create-f06-acceptance.yml",
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
              ".github/workflows/live-stock-inflight-authority-acceptance.yml",
              "dashboard/src/features/dispatch/routeLaunch/contract.ts",
              "dashboard/src/features/dispatch/routeLaunch/useRouteLaunchRecovery.ts",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/test/dispatch-route-launch-d07.test.tsx",
              "wa_backend/api/dispatch.py",
              "wa_backend/domains/dispatch_route_launch_receipt.py",
              "wa_backend/schemas.py",
              "wa_backend/tests/test_dispatch_route_launch_d07_postgres.py",
          }
          assert len(expected) == 5 and len(d07_complete_exact) == 14
          # #1039 ZV1-B: six-file exact geo correction plus four CI guards.
          # Frozen F06/D07/M04/M05 modes remain intact for other PRs.
          zones_1039_exact = {
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
              ".github/workflows/dispatch-shop-create-f06-acceptance.yml",
              ".github/workflows/dispatch-route-launch-d07-acceptance.yml",
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              "wa_backend/api/dispatch.py",
              "wa_backend/tests/test_dispatch_zones_1039_geo_pg16.py",
          }
          assert len(zones_1039_exact) == 7
          arv1_b_1045_exact = {
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              ".github/workflows/dispatch-route-launch-d07-acceptance.yml",
              ".github/workflows/dispatch-shop-create-f06-acceptance.yml",
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
              "wa_backend/api/dispatch.py",
              "wa_backend/tests/test_dispatch_active_routes_arv1_pg16.py",
          }
          assert len(arv1_b_1045_exact) == 7
          shortage_1057_exact = {
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              ".github/workflows/dispatch-route-launch-d07-acceptance.yml",
              ".github/workflows/dispatch-shop-create-f06-acceptance.yml",
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
              ".github/workflows/live-stock-inflight-authority-acceptance.yml",
              "dashboard/src/components/dispatch/ShortageModal.tsx",
              "dashboard/src/components/dispatch/ShortageProductPicker.tsx",
              "dashboard/src/components/dispatch/ShortageRequestComposer.tsx",
              "dashboard/src/features/dispatch/dispatchDrafts.ts",
              "dashboard/src/features/dispatch/dispatchUiText.ts",
              "dashboard/src/features/dispatch/useDispatchProductSearch.ts",
              "dashboard/src/features/dispatch/useShortageVehicleAvailability.ts",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/test/dispatch-d10-drafts.test.ts",
              "dashboard/src/test/dispatch-shortage-group-recovery-v1.test.tsx",
              "dashboard/src/test/dispatch-shortage-partial-uom-1060.test.tsx",
              "dashboard/src/test/dispatch-shortage-vehicle-availability-1057.test.tsx",
              "dashboard/src/test/dispatch-urgent-quick-composer-v1.test.tsx",
              "wa_backend/api/dispatch.py",
              "wa_backend/api/dispatch_product_schemas.py",
              "wa_backend/api/dispatch_shortage_availability.py",
              "wa_backend/domains/dispatch_product_discovery.py",
              "wa_backend/schemas.py",
              "wa_backend/tests/test_dispatch_shortage_base_uom_1062.py",
              "wa_backend/tests/test_dispatch_shortage_vehicle_availability.py",
              "wa_backend/tests/test_dispatch_shortage_vehicle_availability_pg16.py",
          }
          shortage_1057_distinct = {
              "wa_backend/api/dispatch_shortage_availability.py",
              "dashboard/src/test/dispatch-shortage-vehicle-availability-1057.test.tsx",
          }
          assert len(shortage_1057_exact)==27
          shortage_1057_release_exact = shortage_1057_exact | {
              "dashboard/src/features/dispatch/shortageCommand/contract.ts",
              "dashboard/src/features/dispatch/shortageCommand/useShortageCommandCommit.ts",
              "dashboard/src/test/dispatch-shortage-command-1068.test.tsx",
              "wa_backend/domains/dispatch_shortage_selected_stock.py",
              "wa_backend/tests/test_dispatch_shortage_selected_stock_1071_pg16.py",
              "wanasah_frontend/test/features/visits/list/shortage_pending_not_field_visit_1068_test.dart",
              "wa_backend/alembic/versions/ae106700b221_shortage_demand_partial_evidence.py",
              "wa_backend/api/dispatch_shortage_commands.py",
              "wa_backend/api/dispatch_shortages_group.py",
              "wa_backend/api/driver.py",
              "wa_backend/domains/dispatch_shortage_fulfillment.py",
              "wa_backend/domains/dispatch_shortage_visits.py",
              "wa_backend/domains/dispatch_shortages_group.py",
              "wa_backend/models.py",
              "wa_backend/services.py",
              "wa_backend/tests/test_dispatch_shortage_phase_b_pg16.py",
              "wa_backend/tests/test_dispatch_shortages_group_v1_postgres.py",
              "wa_backend/tests/test_driver_session_field_context_cutover.py",
              "wa_backend/tests/test_legacy_field_transport_boundary.py",
          }
          assert len(shortage_1057_release_exact) == 46
          m04_mode = __import__("runpy").run_path(".github/scripts/m04_ci_scope.py")["m04_mode"]
          m05_mode = __import__("runpy").run_path(".github/scripts/m05_ci_scope.py")["m05_mode"]
          def ownership_mode(candidate):
              if candidate == shortage_1057_release_exact: return 'SHORTAGE_1057_RELEASE_EXACT'
              if candidate == shortage_1057_exact: return 'SHORTAGE_1057_EXACT'
              if candidate & shortage_1057_distinct:
                  raise AssertionError('SHORTAGE_1057 partial/foreign: '+repr(sorted(candidate)))
              if candidate == arv1_b_1045_exact: return "ARV1_B_1045_EXACT"
              if "wa_backend/tests/test_dispatch_active_routes_arv1_pg16.py" in candidate:
                  raise AssertionError("ARV1_B_1045 partial/foreign: " + repr(sorted(candidate)))
              if candidate == zones_1039_exact: return "ZONES_1039_EXACT"
              if "wa_backend/tests/test_dispatch_zones_1039_geo_pg16.py" in candidate:
                  raise AssertionError("ZONES_1039 partial/foreign scope: " + repr(sorted(candidate)))
              if m04_mode(candidate): return "M04_942_EXACT"
              if m05_mode(candidate): return "M05_945_EXACT"
              if __import__("runpy").run_path(".github/scripts/dispatch_d06_ci_scope.py")["d06_mode"](candidate):
                  return "DISPATCH_D06_889_EXACT"
              if candidate == expected: return "F06_EXACT"
              if candidate == d07_complete_exact: return "D07_COMPLETE_EXACT"
              raise AssertionError(
                  f"F06/D07 exact ownership denied: missing={sorted(d07_complete_exact - candidate)} "
                  f"extra={sorted(candidate - d07_complete_exact)}"
              )
          assert ownership_mode(shortage_1057_exact) == 'SHORTAGE_1057_EXACT'
          for missing in shortage_1057_exact:
              try: ownership_mode(shortage_1057_exact-{missing})
              except AssertionError: pass
              else: raise AssertionError('SHORTAGE_1057 missing: '+missing)
          for foreign in ('wa_backend/models.py','wa_backend/api/driver.py','wanasah_frontend/lib/main.dart'):
              try: ownership_mode(shortage_1057_exact|{foreign})
              except AssertionError: pass
              else: raise AssertionError('SHORTAGE_1057 foreign: '+foreign)
          for mixed in (arv1_b_1045_exact,zones_1039_exact,d07_complete_exact):
              try: ownership_mode(shortage_1057_exact|mixed)
              except AssertionError: pass
              else: raise AssertionError('SHORTAGE_1057 mixed: '+repr(mixed))
          print('SHORTAGE_1057_F06_SELFTEST=PASS exact=27 missing=27 foreign=3 mixed=3')
          assert ownership_mode(shortage_1057_release_exact) == 'SHORTAGE_1057_RELEASE_EXACT'
          for missing in shortage_1057_release_exact:
              try: valid = ownership_mode(shortage_1057_release_exact - {missing})
              except AssertionError: continue
              raise AssertionError("release missing-scope admitted: "+str(missing))
          for foreign in ("wa_backend/api/warehouse.py","wanasah_frontend/lib/main.dart"):
              try: valid = ownership_mode(shortage_1057_release_exact | {foreign})
              except AssertionError: continue
              raise AssertionError("release foreign-scope admitted: "+str(foreign))
          print("SHORTAGE_1057_RELEASE_SELFTEST=PASS exact=46 missing=46 foreign=2")
          for label, exact in (("F06_EXACT", expected), ("D07_COMPLETE_EXACT", d07_complete_exact)):
              assert ownership_mode(exact) == label
              for missing in exact:
                  try: ownership_mode(exact - {missing})
                  except AssertionError: pass
                  else: raise AssertionError(f"{label} admitted partial without {missing}")
              for foreign in ("wa_backend/main.py", "wa_backend/models.py",
                              "dashboard/src/features/dispatch/sessionScope.ts"):
                  if foreign not in exact:
                      try: ownership_mode(exact | {foreign})
                      except AssertionError: pass
                      else: raise AssertionError(f"{label} admitted foreign {foreign}")
          assert ownership_mode(zones_1039_exact) == "ZONES_1039_EXACT"
          for missing in zones_1039_exact:
              try: ownership_mode(zones_1039_exact - {missing})
              except AssertionError: pass
              else: raise AssertionError(f"ZONES_1039 admitted partial without {missing}")
          for foreign in ("wa_backend/models.py", "wa_backend/schemas.py",
                          "dashboard/src/pages/DispatchBoard.tsx"):
              try: ownership_mode(zones_1039_exact | {foreign})
              except AssertionError: pass
              else: raise AssertionError(f"ZONES_1039 admitted foreign {foreign}")
          print("ZONES_1039_F06_SCOPE_SELFTEST=PASS exact=7 missing=7 foreign=3")
          assert ownership_mode(arv1_b_1045_exact) == "ARV1_B_1045_EXACT"
          for missing in sorted(arv1_b_1045_exact):
              try: ownership_mode(arv1_b_1045_exact - {missing})
              except AssertionError: pass
              else: raise AssertionError(f"ARV1_B_1045 admitted missing {missing}")
          for foreign in ("wa_backend/models.py", "wa_backend/schemas.py",
                          "dashboard/src/pages/DispatchBoard.tsx"):
              try: ownership_mode(arv1_b_1045_exact | {foreign})
              except AssertionError: pass
              else: raise AssertionError(f"ARV1_B_1045 admitted foreign {foreign}")
          for mixed in (
              arv1_b_1045_exact | {"wa_backend/tests/test_dispatch_zones_1039_geo_pg16.py"},
              arv1_b_1045_exact | {"wa_backend/tests/test_dispatch_m06_owner_acceptance_postgres.py"},
              (arv1_b_1045_exact - {".github/workflows/dispatch-route-launch-d07-acceptance.yml"})
              | {"dashboard/src/features/dispatch/sessionScope.ts"},
          ):
              try: ownership_mode(mixed)
              except AssertionError: pass
              else: raise AssertionError("ARV1_B_1045 admitted mixed scope")
          print("ARV1_B_1045_F06_SELFTEST=PASS exact=7 missing=7 foreign=3 mixed=3")
          mode = ownership_mode(changed)
          print(f"F06_D07_EXACT_SCOPE=PASS mode={mode} files={len(changed)}")
          PY
          git diff --check "$BASE" HEAD --
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused Backend test requirements
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Compile exact Shop create and canonical permissioned route
        working-directory: wa_backend
        run: |
          python -m py_compile api/dispatch.py schemas.py domains/dispatch_shop_create.py tests/test_dispatch_shop_create_f06_postgres.py
      - name: Start disposable PostgreSQL 16 only
        run: |
          docker run --detach --name dispatch-f06-pg16 \
            --env POSTGRES_USER=p0_dispatch_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 40); do
            if docker exec dispatch-f06-pg16 pg_isready -U p0_dispatch_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs dispatch-f06-pg16
          exit 1
      - name: Create restricted runtime identity (NOBYPASSRLS)
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql",
          ).render_as_string(hide_password=False)
          with psycopg.connect(uri, autocommit=True) as db:
              db.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Full schema migrations, unchanged production data model
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant disposable schema DML to restricted role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql",
          ).render_as_string(hide_password=False)
          with psycopg.connect(uri, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Prove real PG16, FORCE RLS and NOBYPASSRLS
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL"]).set(
              drivername="postgresql",
          ).render_as_string(hide_password=False)
          with psycopg.connect(uri) as db:
              row = db.execute(
                  "SELECT current_user, current_setting('server_version_num')::int, rolsuper, rolbypassrls "
                  "FROM pg_roles WHERE rolname=current_user"
              ).fetchone()
              assert row[0] == "wanasah_app" and 160000 <= row[1] < 170000
              assert row[2:] == (False, False)
              for table in ("shops", "operation_idempotency", "system_audit_logs"):
                  flags = db.execute(
                      "SELECT relrowsecurity, relforcerowsecurity FROM pg_class "
                      "WHERE oid=to_regclass(%s)", (table,),
                  ).fetchone()
                  assert flags == (True, True), (table, flags)
          print("F06_PG16_NOBYPASSRLS_FORCE PASS")
          PY
      - name: Actual Bearer F06, finance F01 and Dispatch physical regressions
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_dispatch_shop_create_f06_postgres.py
          tests/test_dispatch_shop_finance_edit_v1_postgres.py
          tests/test_dispatch_p0_route_stock_safety_postgres.py
          --junitxml=f06-shop-create-pg16.xml
      - name: Full no-skip F06 plus prior finance/physical acceptance
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = "f06-shop-create-pg16.xml"
          assert os.path.exists(path), "F06_JUNIT_MISSING"
          cases = list(ET.parse(path).getroot().iter("testcase"))
          f06 = [case for case in cases if "test_dispatch_shop_create_f06_postgres" in case.attrib.get("classname", "")]
          failures = [case for case in cases if case.find("failure") is not None or case.find("error") is not None]
          skipped = [case for case in cases if case.find("skipped") is not None]
          assert len(f06) == 10, f"F06 case manifest mismatch: {len(f06)}"
          assert len(cases) == 29, f"F06+finance+physical exact manifest mismatch: {len(cases)}"
          assert not failures and not skipped, f"F06 FAIL={len(failures)} SKIP={len(skipped)}"
          print(f"F06_PG16_CASES PASS total={len(cases)} f06={len(f06)} failures=0 skips=0")
          PY
      - name: Publish real audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f06-shop-create-real-pg16-${{ github.run_id }}
          path: wa_backend/f06-shop-create-pg16.xml
          if-no-files-found: warn
      - name: Show only disposable database logs on failure
        if: failure()
        run: docker logs dispatch-f06-pg16 2>/dev/null | tail -n 120 || true

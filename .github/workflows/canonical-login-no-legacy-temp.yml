name: Canonical login no legacy temp gate

on:
  pull_request:
    paths:
      - "wa_backend/api/authentication/login.py"
      - "wa_backend/api/authentication/login_orchestration.py"
      - "wa_backend/api/authentication/schemas.py"
      - "wa_backend/tests/test_canonical_login_no_legacy_boundary.py"
      - "wa_backend/tests/test_identity_authentication_foundation.py"
      - "wa_backend/tests/test_principal_auth_http_contracts.py"
      - "wa_backend/tests/test_principal_login_http_boundary.py"
      - "wa_backend/tests/test_principal_login_orchestration.py"
      - "wa_backend/tests/test_principal_login_route_adapter.py"
      - ".github/workflows/canonical-login-no-legacy-temp.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: CanonicalLoginTempSecret123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://unit@127.0.0.1:1/unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://unit@127.0.0.1:1/unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt
      - name: Run focused canonical login tests
        working-directory: wa_backend
        run: |
          python -m unittest -v \
            tests.test_canonical_login_no_legacy_boundary \
            tests.test_identity_authentication_foundation \
            tests.test_principal_auth_http_contracts \
            tests.test_principal_login_http_boundary \
            tests.test_principal_login_orchestration \
            tests.test_principal_login_route_adapter
      - name: Diff whitespace gate
        run: git diff --check

name: TEMP canonical Backoffice runtime compatibility gate

on:
  push:
    branches:
      - sol/canonical-backoffice-runtime-compatibility

permissions:
  contents: read

jobs:
  focused-backoffice-runtime-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: BackofficeCompatibilityGateOnlyKey123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://bo_unit@127.0.0.1:1/bo_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://bo_admin@127.0.0.1:1/bo_unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt
      - name: Canonical Backoffice runtime compatibility tests
        working-directory: wa_backend
        run: python -m unittest -v tests.test_canonical_backoffice_runtime_compatibility
      - name: Diff whitespace gate
        run: git diff --check

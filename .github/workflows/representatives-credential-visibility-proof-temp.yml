name: Representative credential visibility proof

on:
  push:
    branches:
      - sol/representatives-form-credential-identity-ux-final
    paths:
      - .github/workflows/representatives-credential-visibility-proof-temp.yml

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/representatives-form-credential-identity-ux-final
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm ci
      - name: Complete Representatives dashboard suite
        working-directory: dashboard
        run: npx vitest run src/pages/representatives-vehicles
      - name: Affected lint
        working-directory: dashboard
        run: npx eslint src/pages/representatives-vehicles/representatives/RepresentativeCredentialAction.test.tsx

name: Stocktake V1 stale session read fence

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeCounting.ts"
      - "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeReview.ts"
      - "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeLifecycle.ts"
      - "dashboard/src/pages/inventory/stocktake/StocktakeSessionReadFence.test.tsx"
      - ".github/workflows/stocktake-v1-session-read-fence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stocktake-read-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: V1 A-to-B late session context and sheet acceptance
        working-directory: dashboard
        run: npm run test -- src/pages/inventory/stocktake/StocktakeSessionReadFence.test.tsx
      - name: Strict Dashboard typecheck and touched-source lint
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npx eslint src/pages/inventory/stocktake/StocktakeSessionReadFence.test.tsx src/pages/inventory/stocktake/hooks/useStocktakeCounting.ts src/pages/inventory/stocktake/hooks/useStocktakeReview.ts src/pages/inventory/stocktake/hooks/useStocktakeLifecycle.ts
      - name: Scope and whitespace
        run: |
          base="${{ github.event.pull_request.base.sha || 'a740c69135f418bbf60b989ae55b11f72bdbc471' }}"
          git cat-file -e "${base}^{commit}"
          git diff --check "$base" HEAD
          STOCKTAKE_SCOPE_BASE="$base" python - <<'PY'
          import os
          import subprocess
          base = os.environ["STOCKTAKE_SCOPE_BASE"]
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True,
          ).splitlines())
          allowed = {
              ".github/workflows/stocktake-v1-session-read-fence.yml",
              "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeCounting.ts",
              "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeReview.ts",
              "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeLifecycle.ts",
              "dashboard/src/pages/inventory/stocktake/StocktakeSessionReadFence.test.tsx",
          }
          discovered_allowed = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-session-read-fence.yml",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeDiscoveredModal.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeDiscoveredV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/discoveredContract.ts",
              "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeCounting.ts",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
              "wa_backend/api/warehouse/stocktake.py",
              "wa_backend/api/warehouse/stocktake_discovery.py",
              "wa_backend/tests/test_cp14c_stocktake_lifecycle_postgres.py",
          }
          if changed == allowed:
              mode = "REENTRY"
          elif changed == discovered_allowed:
              mode = "DISCOVERED"
          else:
              raise AssertionError({
                  "unexpected": sorted(changed - (allowed | discovered_allowed)),
                  "missing_reentry": sorted(allowed - changed),
                  "missing_discovered": sorted(discovered_allowed - changed),
              })
          for foreign in ("wa_backend/services.py", "dashboard/src/pages/inventory/Tab4Ledger.tsx",
                          "flutter/lib/main.dart", "wa_backend/alembic/versions/foreign.py"):
              assert foreign not in allowed and foreign not in discovered_allowed
          print(f"STOCKTAKE_V1_REENTRY_SCOPE=PASS mode={mode}")
          PY

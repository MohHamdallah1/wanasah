name: TEMP Final green canonical wave

on:
  push:
    branches:
      - lead/final-green-canonical-wave

jobs:
  focused:
    name: focused-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: product-tracking
            files: tests/test_product_tracking_canonical_auth.py
          - name: inbound-adjustments
            files: tests/test_inbound_adjustments_canonical_auth_cutover.py
          - name: tenant
            files: tests/test_tenant_identity_canonical_auth_cutover.py
          - name: ledger-status
            files: tests/test_warehouse_ledger_status_canonical_auth_cutover.py
          - name: quality-preview
            files: tests/test_whole_product_quality_preview_canonical_auth_cutover.py
    env:
      ENVIRONMENT: test
      SECRET_KEY: FinalGreenCanonicalWaveGateOnlyKey123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://canonical_unit@127.0.0.1:1/canonical_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://canonical_admin@127.0.0.1:1/canonical_unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: Run focused suite
        working-directory: wa_backend
        env:
          PYTHONPATH: .
        run: pytest -q ${{ matrix.files }}

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and authority audit
        run: |
          python -m py_compile \
            wa_backend/api/product_tracking.py \
            wa_backend/api/warehouse/inbound_adjustments.py \
            wa_backend/api/tenant.py \
            wa_backend/api/warehouse/ledger.py \
            wa_backend/api/warehouse/status.py \
            wa_backend/api/warehouse/whole_product_quality_preview.py
          python - <<'PY'
          from pathlib import Path
          paths = [
              'wa_backend/api/product_tracking.py',
              'wa_backend/api/warehouse/inbound_adjustments.py',
              'wa_backend/api/tenant.py',
              'wa_backend/api/warehouse/ledger.py',
              'wa_backend/api/warehouse/status.py',
              'wa_backend/api/warehouse/whole_product_quality_preview.py',
          ]
          forbidden = ('get_current_driver','get_current_admin','InventoryAccess','.is_admin','actor.company_id','legacy_actor.company_id','current_admin')
          for path in paths:
              text = Path(path).read_text(encoding='utf-8')
              assert 'BackofficeCapabilityAccess' in text, path
              for token in forbidden:
                  assert token not in text, f'{token}: {path}'
          PY
          git diff --check origin/main...HEAD

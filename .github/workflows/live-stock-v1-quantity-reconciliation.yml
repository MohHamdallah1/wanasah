name: Live Stock V1 quantity reconciliation acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/test_live_stock_v1_quantity_reconciliation_postgres.py"
      - ".github/workflows/live-stock-v1-quantity-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-v1-quantity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-16:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: LiveStockQuantityProofKeyAbc123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Compile reconciliation acceptance only
        working-directory: wa_backend
        run: python -m py_compile tests/test_live_stock_v1_quantity_reconciliation_postgres.py

      - name: Start disposable PostgreSQL 16
        run: |
          docker run --detach --name live-stock-quantity-postgres \
            --env POSTGRES_USER=cp1_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec live-stock-quantity-postgres pg_isready \
              -U cp1_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs live-stock-quantity-postgres
          exit 1

      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          dsn = (
              make_url(os.environ["DATABASE_URL_MIGRATION"])
              .set(drivername="postgresql")
              .render_as_string(hide_password=False)
          )
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Migrate disposable database
        working-directory: wa_backend
        run: alembic upgrade head

      - name: Grant restricted runtime DML
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          dsn = (
              make_url(os.environ["DATABASE_URL_MIGRATION"])
              .set(drivername="postgresql")
              .render_as_string(hide_password=False)
          )
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE "
                  "ON ALL TABLES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT USAGE, SELECT, UPDATE "
                  "ON ALL SEQUENCES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app"
              )
          PY

      - name: Run only Section 5.A inbound-to-vehicle quantity proof
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v1_quantity_reconciliation_postgres.py
          --junitxml=live-stock-v1-quantity-reconciliation.xml

      - name: Retain focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-v1-quantity-reconciliation-${{ github.sha }}
          path: wa_backend/live-stock-v1-quantity-reconciliation.xml
          if-no-files-found: error

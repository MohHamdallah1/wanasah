name: V1 return cost fidelity and reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/api/driver.py"
      - "wa_backend/services.py"
      - "wa_backend/models.py"
      - "wa_backend/domains/inventory_costing/service.py"
      - "wa_backend/alembic/versions/e1b7c4d9a203_linked_return_cost_provenance.py"
      - "wa_backend/tests/test_return_cost_fidelity_c3_c5_postgres.py"
      - ".github/workflows/v1-return-cost-fidelity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-return-cost-fidelity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  committed-return-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        method: [FIFO, MOVING_AVERAGE]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: return_cost_admin
          POSTGRES_DB: wanasah_return_cost_fidelity
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55491:5432"]
        options: >-
          --health-cmd "pg_isready -U return_cost_admin -d wanasah_return_cost_fidelity"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: ReturnCostFidelityOnlyKey123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://return_cost_runtime@127.0.0.1:55491/wanasah_return_cost_fidelity
      DATABASE_URL_MIGRATION: postgresql+asyncpg://return_cost_admin@127.0.0.1:55491/wanasah_return_cost_fidelity
      WANASAH_FIELD_CONTRACT_PG_GATE: "1"
      WANASAH_RETURN_COST_FIDELITY_PG_GATE: "1"
      WANASAH_RETURN_COST_FIDELITY_METHOD: ${{ matrix.method }}
      PYTHONPATH: ".:tests"

    defaults:
      run:
        working-directory: wa_backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused backend dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Compile production and acceptance files
        run: >-
          python -m py_compile
          api/driver.py
          services.py
          models.py
          domains/inventory_costing/service.py
          tests/test_return_cost_fidelity_c3_c5_postgres.py
          tests/test_costed_driver_sale_correction_real_c2_db.py
          tests/field_contract_postgres_fixture.py

      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://return_cost_admin@127.0.0.1:55491/wanasah_return_cost_fidelity",
              autocommit=True,
          ) as db:
              db.execute(
                  "CREATE ROLE return_cost_runtime LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Migrate fresh PostgreSQL 16 schema
        run: |
          alembic upgrade head
          alembic check

      - name: Grant restricted runtime DML
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://return_cost_admin@127.0.0.1:55491/wanasah_return_cost_fidelity",
              autocommit=True,
          ) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO return_cost_runtime")
              db.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE "
                  "ON ALL TABLES IN SCHEMA public TO return_cost_runtime"
              )
              db.execute(
                  "GRANT USAGE, SELECT, UPDATE "
                  "ON ALL SEQUENCES IN SCHEMA public TO return_cost_runtime"
              )
              db.execute(
                  "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO return_cost_runtime"
              )
              db.execute(
                  "INSERT INTO permissions(code) VALUES "
                  "('inventory.read'), ('inbound.create') "
                  "ON CONFLICT(code) DO NOTHING"
              )
          PY

      - name: Seed isolated synthetic FIELD fixture
        run: python -m tests.field_contract_postgres_fixture

      - name: Run committed return-cost fidelity proof
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_return_cost_fidelity_c3_c5_postgres.py
          --junitxml=return-cost-${{ matrix.method }}.xml

      - name: Run relevant existing priced-sale correction regression
        env:
          WANASAH_C2_REAL_SALE_DB_GATE: "1"
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_costed_driver_sale_correction_real_c2_db.py
          -k "${{ matrix.method == 'FIFO' && 'fifo' || 'average' }}"
          --junitxml=existing-c2-${{ matrix.method }}.xml

      - name: Run Stage74 costing contract gate
        run: python scripts/gate_stage74_inventory_costing.py

      - name: Reject skips failures and empty execution
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          method = os.environ["WANASAH_RETURN_COST_FIDELITY_METHOD"]
          for name in (f"return-cost-{method}.xml", f"existing-c2-{method}.xml"):
              root = ET.parse(name).getroot()
              cases = list(root.iter("testcase"))
              assert cases, f"No tests executed in {name}"
              assert not list(root.iter("skipped")), f"Skipped test in {name}"
              assert not list(root.iter("failure")) and not list(root.iter("error")), (
                  f"Failure/error in {name}"
              )
              print(name + "_EXECUTED=" + str(len(cases)))
          PY

      - name: Scope and whitespace checks
        run: |
          git diff --check origin/main...HEAD
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/v1-return-cost-fidelity.yml",
              "wa_backend/alembic/versions/e1b7c4d9a203_linked_return_cost_provenance.py",
              "wa_backend/api/driver.py",
              "wa_backend/domains/inventory_costing/service.py",
              "wa_backend/models.py",
              "wa_backend/services.py",
              "wa_backend/tests/test_return_cost_fidelity_c3_c5_postgres.py",
          }
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              text=True,
          ).splitlines())
          unexpected = sorted(actual - allowed)
          assert not unexpected, "Unexpected ownership files: " + repr(unexpected)
          print("RETURN_COST_SCOPE=PASS " + repr(sorted(actual)))
          PY

      - name: Retain financial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: return-cost-${{ matrix.method }}-${{ github.sha }}
          path: |
            wa_backend/return-cost-${{ matrix.method }}.xml
            wa_backend/existing-c2-${{ matrix.method }}.xml
          if-no-files-found: warn

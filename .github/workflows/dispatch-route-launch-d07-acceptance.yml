              "dashboard/src/test/dispatch-urgent-quick-composer-v1.test.tsx",
          }
          assert len(urgent_1050_exact) == 15
          def shortage_1057_mode(candidate):
              if candidate == shortage_1057_exact: return True
              if candidate & shortage_1057_distinct:
                  raise AssertionError('SHORTAGE_1057 partial/foreign: '+repr(sorted(candidate)))
              return False
          assert shortage_1057_mode(shortage_1057_exact) is True
          for missing in shortage_1057_exact:
              try: shortage_1057_mode(shortage_1057_exact-{missing})
              except AssertionError: pass
              else: raise AssertionError('SHORTAGE_1057 missing: '+missing)
          for foreign in ('wa_backend/models.py','wa_backend/api/driver.py','wanasah_frontend/lib/main.dart'):
              try: shortage_1057_mode(shortage_1057_exact|{foreign})
              except AssertionError: pass
              else: raise AssertionError('SHORTAGE_1057 foreign: '+foreign)
          for mixed in (arv1_f_1044_exact,arv1_b_1045_exact,zones_1039_exact):
              try: shortage_1057_mode(shortage_1057_exact|mixed)
              except AssertionError: pass
              else: raise AssertionError('SHORTAGE_1057 mixed: '+repr(mixed))
          print('SHORTAGE_1057_D07_SELFTEST=PASS exact=16 missing=16 foreign=3 mixed=3')
          def urgent_1055_mode(candidate):
              if candidate == urgent_1055_exact: return True
              if candidate & urgent_1055_distinct:
                  raise AssertionError('URGENT_1055 partial/foreign: '+repr(sorted(candidate)))
              return False
          assert urgent_1055_mode(urgent_1055_exact) == True
          for missing in urgent_1055_exact:
              try: urgent_1055_mode(urgent_1055_exact-{missing})
              except AssertionError: pass
              else: raise AssertionError('URGENT_1055 missing: '+missing)
          for foreign in ('wa_backend/models.py','wa_backend/api/driver.py','wanasah_frontend/lib/main.dart'):
              try: urgent_1055_mode(urgent_1055_exact|{foreign})
              except AssertionError: pass
              else: raise AssertionError('URGENT_1055 foreign: '+foreign)
          for mixed in (arv1_f_1044_exact,arv1_b_1045_exact,zones_1039_exact):
              try: urgent_1055_mode(urgent_1055_exact | mixed)
              except AssertionError: pass
              else: raise AssertionError('URGENT_1055 mixed: '+repr(mixed))
          print('URGENT_1055_SELFTEST=PASS exact=11 missing=11 foreign=3 mixed=3')
          def urgent_1053_mode(candidate):
              if candidate == urgent_1053_exact: return True
              if candidate & urgent_1053_distinct:
                  raise AssertionError('URGENT_1053 partial/foreign: '+repr(sorted(candidate)))
              return False
          assert urgent_1053_mode(urgent_1053_exact) == True
          for missing in urgent_1053_exact:
              try: urgent_1053_mode(urgent_1053_exact-{missing})
              except AssertionError: pass
              else: raise AssertionError('URGENT_1053 missing: '+missing)
          for foreign in ('wa_backend/models.py','wa_backend/api/driver.py','wanasah_frontend/lib/main.dart'):
              try: urgent_1053_mode(urgent_1053_exact|{foreign})
              except AssertionError: pass
              else: raise AssertionError('URGENT_1053 foreign: '+foreign)
          for mixed in (arv1_f_1044_exact,arv1_b_1045_exact,zones_1039_exact):
              try: urgent_1053_mode(urgent_1053_exact | mixed)
              except AssertionError: pass
              else: raise AssertionError('URGENT_1053 mixed: '+repr(mixed))
          print('URGENT_1053_SELFTEST=PASS exact=15 missing=15 foreign=3 mixed=3')
          def urgent_1050_mode(candidate):
              if candidate == urgent_1050_exact: return True
              if candidate & urgent_1050_distinct:
                  raise AssertionError('URGENT_1050 incomplete/foreign: '+repr(sorted(candidate)))
              return False
          assert urgent_1050_mode(urgent_1050_exact) == True
          for missing in urgent_1050_exact:
              try:
                  urgent_1050_mode(urgent_1050_exact-{missing})
              except AssertionError: pass
              else: raise AssertionError('URGENT_1050 missing path allowed: '+missing)
          for foreign in ("wa_backend/models.py", "wa_backend/api/driver.py", "wanasah_frontend/lib/main.dart"):
              try:
                  urgent_1050_mode(urgent_1050_exact | {foreign})
              except AssertionError: pass
              else: raise AssertionError('URGENT_1050 foreign path allowed')
          for mixed in (arv1_f_1044_exact, arv1_b_1045_exact, zones_1039_exact):
              try:
                  urgent_1050_mode(urgent_1050_exact | mixed)
              except AssertionError: pass
              else: raise AssertionError('URGENT_1050 mixed path allowed')
          print('URGENT_1050_TRUE_SELFTEST=PASS exact=15 missing=15 foreign=3 mixed=3')

          def arv1_f_1044_mode(candidate):
              if candidate == arv1_f_1044_exact: return True
              if candidate & arv1_f_1044_distinct:
                  raise AssertionError("ARV1_F_1044 incomplete/foreign: " + repr(sorted(candidate)))
              return False

          # Every missing #1044 path must be rejected, not downgraded to a historical scope.
          assert arv1_f_1044_mode(arv1_f_1044_exact) is True
          for missing in arv1_f_1044_exact:
              try:
                  arv1_f_1044_mode(arv1_f_1044_exact - {missing})
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"ARV1_F_1044 missing path admitted: {missing}")
          for foreign in ("wa_backend/models.py", "wa_backend/api/driver.py",
                          "wanasah_frontend/lib/main.dart"):
              try:
                  arv1_f_1044_mode(arv1_f_1044_exact | {foreign})
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"ARV1_F_1044 foreign path admitted: {foreign}")
          for mixed in (
              arv1_f_1044_exact | arv1_b_1045_exact,
              arv1_f_1044_exact | zones_1039_exact,
              arv1_f_1044_exact | d07_complete_exact,
          ):
              try:
                  arv1_f_1044_mode(mixed)
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"ARV1_F_1044 mixed owners admitted: {sorted(mixed)}")
          print("ARV1_F_1044_EXACT_SELFTEST=PASS exact=14 missing=14 foreign=3 mixed=3")

          if os.environ.get("PR_NUMBER") == "884":
              # GitHub's pull_request checkout is a synthetic merge commit.
              # A newer MAIN containing D12 must NOT be charged to D11.
              # Inspect ONLY the author's PR HEAD against the exact approved
              # D11 starting MAIN. Neither broad path exceptions nor D07
              # acceptance are granted to any other PR.
              d11_original_main = "5417254e71128fcebec6f756e3c8de657307231f"
              d11_head = os.environ["PR_HEAD"]
              assert subprocess.check_output(
                  ["git", "merge-base", d11_original_main, d11_head], text=True
              ).strip() == d11_original_main, "D11 PR must descend from approved exact MAIN"
              d11_authored = set(subprocess.check_output(
                  ["git", "diff", "--name-only", d11_original_main, d11_head], text=True
              ).splitlines())
              assert d11_authored == dispatch_d11_881_exact, (
                  f"D11 exact PR authored scope missing={sorted(dispatch_d11_881_exact - d11_authored)} "
                  f"extra={sorted(d11_authored - dispatch_d11_881_exact)}"
              )
              print("D11_D07_CROSS_OWNER=PASS authored_exact=16 upstream_D12_ignored")
          else:
              m04_mode = __import__("runpy").run_path(".github/scripts/m04_ci_scope.py")["m04_mode"]
              m04_authorized = m04_mode(files)
              m05_authorized = __import__("runpy").run_path(".github/scripts/m05_ci_scope.py")["m05_mode"](files)
              # D06 is independently approved and frozen to exact security paths.
              # D07/F06 historical scope is unchanged for all other PRs.
              release_mode = __import__("runpy").run_path(".github/scripts/dispatch_c03_x01_release_scope.py")["release_mode"]
          assert (shortage_1057_mode(files) or urgent_1055_mode(files) or urgent_1053_mode(files) or urgent_1050_mode(files) or arv1_f_1044_mode(files) or arv1_b_1045_mode(files) or zones_1038_mode(files) or zones_1039_mode(files) or release_mode(files) or files == u02_u03_969_exact or files == d21_launch_exact or files == u01_carton_codec_exact or files == d20_input_exact or files == d19_961_exact or files == d18_959_exact or files == d17_957_exact or files == d16_955_exact or m05_authorized or m04_authorized or files == d07_complete_exact or __import__("runpy").run_path(
                  ".github/scripts/dispatch_d15_real_content_scope.py"
              )["d15_real_content_mode"](files) or __import__("runpy").run_path(
                  ".github/scripts/dispatch_d06_ci_scope.py"
              )["d06_mode"](files) or __import__("runpy").run_path(
                  ".github/scripts/dispatch_d15_visual_ci_scope.py"
              )["d15_visual_mode"](files) or __import__("runpy").run_path(
                  ".github/scripts/dispatch_d15_zero_flash_scope.py"
              )["d15_zero_flash_mode"](files) or __import__("runpy").run_path(
                  ".github/scripts/dispatch_d15_reentry_ci_scope.py"
              )["d15_overflow_mode"](files) or __import__("runpy").run_path(
                  ".github/scripts/dispatch_d15_reentry_ci_scope.py"
              )["d15_reentry_mode"](files) or __import__("runpy").run_path(
                  ".github/scripts/dispatch_d14_ci_scope.py"
              )["d14_mode"](files)), (
                  f"D07/D06 exact scope denied files={sorted(files)}"
              )
          for absent in d07_complete_exact:
              assert d07_complete_exact - {absent} != files
          for foreign in (
              "dashboard/src/features/dispatch/dispatchDrafts.ts",
              "dashboard/src/features/dispatch/sessionScope.ts",
              "wa_backend/models.py", "dashboard/src/components/dispatch/ShortageModal.tsx",
          ):
              assert foreign not in files or (os.environ.get("PR_NUMBER") != "884" and (files == u02_u03_969_exact or m04_mode(files) or urgent_1055_mode(files) or urgent_1053_mode(files) or urgent_1050_mode(files))), f"D07 forbidden foreign path: {foreign}"
          print("D07_COMPLETE_OWNERSHIP=PASS exact=14 foreign=4")
          PY
          git diff --check "$BASE" HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Compile source and D07 tests, not mock commercial scope
        working-directory: wa_backend
        run: python -m py_compile api/dispatch.py schemas.py domains/dispatch_route_launch_receipt.py tests/test_dispatch_route_launch_d07_postgres.py
      - name: Start fresh disposable local PostgreSQL 16
        run: |
          docker run --detach --name dispatch-d07-pg16 \
            --env POSTGRES_USER=p0_dispatch_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 35); do
            if docker exec dispatch-d07-pg16 pg_isready -U p0_dispatch_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs dispatch-d07-pg16
          exit 1
      - name: Create separate restricted NOBYPASSRLS runtime role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as connection:
              connection.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY
      - name: Alembic real migration to latest schema
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant restricted runtime DML only within disposable schema
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as connection:
              connection.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              connection.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              connection.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              connection.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Prove restricted PostgreSQL16 and FORCE RLS
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn) as connection:
              name, user, ver, superuser, bypass = connection.execute(
                  "SELECT current_database(),current_user,current_setting('server_version_num')::int,"
                  "rolsuper,rolbypassrls FROM pg_roles WHERE rolname=current_user"
              ).fetchone()
              assert name == "wanasah_no_lot_contract_test" and user == "wanasah_app"
              assert 160000 <= ver < 170000 and not superuser and not bypass
              for table in ("dispatch_routes","visits","route_commercial_contexts",
                            "inventory_balances","inventory_movements","operation_idempotency"):
                  flags = connection.execute(
                      "SELECT relrowsecurity,relforcerowsecurity FROM pg_class WHERE oid=to_regclass(%s)",
                      (table,)
                  ).fetchone()
                  assert flags == (True,True), (table,flags)
              print("D07_PG16_NOBYPASSRLS_FORCE_RLS PASS")
          PY
      - name: Real HTTP owner/nonowner lost-201 replay, published policy and physical rollback
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_dispatch_route_launch_d07_postgres.py
          --junitxml=d07-real-pg16.xml
      - name: Exact D07 no-skip JUnit manifest
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          name = "d07-real-pg16.xml"
          assert os.path.isfile(name), "No genuine PG16 evidence"
          cases = list(ET.parse(name).getroot().iter("testcase"))
          invalid = [(x.get("name"),state) for x in cases for state in ("failure","error","skipped")
                     if x.find(state) is not None]
          print(f"D07_PG16_CASES={len(cases)} failures_or_skips={len(invalid)}")
          assert len(cases) == 5, f"D07 focused expected 5, got {len(cases)}"
          assert not invalid, f"D07 real PG16 failed/skipped: {invalid}"
          PY
      - name: U03 genuine signed largest-UOM/base PG16 six scenarios
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_dispatch_route_load_uom_contract.py::test_u03_real_signed_base_load_and_reverse_unload_exactly_once
          --junitxml=u03-real-pg16.xml
      - name: U03 exact six-case no-skip physical stock manifest
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          name = "u03-real-pg16.xml"
          assert os.path.isfile(name), "No genuine U03 PostgreSQL16 evidence"
          cases = list(ET.parse(name).getroot().iter("testcase"))
          invalid = [(case.get("name"), state) for case in cases
                     for state in ("failure", "error", "skipped")
                     if case.find(state) is not None]
          print(f"U03_PG16_CASES={len(cases)} failures_or_skips={len(invalid)}")
          assert len(cases) == 6, f"U03 expected six physical signed cases, got {len(cases)}"
          assert not invalid, f"U03 physical PG16 failed/skipped: {invalid}"
          PY
      - name: Publish test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-d07-real-pg16-junit-${{ github.run_id }}
          path: |
            wa_backend/d07-real-pg16.xml
            wa_backend/u03-real-pg16.xml
          if-no-files-found: warn
      - name: Disposable PG diagnostic on failure only
        if: failure()
        run: docker logs dispatch-d07-pg16 2>/dev/null | tail -n 100 || true

  d07-react-focused:
    name: d07-independent-client-command-vitest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Focused D07 immutable original command and React AR/EN acceptance
        working-directory: dashboard
        run: npx vitest run src/test/dispatch-route-launch-d07.test.tsx
      - name: Check Dashboard TypeScript contract
        working-directory: dashboard
        run: npx tsc --noEmit

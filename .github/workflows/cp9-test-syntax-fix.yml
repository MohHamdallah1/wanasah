name: CP9 bounded test syntax repair

on:
  push:
    branches:
      - sol/cp9-stocktake-full-closure-wave2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/cp9-stocktake-full-closure-wave2
      - name: Repair exact CP9 PostgreSQL assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('wa_backend/tests/test_cp9_stocktake_postgres.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'self.assertEqual(int(await self.db.scalar(select(func.count()).select_from(InventoryMovement).where(InventoryMovement.stocktake_session_id == sid))) or 0, 0)': 'self.assertEqual(int((await self.db.scalar(select(func.count()).select_from(InventoryMovement).where(InventoryMovement.stocktake_session_id == sid))) or 0), 0)',
              'self.assertEqual(int(await self.db.scalar(select(func.count()).select_from(InventoryLock).where(InventoryLock.stocktake_session_id == sid, InventoryLock.released_at.is_(None))) or 0, 0)': 'self.assertEqual(int((await self.db.scalar(select(func.count()).select_from(InventoryLock).where(InventoryLock.stocktake_session_id == sid, InventoryLock.released_at.is_(None))) or 0), 0)',
              'self.assertEqual(int(await self.db.scalar(select(func.count()).select_from(InventoryLock).where(InventoryLock.stocktake_session_id == cancel_sid, InventoryLock.released_at.is_(None))) or 0, 0)': 'self.assertEqual(int((await self.db.scalar(select(func.count()).select_from(InventoryLock).where(InventoryLock.stocktake_session_id == cancel_sid, InventoryLock.released_at.is_(None))) or 0), 0)',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, got {count}: {old[:80]}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile wa_backend/tests/test_cp9_stocktake_postgres.py
          rm .github/workflows/cp9-test-syntax-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wa_backend/tests/test_cp9_stocktake_postgres.py .github/workflows/cp9-test-syntax-fix.yml
          git commit -m 'CP9: repair PostgreSQL acceptance syntax'
          git push origin HEAD:sol/cp9-stocktake-full-closure-wave2

name: Temporary representatives field financial safety gate

on:
  push:
    branches:
      - sol/representatives-field-compatibility-acceptance
    paths:
      - ".github/workflows/representatives-field-financial-safety-temp.yml"

permissions:
  contents: read

jobs:
  flutter-financial-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 2b0527b1c4dc65cad2825d0398486b04bb44fc77
      BASE_SHA: 19566ddefa81f9941de7cc72c608da66896c2c16
    steps:
      - name: Checkout exact production fix
        uses: actions/checkout@v4
        with:
          ref: 2b0527b1c4dc65cad2825d0398486b04bb44fc77
          fetch-depth: 0
      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: wanasah_frontend
        run: flutter pub get
      - name: Formatting gate
        working-directory: wanasah_frontend
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/blocs/auth/auth_bloc.dart
          lib/blocs/auth/offline_owner_guard.dart
          test/offline_owner_guard_test.dart
      - name: Focused Flutter analyze
        working-directory: wanasah_frontend
        run: >-
          flutter analyze --no-pub
          lib/blocs/auth/auth_bloc.dart
          lib/blocs/auth/offline_owner_guard.dart
          test/offline_owner_guard_test.dart
      - name: Prepare local test asset
        working-directory: wanasah_frontend
        run: touch .env
      - name: Focused auth and offline regression tests
        working-directory: wanasah_frontend
        run: flutter test test/offline_owner_guard_test.dart
      - name: Diff whitespace gate
        run: git diff --check "$BASE_SHA" "$TARGET_SHA"
      - name: Field financial safety scope gate
        shell: bash
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(wanasah_frontend/lib/blocs/auth/auth_bloc\.dart|wanasah_frontend/lib/blocs/auth/offline_owner_guard\.dart|wanasah_frontend/test/offline_owner_guard_test\.dart|\.github/workflows/representatives-field-financial-safety-temp\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files outside field financial-safety scope:\n%s\n' "$unexpected"
            exit 1
          fi
          for required in \
            wanasah_frontend/lib/blocs/auth/auth_bloc.dart \
            wanasah_frontend/lib/blocs/auth/offline_owner_guard.dart \
            wanasah_frontend/test/offline_owner_guard_test.dart; do
            printf '%s\n' "$changed" | grep -Fx "$required" >/dev/null
          done
          printf 'FIELD_FINANCIAL_SAFETY_SCOPE=PASS\n'

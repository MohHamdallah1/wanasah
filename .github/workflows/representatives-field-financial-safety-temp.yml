name: Temporary representatives field financial safety gate

on:
  push:
    branches:
      - sol/representatives-field-compatibility-acceptance
    paths:
      - ".github/workflows/representatives-field-financial-safety-temp.yml"

permissions:
  contents: write

jobs:
  apply-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/representatives-field-compatibility-acceptance
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - name: Apply exact Dart formatter
        working-directory: wanasah_frontend
        run: >-
          dart format
          lib/blocs/auth/auth_bloc.dart
          lib/blocs/auth/offline_owner_guard.dart
          test/offline_owner_guard_test.dart
      - name: Commit formatted production and test files
        run: |
          git diff --check
          if git diff --quiet -- \
            wanasah_frontend/lib/blocs/auth/auth_bloc.dart \
            wanasah_frontend/lib/blocs/auth/offline_owner_guard.dart \
            wanasah_frontend/test/offline_owner_guard_test.dart; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            wanasah_frontend/lib/blocs/auth/auth_bloc.dart \
            wanasah_frontend/lib/blocs/auth/offline_owner_guard.dart \
            wanasah_frontend/test/offline_owner_guard_test.dart
          git commit -m "style(field): apply Dart formatter to financial safety fix"
          git push origin HEAD:sol/representatives-field-compatibility-acceptance

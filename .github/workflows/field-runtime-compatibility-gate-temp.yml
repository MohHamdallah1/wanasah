name: Field runtime compatibility gate temp

on:
  push:
    branches:
      - codex/canonical-field-runtime-compatibility

permissions:
  contents: read

jobs:
  focused-field-runtime-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: FieldCompatibilitySyntheticSecret123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://field_unit@127.0.0.1:1/field_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://field_admin@127.0.0.1:1/field_unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt
      - name: Canonical field runtime compatibility tests
        working-directory: wa_backend
        run: |
          python -m unittest -v tests.test_canonical_field_runtime_compatibility
          python -m unittest -v tests.test_canonical_field_runtime_compatibility_boundary
      - name: Diff whitespace gate
        run: git diff --check

name: Inventory CP7 Live Stock acceptance

on:
  pull_request:
    branches:
      - integration/inventory-wave-2
    paths:
      - "wa_backend/api/warehouse/live_stock.py"
      - "wa_backend/api/warehouse/live_stock_source_detail.py"
      - "wa_backend/api/warehouse/__init__.py"
      - "wa_backend/scripts/gate_warehouse_route_manifest.py"
      - "wa_backend/scripts/warehouse_route_manifest_extensions.json"
      - "wa_backend/tests/test_cp7_live_stock_contract.py"
      - "wa_backend/tests/test_cp7_live_stock_postgres.py"
      - "dashboard/src/pages/inventory/MainInventory.tsx"
      - "dashboard/src/pages/inventory/Tab1LiveStock.tsx"
      - "dashboard/src/pages/inventory/liveStock/**"
      - "dashboard/src/test/inventory-cp7-live-stock.test.tsx"
      - "dashboard/src/test/inventory-cp7-live-stock-parity.test.tsx"
      - ".github/workflows/inventory-cp7-live-stock-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp7-live-stock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: Cp7LiveStockFunctionalOnlyKeyAbc123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://cp7_unit@127.0.0.1:1/cp7_unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: CP7 focused backend acceptance
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_cp7_live_stock_contract.py
          tests/test_live_stock_batch_detail_disposition_contract.py
          tests/test_live_stock_canonical_cutover.py
      - name: CP1 no-lot and source regressions
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_inbound_lot_expiry_checkpoint1.py
          tests/test_batch_stock_sources_contract.py
          tests/test_batch_reservation_owner_contract.py
          -k "not test_operator_facing_serializers_use_central_public_batch_helper"
      - name: CP2 read-contract regression
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_inventory_batch_index_contract.py
          tests/test_inventory_batch_index_authorization.py
      - name: CP10 Ledger backend regression
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_cp10_ledger_backend.py
          tests/test_inbound_adjustments_canonical_auth_cutover.py
      - name: Warehouse route manifest
        working-directory: wa_backend
        run: python scripts/gate_warehouse_route_manifest.py
      - name: CP7 py_compile
        working-directory: wa_backend
        run: >-
          python -m py_compile
          api/warehouse/__init__.py
          api/warehouse/live_stock.py
          api/warehouse/live_stock_source_detail.py
          tests/test_cp7_live_stock_contract.py
          tests/test_cp7_live_stock_postgres.py

  postgres-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: Cp7LiveStockPostgresOnlyKeyAbc1234567890123456789012345
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_CP7_PG_GATE: "1"
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL acceptance dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Start disposable PostgreSQL 16
        run: |
          docker run --detach --name cp7-postgres \
            --env POSTGRES_USER=cp1_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec cp7-postgres pg_isready -U cp1_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs cp7-postgres
          exit 1
      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              if conn.execute("SELECT 1 FROM pg_roles WHERE rolname='wanasah_app'").fetchone() is None:
                  conn.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate disposable CP7 database
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Grant restricted runtime DML and seed test permissions
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
              conn.execute("INSERT INTO permissions(code) VALUES ('inventory.read'), ('inbound.create') ON CONFLICT(code) DO NOTHING")
          PY
      - name: CP7 real PostgreSQL isolation and SQL-count acceptance
        working-directory: wa_backend
        run: python -m pytest -q -s tests/test_cp7_live_stock_postgres.py

  dashboard-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: CP7 focused Dashboard acceptance
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-cp7-live-stock.test.tsx
          src/test/inventory-cp7-live-stock-parity.test.tsx
          --reporter=verbose
      - name: CP1 public batch/date regression
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-public-batch-number-parity.test.ts
          src/test/inventory-product-batch-date-parity.test.ts
          src/test/inventory-batch-disposition.test.ts
      - name: CP4 CP5 CP6 focused regressions
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-cp4-branch-dashboard.test.tsx
          src/test/cp5-product-location-dashboard.test.tsx
          src/test/cp5-product-location-modal.test.tsx
          src/test/inventory-cp6-minimum-stock-dashboard.test.tsx
      - name: CP10 Ledger Dashboard regression
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-cp10-ledger-dashboard.test.tsx
          src/test/inventory-cp10-ledger-contract.test.ts
          src/test/inventory-cp10-ledger-keyboard.test.tsx
      - name: TypeScript noEmit
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: Production Dashboard build
        working-directory: dashboard
        run: npm run build

  scope-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve dynamic wave merge-base
        id: base
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            base=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          else
            git fetch origin integration/inventory-wave-2
            base=$(git merge-base origin/integration/inventory-wave-2 HEAD)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "CP7_MERGE_BASE=$base"
      - name: Diff whitespace gate
        run: git diff --check "${{ steps.base.outputs.sha }}" HEAD --
      - name: Exact CP7 allowed-file scope
        env:
          CP7_BASE: ${{ steps.base.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          allowed = {
              ".github/workflows/inventory-cp7-live-stock-acceptance.yml",
              "wa_backend/api/warehouse/__init__.py",
              "wa_backend/api/warehouse/live_stock_source_detail.py",
              "wa_backend/scripts/gate_warehouse_route_manifest.py",
              "wa_backend/scripts/warehouse_route_manifest_extensions.json",
              "wa_backend/tests/test_cp7_live_stock_contract.py",
              "wa_backend/tests/test_cp7_live_stock_postgres.py",
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/Tab1LiveStock.tsx",
              "dashboard/src/pages/inventory/liveStock/i18n.ts",
              "dashboard/src/pages/inventory/liveStock/sourceContract.ts",
              "dashboard/src/pages/inventory/liveStock/useLiveStockBatchDetail.ts",
              "dashboard/src/pages/inventory/liveStock/BatchDetailPanel.tsx",
              "dashboard/src/pages/inventory/liveStock/LiveStockTable.tsx",
              "dashboard/src/pages/inventory/liveStock/LiveStockMobileCards.tsx",
              "dashboard/src/pages/inventory/liveStock/LiveStockFilters.tsx",
              "dashboard/src/pages/inventory/liveStock/LiveStockWarehouseContext.tsx",
              "dashboard/src/test/inventory-cp7-live-stock.test.tsx",
              "dashboard/src/test/inventory-cp7-live-stock-parity.test.tsx",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["CP7_BASE"], "HEAD", "--"],
              text=True,
          ).splitlines())
          if changed != allowed:
              raise SystemExit(
                  "CP7_SCOPE=FAIL\n"
                  f"missing={sorted(allowed - changed)}\n"
                  f"extra={sorted(changed - allowed)}"
              )
          forbidden = (
              "dashboard/src/pages/inventory/TabBatches.tsx",
              "dashboard/src/pages/products/",
              "dashboard/src/features/inventory/productLocations/",
              "wa_backend/api/warehouse/batch_index.py",
              "wa_backend/api/warehouse/transfers.py",
              "wa_backend/api/warehouse/stocktake.py",
              "wa_backend/alembic/versions/",
          )
          for path in changed:
              if any(path == prefix or path.startswith(prefix) for prefix in forbidden):
                  raise SystemExit(f"CP7_SCOPE=FAIL forbidden path: {path}")
          print(f"CP7_SCOPE=PASS files={len(changed)}")
          PY

name: TEMP Warehouse Transfers canonical gate

on:
  push:
    branches:
      - sol/warehouse-transfers-canonical-auth-cutover

jobs:
  focused-transfers:
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: test
      SECRET_KEY: TransfersLeadGateOnlyKey123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://transfer_unit@127.0.0.1:1/transfer_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://transfer_admin@127.0.0.1:1/transfer_unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: Compile transfer runtime and focused tests
        run: |
          python -m py_compile \
            wa_backend/api/warehouse/transfers.py \
            wa_backend/api/warehouse/transfer_policy.py \
            wa_backend/tests/test_warehouse_transfers_canonical_auth_cutover.py
      - name: Focused transfer canonical tests
        working-directory: wa_backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_warehouse_transfers_canonical_auth_cutover.py \
            tests/test_special_transfer_action_options.py \
            tests/test_canonical_backoffice_capability_access.py
      - name: Transfer forbidden-symbol audit
        run: |
          python - <<'PY'
          from pathlib import Path
          for relative in ('wa_backend/api/warehouse/transfers.py','wa_backend/api/warehouse/transfer_policy.py'):
              src = Path(relative).read_text(encoding='utf-8')
              for token in ('get_current_driver', 'get_current_admin', 'InventoryAccess', 'current_admin', '.is_admin', 'legacy_actor.company_id'):
                  assert token not in src, (relative, token)
              assert 'get_current_backoffice_capability_access' in src
          PY
      - name: Diff whitespace gate
        run: git diff --check 34f900d7b7859ec2d7789378b66380c3174017a9...HEAD

name: TEMP Commercial Policy canonical review

on:
  pull_request:
    branches:
      - lead/commercial-policy-canonical-review
  workflow_dispatch:

jobs:
  focused-test:
    name: CP ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: owner
            node: tests/test_commercial_policy_canonical_auth_cutover.py::CommercialPolicyCanonicalAuthCutoverTests::test_owner_uses_canonical_full_capability_semantics
          - name: ordinary-grant
            node: tests/test_commercial_policy_canonical_auth_cutover.py::CommercialPolicyCanonicalAuthCutoverTests::test_ordinary_company_grant_can_read
          - name: maker-checker
            node: tests/test_commercial_policy_canonical_auth_cutover.py::CommercialPolicyCanonicalAuthCutoverTests::test_publish_requires_manage_and_approve
          - name: read-boundary
            node: tests/test_commercial_policy_canonical_auth_cutover.py::CommercialPolicyCanonicalAuthCutoverTests::test_read_route_is_driver_free_and_uses_canonical_company
          - name: publish-provenance
            node: tests/test_commercial_policy_canonical_auth_cutover.py::CommercialPolicyCanonicalAuthCutoverTests::test_publish_uses_both_capabilities_and_mapped_driver_only_for_provenance
          - name: forbidden-authority
            node: tests/test_commercial_policy_canonical_auth_cutover.py::CommercialPolicyCanonicalAuthCutoverTests::test_no_legacy_authority_or_identity_alias_assumption
          - name: tenant-isolation
            node: tests/test_commercial_policy_canonical_auth_cutover.py::CommercialPolicyCanonicalAuthCutoverTests::test_cross_company_isolation_comes_from_canonical_access
          - name: business-contracts
            node: tests/test_commercial_policy_canonical_auth_cutover.py::CommercialPolicyCanonicalAuthCutoverTests::test_business_idempotency_audit_and_error_contracts_are_preserved
          - name: independent-ids
            node: tests/test_commercial_policy_canonical_auth_cutover.py::CommercialPolicyCanonicalAuthCutoverTests::test_independent_identity_ids_and_driver_admin_flag_are_irrelevant
    defaults:
      run:
        working-directory: wa_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wa_backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q "${{ matrix.node }}"

  structural-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wa_backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile api/commercial_policy.py tests/test_commercial_policy_canonical_auth_cutover.py
      - run: pytest -q tests/test_canonical_backoffice_capability_access.py
      - name: Authority and capability audit
        shell: bash
        run: |
          set -euo pipefail
          f=api/commercial_policy.py
          ! grep -nE 'get_current_driver|get_current_admin|InventoryAccess|\.is_admin|actor\.company_id|legacy_actor\.company_id' "$f"
          test "$(grep -o 'get_current_backoffice_legacy_driver' "$f" | wc -l)" -eq 2
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('api/commercial_policy.py').read_text()
          assert set(re.findall(r"['\"](pricing\.[a-z]+)['\"]", src)) == {'pricing.view','pricing.manage','pricing.approve'}
          PY

name: TEMP Commercial Policy canonical review

on:
  pull_request:
    branches:
      - lead/commercial-policy-canonical-review
  workflow_dispatch:

env:
  SECRET_KEY: "WanasahCommercialPolicyReview2026TestKeyA1b2C3d4E5f6"
  DATABASE_URL: "postgresql+asyncpg://wanasah_test:wanasah_test@127.0.0.1:5432/wanasah_test"

jobs:
  focused-test:
    name: CP ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: owner
            method: test_owner_uses_canonical_full_capability_semantics
          - name: ordinary-grant
            method: test_ordinary_company_grant_can_read
          - name: maker-checker
            method: test_publish_requires_manage_and_approve
          - name: read-boundary
            method: test_read_route_is_driver_free_and_uses_canonical_company
          - name: publish-provenance
            method: test_publish_uses_both_capabilities_and_mapped_driver_only_for_provenance
          - name: forbidden-authority
            method: test_no_legacy_authority_or_identity_alias_assumption
          - name: tenant-isolation
            method: test_cross_company_isolation_comes_from_canonical_access
          - name: business-contracts
            method: test_business_idempotency_audit_and_error_contracts_are_preserved
          - name: independent-ids
            method: test_independent_identity_ids_and_driver_admin_flag_are_irrelevant
    defaults:
      run:
        working-directory: wa_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wa_backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: >-
          python -m unittest -q
          tests.test_commercial_policy_canonical_auth_cutover.CommercialPolicyCanonicalAuthCutoverTests.${{ matrix.method }}

  structural-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wa_backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile api/commercial_policy.py tests/test_commercial_policy_canonical_auth_cutover.py
      - run: python -m unittest -q tests.test_canonical_backoffice_capability_access
      - name: Authority and capability audit
        shell: bash
        run: |
          set -euo pipefail
          f=api/commercial_policy.py
          ! grep -nE 'get_current_driver|get_current_admin|InventoryAccess|\.is_admin|actor\.company_id|legacy_actor\.company_id' "$f"
          test "$(grep -o 'get_current_backoffice_legacy_driver' "$f" | wc -l)" -eq 2
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('api/commercial_policy.py').read_text()
          assert set(re.findall(r"['\"](pricing\.[a-z]+)['\"]", src)) == {'pricing.view','pricing.manage','pricing.approve'}
          PY

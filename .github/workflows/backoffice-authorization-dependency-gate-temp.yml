name: TEMP canonical Backoffice authorization dependency gate

on:
  push:
    branches:
      - sol/canonical-backoffice-authorization-dependency

permissions:
  contents: read

jobs:
  focused-backoffice-authorization-dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: BackofficeAuthorizationDependencyGateOnlyKey123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://backoffice_unit@127.0.0.1:1/backoffice_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://backoffice_admin@127.0.0.1:1/backoffice_unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt
      - name: Canonical Backoffice authorization dependency tests
        working-directory: wa_backend
        run: python -m unittest -v tests.test_canonical_backoffice_authorization_dependency
      - name: Diff whitespace gate
        run: git diff --check

name: Supplier V1 acceptance
on:
  pull_request:
    paths:
      - "wa_backend/**"
      - "dashboard/**"
      - ".github/workflows/suppliers-v1.yml"
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: supplier_gate
          POSTGRES_DB: supplier_master_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supplier_gate -d supplier_master_gate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: SupplierGateTestOnlyKeyAbc1234567890123456789012
      DATABASE_URL: postgresql+asyncpg://supplier_runtime@127.0.0.1:5432/supplier_master_gate
      DATABASE_URL_MIGRATION: postgresql+asyncpg://supplier_gate@127.0.0.1:5432/supplier_master_gate
      WANASAH_SUPPLIER_DB_GATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install backend and test dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Supplier database acceptance and affected regressions
        working-directory: wa_backend
        run: python -m pytest -q tests/test_supplier_master_db.py tests/test_supplier_module_boundaries.py tests/test_whole_product_quality_global_contract.py tests/test_whole_product_quality_direct_stage.py tests/test_terminal_quality_workflow_chain.py tests/test_whole_product_quality_stage4_legacy_fifo.py
      - name: Locked frontend dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Focused frontend acceptance
        working-directory: dashboard
        run: npm test -- src/test/suppliers-v1.test.tsx src/test/quality-safety-v1-closure.test.ts src/test/whole-product-quality-preview.test.ts src/test/catalog-inventory-boundary.test.ts
      - name: Unmodified main baseline for TypeScript
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir baseline
          git archive --format=tar --output=baseline.tar "$BASE_SHA" dashboard
          tar -xf baseline.tar -C baseline
      - name: Reject new TypeScript diagnostics
        working-directory: dashboard
        run: node scripts/check-types-against-baseline.mjs ../baseline/dashboard
      - name: Affected frontend lint
        working-directory: dashboard
        run: npx eslint src/features/suppliers src/pages/suppliers src/i18n/suppliers.ts src/pages/inventory/inbound/useInboundPosting.ts src/features/inventory/quality/useProductQualityCommands.ts src/features/inventory/quality/wholeProductQualityResolveContract.ts src/features/inventory/quality/WholeProductQualityActionsPanel.tsx src/pages/inventory/Tab2Inbound.tsx src/pages/inventory/Tab4Ledger.tsx src/pages/inventory/TabInventoryAccess.tsx src/pages/inventory/ledger/contracts.ts src/pages/inventory/inbound/contracts.ts src/App.tsx src/components/operations/OperationsSidebar.tsx src/i18n/resources.ts src/test/suppliers-v1.test.tsx
      - name: Production build
        working-directory: dashboard
        run: npm run build
      - name: Diff whitespace gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD

name: Live Stock R1 PostgreSQL integrity proof

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/api/warehouse/live_stock.py"
      - "wa_backend/tests/live_stock_r1_support.py"
      - "wa_backend/tests/test_live_stock_r1_*_postgres.py"
      - ".github/workflows/live-stock-r1-integrity-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-proof:
    name: R1 ${{ matrix.part }} PostgreSQL gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        part: [movement, snapshot, sql, cp7]
    env:
      ENVIRONMENT: test
      SECRET_KEY: R1IsolatedPostgresOnlyKeyAbc1234567890123456789012345
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_R1_PG_GATE: "1"
      WANASAH_CP7_PG_GATE: "1"
      WANASAH_R1_SCALE_PRODUCTS: "50000"
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce authorized R1 runtime scope and preserve F1
        env:
          R1_BASE: ${{ github.event.pull_request.base.sha || 'c0fe0187dbf326e9852e789fd2c38262ab648052' }}
        run: |
          python - <<'PY'
          import ast
          import os
          import subprocess
          from pathlib import Path
          base = subprocess.check_output(
              ["git", "merge-base", os.environ["R1_BASE"], "HEAD"], text=True).strip()
          allowed = {
              "wa_backend/api/warehouse/live_stock.py",
              "wa_backend/tests/live_stock_r1_support.py",
              "wa_backend/tests/test_live_stock_r1_movement_postgres.py",
              "wa_backend/tests/test_live_stock_r1_snapshot_postgres.py",
              "wa_backend/tests/test_live_stock_r1_sql_postgres.py",
              ".github/workflows/live-stock-r1-integrity-proof.yml",
              "docs/operations/LIVE_STOCK_R1_PROOF.md",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          assert changed <= allowed, f"Unauthorized files: {changed - allowed}"
          assert not subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=D", base, "HEAD"], text=True).strip()
          path = "wa_backend/api/warehouse/live_stock.py"
          old = ast.parse(subprocess.check_output(["git", "show", f"{base}:{path}"], text=True))
          new = ast.parse(Path(path).read_text(encoding="utf-8"))
          def immutable_nodes(tree):
              return [ast.dump(node, include_attributes=False) for node in tree.body
                      if not isinstance(node, ast.AsyncFunctionDef)
                      or node.name != "get_warehouse_inventory"]
          assert immutable_nodes(old) == immutable_nodes(new), "F1 or another runtime seam changed"
          print("R1_SCOPE=PASS", sorted(changed))
          PY
      - name: Install focused test dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio
      - name: Compile only R1 test files
        working-directory: wa_backend
        run: >-
          python -m py_compile tests/live_stock_r1_support.py
          tests/test_live_stock_r1_movement_postgres.py
          tests/test_live_stock_r1_snapshot_postgres.py
          tests/test_live_stock_r1_sql_postgres.py
          api/warehouse/live_stock.py
      - name: Start ephemeral PostgreSQL 16 on this hosted runner
        run: |
          docker run --detach --name r1-postgres \
            --env POSTGRES_USER=cp1_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec r1-postgres pg_isready -U cp1_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs r1-postgres
          exit 1
      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate only the disposable database
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Grant runtime DML and synthetic fixture permissions
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
              conn.execute("INSERT INTO permissions(code) VALUES ('inventory.read'), ('inbound.create') ON CONFLICT(code) DO NOTHING")
          PY
      - name: Run real PostgreSQL R1 ${{ matrix.part }} tests
        working-directory: wa_backend
        env:
          R1_PART: ${{ matrix.part }}
        run: |
          if [ "$R1_PART" = "cp7" ]; then
            python -B -m pytest -p no:cacheprovider -q -s tests/test_cp7_live_stock_postgres.py --junitxml=r1-cp7.xml
          else
            python -B -m pytest -p no:cacheprovider -q -s "tests/test_live_stock_r1_${R1_PART}_postgres.py" --junitxml="r1-${R1_PART}.xml"
          fi
      - name: Retain test evidence even when the integrity gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-${{ matrix.part }}-${{ github.sha }}
          path: |
            wa_backend/r1-${{ matrix.part }}.xml
            wa_backend/r1-query-plans-*.json
          if-no-files-found: warn

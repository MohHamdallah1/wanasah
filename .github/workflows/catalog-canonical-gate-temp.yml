name: TEMP Catalog canonical gate

on:
  push:
    branches:
      - codex/catalog-canonical-auth-cutover

jobs:
  focused-catalog:
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: test
      SECRET_KEY: CatalogLeadGateOnlyKey123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://catalog_unit@127.0.0.1:1/catalog_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://catalog_admin@127.0.0.1:1/catalog_unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: Compile Catalog runtime and focused tests
        run: |
          python -m py_compile \
            wa_backend/api/catalog.py \
            wa_backend/tests/test_catalog_canonical_boundary.py \
            wa_backend/tests/test_catalog_canonical_cutover.py \
            wa_backend/tests/test_archive_owner_navigation.py \
            wa_backend/tests/test_recall_readiness_contract.py
      - name: Focused Catalog canonical tests
        working-directory: wa_backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_catalog_canonical_boundary.py \
            tests/test_catalog_canonical_cutover.py \
            tests/test_archive_navigation_canonical_access.py \
            tests/test_archive_owner_navigation.py \
            tests/test_recall_readiness_contract.py \
            tests/test_catalog_recall_cancel_guard.py \
            tests/test_canonical_backoffice_capability_access.py
      - name: Catalog forbidden-symbol audit
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('wa_backend/api/catalog.py').read_text(encoding='utf-8')
          for token in ('get_current_driver', 'get_current_admin', 'InventoryAccess', '.is_admin', 'legacy_actor.company_id', 'actor.company_id'):
              assert token not in src, token
          assert 'get_current_backoffice_capability_access' in src
          PY
      - name: Diff whitespace gate
        run: git diff --check acd9ca5f0c2da588b6ae2a3f33202b914a61949b...HEAD

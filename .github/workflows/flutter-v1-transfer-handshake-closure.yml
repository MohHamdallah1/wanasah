name: Flutter V1 Transfer Handshake Closure

on:
  push:
    branches:
      - sol/flutter-v1-transfer-handshake-closure
  workflow_dispatch:
  pull_request:
    paths:
      - "wanasah_frontend/lib/features/custody/**"
      - "wanasah_frontend/lib/blocs/dashboard/dashboard_bloc.dart"
      - "wanasah_frontend/test/features/custody/**"
      - "wanasah_frontend/lib/core/db/local_database.dart"
      - "wanasah_frontend/lib/repositories/sync_repository.dart"
      - "wanasah_frontend/pubspec.yaml"
      - "wanasah_frontend/pubspec.lock"
      - ".github/workflows/flutter-v1-transfer-handshake-closure.yml"

permissions:
  contents: read

jobs:
  transfer-handshake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Prepare CI-only environment asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Transfer handshake focused and regression tests
        run: >-
          flutter test
          test/features/custody/transfer_handshake_closure_test.dart
          test/features/custody/canonical_transfer_uom_test.dart
          test/features/custody/canonical_transfer_sqlite_test.dart
          test/features/custody/custody_behavioral_closure_test.dart
          test/features/custody/domain/custody_contracts_test.dart
          test/offline_durable_command_test.dart
          test/features/recovery/recovery_behavioral_closure_test.dart
          test/features/session_custody_decomposition_test.dart

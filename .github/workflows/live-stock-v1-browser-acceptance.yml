name: Live Stock V1 Chromium browser acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/e2e/live-stock-v1.*.ts"
      - ".github/workflows/live-stock-v1-browser-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-v1-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-browser-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Install disposable Playwright Chromium
        working-directory: dashboard
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Application TypeScript and explicit Playwright test typecheck
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --types node --lib es2022,dom e2e/live-stock-v1.config.ts e2e/live-stock-v1.fixtures.ts e2e/live-stock-v1.spec.ts
      - name: Build actual Dashboard
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174/api
        run: npm run build
      - name: Start isolated built-app preview
        working-directory: dashboard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/live-stock-v1-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/inventory >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-stock-v1-preview.log
          exit 1
      - name: Chromium Live Stock V1 user journeys
        working-directory: dashboard
        run: npx playwright test --config e2e/live-stock-v1.config.ts
      - name: Upload red-case traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-v1-browser-failures
          path: dashboard/node_modules/.cache/live-stock-v1-browser
          if-no-files-found: warn
      - name: Verify bounded PR browser scope and whitespace
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, urllib.request
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_ref = os.environ["BASE"]
          assert re.fullmatch(r"[0-9a-f]{40}", head) and re.fullmatch(r"[0-9a-f]{40}", base_ref)
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{base_ref}...{head}",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              base = json.load(response)["merge_base_commit"]["sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", base)
          subprocess.run(["git", "cat-file", "-e", base + "^{commit}"], check=True)
          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          allowed = [".github/scripts/live_stock_ci_ownership.py",".github/workflows/inventory-cp13-shell-polish.yml",".github/workflows/inventory-cp2-batch-index-acceptance.yml",".github/workflows/inventory-cp6-minimum-stock-dashboard-acceptance.yml",".github/workflows/live-stock-inflight-authority-acceptance.yml",".github/workflows/live-stock-physical-custody-consumers.yml",".github/workflows/live-stock-r4-final-performance.yml",".github/workflows/live-stock-v1-browser-acceptance.yml",".github/workflows/live-stock-v1-operational-browser.yml",".github/workflows/live-stock-v1-ux-closure.yml","dashboard/e2e/inventory-cp14-device-ux.spec.ts","dashboard/e2e/live-stock-physical-custody.config.ts","dashboard/e2e/live-stock-physical-custody.fixture.py","dashboard/e2e/live-stock-physical-custody.spec.ts","dashboard/e2e/live-stock-ux-closure.fixtures.ts","dashboard/e2e/live-stock-v1.config.ts","dashboard/e2e/live-stock-v1.fixtures.ts","dashboard/e2e/live-stock-v1.spec.ts","dashboard/src/App.tsx","dashboard/src/components/operations/DashboardLayout.tsx","dashboard/src/i18n/resources.ts","dashboard/src/pages/inventory/MainInventory.tsx","dashboard/src/pages/inventory/StockMinimumManager.tsx","dashboard/src/pages/inventory/Tab1LiveStock.tsx","dashboard/src/pages/inventory/liveStock/BatchDetailPanel.tsx","dashboard/src/pages/inventory/liveStock/LiveStockMobileCards.tsx","dashboard/src/pages/inventory/liveStock/LiveStockTable.tsx","dashboard/src/pages/inventory/liveStock/VehicleCustodyQuantity.tsx","dashboard/src/pages/inventory/liveStock/contracts.ts","dashboard/src/pages/inventory/liveStock/i18n.ts","dashboard/src/pages/inventory/liveStock/sourceContract.ts","dashboard/src/pages/inventory/liveStock/useLiveStockBatchDetail.ts","dashboard/src/test/auth-session-page-boundary.test.tsx","dashboard/src/test/inventory-access.test.ts","dashboard/src/test/inventory-cp6-minimum-stock-dashboard.test.tsx","dashboard/src/test/inventory-cp7-live-stock-parity.test.tsx","dashboard/src/test/inventory-cp7-live-stock.test.tsx","dashboard/src/test/live-stock-local-failure.test.tsx","dashboard/src/test/live-stock-render-performance.benchmark.test.tsx","dashboard/src/test/live-stock-render-windowing.test.tsx","dashboard/src/test/live-stock-ui-stability.test.ts","dashboard/src/test/live-stock-ui01-canonical-alert.test.tsx","dashboard/src/test/live-stock-warehouse-discovery.test.tsx","dashboard/src/test/live-stock-warm-authority.test.tsx","wa_backend/api/warehouse/live_stock_source_detail.py","wa_backend/scripts/warehouse_route_manifest_extensions.json","wa_backend/tests/test_cp7_live_stock_postgres.py"]
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          assert changed <= set(allowed), sorted(changed - set(allowed))
          print("LIVE_STOCK_V1_BROWSER_SCOPE=PASS", base, len(changed))
          PY

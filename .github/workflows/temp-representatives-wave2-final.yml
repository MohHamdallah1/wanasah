name: TEMP Representatives Wave 2 Final

on:
  push:
    branches: [sol/representatives-lifecycle-credentials]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: test
      SECRET_KEY: RepresentativesWave2FinalSecret0123456789ABCDEF
      DATABASE_URL: postgresql+asyncpg://wanasah_test:wanasah_test@127.0.0.1:5432/wanasah_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://wanasah_test:wanasah_test@127.0.0.1:5432/wanasah_test
      PYTHONPATH: ${{ github.workspace }}/wa_backend/tests:${{ github.workspace }}/wa_backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest

      - name: Compile representatives
        run: |
          python -m compileall -q wa_backend/domains/representatives wa_backend/api/representatives wa_backend/tests/test_representatives_lifecycle_credentials.py wa_backend/tests/test_representatives_management_idempotency_symmetry.py

      - name: Focused representatives Wave 2
        working-directory: wa_backend
        run: |
          python -m pytest -q \
            tests/test_representatives_lifecycle_credentials.py \
            tests/test_representatives_management_idempotency_symmetry.py

      - name: Canonical auth session regressions
        working-directory: wa_backend
        run: |
          python -m pytest -q \
            tests/test_principal_session_invalidation.py \
            tests/test_auth_session_token_contract.py \
            tests/test_principal_refresh_sessions.py

      - name: Diff check
        run: git diff --check c86afa5b97df3d7d6b8c1ed2737e93125e7564b5...HEAD

name: Temporary representatives credit policy inspection

on:
  push:
    branches:
      - sol/representatives-credit-policy-ui-finalization
    paths:
      - ".github/workflows/representatives-credit-policy-inspect-temp.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect backend model and dashboard tests
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MODEL DEFINITIONS ==='
          for cls in Company Driver Shop; do
            line="$(grep -n "^class ${cls}(Base)" wa_backend/models.py | cut -d: -f1 | head -n1)"
            echo "--- ${cls} @ ${line} ---"
            sed -n "${line},$((line+95))p" wa_backend/models.py
          done
          echo '=== REPRESENTATIVE REPOSITORY CREDIT WRITES ==='
          grep -n -C 12 "can_allow_debt\|max_debt_limit" wa_backend/domains/representatives/repository.py | head -n 260 || true
          echo '=== REPRESENTATIVE FORM TEST ==='
          cat dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.test.tsx
          echo '=== PAGE TEST ==='
          cat dashboard/src/pages/representatives-vehicles/RepresentativesVehiclesPage.test.tsx
          echo '=== DRAWER CREDIT SECTION ==='
          grep -n -C 5 "debtPermission\|debtLimit" dashboard/src/pages/representatives-vehicles/representatives/RepresentativeDrawer.tsx || true

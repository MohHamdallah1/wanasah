name: Temporary representatives credit policy plan update

on:
  push:
    branches:
      - sol/representatives-credit-policy-ui-finalization
    paths:
      - ".github/workflows/representatives-credit-policy-inspect-temp.yml"

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/representatives-credit-policy-ui-finalization
          fetch-depth: 0
      - name: Document frozen proven credit semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('REPRESENTATIVES_VEHICLES_V1_PLAN.md')
          source = path.read_text(encoding='utf-8')
          marker = '''- [x] Representative audit/security acceptance merged; mutation audit atomicity, replay behavior, tenant isolation, secret redaction, and bcrypt traceback redaction are proven.\n\nStill pending before Representatives owner-complete gate:\n'''
          replacement = '''- [x] Representative audit/security acceptance merged; mutation audit atomicity, replay behavior, tenant isolation, secret redaction, and bcrypt traceback redaction are proven.\n\nFinal Representative credit-policy closure validated on the acceptance branch (pending merge):\n\n- [x] `FieldRepresentative.can_allow_debt` is the authoritative switch for whether a Representative may create any new credit sale.\n- [x] `FieldRepresentative.max_debt_limit` is the maximum **new credit amount in one sale transaction**; it is not daily, monthly, cumulative, or auto-resetting.\n- [x] `Shop.max_debt_limit` remains the independent **cumulative outstanding receivable ceiling** for that Shop.\n- [x] Every new-credit decision requires **both** the canonical Representative guard and the locked current Shop guard to pass.\n- [x] Credit policy has **no daily reset**; persisted canonical Representative policy is re-read for each new-credit decision so disable/limit changes take effect on the next attempt without FIELD re-login.\n- [x] Legacy `Driver.id` is only an operational locator through the company-scoped `FIELD_ONLY` mapping; legacy Driver credit flags/limits are not financial-policy authority.\n\nStill pending before Representatives owner-complete gate:\n'''
          if marker not in source:
              raise SystemExit('plan insertion marker not found')
          source = source.replace(marker, replacement, 1)
          path.write_text(source, encoding='utf-8')
          PY
          grep -F 'maximum **new credit amount in one sale transaction**' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          grep -F 'cumulative outstanding receivable ceiling' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          grep -F 'no daily reset' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          grep -F 'OWNER UI ACCEPTANCE PENDING; VEHICLES NOT STARTED' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          grep -F 'Vehicles implementation — **NOT STARTED**' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          git diff --check
      - name: Commit plan update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPRESENTATIVES_VEHICLES_V1_PLAN.md
          git commit -m "docs: freeze representative credit policy semantics"
          git push origin HEAD:sol/representatives-credit-policy-ui-finalization

name: Temporary representatives credit policy final closure gate

on:
  push:
    branches:
      - sol/representatives-credit-policy-ui-finalization
    paths:
      - ".github/workflows/representatives-credit-policy-inspect-temp.yml"

permissions:
  contents: read

jobs:
  final-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_SHA: 1b0cfcbd378954ea022f5985cf495f481d0292a2
      BASE_SHA: 4ead45c05ced5a004d766ec5b3bcd7ea6a74ad12
    steps:
      - name: Checkout exact final source
        uses: actions/checkout@v4
        with:
          ref: 1b0cfcbd378954ea022f5985cf495f481d0292a2
          fetch-depth: 0
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Representatives focused tests including RTL/LTR
        working-directory: dashboard
        run: npx vitest run src/pages/representatives-vehicles
      - name: Affected ESLint
        working-directory: dashboard
        run: >-
          npx eslint
          src/pages/representatives-vehicles
          src/i18n/representativesVehicles.ts
      - name: Frozen plan assertions
        run: |
          grep -F 'maximum **new credit amount in one sale transaction**' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          grep -F 'cumulative outstanding receivable ceiling' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          grep -F 'both** the canonical Representative guard and the locked current Shop guard' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          grep -F 'no daily reset' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          grep -F 'OWNER UI ACCEPTANCE PENDING; VEHICLES NOT STARTED' REPRESENTATIVES_VEHICLES_V1_PLAN.md
          grep -F 'Vehicles implementation — **NOT STARTED**' REPRESENTATIVES_VEHICLES_V1_PLAN.md
      - name: Final source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('wa_backend/services.py').read_text(encoding='utf-8')
          start = source.index('async def check_debt_limits(')
          end = source.index('\nclass InventoryMutationError', start)
          block = source[start:end]
          assert 'select(Driver)' not in block
          assert 'Driver.can_allow_debt' not in block
          assert 'driver.can_allow_debt' not in block
          assert 'driver.max_debt_limit' not in block
          assert 'float(' not in block
          assert 'IdentityLegacyDriverMap.classification == "FIELD_ONLY"' in block
          assert 'representative.can_allow_debt' in block
          assert 'representative.max_debt_limit' in block
          assert 'CompanyPrincipal.is_active.is_(True)' in block
          page = Path('dashboard/src/pages/representatives-vehicles/RepresentativesVehiclesPage.tsx').read_text(encoding='utf-8')
          assert page.index('<WorkspaceTopBar') < page.index('role="tablist"') < page.index('</WorkspaceTopBar>')
          assert 'disabled' in page[page.index('role="tablist"'):page.index('</WorkspaceTopBar>')]
          assert 'VehiclesTab' not in page
          PY
      - name: Diff whitespace gate
        run: git diff --check "$BASE_SHA" "$TARGET_SHA"
      - name: Final pre-cleanup scope gate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/representatives-credit-policy-inspect-temp\.yml|REPRESENTATIVES_VEHICLES_V1_PLAN\.md|wa_backend/services\.py|wa_backend/tests/test_representative_credit_policy_runtime_db\.py|dashboard/src/i18n/representativesVehicles\.ts|dashboard/src/pages/representatives-vehicles/RepresentativesVehiclesPage\.tsx|dashboard/src/pages/representatives-vehicles/RepresentativesVehiclesPage\.test\.tsx|dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm\.tsx|dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm\.test\.tsx|dashboard/src/pages/representatives-vehicles/representatives/RepresentativeTable\.tsx|dashboard/src/pages/representatives-vehicles/representatives/RepresentativeTable\.test\.tsx)$' || true)"
          test -z "$unexpected"
          ! printf '%s\n' "$changed" | grep -E '^wanasah_frontend/'
          ! printf '%s\n' "$changed" | grep -E '^wa_backend/(api/driver\.py|api/dispatch\.py|alembic/)'
          echo REPRESENTATIVES_CREDIT_FINAL_SCOPE=PASS

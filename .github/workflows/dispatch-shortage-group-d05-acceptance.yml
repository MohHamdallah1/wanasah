name: Dispatch Shortage Group D05 PG16 Bearer acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/main.py"
      - "wa_backend/api/dispatch_shortages_group.py"
      - "wa_backend/domains/dispatch_shortages_group.py"
      - "wa_backend/domains/dispatch_shortage_visits.py"
      - "wa_backend/domains/dispatch_shop_finance_fence.py"
      - "wa_backend/tests/test_dispatch_shortages_group_v1_postgres.py"
      - ".github/workflows/dispatch-shortage-group-d05-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortage-group-d05-exact-pg16:
    name: shortage-group-d05-pg16-real-bearer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ENVIRONMENT: test
      SECRET_KEY: Dispatch842FinanceDedicatedTestKey01234567890123456
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_DISPATCH_P0_PG_GATE: "1"
      WANASAH_SHORTAGE_GROUP_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify #849 exact approved base and immutable file ownership
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python - <<'PY'
          import subprocess, os
          base = "0e03d3423dd4773e694d386073fb214c7082e0d6"
          subprocess.run(["git", "cat-file", "-e", base + "^{commit}"], check=True)
          assert subprocess.check_output(
              ["git", "merge-base", base, "HEAD"], text=True
          ).strip() == base, "Audit must descend from owner-approved exact MAIN"
          files = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines())
          allowed = {
              "wa_backend/main.py",
              "wa_backend/api/dispatch_shortages_group.py",
              "wa_backend/domains/dispatch_shortages_group.py",
              "wa_backend/domains/dispatch_shortage_visits.py",
              "wa_backend/tests/test_dispatch_shortages_group_v1_postgres.py",
              ".github/workflows/dispatch-shortage-group-d05-acceptance.yml",
          }
          # D11 is a complete, separate owner-reviewed launch safety surface.
          # Admit ONLY its 16 exact files against the current PR base; retain
          # the frozen #849 ancient-base requirement for EVERY other PR.
          d11_exact = {
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/dispatch-d11-commercial-preflight.yml",
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              ".github/workflows/dispatch-route-launch-d07-acceptance.yml",
              ".github/workflows/dispatch-shortage-group-d05-acceptance.yml",
              ".github/workflows/live-stock-g04-outage-recovery.yml",
              ".github/workflows/live-stock-inflight-authority-acceptance.yml",
              "dashboard/src/features/dispatch/commercialPreflight/CommercialPreflightPanel.tsx",
              "dashboard/src/features/dispatch/commercialPreflight/contract.ts",
              "dashboard/src/features/dispatch/commercialPreflight/useCommercialPreflight.ts",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/test/dispatch-d11-commercial-preflight.test.tsx",
              "dashboard/src/test/dispatch-route-launch-d07.test.tsx",
              "wa_backend/api/dispatch_commercial_preflight.py",
              "wa_backend/main.py",
              "wa_backend/tests/test_dispatch_commercial_preflight_d11_postgres.py",
          }
          assert len(d11_exact) == 16
          pr_files = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["PR_BASE"], "HEAD"], text=True,
          ).splitlines())
          # #1058 final signed release only: exact 48-file integration delta,
          # including this workflow; no wildcard, no historic #849 bypass.
          # Keep #849/D11 scope checks for every other PR.
          from pathlib import Path
          import ast
          owner_policy = ast.parse(Path(".github/scripts/live_stock_ci_ownership.py").read_text())
          release_items = {
              ".github/scripts/live_stock_ci_ownership.py",
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              ".github/workflows/dispatch-route-launch-d07-acceptance.yml",
              ".github/workflows/dispatch-shop-create-f06-acceptance.yml",
              ".github/workflows/dispatch-shop-finance-p0-acceptance.yml",
              ".github/workflows/live-stock-inflight-authority-acceptance.yml",
              ".github/workflows/dispatch-shortage-group-d05-acceptance.yml",
              ".github/workflows/flutter-v1-field-seams-client-adapters.yml",
              "dashboard/src/components/dispatch/ShortageModal.tsx",
              "dashboard/src/components/dispatch/ShortageProductPicker.tsx",
              "dashboard/src/components/dispatch/ShortageRequestComposer.tsx",
              "dashboard/src/features/dispatch/dispatchDrafts.ts",
              "dashboard/src/features/dispatch/dispatchUiText.ts",
              "dashboard/src/features/dispatch/shortageCommand/contract.ts",
              "dashboard/src/features/dispatch/shortageCommand/useShortageCommandCommit.ts",
              "dashboard/src/features/dispatch/useDispatchProductSearch.ts",
              "dashboard/src/features/dispatch/useShortageVehicleAvailability.ts",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/test/dispatch-d10-drafts.test.ts",
              "dashboard/src/test/dispatch-shortage-command-1068.test.tsx",
              "dashboard/src/test/dispatch-shortage-group-recovery-v1.test.tsx",
              "dashboard/src/test/dispatch-shortage-partial-uom-1060.test.tsx",
              "dashboard/src/test/dispatch-shortage-vehicle-availability-1057.test.tsx",
              "dashboard/src/test/dispatch-urgent-quick-composer-v1.test.tsx",
              "wa_backend/alembic/versions/ae106700b221_shortage_demand_partial_evidence.py",
              "wa_backend/api/dispatch.py",
              "wa_backend/api/dispatch_product_schemas.py",
              "wa_backend/api/dispatch_shortage_availability.py",
              "wa_backend/api/dispatch_shortage_commands.py",
              "wa_backend/api/dispatch_shortages_group.py",
              "wa_backend/api/driver.py",
              "wa_backend/domains/dispatch_product_discovery.py",
              "wa_backend/domains/dispatch_shortage_fulfillment.py",
              "wa_backend/domains/dispatch_shortage_selected_stock.py",
              "wa_backend/domains/dispatch_shortage_visits.py",
              "wa_backend/domains/dispatch_shortages_group.py",
              "wa_backend/models.py",
              "wa_backend/schemas.py",
              "wa_backend/services.py",
              "wa_backend/tests/test_dispatch_shortage_base_uom_1062.py",
              "wa_backend/tests/test_dispatch_shortage_phase_b_pg16.py",
              "wa_backend/tests/test_dispatch_shortage_selected_stock_1071_pg16.py",
              "wa_backend/tests/test_dispatch_shortage_vehicle_availability.py",
              "wa_backend/tests/test_dispatch_shortage_vehicle_availability_pg16.py",
              "wa_backend/tests/test_dispatch_shortages_group_v1_postgres.py",
              "wa_backend/tests/test_driver_session_field_context_cutover.py",
              "wa_backend/tests/test_legacy_field_transport_boundary.py",
              "wanasah_frontend/test/features/visits/list/shortage_pending_not_field_visit_1068_test.dart",
          }
          assert len(release_items) == 48
          def exact_release(candidate):
              return candidate == release_items
          assert exact_release(release_items)
          for missing in release_items:
              assert not exact_release(release_items - {missing})
          for foreign in ("wa_backend/api/warehouse.py", "wanasah_frontend/lib/main.dart"):
              assert not exact_release(release_items | {foreign})
          if pr_files == release_items and os.environ["PR_BASE"] == "9460f6b8568bf118ff2e0ae30922bf0288a39183":
              print("D05_INTEGRATED_RELEASE_EXACT=PASS files=48 missing=48 foreign=2; original #849 intact")
          elif pr_files == d11_exact:
              print("D11_D05_CROSS_OWNER=PASS exact=16 original #849 unchanged")
          else:
              assert files and files <= allowed, f"Worker 1 #849 scope violated: {sorted(files - allowed)}"
          print(f"EXACT_APPROVED_BASE={base}")
          print("EXACT_TEST_HEAD=" + subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip())
          print("WORKER1_SCOPE_FILES=" + ", ".join(sorted(files)))
          PY
          git diff --check 0e03d3423dd4773e694d386073fb214c7082e0d6 HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused backend test requirements
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Reproduce original exact-main HTTP 405 against baseline ASGI app
        run: |
          mkdir -p "$RUNNER_TEMP/dispatch-849-before"
          git archive 1a74f15db7df87f2c74a2b451af41c91b15725ed wa_backend | tar -x -C "$RUNNER_TEMP/dispatch-849-before"
          cd "$RUNNER_TEMP/dispatch-849-before/wa_backend"
          python - <<'PY'
          import asyncio
          from uuid import uuid4
          import httpx
          from main import app

          async def verify_before():
              transport = httpx.ASGITransport(app=app, raise_app_exceptions=False)
              async with httpx.AsyncClient(transport=transport, base_url="http://dispatch-849-before.test") as client:
                  res = await client.put("/dispatch/shortages/group", json={
                      "request_id": str(uuid4()), "shortage_ids": [1], "items": [],
                  })
              print(f"EXACT_MAIN_BEFORE_405={res.status_code}")
              assert res.status_code == 405, res.text[:500]
          asyncio.run(verify_before())
          PY
      - name: Compile all group contract, lifecycle, adapter and focused test modules
        working-directory: wa_backend
        run: python -m py_compile domains/dispatch_shortages_group.py domains/dispatch_shortage_visits.py api/dispatch_shortages_group.py tests/test_dispatch_shortages_group_v1_postgres.py main.py
      - name: Start ONLY disposable local PostgreSQL 16
        run: |
          docker run --detach --name dispatch-849-pg16 \
            --env POSTGRES_USER=p0_dispatch_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec dispatch-849-pg16 pg_isready -U p0_dispatch_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs dispatch-849-pg16
          exit 1
      - name: Create isolated NOBYPASSRLS application role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(uri, autocommit=True) as conn:
              conn.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Full real Alembic migrations
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant DML on disposable schema to restricted role only
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(uri, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Assert fresh PostgreSQL16 and restricted runtime identity
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          uri = make_url(os.environ["DATABASE_URL"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(uri) as conn:
              name, role, version, superuser, bypass = conn.execute(
                  "SELECT current_database(), current_user, current_setting('server_version_num')::int, "
                  "rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user"
              ).fetchone()
              print("PG16_ROLE_EVIDENCE", name, role, version, superuser, bypass)
              assert name == "wanasah_no_lot_contract_test"
              assert role == "wanasah_app" and 160000 <= version < 170000
              assert not superuser and not bypass
          PY
      - name: Run genuine Backoffice Bearer group mutations and original custody PG16 safety
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_dispatch_shortages_group_v1_postgres.py
          tests/test_dispatch_p0_route_stock_safety_postgres.py
          --junitxml=shortage-group-d05-pg16-junit.xml
      - name: Report all PASS/FAIL/ERROR/SKIP and enforce green safety release
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          path = "shortage-group-d05-pg16-junit.xml"
          if not os.path.isfile(path):
              print("PG16 EVIDENCE NOT PRODUCED: no JUnit XML")
              sys.exit(1)
          cases = list(ET.parse(path).getroot().iter("testcase"))
          passed = failed = skipped = errors = 0
          for case in cases:
              bad = case.find("failure")
              error = case.find("error")
              skip = case.find("skipped")
              status = ("FAIL" if bad is not None else
                        "ERROR" if error is not None else
                        "SKIP" if skip is not None else "PASS")
              print(f"CASE {status}: {case.attrib.get('classname')}.{case.attrib.get('name')}")
              if bad is not None:
                  failed += 1
                  print((bad.text or "")[:4000])
              elif error is not None:
                  errors += 1
                  print((error.text or "")[:4000])
              elif skip is not None:
                  skipped += 1
              else:
                  passed += 1
          print(f"PG16_CASES={len(cases)} PASS={passed} FAIL={failed} ERROR={errors} SKIP={skipped}")
          assert len(cases) >= 21, "Expected all real group tests and existing physical safety cases"
          assert skipped == 0, "A skip is UNPROVEN, not an accepted PG16 PASS"
          assert failed == errors == 0, "Group D05 and preserved physical safety must PASS"
          PY
      - name: Publish JUnit even on regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shortage-group-d05-pg16-junit-${{ github.run_id }}
          path: wa_backend/shortage-group-d05-pg16-junit.xml
          if-no-files-found: warn
      - name: Show disposable PG logs on startup/migration failure
        if: failure()
        run: docker logs dispatch-849-pg16 2>/dev/null | tail -n 130 || true

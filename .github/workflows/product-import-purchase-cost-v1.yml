name: Product Import optional purchase cost V1 acceptance

on:
  push:
    branches: [sol/product-import-optional-purchase-cost-v1]
  pull_request:
    paths:
      - "wa_backend/domains/simple_products/imports/**"
      - "wa_backend/domains/inventory_costing/purchase_reference/**"
      - "wa_backend/alembic/**"
      - "wa_backend/tests/test_product_import_purchase_cost_contract.py"
      - "dashboard/src/pages/products/import/**"
      - "dashboard/src/i18n/resources.ts"
      - ".github/workflows/product-import-purchase-cost-v1.yml"

permissions:
  contents: read

jobs:
  import-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: ProductImportPurchaseCostTestOnlyKey01234567890123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and focused tests
        run: python -m pip install -r wa_backend/requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
      - name: Canonical old 10 / new optional 11 / source locale / validation / idempotency tests
        working-directory: wa_backend
        run: python -m pytest -q tests/test_product_import_purchase_cost_contract.py tests/test_product_import_multilingual.py tests/test_product_import_phase11_source_semantics.py tests/test_product_import_phase5_validation.py tests/test_product_import_phase8_idempotency_correction.py tests/test_product_import_d6_profile_contract.py
      - name: Exactly unchanged publication and staging batch constants
        working-directory: wa_backend
        run: |
          python - <<'PY'
          from domains.simple_products.imports.application.staging_service import STAGE_BATCH
          from domains.simple_products.imports.application.validation_service import VALIDATION_BATCH_SIZE
          from domains.simple_products.imports.application.execution_service import IMPORT_BATCH
          assert (STAGE_BATCH,VALIDATION_BATCH_SIZE,IMPORT_BATCH)==(500,500,200)
          print("BOUNDED_IMPORT_BATCH_SIZES_UNCHANGED")
          PY
      - name: Syntax and scope
        run: |
          python -m compileall -q wa_backend/domains/simple_products/imports wa_backend/domains/inventory_costing/purchase_reference
          git diff --check HEAD^ HEAD
  dashboard-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

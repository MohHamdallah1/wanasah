name: Live Stock V1 R4 negative filter closure

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/api/warehouse/live_stock.py"
      - "wa_backend/tests/live_stock_r4_negative_filter_postgres_acceptance.py"
      - "wa_backend/tests/test_live_stock_r4_negative_filter_contract.py"
      - ".github/workflows/live-stock-v1-r4-negative-filter-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-v1-r4-negative-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-pg16-negative-filters:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: R4NegativeFilterClosureKey123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_r2_perf_50k
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_r2_perf_50k
      WANASAH_CODE_ROOT: ${{ github.workspace }}/wa_backend
      R4_EVIDENCE_DIR: /tmp/r4-legacy-unused
      R4_NEGATIVE_EVIDENCE_DIR: /tmp/r4-negative-filter-evidence
      R4_NEGATIVE_BASE_SHA: c3687f49e2424d783fa3f7a91598ab232b176793
      R4_NEGATIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      R4_OPT_BASE_SHA: c3687f49e2424d783fa3f7a91598ab232b176793
      R4_QUERY_OPT_PG_GATE: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Compile changed runtime and focused acceptance
        working-directory: wa_backend
        run: >-
          python -m py_compile
          api/warehouse/live_stock.py
          tests/test_live_stock_r4_negative_filter_contract.py
          tests/live_stock_r4_negative_filter_postgres_acceptance.py

      - name: Backend-only negative-filter contract
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q
          tests/test_live_stock_r4_negative_filter_contract.py

      - name: Start one disposable PostgreSQL 16 server
        run: |
          docker run --detach --name r4-negative-postgres \
            --env POSTGRES_USER=cp1_admin \
            --env POSTGRES_DB=wanasah_r2_perf_50k \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec r4-negative-postgres pg_isready \
              -U cp1_admin -d wanasah_r2_perf_50k -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs r4-negative-postgres
          exit 1

      - name: Create restricted NOBYPASSRLS runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = (
              make_url(os.environ["DATABASE_URL_MIGRATION"])
              .set(drivername="postgresql")
              .render_as_string(hide_password=False)
          )
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Fresh schema and migration parity
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check

      - name: Grant restricted runtime DML
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = (
              make_url(os.environ["DATABASE_URL_MIGRATION"])
              .set(drivername="postgresql")
              .render_as_string(hide_password=False)
          )
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE "
                  "ON ALL TABLES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT USAGE, SELECT, UPDATE "
                  "ON ALL SEQUENCES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "INSERT INTO permissions(code) VALUES "
                  "('inventory.read'), ('inbound.create') "
                  "ON CONFLICT(code) DO NOTHING"
              )
          PY

      - name: One 50k seed - exact #675 before/after negative filters only
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/live_stock_r4_negative_filter_postgres_acceptance.py
          --junitxml=r4-negative-filter-postgres.xml

      - name: Reject failures skips and empty execution
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("r4-negative-filter-postgres.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No focused negative-filter PostgreSQL acceptance executed"
          assert not list(root.iter("skipped")), "Negative-filter acceptance must not skip"
          assert not list(root.iter("failure")) and not list(root.iter("error")), \
              "Negative-filter PostgreSQL acceptance failed"
          print("R4_NEGATIVE_POSTGRES_EXECUTED=" + str(len(cases)))
          PY

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Retain focused SQL and EXPLAIN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-negative-filter-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/r4-negative-filter-evidence/
            wa_backend/r4-negative-filter-postgres.xml
          if-no-files-found: error

      - name: Start PostgreSQL 16
        run: |
          docker run --detach --name cp7-pg --env POSTGRES_USER=cp1_admin --env POSTGRES_DB=wanasah_no_lot_contract_test --env POSTGRES_HOST_AUTH_METHOD=trust --publish 127.0.0.1:55439:55439 postgres:16 -p 55439
          for attempt in $(seq 1 30); do docker exec cp7-pg pg_isready -U cp1_admin -d wanasah_no_lot_contract_test -p 55439 && exit 0; sleep 1; done

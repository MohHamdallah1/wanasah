      - name: CP10 Ledger PostgreSQL movement smoke
        working-directory: wa_backend
        run: python -m pytest -q -s tests/test_cp10_ledger_postgres.py tests/test_cp10_ledger_postgres_multibatch.py

  dashboard-combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: CP3 Core and terminal UI coexistence
        working-directory: dashboard
        run: npm test -- src/test/inventory-cp3-batch-actions.test.tsx src/test/batch-terminal-actions.test.tsx src/test/cp34-quality-durable.test.tsx --reporter=verbose
      - name: Supplier quality-return
        working-directory: dashboard
        run: npm test -- src/test/suppliers-v1.test.tsx -t "retries whole-product return|replays a stored pre-Supplier quality command" --reporter=verbose
      - name: CP2 and CP7 parity
        working-directory: dashboard
        run: npm test -- src/test/inventory-cp2-batches-dashboard.test.tsx src/test/inventory-batches-expiry-semantics.test.tsx src/test/inventory-cp7-live-stock.test.tsx src/test/inventory-cp7-live-stock-parity.test.tsx --reporter=verbose
      - name: CP8 Transfers
        working-directory: dashboard
        run: npm test -- src/pages/inventory/transfers/cp8-transfers.test.tsx src/test/cp8-quality-destinations.test.tsx --reporter=verbose
      - name: CP6 shelf-life policy parity
        working-directory: dashboard
        run: npm test -- src/test/inventory-cp6-policy-closure.test.tsx --reporter=verbose
      - name: CP10 Ledger Dashboard smoke
        working-directory: dashboard
        run: npm test -- src/test/inventory-cp10-ledger-dashboard.test.tsx src/test/inventory-cp10-ledger-contract.test.ts --reporter=verbose
      - name: ESLint touched frontend
        working-directory: dashboard
        run: npx eslint src/pages/inventory/batches/useBatchTerminalAction.ts src/test/batch-terminal-actions.test.tsx src/test/cp34-quality-durable.test.tsx src/test/suppliers-v1.test.tsx src/test/inventory-cp2-batches-dashboard.test.tsx src/test/inventory-cp7-live-stock.test.tsx src/test/inventory-cp7-live-stock-parity.test.tsx
      - name: TypeScript noEmit
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: Production Dashboard build
        working-directory: dashboard
        run: npm run build

  diff-and-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve target merge-base and diff check
        shell: bash
        run: |
          git fetch origin integration/inventory-wave-2 --no-tags
          base="$(git merge-base HEAD origin/integration/inventory-wave-2)"
          test -n "$base"
          git diff --check "$base" HEAD --
          git merge-base --is-ancestor 7216a067c97371078e375f1c84ab365e86e816b0 HEAD
          echo "CP3_COMBINED_BASE=$base"
      - name: No foreign runtime modifications
        shell: bash
        run: |
          git fetch origin integration/inventory-wave-2 --no-tags
          base="$(git merge-base HEAD origin/integration/inventory-wave-2)"
          python - "$base" <<'PY'
          import subprocess, sys
          base = sys.argv[1]
          changed = set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"], text=True).splitlines())
          runtime_allowed = {
              "dashboard/src/pages/inventory/batches/useBatchTerminalAction.ts",
              "wa_backend/api/warehouse/whole_product_quality.py",
              "wa_backend/domains/inventory_quality_confirmation.py",
          }
          workflow_test_prefixes = (".github/workflows/", "dashboard/src/test/", "wa_backend/tests/")
          bad = sorted(p for p in changed if p not in runtime_allowed and not p.startswith(workflow_test_prefixes))
          if bad:
              raise SystemExit(f"CP3_COMBINED_SCOPE=FAIL foreign={bad}")
          print("CP3_COMBINED_SCOPE=PASS", sorted(changed))
          PY

          for attempt in $(seq 1 30); do docker exec cp34-pg pg_isready -U cp8_admin -d wanasah_cp8_test -p 55448 && exit 0; sleep 1; done
          docker logs cp34-pg; exit 1
      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              if not conn.execute("SELECT 1 FROM pg_roles WHERE rolname='cp8_app'").fetchone():
                  conn.execute("CREATE ROLE cp8_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate
        working-directory: wa_backend
        run: alembic upgrade head
      - name: CP3.4 plus CP8 PostgreSQL 16
        working-directory: wa_backend
        run: python -m pytest -q -s tests/test_cp8_transfers_postgres.py tests/test_cp34_quality_terminal_postgres.py


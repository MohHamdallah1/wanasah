          docker run --detach --name cp10-pg --env POSTGRES_USER=cp10_admin --env POSTGRES_DB=wanasah_cp10_test --env POSTGRES_HOST_AUTH_METHOD=trust --publish 127.0.0.1:55450:55450 postgres:16 -p 55450
          for attempt in $(seq 1 30); do docker exec cp10-pg pg_isready -U cp10_admin -d wanasah_cp10_test -p 55450 && exit 0; sleep 1; done

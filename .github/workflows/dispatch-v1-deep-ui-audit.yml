name: Dispatch V1 #838 isolated real Dashboard browser audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-v1-deep-ui-audit.yml"
      - "dashboard/e2e/dispatch-v1-deep-audit.config.ts"
      - "dashboard/e2e/dispatch-v1-deep-audit.spec.ts"
      - "dashboard/src/test/dispatch-v1-deep-*.test.tsx"
      - "wa_backend/tests/dispatch_v1_browser_audit_fixture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-dashboard:
    name: PG16 real FastAPI Chromium AR EN 1440 700 390
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      SECRET_KEY: Dispatch838StrictPG16ChromiumTestFixtureOnly2026
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://dispatch_838_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_DISPATCH_P0_WIRE_GATE: "1"
      WANASAH_DISPATCH_V1_DEEP_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://dispatch_838_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_DISPATCH_P0_WIRE_STATE: /tmp/dispatch-v1-deep-state.json
      PYTHONPATH: ${{ github.workspace }}/wa_backend
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify EXACT immutable base and test-only ownership
        shell: bash
        run: |
          base=c71121dabdd7566806f29a768d4fb0af4b5ee78e
          git cat-file -e "$base^{commit}"
          git diff --check "$base" HEAD
          BASE="$base" python - <<'PY'
          import subprocess, os
          base = os.environ["BASE"]
          files = set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed = {
            ".github/workflows/dispatch-v1-deep-ui-audit.yml",
            "dashboard/e2e/dispatch-v1-deep-audit.config.ts",
            "dashboard/e2e/dispatch-v1-deep-audit.spec.ts",
            "dashboard/src/test/dispatch-v1-deep-ui.test.tsx",
            "wa_backend/tests/dispatch_v1_browser_audit_fixture.py",
          }
          assert files <= allowed, f"Forbidden code change(s): {sorted(files-allowed)}"
          assert files, "Refuse empty test-only PR"
          print("DISPATCH_838_OWNER_SCOPE=PASS",sorted(files))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install backend dependencies and compile test fixture
        run: |
          python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
          python -m py_compile wa_backend/tests/dispatch_v1_browser_audit_fixture.py
      - name: Disposable localhost PostgreSQL 16
        run: |
          docker run -d --name dispatch-838-postgres \
            -e POSTGRES_USER=dispatch_838_admin \
            -e POSTGRES_DB=wanasah_no_lot_contract_test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55439:55439 postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec dispatch-838-postgres pg_isready -U dispatch_838_admin -d wanasah_no_lot_contract_test -p 55439; then exit 0; fi
            sleep 1
          done
          docker logs dispatch-838-postgres
          exit 1
      - name: Create NOBYPASSRLS runtime account
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(url,autocommit=True) as db:
              db.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate disposable schema and grant restricted DML
        run: |
          (cd wa_backend && alembic upgrade head && alembic check)
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(url,autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Seed restricted real two-tenant bearer and physical stock fixture
        working-directory: wa_backend
        run: |
          python -B -m pytest -p no:cacheprovider -q -s \
            tests/dispatch_v1_browser_audit_fixture.py::test_seed_real_dispatch_v1_dashboard \
            --junitxml=dispatch-v1-deep-seed.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases=list(ET.parse("dispatch-v1-deep-seed.xml").getroot().iter("testcase"))
          assert len(cases)==1 and not any(
              case.find(x) is not None for case in cases for x in ("error","failure","skipped")
          ), f"Seed tests failed/skipped/missing: {len(cases)}"
          print("DISPATCH_838_SEED=PASS one real authorized case")
          PY
      - name: Start authentic FastAPI on isolated PostgreSQL
        working-directory: wa_backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 4174 > /tmp/dispatch-838-api.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4174/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dispatch-838-api.log
          exit 1
      - name: Install pinned Dashboard and Chromium
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build actual Wanasah React Dashboard
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174
        run: npm run build
      - name: Run real Vite production preview
        working-directory: dashboard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/dispatch-838-ui.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/dispatch > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dispatch-838-ui.log
          exit 1
      - name: AR EN Chromium six viewports - leave business regressions RED
        working-directory: dashboard
        run: npx playwright test --config e2e/dispatch-v1-deep-audit.config.ts
      - name: Preserve actual HTTP trace screenshots JSON CI and server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-v1-deep-ui-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dashboard/node_modules/.cache/dispatch-v1-deep-audit
            wa_backend/dispatch-v1-deep-seed.xml
            /tmp/dispatch-838-api.log
            /tmp/dispatch-838-ui.log
          if-no-files-found: warn

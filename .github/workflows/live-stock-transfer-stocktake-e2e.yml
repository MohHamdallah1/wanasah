name: V1 warehouse transfer and stocktake E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/warehouse_transfer_stocktake_*.py"
      - "wa_backend/tests/test_v1_warehouse_transfer_stocktake_postgres.py"
      - ".github/workflows/live-stock-transfer-stocktake-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-transfer-stocktake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: WarehouseJourneyIsolatedPostgresOnlyKey12345678901234567890
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_TRANSFER_STOCKTAKE_E2E_PG_GATE: "1"
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Compile focused journey acceptance
        working-directory: wa_backend
        run: python -m py_compile tests/warehouse_transfer_stocktake_expected.py tests/warehouse_transfer_stocktake_support.py tests/test_v1_warehouse_transfer_stocktake_postgres.py

      - name: Start isolated PostgreSQL 16
        run: |
          docker run --detach --name warehouse-journey-postgres \
            --env POSTGRES_USER=cp1_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec warehouse-journey-postgres pg_isready -U cp1_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs warehouse-journey-postgres
          exit 1

      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Migrate isolated database
        working-directory: wa_backend
        run: alembic upgrade head

      - name: Grant runtime DML only
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE "
                  "ON ALL TABLES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT USAGE, SELECT, UPDATE "
                  "ON ALL SEQUENCES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "INSERT INTO permissions(code) VALUES "
                  "('inventory.read'), ('inbound.create') "
                  "ON CONFLICT(code) DO NOTHING"
              )
          PY

      - name: Run affected CP8 and CP9 regressions
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q
          tests/test_cp8_transfers_backend.py
          tests/test_warehouse_transfers_canonical_auth_cutover.py
          tests/test_cp9_stocktake_closure_contract.py
          tests/test_stocktake_canonical_auth_cutover.py

      - name: Run canonical FIFO and moving-average PostgreSQL journey
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_v1_warehouse_transfer_stocktake_postgres.py

      - name: Retain predetermined truth and committed reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-transfer-stocktake-${{ github.sha }}
          path: /tmp/warehouse-transfer-stocktake-evidence/*.json
          if-no-files-found: error

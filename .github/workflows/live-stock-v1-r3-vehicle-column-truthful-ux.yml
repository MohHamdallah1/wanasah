name: Live Stock V1 R3 vehicle column truthful UX

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/pages/inventory/liveStock/LiveStockTable.tsx"
      - "dashboard/src/pages/inventory/liveStock/LiveStockMobileCards.tsx"
      - "dashboard/src/i18n/resources.ts"
      - "dashboard/src/test/live-stock-r3-vehicle-column-truthful-ux.test.tsx"
      - ".github/workflows/live-stock-v1-r3-vehicle-column-truthful-ux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-v1-r3-vehicle-column-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      - name: Focused AR EN desktop mobile render and accessibility proof
        working-directory: dashboard
        run: >-
          npm test --
          src/test/live-stock-r3-vehicle-column-truthful-ux.test.tsx
          src/test/inventory-cp7-live-stock-parity.test.tsx
          --reporter=verbose

      - name: Focused lint
        working-directory: dashboard
        run: >-
          npx eslint
          src/pages/inventory/liveStock/LiveStockTable.tsx
          src/pages/inventory/liveStock/LiveStockMobileCards.tsx
          src/i18n/resources.ts
          src/test/live-stock-r3-vehicle-column-truthful-ux.test.tsx

      - name: TypeScript contract
        working-directory: dashboard
        run: npx tsc --noEmit --pretty false

      - name: Exact UX-only ownership
        run: |
          base="4c100550ac3dc3fcf16ecd174e285f3dc84c941f"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD --
          BASE="$base" python - <<'PY'
          import os
          import subprocess

          allowed = {
              ".github/workflows/live-stock-v1-r3-vehicle-column-truthful-ux.yml",
              "dashboard/src/i18n/resources.ts",
              "dashboard/src/pages/inventory/liveStock/LiveStockTable.tsx",
              "dashboard/src/pages/inventory/liveStock/LiveStockMobileCards.tsx",
              "dashboard/src/test/live-stock-r3-vehicle-column-truthful-ux.test.tsx",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", os.environ["BASE"], "HEAD"],
                  text=True,
              ).splitlines()
          )
          extra = changed - allowed
          if extra:
              raise SystemExit(f"R3_VEHICLE_COLUMN_SCOPE=FAIL extra={sorted(extra)}")
          forbidden = {
              "LIVE_STOCK_V1_CLOSURE_PLAN.md",
              "dashboard/src/pages/inventory/Tab1LiveStock.tsx",
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/liveStock/LiveStockFilters.tsx",
              "wa_backend/api/warehouse/live_stock.py",
              "wa_backend/domains/live_stock_projection/service.py",
          }
          overlap = changed & forbidden
          if overlap:
              raise SystemExit(f"R3_VEHICLE_COLUMN_SCOPE=FAIL forbidden={sorted(overlap)}")
          backend = sorted(path for path in changed if path.startswith("wa_backend/"))
          if backend:
              raise SystemExit(f"R3_VEHICLE_COLUMN_SCOPE=FAIL backend={backend}")
          print(f"R3_VEHICLE_COLUMN_SCOPE=PASS files={len(changed)}")
          PY

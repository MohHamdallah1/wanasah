name: Live Stock V1 operational browser closure

on:
  workflow_call:
    inputs:
      backend_ref:
        type: string
        default: ""
      accepted_main_ref:
        type: string
        default: ""
      scenario:
        type: string
        default: operational
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/pages/inventory/**"
      - "dashboard/src/components/dashboard/WorkspaceTopBar.css"
      - "dashboard/e2e/live-stock-operational.*"
      - "dashboard/e2e/live-stock-operational-workflow.test.py"
      - "dashboard/src/test/live-stock-batch-detail-freshness.test.tsx"
      - "wa_backend/tests/live_stock_operational_browser_support.py"
      - ".github/workflows/live-stock-v1-operational-browser.yml"
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Optional exact backend SHA for an intentional audit"
        type: string
        default: ""
      accepted_main_ref:
        description: "Optional exact baseline SHA requiring unchanged runtime"
        type: string
        default: ""
      scenario:
        type: choice
        options: [operational, physical-custody]
        default: operational

permissions:
  contents: read

concurrency:
  group: live-stock-operational-browser-${{ github.event.pull_request.number || github.ref }}-${{ inputs.scenario || 'operational' }}
  cancel-in-progress: true

jobs:
  real-api-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ENVIRONMENT: test
      SECRET_KEY: RealBrowserPostgresOnlyKeyAbc123456789012345678901234
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://real_browser_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_REAL_BROWSER_GATE: "1"
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://real_browser_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_REAL_BROWSER_STATE: /tmp/live-stock-real-browser-state.json
      WANASAH_OPERATIONAL_BROWSER_STATE: /tmp/live-stock-operational-state.json
      PYTHON: python
      R3_BACKEND_ROOT: ${{ github.workspace }}/backend-under-test/wa_backend
      SCENARIO: ${{ inputs.scenario || 'operational' }}
      BACKEND_REF: ${{ inputs.backend_ref }}
      ACCEPTED_MAIN_REF: ${{ inputs.accepted_main_ref }}
      PR_BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate bounded acceptance scenario
        env:
          BACKEND_REF: ${{ inputs.backend_ref }}
        run: |
          python - <<'PY'
          import os, re
          assert os.environ["SCENARIO"] in ("operational", "physical-custody")
          assert not os.environ["BACKEND_REF"] or re.fullmatch(r"[0-9a-f]{40}", os.environ["BACKEND_REF"])
          assert not os.environ["ACCEPTED_MAIN_REF"] or re.fullmatch(r"[0-9a-f]{40}", os.environ["ACCEPTED_MAIN_REF"])
          PY

      - name: Checkout backend under test separately
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_ref || github.event.pull_request.head.sha || github.sha }}
          path: backend-under-test
          fetch-depth: 1

      - name: Guard future-runtime and optional-audit workflow contracts
        run: python -B dashboard/e2e/live-stock-operational-workflow.test.py

      - name: Prove integrated-main runtime and historical contract mismatch
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          historical = "6232face36982207fc923068b4f7a7081c62b661"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          frontend = git("rev-parse", "HEAD")
          accepted = os.environ["ACCEPTED_MAIN_REF"] or git("merge-base", os.environ["PR_BASE_REF"], frontend)
          backend = git("-C", "backend-under-test", "rev-parse", "HEAD")
          if not os.environ["BACKEND_REF"]:
              assert backend == frontend, "Default acceptance must use matching PR frontend/backend"
          runtime_matches = subprocess.run(["git", "diff", "--quiet", accepted, frontend, "--",
                          "wa_backend", "dashboard/src", ":!dashboard/src/test"]).returncode == 0
          runtime_matches = runtime_matches and git("rev-parse", backend + ":wa_backend") == git("rev-parse", accepted + ":wa_backend")
          # Explicit final-main proofs require identical production trees. Ordinary
          # future PRs retain their normal runtime-change acceptance behavior.
          if os.environ["ACCEPTED_MAIN_REF"]:
              assert runtime_matches, "Explicit main proof must exercise unchanged accepted runtime"
          old = git("show", historical + ":wa_backend/api/warehouse/live_stock.py")
          current = pathlib.Path("backend-under-test/wa_backend/api/warehouse/live_stock.py").read_text()
          keys = ('"vehicle_quantity_scope"', '"total_quantity_scope"')
          assert all(key not in old and key in current for key in keys)
          assert '"vehicle_quantity": canonical_quantity(vehicle_total)' in old
          evidence = dict(accepted_main=accepted, frontend=frontend, backend=backend,
                          runtime_matches_main=runtime_matches, historical_backend=historical,
                          historical_missing_scope_keys=list(keys))
          pathlib.Path("/tmp/live-stock-sha-provenance.json").write_text(json.dumps(evidence, indent=2))
          print("INTEGRATED_MAIN_RUNTIME_AND_HISTORICAL_MISMATCH PASS " + json.dumps(evidence))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install focused backend dependencies
        run: python -m pip install -r backend-under-test/wa_backend/requirements.txt alembic pytest pytest-asyncio

      - name: Compile real-browser fixture
        run: |
          if [ ! -f backend-under-test/wa_backend/tests/live_stock_operational_browser_support.py ]; then
            cp wa_backend/tests/live_stock_operational_browser_support.py \
              backend-under-test/wa_backend/tests/live_stock_operational_browser_support.py
          fi
          python -m py_compile backend-under-test/wa_backend/tests/live_stock_operational_browser_support.py

      - name: Start disposable PostgreSQL 16
        run: |
          docker run --detach --name live-stock-real-browser-pg \
            --env POSTGRES_USER=real_browser_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec live-stock-real-browser-pg pg_isready \
              -U real_browser_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs live-stock-real-browser-pg
          exit 1

      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Migrate only disposable database
        working-directory: backend-under-test/wa_backend
        run: alembic upgrade head

      - name: Grant restricted runtime fixture permissions
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url

          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app"
              )
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
              conn.execute(
                  "INSERT INTO permissions(code) VALUES "
                  "('inventory.read'), ('location.read'), ('inbound.create') "
                  "ON CONFLICT(code) DO NOTHING"
              )
          PY

      - name: Seed canonical inbound and exact expected truth
        working-directory: backend-under-test/wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/live_stock_operational_browser_support.py::test_prepare_operational_browser

      - name: Prepare canonical physical Vehicle custody
        if: inputs.scenario == 'physical-custody'
        run: python dashboard/e2e/live-stock-physical-custody.fixture.py setup

      - name: Start actual FastAPI server
        working-directory: backend-under-test/wa_backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 4174 \
            > /tmp/live-stock-real-api.log 2>&1 &
          echo $! > /tmp/live-stock-real-api.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/live-stock-real-api.log
          exit 1

      - name: Install locked Dashboard and disposable Chromium
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0 @testing-library/dom@10.4.1
          npx playwright install --with-deps chromium

      - name: Focused affected frontend regressions
        working-directory: dashboard
        run: >-
          npx vitest run
          src/test/live-stock-batch-detail-freshness.test.tsx
          src/test/live-stock-batch-refresh-integration.test.tsx
          src/test/live-stock-warm-authority.test.tsx
          src/test/inventory-cp13-shell-polish.test.tsx
          src/test/inventory-cp6-minimum-stock-dashboard.test.tsx
          src/test/inventory-cp7-live-stock.test.tsx
          src/test/inventory-cp7-live-stock-parity.test.tsx

      - name: Lint operational frontend changes
        working-directory: dashboard
        run: >-
          npx eslint
          e2e/live-stock-operational.config.ts
          e2e/live-stock-operational.journey.ts
          e2e/live-stock-operational.spec.ts
          e2e/live-stock-operational.support.ts
          e2e/live-stock-ux-closure.fixtures.ts
          e2e/live-stock-ux-closure.spec.ts
          src/pages/inventory/liveStock/contracts.ts
          src/pages/inventory/liveStock/VehicleCustodyQuantity.tsx
          src/pages/inventory/liveStock/LiveStockTable.tsx
          src/pages/inventory/liveStock/LiveStockMobileCards.tsx
          src/pages/inventory/StockMinimumManager.tsx
          src/i18n/resources.ts
          src/pages/inventory/InventoryTopDock.tsx
          src/pages/inventory/MainInventory.tsx
          src/pages/inventory/Tab1LiveStock.tsx
          src/pages/inventory/inventoryTopDockController.ts
          src/pages/inventory/liveStock/BatchDetailPanel.tsx
          src/pages/inventory/liveStock/useLiveStockBatchDetail.ts
          src/test/inventory-cp13-shell-polish.test.tsx
          src/test/live-stock-batch-detail-freshness.test.tsx

      - name: Typecheck app and focused browser proof
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npx tsc --noEmit --skipLibCheck --target es2022 --module esnext \
            --moduleResolution bundler --types node --lib es2022,dom \
            e2e/live-stock-operational.config.ts e2e/live-stock-operational.spec.ts \
            e2e/live-stock-operational.journey.ts e2e/live-stock-operational.support.ts \
            e2e/live-stock-physical-custody.config.ts e2e/live-stock-physical-custody.spec.ts

      - name: Build actual Dashboard against actual FastAPI
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174
        run: npm run build

      - name: Start isolated built Dashboard
        working-directory: dashboard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 \
            > /tmp/live-stock-real-dashboard.log 2>&1 &
          echo $! > /tmp/live-stock-real-dashboard.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/inventory >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/live-stock-real-dashboard.log
          exit 1

      - name: Run real Chromium through FastAPI and PostgreSQL
        working-directory: dashboard
        run: |
          if [ "$SCENARIO" = "physical-custody" ]; then
            npx playwright test --config e2e/live-stock-physical-custody.config.ts
          else
            npx playwright test --config e2e/live-stock-operational.config.ts
          fi

      - name: Verify ownership and real screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.sha }}" python - <<'PY'
          import os, subprocess
          allowed = [".github/workflows/inventory-cp13-shell-polish.yml",".github/workflows/inventory-cp6-minimum-stock-dashboard-acceptance.yml",".github/workflows/live-stock-physical-custody-consumers.yml",".github/workflows/live-stock-v1-browser-acceptance.yml",".github/workflows/live-stock-v1-operational-browser.yml",".github/workflows/live-stock-v1-ux-closure.yml","dashboard/e2e/inventory-cp14-device-ux.spec.ts","dashboard/e2e/live-stock-operational.config.ts","dashboard/e2e/live-stock-operational.journey.ts","dashboard/e2e/live-stock-operational-workflow.test.py","dashboard/e2e/live-stock-operational.spec.ts","dashboard/e2e/live-stock-operational.support.ts","dashboard/e2e/live-stock-physical-custody.config.ts","dashboard/e2e/live-stock-physical-custody.fixture.py","dashboard/e2e/live-stock-physical-custody.spec.ts","dashboard/e2e/live-stock-ux-closure.fixtures.ts","dashboard/e2e/live-stock-ux-closure.spec.ts","dashboard/e2e/live-stock-v1.fixtures.ts","dashboard/src/components/dashboard/WorkspaceTopBar.css","dashboard/src/i18n/resources.ts","dashboard/src/pages/inventory/InventoryTopDock.tsx","dashboard/src/pages/inventory/MainInventory.tsx","dashboard/src/pages/inventory/StockMinimumManager.tsx","dashboard/src/pages/inventory/Tab1LiveStock.tsx","dashboard/src/pages/inventory/inventoryShellPolish.css","dashboard/src/pages/inventory/inventoryTopDockController.ts","dashboard/src/pages/inventory/liveStock/BatchDetailPanel.tsx","dashboard/src/pages/inventory/liveStock/LiveStockMobileCards.tsx","dashboard/src/pages/inventory/liveStock/LiveStockTable.tsx","dashboard/src/pages/inventory/liveStock/VehicleCustodyQuantity.tsx","dashboard/src/pages/inventory/liveStock/contracts.ts","dashboard/src/pages/inventory/liveStock/useLiveStockBatchDetail.ts","dashboard/src/test/inventory-access.test.ts","dashboard/src/test/inventory-cp13-shell-polish.test.tsx","dashboard/src/test/inventory-cp6-minimum-stock-dashboard.test.tsx","dashboard/src/test/inventory-cp7-live-stock-parity.test.tsx","dashboard/src/test/inventory-cp7-live-stock.test.tsx","dashboard/src/test/live-stock-batch-detail-freshness.test.tsx","dashboard/src/test/live-stock-local-failure.test.tsx","dashboard/src/test/live-stock-render-performance.benchmark.test.tsx","dashboard/src/test/live-stock-render-windowing.test.tsx","dashboard/src/test/live-stock-ui01-canonical-alert.test.tsx","dashboard/src/test/live-stock-warm-authority.test.tsx","docs/operations/LIVE_STOCK_OPERATIONAL_BROWSER_EVIDENCE.md","wa_backend/tests/live_stock_operational_browser_support.py"]
          import json, re, urllib.request
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_ref = os.environ["BASE"]
          assert re.fullmatch(r"[0-9a-f]{40}", head) and re.fullmatch(r"[0-9a-f]{40}", base_ref)
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/compare/{base_ref}...{head}",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              base = json.load(response)["merge_base_commit"]["sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", base)
          subprocess.run(["git", "cat-file", "-e", base + "^{commit}"], check=True)
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          assert changed <= set(allowed), changed - set(allowed)
          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          print("OPERATIONAL_BROWSER_OWNERSHIP PASS")
          PY
          if [ "$SCENARIO" = "physical-custody" ]; then
            count=$(find dashboard/node_modules/.cache/live-stock-physical-custody -name '*.png' | wc -l)
            test "$count" -ge 5
          else
            count=$(find dashboard/node_modules/.cache/live-stock-operational -name '*.png' | wc -l)
            test "$count" -ge 9
          fi
          echo "OPERATIONAL_SCREENSHOTS=$count"

      - name: Complete consumer contracts including both inherited concerns
        working-directory: dashboard
        run: >-
          npx vitest run src/test/inventory-access.test.ts
          --reporter=default --reporter=junit
          --outputFile=node_modules/.cache/live-stock-contracts.xml

      - name: Reject incomplete or skipped consumer-contract execution
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("dashboard/node_modules/.cache/live-stock-contracts.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 50, f"Expected all 50 contract cases, got {len(cases)}"
          assert not list(root.iter("skipped")), "Consumer contracts must not skip"
          assert not list(root.iter("failure")) and not list(root.iter("error"))
          print("COMPLETE_CONSUMER_CONTRACTS PASS 50; skipped=0")
          PY

      - name: Upload operational visual and server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-operational-browser-${{ github.sha }}
          path: |
            dashboard/node_modules/.cache/live-stock-operational
            dashboard/node_modules/.cache/live-stock-physical-custody
            dashboard/node_modules/.cache/live-stock-contracts.xml
            /tmp/live-stock-sha-provenance.json
            /tmp/live-stock-real-api.log
            /tmp/live-stock-real-dashboard.log

          if-no-files-found: error

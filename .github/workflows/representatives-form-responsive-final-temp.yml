name: Temporary representatives form responsive final acceptance

on:
  push:
    branches:
      - sol/representatives-credit-policy-ui-finalization
    paths:
      - ".github/workflows/representatives-form-responsive-final-temp.yml"

permissions:
  contents: write

jobs:
  patch-and-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PREVIOUS_HEAD: cca197320ee280fd4574912c4cbca85df3fc01b7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/representatives-credit-policy-ui-finalization
          fetch-depth: 0

      - name: Apply owner form UX correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          form_path = Path('dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.tsx')
          source = form_path.read_text(encoding='utf-8')

          replacements = [
            (
              'import { type FormEvent, useEffect, useRef, useState } from "react";',
              'import { type FocusEvent, type FormEvent, type MouseEvent, useEffect, useRef, useState } from "react";'
            ),
            (
              '  const { t } = useTranslation();',
              '  const { t, i18n } = useTranslation();'
            ),
            (
              '  const [maxDebtLimit, setMaxDebtLimit] = useState(representative?.max_debt_limit ?? "0.000");\n  const [validation, setValidation] = useState("");\n  const operation = useRef<PendingFormOperation | null>(null);',
              '  const [maxDebtLimit, setMaxDebtLimit] = useState(representative?.max_debt_limit ?? "");\n  const [validation, setValidation] = useState("");\n  const operation = useRef<PendingFormOperation | null>(null);\n  const debtSelectionHandled = useRef(false);\n  const debtMouseUpSelectionPending = useRef(false);\n  const formDirection = i18n.dir();\n  const localeTextAlignment = formDirection === "rtl" ? "text-right" : "text-left";'
            ),
            (
              '    setMaxDebtLimit(representative?.max_debt_limit ?? "0.000");\n    setValidation("");\n    operation.current = null;',
              '    setMaxDebtLimit(representative?.max_debt_limit ?? "");\n    setValidation("");\n    operation.current = null;\n    debtSelectionHandled.current = false;\n    debtMouseUpSelectionPending.current = false;'
            ),
            (
              '    const normalizedPhone = normalizeOptionalPhone(phone);\n    const normalizedDebt = normalizeDebtLimit(maxDebtLimit);',
              '    const normalizedPhone = normalizeOptionalPhone(phone);\n    const debtInput = maxDebtLimit.trim();\n    const normalizedDebt = debtInput ? normalizeDebtLimit(debtInput) : null;'
            ),
            (
              '    if (!normalizedDebt) {\n      setValidation(t("representativesVehicles.representatives.form.debtInvalid"));\n      return;\n    }',
              '    if (canAllowDebt && !debtInput) {\n      setValidation(t("representativesVehicles.representatives.form.debtRequired"));\n      return;\n    }\n    if (canAllowDebt && !normalizedDebt) {\n      setValidation(t("representativesVehicles.representatives.form.debtInvalid"));\n      return;\n    }'
            ),
            (
              '      if (normalizedDebt !== originalDebt) update.max_debt_limit = normalizedDebt;',
              '      if (canAllowDebt && normalizedDebt && normalizedDebt !== originalDebt) {\n        update.max_debt_limit = normalizedDebt;\n      }'
            ),
            (
              '      max_debt_limit: normalizedDebt,',
              '      max_debt_limit: canAllowDebt ? normalizedDebt! : "0.000",'
            ),
            (
              '  const inputClass = "h-10 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800 outline-none transition focus:border-cyan-300 focus:ring-4 focus:ring-cyan-100/60 disabled:bg-slate-50 disabled:text-slate-500";\n\n  return (\n    <form className="space-y-4" onSubmit={submit}>',
              '''  const selectExistingDebtOnFirstFocus = (event: FocusEvent<HTMLInputElement>) => {\n    if (!representative || debtSelectionHandled.current || !event.currentTarget.value) return;\n    event.currentTarget.select();\n    debtSelectionHandled.current = true;\n    debtMouseUpSelectionPending.current = true;\n  };\n\n  const preserveFirstDebtSelection = (event: MouseEvent<HTMLInputElement>) => {\n    if (!debtMouseUpSelectionPending.current) return;\n    event.preventDefault();\n    debtMouseUpSelectionPending.current = false;\n  };\n\n  const inputClass = "h-10 min-w-0 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800 outline-none transition focus:border-cyan-300 focus:ring-4 focus:ring-cyan-100/60 disabled:bg-slate-50 disabled:text-slate-500";\n\n  return (\n    <form dir={formDirection} className="space-y-4" onSubmit={submit}>'''
            ),
            (
              '<div className="space-y-1.5 sm:col-span-2">\n          <label htmlFor="representative-name" className="text-xs font-black text-slate-700">',
              '<div className="min-w-0 space-y-1.5 sm:col-span-2">\n          <label htmlFor="representative-name" className="block text-start text-xs font-black text-slate-700">'
            ),
            (
              '<div className="space-y-1.5">\n          <label htmlFor="representative-username" className="text-xs font-black text-slate-700">{t("representativesVehicles.representatives.fields.username")}</label>\n          <input id="representative-username" dir="ltr" maxLength={80} value={username} onChange={(event) => { resetOperation(); setUsername(event.target.value); }} placeholder={t("representativesVehicles.representatives.form.usernamePlaceholder")} className={inputClass} disabled={busy} autoComplete="off" />\n        </div>\n\n        <div className="space-y-1.5">\n          <label htmlFor="representative-phone" className="text-xs font-black text-slate-700">{t("representativesVehicles.representatives.fields.phone")}</label>\n          <input id="representative-phone" dir="ltr" inputMode="tel" maxLength={20} value={phone} onChange={(event) => { resetOperation(); setPhone(event.target.value); }} placeholder={t("representativesVehicles.representatives.form.phonePlaceholder")} className={inputClass} disabled={busy} autoComplete="tel" />\n        </div>',
              '''<div className="min-w-0 space-y-1.5">\n          <label htmlFor="representative-username" className="block text-start text-xs font-black text-slate-700">{t("representativesVehicles.representatives.fields.username")}</label>\n          <input id="representative-username" dir={username ? "ltr" : formDirection} maxLength={80} value={username} onChange={(event) => { resetOperation(); setUsername(event.target.value); }} placeholder={t("representativesVehicles.representatives.form.usernamePlaceholder")} className={`${inputClass} ${localeTextAlignment}`} disabled={busy} autoComplete="off" />\n        </div>\n\n        <div className="min-w-0 space-y-1.5">\n          <label htmlFor="representative-phone" className="block text-start text-xs font-black text-slate-700">{t("representativesVehicles.representatives.fields.phone")}</label>\n          <input id="representative-phone" dir={phone ? "ltr" : formDirection} inputMode="tel" maxLength={20} value={phone} onChange={(event) => { resetOperation(); setPhone(event.target.value); }} placeholder={t("representativesVehicles.representatives.form.phonePlaceholder")} className={`${inputClass} ${localeTextAlignment}`} disabled={busy} autoComplete="tel" />\n        </div>'''
            ),
            (
              '<div className="space-y-1.5 sm:col-span-2">\n            <label htmlFor="representative-password" className="text-xs font-black text-slate-700">',
              '<div className="min-w-0 space-y-1.5 sm:col-span-2">\n            <label htmlFor="representative-password" className="block text-start text-xs font-black text-slate-700">'
            ),
            (
              '<label htmlFor="representative-debt-limit" className="text-xs font-black text-slate-700">{t("representativesVehicles.representatives.fields.debtLimit")}</label>\n            <input id="representative-debt-limit" dir="ltr" inputMode="decimal" value={maxDebtLimit} onChange={(event) => { resetOperation(); setMaxDebtLimit(event.target.value); }} placeholder={t("representativesVehicles.representatives.form.debtLimitPlaceholder")} className={inputClass} disabled={busy} autoComplete="off" />\n            <p className="text-[11px] font-semibold leading-5 text-slate-500">{t("representativesVehicles.representatives.form.debtHint")}</p>',
              '''<label htmlFor="representative-debt-limit" className="block text-start text-xs font-black text-slate-700">{t("representativesVehicles.representatives.fields.debtLimit")}</label>\n            <input\n              id="representative-debt-limit"\n              aria-describedby="representative-debt-hint"\n              dir={maxDebtLimit ? "ltr" : formDirection}\n              inputMode="decimal"\n              value={maxDebtLimit}\n              onFocus={selectExistingDebtOnFirstFocus}\n              onMouseUp={preserveFirstDebtSelection}\n              onChange={(event) => {\n                debtMouseUpSelectionPending.current = false;\n                resetOperation();\n                setMaxDebtLimit(event.target.value);\n              }}\n              placeholder={t("representativesVehicles.representatives.form.debtLimitPlaceholder")}\n              className={`${inputClass} ${localeTextAlignment} font-mono tabular-nums`}\n              disabled={busy}\n              autoComplete="off"\n            />\n            <p id="representative-debt-hint" className="text-[11px] font-semibold leading-5 text-slate-500">{t("representativesVehicles.representatives.form.debtHint")}</p>'''
            ),
          ]

          for old, new in replacements:
            assert source.count(old) == 1, old[:120]
            source = source.replace(old, new)

          form_path.write_text(source, encoding='utf-8')

          i18n_path = Path('dashboard/src/i18n/representativesVehicles.ts')
          i18n = i18n_path.read_text(encoding='utf-8')
          i18n_replacements = [
            ('debtLimitPlaceholder: "0.000",\n        debtHint:', 'debtLimitPlaceholder: "مثال: 50.000",\n        debtRequired: "أدخل حد الذمم لكل عملية بيع.",\n        debtHint:'),
            ('debtLimitPlaceholder: "0.000",\n        debtHint:', 'debtLimitPlaceholder: "Example: 50.000",\n        debtRequired: "Enter a per-sale credit limit.",\n        debtHint:'),
          ]
          assert i18n.count(i18n_replacements[0][0]) == 2
          i18n = i18n.replace(i18n_replacements[0][0], i18n_replacements[0][1], 1)
          assert i18n.count(i18n_replacements[1][0]) == 1
          i18n = i18n.replace(i18n_replacements[1][0], i18n_replacements[1][1], 1)
          i18n_path.write_text(i18n, encoding='utf-8')

          test_path = Path('dashboard/src/pages/representatives-vehicles/representatives/RepresentativeForm.test.tsx')
          test = test_path.read_text(encoding='utf-8')
          old_mock = '''vi.mock("react-i18next", () => ({\n  useTranslation: () => ({\n    t: (key: string) => key,\n  }),\n}));'''
          new_mock = '''const translationState = vi.hoisted(() => ({\n  direction: "rtl" as "rtl" | "ltr",\n  language: "ar" as "ar" | "en",\n}));\n\nvi.mock("react-i18next", () => ({\n  useTranslation: () => ({\n    t: (key: string) => {\n      if (key === "representativesVehicles.representatives.form.debtLimitPlaceholder") {\n        return translationState.language === "ar" ? "مثال: 50.000" : "Example: 50.000";\n      }\n      return key;\n    },\n    i18n: { dir: () => translationState.direction },\n  }),\n}));'''
          assert test.count(old_mock) == 1
          test = test.replace(old_mock, new_mock)

          old_before = '''beforeEach(() => {\n  vi.stubGlobal("crypto", { randomUUID: vi.fn(() => requestUuid) });\n});'''
          new_before = '''beforeEach(() => {\n  translationState.direction = "rtl";\n  translationState.language = "ar";\n  vi.stubGlobal("crypto", { randomUUID: vi.fn(() => requestUuid) });\n});'''
          assert test.count(old_before) == 1
          test = test.replace(old_before, new_before)

          insertion = '''\n\n  it("keeps a new disabled credit limit hidden and reveals an empty localized amount input", () => {\n    const onSubmit = vi.fn();\n    render(<RepresentativeForm onCancel={() => undefined} onSubmit={onSubmit} />);\n\n    expect(screen.queryByLabelText("representativesVehicles.representatives.fields.debtLimit")).toBeNull();\n    fireEvent.click(screen.getByLabelText("representativesVehicles.representatives.fields.debtPermission"));\n\n    const limit = screen.getByLabelText("representativesVehicles.representatives.fields.debtLimit") as HTMLInputElement;\n    expect(limit.value).toBe("");\n    expect(limit.placeholder).toBe("مثال: 50.000");\n    fireEvent.change(limit, { target: { value: "50.000" } });\n    expect(limit.value).toBe("50.000");\n  });\n\n  it("requires an explicit debt amount when a new representative enables credit", () => {\n    const onSubmit = vi.fn();\n    const { container } = render(<RepresentativeForm onCancel={() => undefined} onSubmit={onSubmit} />);\n    fireEvent.change(screen.getByLabelText("representativesVehicles.representatives.fields.name"), { target: { value: "Ahmad" } });\n    fireEvent.change(screen.getByLabelText("representativesVehicles.representatives.fields.username"), { target: { value: "rep17" } });\n    fireEvent.change(screen.getByLabelText("representativesVehicles.representatives.fields.password"), { target: { value: "password8" } });\n    fireEvent.click(screen.getByLabelText("representativesVehicles.representatives.fields.debtPermission"));\n    fireEvent.submit(container.querySelector("form")!);\n\n    expect(onSubmit).not.toHaveBeenCalled();\n    expect(screen.getByRole("alert").textContent).toBe("representativesVehicles.representatives.form.debtRequired");\n  });\n\n  it("uses the safe disabled zero only in the new create payload", async () => {\n    const onSubmit = vi.fn();\n    const { container } = render(<RepresentativeForm onCancel={() => undefined} onSubmit={onSubmit} />);\n    fireEvent.change(screen.getByLabelText("representativesVehicles.representatives.fields.name"), { target: { value: "Ahmad" } });\n    fireEvent.change(screen.getByLabelText("representativesVehicles.representatives.fields.username"), { target: { value: "rep17" } });\n    fireEvent.change(screen.getByLabelText("representativesVehicles.representatives.fields.password"), { target: { value: "password8" } });\n    fireEvent.submit(container.querySelector("form")!);\n\n    await waitFor(() => expect(onSubmit).toHaveBeenCalledWith(expect.objectContaining({\n      can_allow_debt: false,\n      max_debt_limit: "0.000",\n    }), requestUuid));\n  });\n\n  it("preserves the stored edit value and selects it only for the first editing focus", () => {\n    render(<RepresentativeForm representative={representative} onCancel={() => undefined} onSubmit={vi.fn()} />);\n    const limit = screen.getByLabelText("representativesVehicles.representatives.fields.debtLimit") as HTMLInputElement;\n    expect(limit.value).toBe("25.500");\n\n    fireEvent.focus(limit);\n    expect(limit.value).toBe("25.500");\n    expect(limit.selectionStart).toBe(0);\n    expect(limit.selectionEnd).toBe("25.500".length);\n\n    fireEvent.change(limit, { target: { value: "50.000" } });\n    fireEvent.blur(limit);\n    limit.setSelectionRange("50.000".length, "50.000".length);\n    fireEvent.focus(limit);\n    expect(limit.value).toBe("50.000");\n    expect(limit.selectionStart).toBe("50.000".length);\n    expect(limit.selectionEnd).toBe("50.000".length);\n  });\n\n  it("uses one logical field tree with RTL visual alignment and LTR value ordering", () => {\n    const { container } = render(<RepresentativeForm representative={representative} onCancel={() => undefined} onSubmit={vi.fn()} />);\n    const form = container.querySelector("form")!;\n    const username = screen.getByLabelText("representativesVehicles.representatives.fields.username") as HTMLInputElement;\n    const phone = screen.getByLabelText("representativesVehicles.representatives.fields.phone") as HTMLInputElement;\n\n    expect(form.getAttribute("dir")).toBe("rtl");\n    expect(username.dir).toBe("ltr");\n    expect(phone.dir).toBe("ltr");\n    expect(username.value).toBe("rep17");\n    expect(phone.value).toBe("+962790000000");\n    expect(username.className).toContain("text-right");\n    expect(phone.className).toContain("text-right");\n  });\n\n  it("switches the same form structure to natural LTR alignment", () => {\n    translationState.direction = "ltr";\n    translationState.language = "en";\n    const { container } = render(<RepresentativeForm representative={representative} onCancel={() => undefined} onSubmit={vi.fn()} />);\n    const username = screen.getByLabelText("representativesVehicles.representatives.fields.username") as HTMLInputElement;\n    const phone = screen.getByLabelText("representativesVehicles.representatives.fields.phone") as HTMLInputElement;\n\n    expect(container.querySelector("form")?.getAttribute("dir")).toBe("ltr");\n    expect(username.className).toContain("text-left");\n    expect(phone.className).toContain("text-left");\n    expect(username.value).toBe("rep17");\n    expect(phone.value).toBe("+962790000000");\n  });\n\n  it("keeps the narrow-screen logical input order name, username, phone, password, then credit", () => {\n    const { container } = render(<RepresentativeForm onCancel={() => undefined} onSubmit={vi.fn()} />);\n    const controls = Array.from(container.querySelectorAll("input")).map((input) => input.id || input.type);\n    expect(controls).toEqual([\n      "representative-name",\n      "representative-username",\n      "representative-phone",\n      "representative-password",\n      "checkbox",\n    ]);\n  });'''
          anchor = '\n  it("disables credit authority without destroying the stored per-sale limit", async () => {'
          assert test.count(anchor) == 1
          test = test.replace(anchor, insertion + anchor)
          test_path.write_text(test, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Representatives focused suite
        working-directory: dashboard
        run: npx vitest run src/pages/representatives-vehicles

      - name: Affected ESLint
        working-directory: dashboard
        run: npx eslint src/pages/representatives-vehicles src/i18n/representativesVehicles.ts

      - name: TypeScript baseline comparison
        shell: bash
        run: |
          set -euo pipefail
          rm -rf baseline
          mkdir -p baseline
          git archive --format=tar --output=/tmp/dashboard-prev.tar "$PREVIOUS_HEAD" dashboard
          tar -xf /tmp/dashboard-prev.tar -C baseline
          cd dashboard
          node scripts/check-types-against-baseline.mjs ../baseline/dashboard

      - name: Production build
        working-directory: dashboard
        run: npm run build

      - name: Real browser responsive RTL LTR acceptance
        working-directory: dashboard
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          cat > representative-form-acceptance.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /></head>
          <body><div id="root"></div><script type="module" src="/src/representative-form-acceptance.tsx"></script></body></html>
          HTML
          cat > src/representative-form-acceptance.tsx <<'TSX'
          import React from "react";
          import { createRoot } from "react-dom/client";
          import { createInstance } from "i18next";
          import { I18nextProvider } from "react-i18next";
          import "./index.css";
          import { Modal } from "./components/ui/modal";
          import { representativesVehicles } from "./i18n/representativesVehicles";
          import { RepresentativeForm } from "./pages/representatives-vehicles/representatives/RepresentativeForm";

          const params = new URLSearchParams(window.location.search);
          const lang = params.get("lang") === "en" ? "en" : "ar";
          const mode = params.get("mode") === "edit" ? "edit" : "create";
          const instance = createInstance();
          await instance.init({
            lng: lang,
            fallbackLng: "en",
            initImmediate: false,
            interpolation: { escapeValue: false },
            resources: {
              ar: { translation: { representativesVehicles: representativesVehicles.ar, common: { cancel: "إلغاء", save: "حفظ", saving: "جارٍ الحفظ...", close: "إغلاق" } } },
              en: { translation: { representativesVehicles: representativesVehicles.en, common: { cancel: "Cancel", save: "Save", saving: "Saving...", close: "Close" } } },
            },
          });
          document.documentElement.lang = lang;
          document.documentElement.dir = instance.dir();
          const representative = mode === "edit" ? {
            id: 17,
            full_name: "Ahmad Saleh",
            username: "rep17",
            phone_number: "+962790000000",
            is_active: true,
            can_allow_debt: true,
            max_debt_limit: "25.500",
          } : null;
          createRoot(document.getElementById("root")!).render(
            <I18nextProvider i18n={instance}>
              <Modal isOpen onClose={() => undefined} title={instance.t("representativesVehicles.representatives.createTitle")} maxWidth="max-w-lg">
                <RepresentativeForm representative={representative} onCancel={() => undefined} onSubmit={() => undefined} />
              </Modal>
            </I18nextProvider>,
          );
          TSX
          cat > playwright.acceptance.config.cjs <<'JS'
          module.exports = {
            testDir: ".",
            testMatch: "representative-form.acceptance.spec.cjs",
            workers: 1,
            reporter: "line",
            use: { headless: true, channel: "chrome" },
          };
          JS
          cat > representative-form.acceptance.spec.cjs <<'JS'
          const { test, expect } = require("@playwright/test");
          const base = "http://127.0.0.1:4178/representative-form-acceptance.html";

          async function panelMetrics(page) {
            return page.locator(".app-modal-panel").evaluate((panel) => {
              const r = panel.getBoundingClientRect();
              return { left: r.left, right: r.right, top: r.top, bottom: r.bottom, width: r.width, viewport: innerWidth, scrollWidth: document.documentElement.scrollWidth };
            });
          }

          for (const width of [320, 375, 768, 1024, 1440]) {
            test(`Arabic modal remains inside viewport at ${width}px`, async ({ page }) => {
              await page.setViewportSize({ width, height: width <= 375 ? 640 : 900 });
              await page.goto(`${base}?lang=ar&mode=create`);
              const panel = page.locator(".app-modal-panel");
              await expect(panel).toBeVisible();
              const metrics = await panelMetrics(page);
              expect(metrics.left).toBeGreaterThanOrEqual(0);
              expect(metrics.right).toBeLessThanOrEqual(metrics.viewport + 0.5);
              expect(metrics.scrollWidth).toBeLessThanOrEqual(metrics.viewport);
              if (width >= 768) expect(metrics.width).toBeLessThanOrEqual(513);
              await expect(page.getByRole("heading")).toBeVisible();
              await expect(page.getByRole("button", { name: "إغلاق" })).toBeVisible();

              const inputs = page.locator(".app-modal-panel input");
              const count = await inputs.count();
              for (let i = 0; i < count; i += 1) {
                const box = await inputs.nth(i).boundingBox();
                expect(box).not.toBeNull();
                expect(box.x).toBeGreaterThanOrEqual(metrics.left - 1);
                expect(box.x + box.width).toBeLessThanOrEqual(metrics.right + 1);
              }

              const body = page.locator(".app-modal-body");
              await body.evaluate((node) => { node.scrollTop = node.scrollHeight; });
              await expect(page.getByRole("button", { name: "حفظ" })).toBeVisible();
              await expect(page.getByRole("button", { name: "إلغاء" })).toBeVisible();
            });
          }

          test("RTL aligns placeholders right while preserving Latin username and phone digit order", async ({ page }) => {
            await page.setViewportSize({ width: 1024, height: 900 });
            await page.goto(`${base}?lang=ar&mode=create`);
            const form = page.locator("form");
            await expect(form).toHaveAttribute("dir", "rtl");
            const username = page.locator("#representative-username");
            const phone = page.locator("#representative-phone");
            await expect(username).toHaveAttribute("placeholder", "اسم الدخول");
            await expect(phone).toHaveAttribute("placeholder", "رقم الهاتف");
            expect(await username.evaluate((el) => getComputedStyle(el).textAlign)).toBe("right");
            expect(await phone.evaluate((el) => getComputedStyle(el).textAlign)).toBe("right");
            const before = await Promise.all([username.boundingBox(), phone.boundingBox()]);
            expect(before[0].x).toBeGreaterThan(before[1].x);
            await username.fill("rep17");
            await phone.fill("+962790000000");
            await expect(username).toHaveValue("rep17");
            await expect(phone).toHaveValue("+962790000000");
            await expect(username).toHaveAttribute("dir", "ltr");
            await expect(phone).toHaveAttribute("dir", "ltr");
          });

          test("LTR keeps Username left and Phone right with natural alignment", async ({ page }) => {
            await page.setViewportSize({ width: 1024, height: 900 });
            await page.goto(`${base}?lang=en&mode=create`);
            await expect(page.locator("form")).toHaveAttribute("dir", "ltr");
            const username = page.locator("#representative-username");
            const phone = page.locator("#representative-phone");
            expect(await username.evaluate((el) => getComputedStyle(el).textAlign)).toBe("left");
            expect(await phone.evaluate((el) => getComputedStyle(el).textAlign)).toBe("left");
            const boxes = await Promise.all([username.boundingBox(), phone.boundingBox()]);
            expect(boxes[0].x).toBeLessThan(boxes[1].x);
          });

          test("mobile stacks fields in logical order and new credit input starts empty", async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 640 });
            await page.goto(`${base}?lang=ar&mode=create`);
            const ids = ["#representative-name", "#representative-username", "#representative-phone", "#representative-password"];
            const tops = [];
            for (const id of ids) tops.push((await page.locator(id).boundingBox()).y);
            expect(tops[0]).toBeLessThan(tops[1]);
            expect(tops[1]).toBeLessThan(tops[2]);
            expect(tops[2]).toBeLessThan(tops[3]);
            await page.getByLabel("السماح بالبيع بالذمم").check();
            const debt = page.locator("#representative-debt-limit");
            await expect(debt).toHaveValue("");
            await expect(debt).toHaveAttribute("placeholder", "مثال: 50.000");
            await debt.fill("50.000");
            await expect(debt).toHaveValue("50.000");
            await expect(page.getByText(/ليس حدًا يوميًا ولا يتجدد تلقائيًا/)).toBeVisible();
          });

          test("edit keeps persisted credit value and selects it only on first focus", async ({ page }) => {
            await page.setViewportSize({ width: 768, height: 900 });
            await page.goto(`${base}?lang=ar&mode=edit`);
            const debt = page.locator("#representative-debt-limit");
            await expect(debt).toHaveValue("25.500");
            await debt.focus();
            let selection = await debt.evaluate((el) => [el.selectionStart, el.selectionEnd, el.value]);
            expect(selection).toEqual([0, 6, "25.500"]);
            await page.keyboard.type("50.000");
            await expect(debt).toHaveValue("50.000");
            await debt.blur();
            await debt.focus();
            selection = await debt.evaluate((el) => [el.selectionStart, el.selectionEnd, el.value]);
            expect(selection).not.toEqual([0, 6, "50.000"]);
          });

name: Inventory CP3 Batch Actions acceptance

on:
  pull_request:
    branches:
      - integration/inventory-wave-2
    paths:
      - "wa_backend/api/warehouse/live_stock_source_detail.py"
      - "wa_backend/domains/batch_actions/**"
      - "wa_backend/tests/test_cp3_batch_actions_contract.py"
      - "wa_backend/tests/test_cp3_batch_actions_postgres.py"
      - "dashboard/src/pages/inventory/MainInventory.tsx"
      - "dashboard/src/pages/inventory/TabBatches.tsx"
      - "dashboard/src/pages/inventory/batches/BatchDispositionManager.tsx"
      - "dashboard/src/pages/inventory/batches/BatchFocusWorkspace.tsx"
      - "dashboard/src/pages/inventory/batches/useBatchDispositionCommand.ts"
      - "dashboard/src/pages/inventory/batches/StockStatusChangeDialog.tsx"
      - "dashboard/src/pages/inventory/batches/StockStatusActionsPanel.tsx"
      - "dashboard/src/pages/inventory/batches/useStockStatusCommand.ts"
      - "dashboard/src/pages/inventory/batches/useWarehouseBatchActionSource.ts"
      - "dashboard/src/pages/inventory/batches/batchActionContracts.ts"
      - "dashboard/src/pages/inventory/batches/batchActionsI18n.ts"
      - "dashboard/src/test/inventory-cp3-batch-actions.test.tsx"
      - ".github/workflows/inventory-cp3-batch-actions-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp3-batch-actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: Cp3BatchActionsFunctionalOnlyKeyAbc123456789012345678901
      DATABASE_URL: postgresql+asyncpg://cp3_unit@127.0.0.1:1/cp3_unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: CP3 focused read-contract acceptance
        working-directory: wa_backend
        run: python -m pytest -q tests/test_cp3_batch_actions_contract.py
      - name: Existing disposition and status-change regressions
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_inbound_no_lot_frozen_contract.py
          tests/test_warehouse_transfers_canonical_auth_cutover.py
          -k "not ledger"
      - name: CP7 source-detail regression
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_cp7_live_stock_contract.py
          tests/test_live_stock_batch_detail_disposition_contract.py
      - name: CP8 status and special-transfer compatibility smoke
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_warehouse_transfers_canonical_auth_cutover.py::WarehouseTransfersCanonicalAuthCutoverTests::test_exact_direct_capability_mapping_is_preserved
      - name: CP9 stocktake movement compatibility smoke
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_cp9_stocktake_closure_contract.py::CP9StocktakeClosureContractTests::test_stock_correction_remains_authoritative_movement_posting
      - name: CP10 Ledger movement evidence compatibility smoke
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_cp10_ledger_backend.py::test_append_only_command_uses_canonical_movement_path_and_exact_delta
      - name: CP11 permission catalog and access compatibility smoke
        working-directory: wa_backend
        run: |
          python -m pytest -q tests/test_cp11_inventory_access_backend.py::test_cp11_dashboard_labels_cover_the_entire_backend_registry_without_raw_fallback
          python - <<'PY'
          import inspect
          from pathlib import Path
          from api.warehouse import transfers
          from domains.authorization.capabilities import PERMISSIONS

          required = {"batch.disposition", "inventory.status_change"}
          assert required <= set(PERMISSIONS)
          migration = Path("alembic/versions/19c740dc40e8_stage4d_batch_disposition_and_portion_.py").read_text(encoding="utf-8")
          for code in required:
              assert code in migration
          assert "batch.disposition" in inspect.getsource(transfers.change_batch_disposition)
          assert "inventory.status_change" in inspect.getsource(transfers.change_inventory_status)
          print("CP11_CP3_PERMISSION_COMPAT=PASS")
          PY
      - name: CP3 changed-backend py_compile
        working-directory: wa_backend
        run: >-
          python -m py_compile
          api/warehouse/live_stock_source_detail.py
          domains/batch_actions/__init__.py
          domains/batch_actions/status_change.py
          tests/test_cp3_batch_actions_contract.py
          tests/test_cp3_batch_actions_postgres.py

  postgres-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: Cp3BatchActionsPostgresOnlyKeyAbc1234567890123456789012
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_CP3_PG_GATE: "1"
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://cp1_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL acceptance dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
      - name: Start disposable PostgreSQL 16
        run: |
          docker run --detach --name cp3-postgres \
            --env POSTGRES_USER=cp1_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec cp3-postgres pg_isready -U cp1_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs cp3-postgres
          exit 1
      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              if conn.execute("SELECT 1 FROM pg_roles WHERE rolname='wanasah_app'").fetchone() is None:
                  conn.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate disposable CP3 database
        working-directory: wa_backend
        run: alembic upgrade head
      - name: Grant restricted runtime DML and seed permissions
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              conn.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
              conn.execute("INSERT INTO permissions(code) VALUES ('inventory.read'), ('inbound.create'), ('batch.disposition'), ('inventory.status_change') ON CONFLICT(code) DO NOTHING")
          PY
      - name: CP3 real PostgreSQL 16 acceptance
        working-directory: wa_backend
        run: python -m pytest -q -s tests/test_cp3_batch_actions_postgres.py

  dashboard-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked Dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: CP3 focused Dashboard acceptance
        working-directory: dashboard
        run: npm test -- src/test/inventory-cp3-batch-actions.test.tsx --reporter=verbose
      - name: CP2 Batches regression
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-cp2-batches-dashboard.test.tsx
          src/test/inventory-batches-expiry-semantics.test.tsx
          --reporter=verbose
      - name: CP7 Live Stock regression
        working-directory: dashboard
        run: >-
          npm test --
          src/test/inventory-cp7-live-stock.test.tsx
          src/test/inventory-cp7-live-stock-parity.test.tsx
          --reporter=verbose
      - name: TypeScript noEmit
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: Production Dashboard build
        working-directory: dashboard
        run: npm run build

  scope-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve dynamic wave merge-base
        id: base
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            base=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          else
            git fetch origin integration/inventory-wave-2
            base=$(git merge-base origin/integration/inventory-wave-2 HEAD)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "CP3_MERGE_BASE=$base"
      - name: Diff whitespace gate
        run: git diff --check "${{ steps.base.outputs.sha }}" HEAD --
      - name: Exact CP3 allowed-file scope
        env:
          CP3_BASE: ${{ steps.base.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          allowed = {
              ".github/workflows/inventory-cp3-batch-actions-acceptance.yml",
              "wa_backend/api/warehouse/live_stock_source_detail.py",
              "wa_backend/domains/batch_actions/__init__.py",
              "wa_backend/domains/batch_actions/status_change.py",
              "wa_backend/tests/test_cp3_batch_actions_contract.py",
              "wa_backend/tests/test_cp3_batch_actions_postgres.py",
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/TabBatches.tsx",
              "dashboard/src/pages/inventory/batches/BatchDispositionManager.tsx",
              "dashboard/src/pages/inventory/batches/BatchFocusWorkspace.tsx",
              "dashboard/src/pages/inventory/batches/useBatchDispositionCommand.ts",
              "dashboard/src/pages/inventory/batches/StockStatusChangeDialog.tsx",
              "dashboard/src/pages/inventory/batches/StockStatusActionsPanel.tsx",
              "dashboard/src/pages/inventory/batches/useStockStatusCommand.ts",
              "dashboard/src/pages/inventory/batches/useWarehouseBatchActionSource.ts",
              "dashboard/src/pages/inventory/batches/batchActionContracts.ts",
              "dashboard/src/pages/inventory/batches/batchActionsI18n.ts",
              "dashboard/src/test/inventory-cp3-batch-actions.test.tsx",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["CP3_BASE"], "HEAD", "--"],
              text=True,
          ).splitlines())
          if changed != allowed:
              raise SystemExit(
                  "CP3_SCOPE=FAIL\n"
                  f"missing={sorted(allowed - changed)}\n"
                  f"extra={sorted(changed - allowed)}"
              )
          forbidden = (
              "wa_backend/api/warehouse/transfers.py",
              "wa_backend/api/warehouse/transfer_policy.py",
              "dashboard/src/pages/inventory/TabTransfers.tsx",
              "dashboard/src/pages/inventory/transfers/",
              "dashboard/src/features/inventory/quality/QualityHandlingDestinationsCard.tsx",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/",
              "wa_backend/api/warehouse/stocktake.py",
              "dashboard/src/pages/inventory/Tab4Ledger.tsx",
              "dashboard/src/pages/inventory/ledger/",
              "wa_backend/api/warehouse/ledger.py",
              "wa_backend/api/warehouse/inbound_adjustments.py",
              "wa_backend/domains/ledger/",
              "wa_backend/alembic/versions/",
          )
          for path in changed:
              if any(path == prefix or path.startswith(prefix) for prefix in forbidden):
                  raise SystemExit(f"CP3_SCOPE=FAIL forbidden path: {path}")
          print(f"CP3_SCOPE=PASS files={len(changed)}")
          PY

name: TEMP Stocktake canonical review gate

on:
  push:
    branches:
      - lead/stocktake-latest-main-integration-gate

permissions:
  contents: read

jobs:
  focused-stocktake-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: StocktakeLeadReviewGateOnlyKey123456789012345678901234
      DATABASE_URL: postgresql+asyncpg://stock_unit@127.0.0.1:1/stock_unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://stock_admin@127.0.0.1:1/stock_unit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r wa_backend/requirements.txt pytest pytest-asyncio httpx
      - name: Compile Stocktake runtime and focused tests
        run: |
          python -m py_compile \
            wa_backend/api/warehouse/stocktake.py \
            wa_backend/tests/test_stocktake_canonical_auth_cutover.py
      - name: Focused Stocktake canonical tests
        working-directory: wa_backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_stocktake_canonical_auth_cutover.py \
            tests/test_canonical_backoffice_capability_access.py \
            tests/test_canonical_backoffice_authorization_dependency.py \
            tests/test_canonical_backoffice_authorization_subject.py \
            tests/test_canonical_backoffice_runtime_compatibility.py \
            tests/test_inventory_multi_location_authority.py
      - name: Stocktake forbidden-symbol and dependency audit
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('wa_backend/api/warehouse/stocktake.py').read_text(encoding='utf-8')
          forbidden = ('get_current_driver','get_current_admin','InventoryAccess','current_admin','.is_admin','legacy_actor.company_id','legacy_backoffice_transport')
          for token in forbidden:
              assert token not in src, token
          assert 'get_current_backoffice_capability_access' in src
          assert 'get_current_backoffice_legacy_driver' in src
          assert 'BackofficeCapabilityAccess' in src
          assert 'company_id = access.company_id' in src
          PY
      - name: Latest-main integration tree check
        run: |
          test "$(git rev-parse HEAD^{tree})" = "424223026ac50e40fef7c2061b18ddd1b97be7da"
      - name: Diff whitespace gate
        run: git diff --check 5a5257a97e83bc407c728a49391b29972280482f...HEAD

name: Live Stock in-flight authority acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/test/live-stock-warm-authority.test.tsx"
      - "dashboard/src/test/live-stock-batch-detail-freshness.test.tsx"
      - "dashboard/e2e/live-stock-inflight*"
      - "dashboard/src/hooks/useAuthFetch.ts"
      - "dashboard/src/lib/authStorage.ts"
      - "dashboard/src/pages/Login.tsx"
      - "dashboard/src/test/auth-session*"
      - "dashboard/src/App.tsx"
      - "dashboard/src/components/operations/DashboardLayout.tsx"
      - "dashboard/src/hooks/useInventoryAccess.ts"
      - "dashboard/src/hooks/useDashboardSession.ts"
      - "dashboard/src/features/tenantIdentity/useTenantIdentity.ts"
      - "dashboard/src/pages/DispatchBoard.tsx"
      - "dashboard/src/pages/products/import/useImportProductPolling.ts"
      - "wa_backend/tests/live_stock_inflight_security_probe.py"
      - ".github/workflows/live-stock-inflight-authority-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-stock-inflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  authority-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      ENVIRONMENT: test
      SECRET_KEY: LiveStockInflightDisposablePg16OnlyKey123456789012345678
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://inflight_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_REAL_BROWSER_GATE: "1"
      WANASAH_INFLIGHT_AUTH_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://inflight_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_OPERATIONAL_BROWSER_STATE: /tmp/live-stock-inflight-state.json
      VITE_API_URL: http://127.0.0.1:4174
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked Dashboard and existing focused peer
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps @testing-library/dom@10.4.1
      - name: Deterministic admission, stale response, batch and locale regressions
        working-directory: dashboard
        run: >-
          npx vitest run
          src/test/live-stock-warm-authority.test.tsx
          src/test/live-stock-batch-detail-freshness.test.tsx
          src/test/live-stock-batch-refresh-integration.test.tsx
          src/test/inventory-cp7-live-stock.test.tsx
          src/test/inventory-session-cache.test.ts
          src/test/auth-session-refresh.test.tsx
          src/test/auth-session-isolation.test.tsx
          src/test/auth-session-page-boundary.test.tsx
          src/test/auth-session-consumer-isolation.test.tsx
          src/test/dispatch-load-context.test.tsx
          src/test/product-import-realtime-lifecycle-j.test.tsx
          --reporter=default --reporter=junit --outputFile=node_modules/.cache/live-stock-inflight-unit.xml
      - name: Typecheck and lint evidence changes
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          python - <<'PY'
          import json, pathlib
          pathlib.Path("e2e/.inflight-types.json").write_text(json.dumps({
              "extends": "../tsconfig.app.json",
              "compilerOptions": {"types": ["node", "vitest/globals", "vite/client"]},
              "include": ["./live-stock-inflight-auth.test.tsx", "./live-stock-inflight.config.ts", "../src/test/auth-session-isolation.test.tsx", "../src/test/auth-session-consumer-isolation.test.tsx", "../src/test/dispatch-load-context.test.tsx"],
          }))
          PY
          npx tsc --noEmit -p e2e/.inflight-types.json
          npx eslint src/App.tsx src/components/operations/DashboardLayout.tsx src/hooks/useInventoryAccess.ts src/hooks/useDashboardSession.ts src/features/tenantIdentity/useTenantIdentity.ts src/pages/DispatchBoard.tsx src/pages/products/import/useImportProductPolling.ts src/test/auth-session-consumer-isolation.test.tsx src/test/auth-session-page-boundary.test.tsx src/test/dispatch-load-context.test.tsx src/hooks/useAuthFetch.ts src/lib/authStorage.ts src/test/auth-session-isolation.test.tsx e2e/live-stock-inflight-auth.test.tsx e2e/live-stock-inflight.config.ts
          npm run build
          node --test src/pages/Login.contract.test.mjs
      - name: Install existing backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio
      - name: Start disposable PG16 and restricted role
        run: |
          docker run --detach --name live-stock-inflight-pg \
            --env POSTGRES_USER=inflight_admin --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust --publish 127.0.0.1:55439:55439 postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec live-stock-inflight-pg pg_isready -U inflight_admin -d wanasah_no_lot_contract_test -p 55439; then break; fi
            sleep 1
          done
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Fresh schema and scoped runtime grants
        run: |
          cd wa_backend
          alembic upgrade head
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
              db.execute("INSERT INTO permissions(code) VALUES ('inventory.read'), ('location.read'), ('inbound.create') ON CONFLICT(code) DO NOTHING")
          dsn = make_url(os.environ["DATABASE_URL"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn) as db:
              assert db.execute("SELECT rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user").fetchone() == (False, False)
              rows = db.execute("SELECT relrowsecurity, relforcerowsecurity FROM pg_class WHERE relname IN ('inventory_balances','inventory_movements')").fetchall()
              assert len(rows) == 2 and all(a and b for a,b in rows)
          print("INFLIGHT_RUNTIME_ROLE_AND_FORCE_RLS PASS")
          PY
      - name: Reuse one canonical operational fixture
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/live_stock_operational_browser_support.py::test_prepare_operational_browser
          --junitxml=/tmp/live-stock-inflight-fixture.xml
      - name: Start actual FastAPI
        working-directory: wa_backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 4174 > /tmp/live-stock-inflight-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-stock-inflight-api.log
          exit 1
      - name: Genuine bearer revocation and delayed refresh security invariants
        working-directory: dashboard
        run: >-
          npx vitest run e2e/live-stock-inflight-auth.test.tsx --config e2e/live-stock-inflight.config.ts
          --reporter=default --reporter=junit --outputFile=node_modules/.cache/live-stock-inflight-http.xml
      - name: Require execution and expose every red invariant
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path, expected in [
              ("/tmp/live-stock-inflight-fixture.xml", 1),
              ("dashboard/node_modules/.cache/live-stock-inflight-unit.xml", 114),
              ("dashboard/node_modules/.cache/live-stock-inflight-http.xml", 7),
          ]:
              root = ET.parse(path).getroot()
              cases = list(root.iter("testcase"))
              assert cases and (expected is None or len(cases) == expected), (path, len(cases))
              assert not list(root.iter("skipped")), path
              failed = len(list(root.iter("failure"))) + len(list(root.iter("error")))
              print(f"INFLIGHT_CASES file={path} executed={len(cases)} failed={failed} skipped=0")
              assert failed == 0, "A security invariant remains RED: " + path
          PY
      - name: Enforce independent ownership and whitespace
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          baseline = os.environ["BASE"]
          assert re.fullmatch(r"[0-9a-f]{40}", baseline)
          base = subprocess.check_output(["git","merge-base",baseline,"HEAD"], text=True).strip()
          files = set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"], text=True).splitlines())
          owned = {
              ".github/workflows/live-stock-inflight-authority-acceptance.yml",
              ".github/workflows/dispatch-p0-route-stock-safety.yml",
              "dashboard/src/test/live-stock-warm-authority.test.tsx",
              "dashboard/src/test/live-stock-batch-detail-freshness.test.tsx",
              "dashboard/e2e/live-stock-inflight.config.ts",
              "dashboard/e2e/live-stock-inflight-auth.test.tsx",
              "docs/operations/LIVE_STOCK_INFLIGHT_AUTHORITY_FINDINGS.md",
              "dashboard/src/hooks/useAuthFetch.ts",
              "dashboard/src/lib/authStorage.ts",
              "dashboard/src/pages/Login.tsx",
              "dashboard/src/test/auth-session-isolation.test.tsx",
              "dashboard/src/test/auth-session-page-boundary.test.tsx",
              "dashboard/src/test/inventory-cp6-minimum-stock-dashboard.test.tsx",
              "wa_backend/tests/live_stock_inflight_security_probe.py",
              ".github/scripts/live_stock_ci_ownership.py",
              "dashboard/src/components/operations/TopBar.tsx",
              "dashboard/src/components/operations/OperationsSidebar.tsx",
              "dashboard/src/App.tsx",
              "dashboard/src/components/operations/DashboardLayout.tsx",
              "dashboard/src/hooks/useInventoryAccess.ts",
              "dashboard/src/hooks/useDashboardSession.ts",
              "dashboard/src/features/tenantIdentity/useTenantIdentity.ts",
              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/pages/products/import/useImportProductPolling.ts",
              "dashboard/src/test/auth-session-consumer-isolation.test.tsx",
              "dashboard/src/test/dispatch-load-context.test.tsx",
          }
          assert files <= owned, sorted(files - owned)
          subprocess.run(["git","diff","--check",base,"HEAD"], check=True)
          print("INFLIGHT_AUTH_REPAIR_SCOPE PASS")
          PY
      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-inflight-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dashboard/node_modules/.cache/live-stock-inflight
            dashboard/node_modules/.cache/live-stock-inflight-unit.xml
            dashboard/node_modules/.cache/live-stock-inflight-http.xml
            /tmp/live-stock-inflight-fixture.xml
            /tmp/live-stock-inflight-api.log
          if-no-files-found: warn

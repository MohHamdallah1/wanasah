              "dashboard/src/pages/DispatchBoard.tsx",
              "dashboard/src/test/dispatch-shop-reorder-scope-v1.test.tsx",
          }
          shop_order_843_new = shop_order_843_exact - {
              "dashboard/src/pages/DispatchBoard.tsx",
          }
          assert len(shop_order_843_exact) == 9 and len(shop_order_843_new) == 8

          # #856: one authorized ShopForm change must include all six paths.
          # The existing DispatchBoard alone still belongs to the older scope.
          shop_form_850_exact = {

name: Representatives audit security acceptance

on:
  push:
    branches:
      - sol/representatives-audit-security-acceptance
    paths:
      - ".github/workflows/representatives-audit-security-acceptance.yml"
      - "wa_backend/observability/http_errors.py"
      - "wa_backend/tests/test_http_error_bcrypt_redaction.py"
      - "wa_backend/tests/test_representatives_audit_security_runtime_db.py"

permissions:
  contents: read

env:
  ENVIRONMENT: test
  SECRET_KEY: RepresentativeAuditSecuritySyntheticSecret123456789012345678901234567890
  DATABASE_URL: postgresql+asyncpg://representatives_runtime@127.0.0.1:5432/representatives_audit_gate
  DATABASE_URL_MIGRATION: postgresql+asyncpg://representatives_audit_admin@127.0.0.1:5432/representatives_audit_gate
  WANASAH_REPRESENTATIVES_AUDIT_DB_GATE: "1"
  WANASAH_ERROR_LOG_PATH: /tmp/representatives-audit-security.log
  BASE_SHA: 19566ddefa81f9941de7cc72c608da66896c2c16

jobs:
  audit-security-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: representatives_audit_admin
          POSTGRES_DB: representatives_audit_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U representatives_audit_admin -d representatives_audit_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify branch scope before validation
        run: |
          python - <<'PY'
          import os
          import subprocess
          allowed = {
              ".github/workflows/representatives-audit-security-acceptance.yml",
              "wa_backend/observability/http_errors.py",
              "wa_backend/tests/test_http_error_bcrypt_redaction.py",
              "wa_backend/tests/test_representatives_audit_security_runtime_db.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          print("changed:", *sorted(changed), sep="\n- ")
          if unexpected:
              raise SystemExit(f"Unexpected branch scope: {unexpected}")
          PY

      - name: Install backend test dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic==1.18.4 pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1

      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE representatives_runtime LOGIN NOSUPERUSER "
                  "NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Migrate PostgreSQL 16 to head
        working-directory: wa_backend
        run: alembic upgrade head

      - name: Verify Alembic/model head
        working-directory: wa_backend
        run: alembic check

      - name: PostgreSQL Representative audit security acceptance
        working-directory: wa_backend
        run: python -m pytest -q tests/test_representatives_audit_security_runtime_db.py

      - name: HTTP error secret-redaction regression
        working-directory: wa_backend
        run: python -m pytest -q tests/test_http_error_bcrypt_redaction.py

      - name: Focused Representative and session regressions
        working-directory: wa_backend
        run: >-
          python -m pytest -q
          tests/test_representatives_lifecycle_credentials.py
          tests/test_representatives_contract.py
          tests/test_representatives_architecture.py
          tests/test_principal_session_invalidation.py
          tests/test_auth_session_token_contract.py
          tests/test_principal_refresh_sessions.py

      - name: Compile affected backend
        working-directory: wa_backend
        run: >-
          python -m compileall -q
          domains/representatives
          api/representatives
          observability/http_errors.py
          tests/test_representatives_audit_security_runtime_db.py
          tests/test_http_error_bcrypt_redaction.py

      - name: Diff whitespace gate
        run: git diff --check "$BASE_SHA" HEAD

      - name: Final branch scope gate
        run: |
          python - <<'PY'
          import os
          import subprocess
          allowed = {
              ".github/workflows/representatives-audit-security-acceptance.yml",
              "wa_backend/observability/http_errors.py",
              "wa_backend/tests/test_http_error_bcrypt_redaction.py",
              "wa_backend/tests/test_representatives_audit_security_runtime_db.py",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"Unexpected branch scope: {unexpected}")
          PY

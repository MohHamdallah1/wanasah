name: Flutter V1 App Bootstrap Theme Foundation

on:
  push:
    branches:
      - sol/flutter-v1-app-bootstrap-theme-foundation
  workflow_dispatch:
  pull_request:
    paths:
      - "wanasah_frontend/lib/main.dart"
      - "wanasah_frontend/lib/app/**"
      - "wanasah_frontend/test/app/**"
      - ".github/workflows/flutter-v1-app-bootstrap-theme-foundation.yml"

permissions:
  contents: read

jobs:
  app-bootstrap-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Prepare CI-only environment asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: App foundation focused and regression tests
        run: >-
          flutter test
          test/app/app_bootstrap_theme_foundation_test.dart
          test/features/auth/application/auth_session_recovery_test.dart
          test/core/network/api_failure_test.dart
          test/core/network/auth_interceptor_test.dart
          test/core/network/retry_policy_characterization_test.dart
          test/features/work_session/work_session_behavioral_closure_test.dart

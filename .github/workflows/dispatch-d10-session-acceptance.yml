name: Dispatch D10 actor-scoped session acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/pages/DispatchBoard.tsx"
      - "dashboard/src/components/dispatch/ShopBulkImportModal.tsx"
      - "dashboard/src/features/dispatch/sessionScope.ts"
      - "dashboard/src/features/dispatch/dispatchDrafts.ts"
      - "dashboard/src/lib/authStorage.ts"
      - "dashboard/src/test/dispatch-d10-*.test.ts"
      - "dashboard/src/test/auth-session-consumer-isolation.test.tsx"
      - "dashboard/src/test/dispatch-load-context.test.tsx"
      - ".github/workflows/dispatch-d10-session-acceptance.yml"

permissions:
  contents: read

jobs:
  session-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Verify whitespace
        run: git diff --check HEAD~1 HEAD
      - name: Install exact dashboard dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: One focused D10/accepted D09 and Vehicle session regression suite
        working-directory: dashboard
        run: >
          npm test --
          src/test/dispatch-d10-session-scope.test.ts
          src/test/dispatch-d10-drafts.test.ts
          src/test/auth-session-consumer-isolation.test.tsx
          src/test/dispatch-load-context.test.tsx

name: Flutter V1 Local Visit Projection Persistence Split

on:
  push:
    branches:
      - sol/flutter-v1-local-visit-projection-persistence-split
  workflow_dispatch:
  pull_request:
    paths:
      - "wanasah_frontend/lib/core/db/local_database.dart"
      - "wanasah_frontend/lib/core/db/visit/**"
      - "wanasah_frontend/test/core/db/**"
      - "wanasah_frontend/test/core/visit/local_inventory_projection_integrity_test.dart"
      - "wanasah_frontend/test/offline_durable_command_test.dart"
      - ".github/workflows/flutter-v1-local-visit-projection-persistence-split.yml"

permissions:
  contents: read

jobs:
  local-visit-projection-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: wanasah_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Prepare CI-only environment asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Visit persistence focused and regression tests
        run: >-
          flutter test
          test/core/db/visit_local_persistence_decomposition_test.dart
          test/core/visit/local_inventory_projection_integrity_test.dart
          test/core/visit/visit_command_correction_test.dart
          test/offline_durable_command_test.dart
          test/features/recovery/sync_recovery_reconciliation_closure_test.dart
          test/features/custody/pending_return_custody_projection_test.dart

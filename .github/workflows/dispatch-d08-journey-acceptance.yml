name: Dispatch D08 full first-company PG16 and Chromium operational journey

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/test_dispatch_d08_journey_postgres.py"
      - "dashboard/e2e/dispatch-d08-journey.spec.ts"
      - "dashboard/e2e/dispatch-d08-journey.config.ts"
      - ".github/workflows/dispatch-d08-journey-acceptance.yml"
      - "wa_backend/domains/dispatch/**"

permissions:
  contents: read

jobs:
  real-d08-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WANASAH_DISPATCH_D08_GATE: "1"
      ENVIRONMENT: test
      SECRET_KEY: D08SyntheticRealBrowserPG16Key1234567890123456789012345
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://d08_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://d08_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_DISPATCH_D08_STATE: /tmp/dispatch-d08-journey.json
      PYTHONPATH: ${{ github.workspace }}/wa_backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install canonical dependencies
        run: |
          python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
          python -m py_compile wa_backend/tests/test_dispatch_d08_journey_postgres.py
      - name: Start temporary PostgreSQL16
        run: |
          docker run --detach --name dispatch-d08-pg \
            --env POSTGRES_USER=d08_dispatch_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 postgres:16 -p 55439
          for attempt in $(seq 1 35); do
            if docker exec dispatch-d08-pg pg_isready -U d08_dispatch_admin -d wanasah_no_lot_contract_test -p 55439; then exit 0; fi
            sleep 1
          done
          docker logs dispatch-d08-pg
          exit 1
      - name: Create restricted non-bypass database role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate canonical schema
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant restricted runtime DML
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Actual Zone Shop import reorder route authorized PG16 operational journey
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_dispatch_d08_journey_postgres.py
          --junitxml=d08-real-pg16.xml
      - name: Start real FastAPI
        working-directory: wa_backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 4174 > /tmp/dispatch-d08-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dispatch-d08-api.log
          exit 1
      - name: Install Dashboard and real Chromium
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build production Dashboard
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174
        run: npm run build
      - name: Serve built Dashboard
        working-directory: dashboard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/dispatch-d08-ui.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/dispatch >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dispatch-d08-ui.log
          exit 1
      - name: Execute real authenticated D08 built Dashboard business journey and mobile
        working-directory: dashboard
        run: npx playwright test --config e2e/dispatch-d08-journey.config.ts
      - name: Preserve measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-d08-real-journey-${{ github.run_id }}
          path: |
            /tmp/dispatch-d08-journey.json
            wa_backend/d08-real-pg16.xml
            dashboard/node_modules/.cache/dispatch-d08-journey/
            /tmp/dispatch-d08-api.log
            /tmp/dispatch-d08-ui.log
          if-no-files-found: warn

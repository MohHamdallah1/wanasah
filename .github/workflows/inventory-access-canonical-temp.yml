name: Inventory access canonical temp gate

on:
  pull_request:
    paths:
      - "wa_backend/api/inventory_permissions.py"
      - "wa_backend/tests/test_inventory_access_canonical_boundary.py"
      - "wa_backend/tests/test_inventory_access_canonical_cutover.py"
      - "dashboard/src/hooks/useInventoryAccess.ts"
      - "dashboard/src/pages/inventory/TabInventoryAccess.tsx"
      - "dashboard/src/i18n/resources.ts"
      - "dashboard/src/test/inventory-access-canonical-contract.test.ts"
      - "dashboard/src/test/inventory-access.test.ts"
      - "dashboard/src/test/fixtures/batchFocus.ts"
      - "dashboard/src/test/inventory-batches-expiry-semantics.test.tsx"
      - ".github/workflows/inventory-access-canonical-temp.yml"

permissions:
  contents: read

jobs:
  backend-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: InventoryAccessCanonicalTempSecret123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://unit@127.0.0.1:1/unit
      DATABASE_URL_MIGRATION: postgresql+asyncpg://migration@127.0.0.1:1/unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt
      - name: Run focused backend tests
        working-directory: wa_backend
        run: |
          python -m unittest -v \
            tests.test_inventory_access_canonical_boundary \
            tests.test_inventory_access_canonical_cutover
      - name: Diff whitespace gate
        run: git diff --check

  dashboard-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Canonical access contract
        run: npx vitest run src/test/inventory-access-canonical-contract.test.ts
      - name: Inventory permission contract only
        run: npx vitest run src/test/inventory-access.test.ts -t "inventory permission contract"
      - name: Batch access semantic
        run: npx vitest run src/test/inventory-batches-expiry-semantics.test.tsx
      - name: Build
        run: npm run build
      - name: Diff whitespace gate
        working-directory: .
        run: git diff --check

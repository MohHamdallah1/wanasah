name: Flutter V1 Error Observability Closure

on:
  push:
    branches:
      - sol/flutter-v1-error-observability-closure
  workflow_dispatch:
  pull_request:
    paths:
      - "wanasah_frontend/lib/app/bootstrap/app_error_handlers.dart"
      - "wanasah_frontend/lib/app/bootstrap/app_bootstrap.dart"
      - "wanasah_frontend/lib/core/observability/**"
      - "wanasah_frontend/lib/features/auth/**"
      - "wanasah_frontend/lib/features/work_session/**"
      - "wanasah_frontend/lib/features/visits/presentation/**"
      - "wanasah_frontend/lib/features/recovery/presentation/**"
      - "wanasah_frontend/lib/features/shops/**"
      - "wanasah_frontend/lib/screens/add_shop_screen.dart"
      - "wanasah_frontend/test/core/observability/**"
      - ".github/workflows/flutter-v1-error-observability-closure.yml"

permissions:
  contents: read

jobs:
  error-observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wanasah_frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Prepare CI-only environment asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Error observability focused and regression tests
        run: >-
          flutter test
          test/core/observability/error_observability_closure_test.dart
          test/app/app_bootstrap_theme_foundation_test.dart
          test/features/auth/application/auth_failure_policy_test.dart
          test/features/auth/application/auth_session_recovery_test.dart
          test/features/work_session/work_session_behavioral_closure_test.dart
          test/features/work_session/session_route_authority_closure_test.dart
          test/features/visits/wiring/visit_field_operator_flow_test.dart
          test/features/visits/wiring/visit_submission_wiring_test.dart
          test/features/recovery/recovery_behavioral_closure_test.dart
          test/features/recovery/sync_recovery_reconciliation_closure_test.dart
          test/offline_durable_command_test.dart
          test/features/shops/shop_creation_reconciliation_test.dart
          test/features/shops/shop_location_feedback_test.dart

name: Flutter V1 Custody behavioral closure

on:
  push:
    branches:
      - sol/flutter-v1-custody-behavioral-closure
  pull_request:
    paths:
      - "wanasah_frontend/lib/features/custody/**"
      - "wanasah_frontend/lib/blocs/dashboard/**"
      - "wanasah_frontend/lib/screens/dashboard_screen.dart"
      - "wanasah_frontend/test/features/custody/**"
      - "wanasah_frontend/test/features/session_custody_decomposition_test.dart"
      - ".github/workflows/flutter-v1-custody-behavioral-closure.yml"

permissions:
  contents: read

jobs:
  custody-behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wanasah_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - name: Provide CI-only dotenv asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env
      - run: flutter pub get
      - name: Analyze Flutter
        run: flutter analyze
      - name: Custody focused tests
        run: flutter test test/features/custody
      - name: Session/Custody architecture regression
        run: flutter test test/features/session_custody_decomposition_test.dart
      - name: Work Session regression
        run: flutter test test/features/work_session/work_session_behavioral_closure_test.dart
      - name: Offline durable regression
        run: >-
          flutter test
          test/offline_durable_command_test.dart
          test/offline_owner_guard_test.dart

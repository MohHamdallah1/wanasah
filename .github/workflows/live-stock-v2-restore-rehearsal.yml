name: Live Stock v2 real restore recovery rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/test_live_stock_v2_restore_rehearsal_postgres.py"
      - "docs/operations/LIVE_STOCK_V2_ROLLOUT_READINESS_RUNBOOK.md"
      - ".github/workflows/live-stock-v2-restore-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-recovery-pg16:
    name: real-backup-restore-recovery-pg16
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      ENVIRONMENT: test
      SECRET_KEY: LiveStockV2RestoreRehearsalOnly123456789012345678901
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://v2_restore_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_LIVE_STOCK_V2_RESTORE_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://v2_restore_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_LIVE_STOCK_V2_RESTORE_MANIFEST: /tmp/live-stock-v2-restore-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Compile restore rehearsal
        working-directory: wa_backend
        run: python -m py_compile tests/test_live_stock_v2_restore_rehearsal_postgres.py

      - name: Start disposable PostgreSQL16
        run: |
          docker run --detach --name live-stock-v2-restore \
            --env POSTGRES_USER=v2_restore_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 \
            postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec live-stock-v2-restore pg_isready \
              -U v2_restore_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs live-stock-v2-restore
          exit 1

      - name: Create restricted NOBYPASSRLS runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Install fresh source schema
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check

      - name: Grant source runtime DML without bypassing RLS
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE "
                  "ON ALL TABLES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT USAGE, SELECT, UPDATE "
                  "ON ALL SEQUENCES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app"
              )
          PY

      - name: Seed canonical physical truth and persisted v1 restore point
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v2_restore_rehearsal_postgres.py::test_prepare_backup_source
          --junitxml=live-stock-v2-restore-source.xml

      - name: Take and inspect real PostgreSQL16 custom-format backup
        run: |
          docker exec live-stock-v2-restore pg_dump \
            -U v2_restore_admin -p 55439 \
            -d wanasah_no_lot_contract_test -Fc \
            > /tmp/live-stock-v2-source.dump
          test -s /tmp/live-stock-v2-source.dump
          sha256sum /tmp/live-stock-v2-source.dump \
            | tee /tmp/live-stock-v2-source.dump.sha256
          docker exec -i live-stock-v2-restore pg_restore -l \
            < /tmp/live-stock-v2-source.dump \
            > /tmp/live-stock-v2-source.restore-list.txt
          grep -q "TABLE DATA public inventory_balances" \
            /tmp/live-stock-v2-source.restore-list.txt
          grep -q "TABLE DATA public inventory_movements" \
            /tmp/live-stock-v2-source.restore-list.txt
          grep -q "TABLE DATA public inventory_cost_events" \
            /tmp/live-stock-v2-source.restore-list.txt
          grep -q "TABLE DATA public inventory_live_stock_projection" \
            /tmp/live-stock-v2-source.restore-list.txt

      - name: Restore backup into a separate disposable database
        run: |
          docker exec live-stock-v2-restore createdb \
            -U v2_restore_admin -p 55439 wanasah_live_stock_v2_restore_test
          docker exec -i live-stock-v2-restore pg_restore \
            -U v2_restore_admin -p 55439 \
            --no-owner --exit-on-error \
            -d wanasah_live_stock_v2_restore_test \
            < /tmp/live-stock-v2-source.dump

      - name: Restored v1 to v2 rollback recovery and fresh bearer RLS proof
        working-directory: wa_backend
        env:
          DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_live_stock_v2_restore_test
          DATABASE_URL_MIGRATION: postgresql+asyncpg://v2_restore_admin@127.0.0.1:55439/wanasah_live_stock_v2_restore_test
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v2_restore_rehearsal_postgres.py::test_restored_backup_recovers_v1_to_v2_without_authoritative_replay
          --junitxml=live-stock-v2-restore-recovery.xml

      - name: Reject skipped failed or empty restore evidence
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          files = [
              "live-stock-v2-restore-source.xml",
              "live-stock-v2-restore-recovery.xml",
          ]
          executed = 0
          for path in files:
              root = ET.parse(path).getroot()
              cases = list(root.iter("testcase"))
              assert len(cases) == 1, (path, len(cases))
              for item in cases:
                  assert not any(
                      item.find(tag) is not None
                      for tag in ("failure", "error", "skipped")
                  ), (path, item.attrib)
              executed += len(cases)
          print(
              "LIVE_STOCK_V2_REAL_BACKUP_RESTORE_RECOVERY=PASS "
              f"cases={executed} skipped=0"
          )
          PY

      - name: Verify bounded ownership and whitespace
        run: |
          base="$(git merge-base origin/main HEAD)"
          git diff --check "$base" HEAD --
          BASE="$base" python - <<'PY'
          import os
          import subprocess
          files = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", os.environ["BASE"], "HEAD"],
                  text=True,
              ).splitlines()
          )
          owned = {
              ".github/workflows/live-stock-v2-restore-rehearsal.yml",
              ".github/workflows/live-stock-v2-rollout-readiness.yml",
              "docs/operations/LIVE_STOCK_V2_ROLLOUT_READINESS_RUNBOOK.md",
              "wa_backend/tests/test_live_stock_v2_restore_rehearsal_postgres.py",
          }
          def check_scope(candidate):
              unexpected = candidate - owned
              assert not unexpected, f"Unowned V2 restore changes: {sorted(unexpected)}"
          check_scope(files)
          for probe in ("wa_backend/services.py", "wa_backend/domains/inventory/services.py"):
              try:
                  check_scope(files | {probe})
              except AssertionError as exc:
                  assert probe in str(exc)
              else:
                  raise AssertionError("Unexpected V2 restore ownership bypass: " + probe)
          print("LIVE_STOCK_V2_RESTORE_SCOPE=PASS negative_probes=2")
          PY

      - name: Retain disposable restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stock-v2-restore-rehearsal-${{ github.sha }}
          path: |
            wa_backend/live-stock-v2-restore-source.xml
            wa_backend/live-stock-v2-restore-recovery.xml
            /tmp/live-stock-v2-restore-manifest.json
            /tmp/live-stock-v2-source.dump.sha256
            /tmp/live-stock-v2-source.restore-list.txt
          if-no-files-found: warn


  rollout-pg16:
    name: g07-canonical-v1-v2-rollout-pg16
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      ENVIRONMENT: test
      SECRET_KEY: LiveStockG07RolloutPg16IsolatedOnly123456789012345678
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55440/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://g07_rollout_admin@127.0.0.1:55440/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_LIVE_STOCK_V2_ROLLOUT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55440/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://g07_rollout_admin@127.0.0.1:55440/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove exact starting-main ancestry and bounded G07 ownership
        run: |
          start=96c5ba374995e99b57aa7a004f0c8bf642e10e3b
          git merge-base --is-ancestor "$start" HEAD
          test "$(git merge-base "$start" HEAD)" = "$start"
          python - <<'PY'
          import subprocess
          start = "96c5ba374995e99b57aa7a004f0c8bf642e10e3b"
          files = set(subprocess.check_output(
              ["git", "diff", "--name-only", start, "HEAD"], text=True
          ).splitlines())
          expected = {".github/workflows/live-stock-v2-restore-rehearsal.yml"}
          assert files == expected, (files, expected)
          print("G07_SCOPE=PASS files=1 starting_main=" + start)
          PY
          git diff --check "$start" HEAD --

      - name: Install focused backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Start disposable PostgreSQL16
        run: |
          docker run --detach --name live-stock-g07-rollout             --env POSTGRES_USER=g07_rollout_admin             --env POSTGRES_DB=wanasah_no_lot_contract_test             --env POSTGRES_HOST_AUTH_METHOD=trust             --publish 127.0.0.1:55440:55440             postgres:16 -p 55440
          for attempt in $(seq 1 40); do
            if docker exec live-stock-g07-rollout pg_isready               -U g07_rollout_admin -d wanasah_no_lot_contract_test -p 55440; then
              exit 0
            fi
            sleep 1
          done
          docker logs live-stock-g07-rollout
          exit 1

      - name: Create restricted NOBYPASSRLS runtime role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Fresh schema and scoped runtime grants
        run: |
          cd wa_backend
          alembic upgrade head
          alembic check
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql"
          ).render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY

      - name: Execute canonical FIFO and MOVING_AVERAGE rollout acceptance
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v2_rollout_readiness_postgres.py
          --junitxml=/tmp/live-stock-g07-rollout.xml

      - name: Reject skips failures or incomplete costing coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/live-stock-g07-rollout.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 2, len(cases)
          assert not list(root.iter("failure"))
          assert not list(root.iter("error"))
          assert not list(root.iter("skipped"))
          print("G07_ROLLOUT_PG16=PASS cases=2 costing=FIFO,MOVING_AVERAGE skipped=0")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g07-rollout-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/live-stock-g07-rollout.xml
          if-no-files-found: error

  compatibility:
    name: g07-in-repo-consumer-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build current Dashboard consumer
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Execute focused Dashboard v2 consumer contracts
        working-directory: dashboard
        run: >-
          npx vitest run
          src/test/inventory-access.test.ts
          src/test/inventory-cp7-live-stock.test.tsx
          src/test/inventory-cp6-minimum-stock-dashboard.test.tsx
          src/pages/inventory/stocktake/StocktakeCp9Acceptance.test.tsx
          --reporter=verbose

      - name: Inventory tracked runtime cursor consumers
        run: |
          python - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(
              ["git", "grep", "-l", "/warehouse/inventory/cursor?", "--", "dashboard/src"],
              text=True,
          ).splitlines())
          expected = {
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/StockMinimumManager.tsx",
              "dashboard/src/pages/inventory/stocktake/hooks/useCycleCountStart.ts",
          }
          assert actual == expected, {"actual": sorted(actual), "expected": sorted(expected)}
          with open("/tmp/live-stock-g07-consumers.txt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(sorted(actual)) + "\n")
          print("G07_DASHBOARD_CONSUMERS=PASS count=3")
          print("G07_EXTERNAL_CLIENT_EVIDENCE=UNAVAILABLE")
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Execute focused FIELD Vehicle custody compatibility
        working-directory: wanasah_frontend
        run: |
          printf 'API_BASE_URL=http://127.0.0.1:8000\nSENTRY_DSN=\n' > .env
          flutter pub get
          flutter test test/features/custody/physical_stock_disclosure_safety_test.dart

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g07-consumers-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/live-stock-g07-consumers.txt
          if-no-files-found: error

  release-package:
    name: operational-go-no-go-package
    runs-on: ubuntu-24.04
    needs: [restore-recovery-pg16, rollout-pg16, compatibility]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build precise G07 operational package
        env:
          RESTORE_RESULT: ${{ needs.restore-recovery-pg16.result }}
          ROLLOUT_RESULT: ${{ needs.rollout-pg16.result }}
          COMPAT_RESULT: ${{ needs.compatibility.result }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          results = {
              "restore": os.environ["RESTORE_RESULT"],
              "rollout": os.environ["ROLLOUT_RESULT"],
              "compatibility": os.environ["COMPAT_RESULT"],
          }
          prep = "YES" if all(value == "success" for value in results.values()) else "NO"
          sha = os.environ["TESTED_SHA"]
          lines = [
              "# WANASAH Live Stock G07 release-readiness package",
              "",
              f"Tested SHA: `{sha}`",
              "Starting main: `96c5ba374995e99b57aa7a004f0c8bf642e10e3b`",
              "",
              "## Executed non-production evidence",
              f"- Real PostgreSQL16 backup -> separate restore -> v1 rejection -> rollback -> one-company rebuild -> fresh bearer readback -> idempotent second rebuild: {results['restore']}.",
              f"- Canonical FIFO + MOVING_AVERAGE v1->v2 rollout with restricted NOBYPASSRLS role and FORCE RLS: {results['rollout']}.",
              f"- Tracked Dashboard and FIELD Vehicle-custody compatibility: {results['compatibility']}.",
              "- External clients outside this repository and production deployment topology are UNAVAILABLE evidence and are not certified by CI.",
              "",
              "## Authorized per-company sequence",
              "1. Require explicit owner/change approval; record exact release SHA, approved company id, active Warehouse ids, operator, maintenance window and rollback owner.",
              "2. Take and verify the production-approved backup/snapshot: source identity, completion, checksum/catalog evidence, credentials and restore rehearsal on an approved non-production target.",
              "3. Deploy only mutually compatible API/Dashboard/mobile clients. Persisted v1 summaries must fail closed with 503 LIVE_STOCK_PROJECTION_NOT_READY, request id and no items.",
              "4. Using only the approved restricted NOBYPASSRLS application role, open ONE company-scoped transaction, establish canonical tenant context and call only rebuild_live_stock_company(company_id=approved_company_id, batch_size=1000).",
              "5. Before commit, assert readiness for every active Warehouse. Timeout, mismatch, unexpected scope, lock-budget breach or verification failure means ROLLBACK and NO-GO.",
              "6. Commit only after all checks pass. From a fresh transaction and real bearer verify v2 READY, Warehouse-only quantities, independent Vehicle/IN_TRANSIT custody, denial paths and unchanged movement/cost/idempotency evidence.",
              "7. If a second acceptance rebuild is used, require drifted_keys=0 and summary_repairs=0 without authoritative stock/cost changes.",
              "",
              "## Rollback and NO-GO criteria",
              "- Before commit: exception, timeout, killed connection, readiness/source mismatch or authorization uncertainty => rollback; v1 stays unavailable rather than empty.",
              "- After commit: DEGRADED/not-ready, scope mismatch, Route attribution, quantity mismatch, unexpected movement/cost event or revoked-access disclosure => stop Live Stock and investigate; never force READY or replay movements.",
              "- Database restore is a separate incident/change action and requires reconciliation of post-backup inventory and financial events.",
              "- Never roll back to a reader that treats legacy Vehicle projection as Warehouse stock.",
              "",
              "## Production p95/p99 procedure — NOT executed in CI",
              "1. Define owner/SRE-approved latency, error-rate and lock/timeout budgets before measurement. Undefined budgets => NO-GO.",
              "2. In the approved environment exercise representative Warehouse sizes, owner/restricted readers, limits 1/50/200, deep cursors, search/family/negative filters, batch/source reads and realistic concurrency.",
              "3. Measure end-to-end API p50/p95/p99 and error rate separately for warm and controlled cold-cache windows; capture PostgreSQL query latency, rows, buffers, lock waits, statement timeouts, CPU/IO and pool saturation.",
              "4. Record release SHA, company/sample scope, request ids, observation window and workload. Synthetic CI timing is never production evidence.",
              "5. Any p95/p99 above the approved budget, material error increase, lock/timeout breach, readiness failure or authority discrepancy => NO-GO/rollback.",
              "",
              "## Environment-specific blockers still required",
              "- Explicit owner/change approval.",
              "- Production-approved backup method, credentials, restore target and verified restore rehearsal.",
              "- Actual production DB size plus dump/restore duration and maintenance/lock budget.",
              "- Deployed API/Dashboard/mobile/external-client version compatibility.",
              "- Approved per-company restricted execution authority.",
              "- Real production p95/p99/error/lock evidence under representative load.",
              "- Post-backup inventory/financial reconciliation plan.",
              "- External client evidence unavailable from this repository.",
              "",
              f"TECHNICAL PREP READY: {prep}",
              "PRODUCTION G07 CLOSED: NO",
              "",
          ]
          report = "\n".join(lines)
          Path("/tmp/live-stock-g07-release-readiness.md").write_text(report, encoding="utf-8")
          print(report)
          if prep != "YES":
              raise SystemExit("G07 technical preflight failed; package remains NO-GO")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g07-release-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/live-stock-g07-release-readiness.md
          if-no-files-found: error

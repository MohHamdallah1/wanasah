name: Temporary representatives dashboard hardening acceptance

on:
  push:
    branches:
      - sol/representatives-dashboard-ui
    paths:
      - ".github/workflows/representatives-dashboard-hardening-temp.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked frontend dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Focused representatives dashboard tests
        working-directory: dashboard
        run: >-
          npm test --
          src/pages/representatives-vehicles/representatives/contracts.test.ts
          src/pages/representatives-vehicles/representatives/api.test.ts
          src/pages/representatives-vehicles/representatives/RepresentativeForm.test.tsx
          src/pages/representatives-vehicles/representatives/RepresentativeCredentialAction.test.tsx
          src/pages/representatives-vehicles/representatives/useRepresentativeInfiniteScroll.test.tsx
          src/pages/representatives-vehicles/representatives/useRepresentatives.test.tsx
          src/pages/representatives-vehicles/representatives/representativeAuthorization.test.ts
          src/pages/representatives-vehicles/RepresentativesVehiclesPage.test.tsx
      - name: Extract TypeScript baseline
        run: |
          mkdir baseline
          git archive --format=tar --output=baseline.tar 8d6ab2663598bb9ae9144bf319863a2bd9eb421e dashboard
          tar -xf baseline.tar -C baseline
      - name: Reject new TypeScript diagnostics
        working-directory: dashboard
        run: node scripts/check-types-against-baseline.mjs ../baseline/dashboard
      - name: Affected frontend lint
        working-directory: dashboard
        run: >-
          npx eslint
          src/pages/representatives-vehicles
          src/App.tsx
          src/components/operations/OperationsSidebar.tsx
          src/i18n/index.ts
          src/i18n/representativesVehicles.ts
      - name: Production build
        working-directory: dashboard
        run: npm run build
      - name: Diff whitespace gate
        run: git diff --check 8d6ab2663598bb9ae9144bf319863a2bd9eb421e HEAD
      - name: Branch scope gate
        shell: bash
        run: |
          unexpected="$(git diff --name-only 8d6ab2663598bb9ae9144bf319863a2bd9eb421e HEAD | grep -Ev '^(dashboard/src/pages/representatives-vehicles/|dashboard/src/App\.tsx$|dashboard/src/components/operations/OperationsSidebar\.tsx$|dashboard/src/i18n/index\.ts$|dashboard/src/i18n/representativesVehicles\.ts$|\.github/workflows/representatives-dashboard-hardening-temp\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files outside Dashboard ownership:\n%s\n' "$unexpected"
            exit 1
          fi

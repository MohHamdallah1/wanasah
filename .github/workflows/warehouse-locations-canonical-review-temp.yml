name: TEMP Warehouse Locations canonical review

on:
  pull_request:
    branches:
      - lead/warehouse-locations-canonical-review
  workflow_dispatch:

jobs:
  focused-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wa_backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile touched files
        run: python -m py_compile api/warehouse/locations.py tests/test_warehouse_locations_canonical_auth_cutover.py
      - name: Run Warehouse Locations focused source contracts directly
        run: |
          python - <<'PY'
          import runpy
          scope = runpy.run_path('tests/test_warehouse_locations_canonical_auth_cutover.py')
          names = sorted(name for name in scope if name.startswith('test_'))
          assert len(names) == 6, names
          for name in names:
              scope[name]()
          print(f'{len(names)} Warehouse Locations focused tests passed')
          PY
      - name: Canonical capability core
        run: python -m unittest -q tests.test_canonical_backoffice_capability_access
      - name: Canonical dependency core
        run: python -m unittest -q tests.test_canonical_backoffice_authorization_dependency
      - name: Authority and capability audit
        shell: bash
        run: |
          set -euo pipefail
          f=api/warehouse/locations.py
          ! grep -nE 'get_current_driver|InventoryAccess|current_admin|\.is_admin|legacy_actor\.company_id|actor\.company_id' "$f"
          test "$(grep -o 'get_current_backoffice_legacy_driver' "$f" | wc -l)" -eq 5
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('api/warehouse/locations.py').read_text()
          assert set(re.findall(r"['\"](location\.[a-z]+)['\"]", src)) == {'location.read','location.create','location.update','location.state'}
          PY

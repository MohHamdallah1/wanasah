name: TEMP Warehouse Locations canonical review

on:
  pull_request:
    branches:
      - lead/warehouse-locations-canonical-review
  workflow_dispatch:

jobs:
  focused-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wa_backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile touched runtime and test
        run: python -m py_compile api/warehouse/locations.py tests/test_warehouse_locations_canonical_auth_cutover.py
      - name: Token get_current_driver
        continue-on-error: true
        run: python -c "from pathlib import Path; s=Path('api/warehouse/locations.py').read_text(); assert 'get_current_driver' not in s"
      - name: Token InventoryAccess
        continue-on-error: true
        run: python -c "from pathlib import Path; s=Path('api/warehouse/locations.py').read_text(); assert 'InventoryAccess' not in s"
      - name: Token current_admin
        continue-on-error: true
        run: python -c "from pathlib import Path; s=Path('api/warehouse/locations.py').read_text(); assert 'current_admin' not in s"
      - name: Token is_admin
        continue-on-error: true
        run: python -c "from pathlib import Path; s=Path('api/warehouse/locations.py').read_text(); assert '.is_admin' not in s"
      - name: Token legacy_actor company
        continue-on-error: true
        run: python -c "from pathlib import Path; s=Path('api/warehouse/locations.py').read_text(); assert 'legacy_actor.company_id' not in s"
      - name: Worker focused tests
        run: pytest -q tests/test_warehouse_locations_canonical_auth_cutover.py
      - name: Canonical capability core
        run: pytest -q tests/test_canonical_backoffice_capability_access.py
      - name: Canonical dependency core
        run: pytest -q tests/test_canonical_backoffice_authorization_dependency.py
      - name: Legacy dependency count
        shell: bash
        run: test "$(grep -o 'get_current_backoffice_legacy_driver' api/warehouse/locations.py | wc -l)" -eq 5
      - name: Exact capability audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('api/warehouse/locations.py').read_text()
          got=set(re.findall(r"['\"](location\.[a-z]+)['\"]", src))
          expected={'location.read','location.create','location.update','location.state'}
          assert got == expected, (got, expected)
          PY

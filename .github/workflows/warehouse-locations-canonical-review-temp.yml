name: TEMP Warehouse Locations canonical review

on:
  pull_request:
    branches:
      - lead/warehouse-locations-canonical-review
  workflow_dispatch:

jobs:
  focused-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wa_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: wa_backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile touched runtime and test
        run: python -m py_compile api/warehouse/locations.py tests/test_warehouse_locations_canonical_auth_cutover.py
      - name: Focused authorization gate
        run: >-
          pytest -q
          tests/test_warehouse_locations_canonical_auth_cutover.py
          tests/test_canonical_backoffice_capability_access.py
          tests/test_canonical_backoffice_authorization_dependency.py
      - name: Forbidden runtime authority audit
        shell: bash
        run: |
          set -euo pipefail
          f=api/warehouse/locations.py
          ! grep -nE 'get_current_driver|InventoryAccess|current_admin|\.is_admin|legacy_actor\.company_id|actor\.company_id' "$f"
          test "$(grep -o 'get_current_backoffice_legacy_driver' "$f" | wc -l)" -eq 5
      - name: Exact capability audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('api/warehouse/locations.py').read_text()
          got=set(re.findall(r"['\"](location\.[a-z]+)['\"]", src))
          expected={'location.read','location.create','location.update','location.state'}
          assert got == expected, (got, expected)
          PY

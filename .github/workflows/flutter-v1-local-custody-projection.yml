name: Flutter V1 Local custody projection

on:
  push:
    branches:
      - sol/flutter-v1-local-custody-projection
  pull_request:
    paths:
      - "wanasah_frontend/lib/features/custody/**"
      - "wanasah_frontend/lib/blocs/dashboard/**"
      - "wanasah_frontend/lib/screens/dashboard_screen.dart"
      - "wanasah_frontend/test/features/custody/**"
      - ".github/workflows/flutter-v1-local-custody-projection.yml"

permissions:
  contents: read

jobs:
  local-custody-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - name: Prepare CI-only environment asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env
      - name: Resolve dependencies
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Custody projection and regressions
        run: >-
          flutter test
          test/features/custody/pending_return_custody_projection_test.dart
          test/features/custody/custody_behavioral_closure_test.dart
          test/features/session_custody_decomposition_test.dart
          test/offline_durable_command_test.dart
          test/features/recovery/recovery_behavioral_closure_test.dart

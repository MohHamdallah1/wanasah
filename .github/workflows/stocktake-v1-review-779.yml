name: Stocktake V1 Review evidence parity #779

on:
  pull_request:
    branches: [main]
    paths:
      - "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx"
      - "dashboard/src/pages/inventory/stocktake/StocktakeReviewV1Parity.test.tsx"
      - "dashboard/src/pages/inventory/stocktake/uiCopy.ts"
      - "dashboard/e2e/stocktake-v1-ux-776.spec.ts"
      - ".github/workflows/stocktake-v1-review-779.yml"

permissions:
  contents: read

jobs:
  review-evidence-ar-en:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Locked dashboard install
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Focused AR EN review parity tests
        working-directory: dashboard
        run: npm test -- src/pages/inventory/stocktake/StocktakeReviewV1Parity.test.tsx
      - name: TypeScript and scoped lint
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npx eslint src/pages/inventory/stocktake/StocktakeReviewPanel.tsx src/pages/inventory/stocktake/StocktakeReviewV1Parity.test.tsx src/pages/inventory/stocktake/uiCopy.ts e2e/stocktake-v1-ux-776.spec.ts
      - name: Exact frontend owner scope and diff check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$BASE_SHA" HEAD
          python - <<'PY'
          import os
          import subprocess
          files = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"],
              text=True,
          ).splitlines())
          expected = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
              "dashboard/e2e/stocktake-v1-ux-776.spec.ts",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewV1Parity.test.tsx",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          # #784 owner-approved operator UX: exact GitHub changed-file list.
          # Retain the original #779 expected scope byte-for-byte.
          operator_784 = {
              ".github/workflows/stocktake-v1-operator-782.yml",
              "dashboard/e2e/stocktake-v1-ux-776.spec.ts",
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeCycleStartModal.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeOperatorUx782.test.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/hooks/useCycleCountStart.ts",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          # Worker 1's separate CI-only compatibility PR. No UX edit allowed.
          ci_compat_784 = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
          }
          shell_789 = {
              "dashboard/src/pages/inventory/MainInventory.tsx",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeSessionCenter.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeShellLayout.test.tsx",
              "dashboard/e2e/stocktake-shell-782/stocktake-v1-ux-776.spec.ts",
          }
          workspace_788 = {
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeIndependentWait.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeUnifiedWorkspaceV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          final_ci_782 = {
              ".github/workflows/stocktake-v1-operator-782.yml",
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
              ".github/scripts/live_stock_ci_ownership.py",
          }
          # Exact approved density PRs and CI/browser bridge, no wildcard scope.
          compact_791 = {
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeUnifiedWorkspaceV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          # #792 has the identical exact file set already approved for #789.
          dialog_792 = set(shell_789)
          bridge_793 = set(final_ci_782) | {"dashboard/e2e/stocktake-v1-ux-776.spec.ts"}
          fast_795 = {
              "dashboard/e2e/stocktake-v1-ux-776.spec.ts",
              "dashboard/src/pages/inventory/Tab3Stocktake.tsx",
              "dashboard/src/pages/inventory/inventoryUtils.ts",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountEntryArithmetic.test.ts",
              "dashboard/src/pages/inventory/stocktake/StocktakeCountingPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeFastCountV1.test.tsx",
              "dashboard/src/pages/inventory/stocktake/countEntry.ts",
              "dashboard/src/pages/inventory/stocktake/discoveredContract.ts",
              "dashboard/src/pages/inventory/stocktake/hooks/useStocktakeCounting.ts",
              "dashboard/src/pages/inventory/stocktake/parsers.ts",
              "dashboard/src/pages/inventory/stocktake/types.ts",
              "dashboard/src/pages/inventory/stocktake/uiCopy.ts",
          }
          ci_796 = {
              ".github/workflows/stocktake-v1-operator-782.yml",
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
              ".github/workflows/stocktake-v1-session-read-fence.yml",
          }
          review_bidi_797 = {
              ".github/workflows/stocktake-v1-discovered-pg16-ui.yml",
              ".github/workflows/stocktake-v1-operator-782.yml",
              ".github/workflows/stocktake-v1-review-779.yml",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewPanel.tsx",
              "dashboard/src/pages/inventory/stocktake/StocktakeReviewV1Parity.test.tsx",
          }
          valid_scopes = {
              frozenset(expected): "REVIEW_EVIDENCE_779",
              frozenset(operator_784): "OPERATOR_UX_784",
              frozenset(ci_compat_784): "CI_COMPAT_784",
              frozenset(shell_789): "SINGLE_TOOLBAR_789",
              frozenset(workspace_788): "UNIFIED_WORKSPACE_788",
              frozenset(final_ci_782): "FINAL_CI_782",
              frozenset(compact_791): "COMPACT_COUNT_791",
              frozenset(bridge_793): "DENSITY_CI_BROWSER_BRIDGE",
              frozenset(fast_795): "FAST_COUNT_795",
              frozenset(ci_796): "FAST_CI_796",
              frozenset(review_bidi_797): "REVIEW_BIDI_797",
          }
          foreign = "wa_backend/api/warehouse/stocktake.py"

          def verify_scope(changed):
              matched = valid_scopes.get(frozenset(changed))
              assert matched is not None, {
                  "error": "STOCKTAKE_REVIEW_OWNER_SCOPE_FAIL",
                  "unexpected": sorted(changed - expected - operator_784 - ci_compat_784 - shell_789 - workspace_788 - final_ci_782 - compact_791 - dialog_792 - bridge_793 - fast_795 - ci_796 - review_bidi_797),
                  "changed": sorted(changed),
              }
              return matched

          # Neither foreign files nor subsets gain approval from this change.
          assert verify_scope(expected) == "REVIEW_EVIDENCE_779"
          assert verify_scope(operator_784) == "OPERATOR_UX_784"
          assert verify_scope(ci_compat_784) == "CI_COMPAT_784"
          assert verify_scope(shell_789) == "SINGLE_TOOLBAR_789"
          assert verify_scope(workspace_788) == "UNIFIED_WORKSPACE_788"
          assert verify_scope(final_ci_782) == "FINAL_CI_782"
          assert verify_scope(compact_791) == "COMPACT_COUNT_791"
          assert verify_scope(dialog_792) == "SINGLE_TOOLBAR_789"
          assert dialog_792 == shell_789
          assert verify_scope(bridge_793) == "DENSITY_CI_BROWSER_BRIDGE"
          assert verify_scope(fast_795) == "FAST_COUNT_795"
          assert verify_scope(ci_796) == "FAST_CI_796"
          assert verify_scope(review_bidi_797) == "REVIEW_BIDI_797"
          for invalid in (
              set(),
              operator_784 - {"dashboard/src/pages/inventory/MainInventory.tsx"},
              operator_784 | {foreign},
              ci_compat_784 | {foreign},
              expected | {foreign},
              shell_789 - {"dashboard/src/pages/inventory/MainInventory.tsx"},
              shell_789 | {foreign},
              workspace_788 - {"dashboard/src/pages/inventory/stocktake/uiCopy.ts"},
              workspace_788 | {foreign},
              final_ci_782 | {foreign},
              final_ci_782 - {".github/scripts/live_stock_ci_ownership.py"},
              shell_789 | workspace_788,
              compact_791 - {"dashboard/src/pages/inventory/stocktake/uiCopy.ts"},
              compact_791 | {foreign},
              dialog_792 - {"dashboard/src/pages/inventory/MainInventory.tsx"},
              dialog_792 | {foreign},
              bridge_793 - {".github/scripts/live_stock_ci_ownership.py"},
              bridge_793 | {foreign},
              compact_791 | dialog_792,
              fast_795 - {"dashboard/src/pages/inventory/stocktake/countEntry.ts"},
              fast_795 | {foreign},
              ci_796 - {".github/workflows/stocktake-v1-session-read-fence.yml"},
              ci_796 | {foreign},
              review_bidi_797 - {"dashboard/src/pages/inventory/stocktake/StocktakeReviewV1Parity.test.tsx"},
              review_bidi_797 | {foreign},
              review_bidi_797 | fast_795,
          ):
              try:
                  verify_scope(invalid)
              except AssertionError:
                  pass
              else:
                  raise AssertionError(f"Stocktake Review owner gate accepted forbidden scope: {sorted(invalid)}")
          print(f"STOCKTAKE_779_FRONTEND_ONLY={verify_scope(files)}_PASS")
          PY

name: Dispatch D06 secure company Shop route-scope and financial read

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/api/dispatch.py"
      - "wa_backend/domains/dispatch_shop_read_scope.py"
      - "wa_backend/domains/authorization/capabilities.py"
      - "wa_backend/alembic/versions/f6c2a7d4e890_d06_shop_financial_read.py"
      - "wa_backend/schemas.py"
      - "wa_backend/tests/test_dispatch_d06_secure_shop_reads_postgres.py"
      - "dashboard/src/pages/DispatchBoard.tsx"
      - "dashboard/src/components/dispatch/ShopTable.tsx"
      - "dashboard/src/features/dispatch/dispatchUiText.ts"
      - "dashboard/src/features/dispatch/shopForm/contract.ts"
      - "dashboard/src/types/dispatch.ts"
      - "dashboard/src/test/dispatch-d06-shop-financial-redaction.test.tsx"
      - ".github/workflows/dispatch-d06-shop-privacy.yml"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_API_URL: http://127.0.0.1:4174
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Exact authored diff whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD
      - name: Install pinned Dashboard
        working-directory: dashboard
        run: npm ci --no-audit --no-fund
      - name: Focused Shop privacy AR EN and existing Shop D04 D13 regressions
        working-directory: dashboard
        run: >-
          npx vitest run
          src/test/dispatch-d06-shop-financial-redaction.test.tsx
          src/test/dispatch-shop-metadata-finance-v1.test.tsx
          src/test/dispatch-d13-accessibility.test.tsx
      - name: Production type check and build
        working-directory: dashboard
        run: |
          npx tsc --noEmit
          npm run build

  real-pg16-bearer:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      ENVIRONMENT: test
      SECRET_KEY: DispatchD06CompanyShopFinancialScopedPG16BearerSecret123456789
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_DISPATCH_P0_PG_GATE: "1"
      WANASAH_SHOP_FINANCE_PG_GATE: "1"
      WANASAH_DISPATCH_D07_PG_GATE: "1"
      WANASAH_DISPATCH_D06_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://p0_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed narrow Backend
        working-directory: wa_backend
        run: >-
          python -m py_compile
          api/dispatch.py
          domains/dispatch_shop_read_scope.py
          domains/authorization/capabilities.py
          tests/test_dispatch_d06_secure_shop_reads_postgres.py
      - name: Install locked Backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx psycopg[binary]
      - name: Disposable PG16
        run: |
          docker run --detach --name dispatch-d06-pg16 \
            --env POSTGRES_USER=p0_dispatch_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 postgres:16 -p 55439
          for attempt in $(seq 1 35); do
            if docker exec dispatch-d06-pg16 pg_isready -U p0_dispatch_admin -d wanasah_no_lot_contract_test -p 55439; then exit 0; fi
            sleep 1
          done
          docker logs dispatch-d06-pg16
          exit 1
      - name: Restricted runtime role, additive migration and grants
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as connection:
              connection.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY
          cd wa_backend
          alembic upgrade head
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Prove PG16 restricted FORCE RLS and no implicit financial grants
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL"]).set(
              drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn) as db:
              user, version, superuser, bypass = db.execute(
                  "SELECT current_user, current_setting('server_version_num')::int, "
                  "rolsuper, rolbypassrls FROM pg_roles WHERE rolname=current_user"
              ).fetchone()
              assert user == "wanasah_app" and 160000 <= version < 170000 and not superuser and not bypass
              for table in ("shops", "visits", "dispatch_routes", "shortage_requests",
                            "inventory_balances", "inventory_movements"):
                  assert db.execute(
                      "SELECT relrowsecurity,relforcerowsecurity FROM pg_class WHERE oid=to_regclass(%s)",
                      (table,),
                  ).fetchone() == (True, True), table
              assert db.execute("SELECT count(*) FROM permissions WHERE code = 'shop.financial.read'").fetchone() == (1,)
              assert db.execute(
                  "SELECT count(*) FROM role_permissions rp "
                  "JOIN permissions p ON p.id=rp.permission_id "
                  "WHERE p.code='shop.financial.read'"
              ).fetchone() == (0,)
          print("D06_PG16_RLS_PERMISSION_NO_DEFAULT_GRANTS=PASS")
          PY
      - name: Actual signed Backoffice Bearer scope, finance and revoke in same token
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q --tb=short -s
          tests/test_dispatch_d06_secure_shop_reads_postgres.py
          --junitxml=d06-real-pg16.xml
      - name: No skip manifest
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path("d06-real-pg16.xml")
          assert p.exists(), "No real D06 PG16 evidence"
          cases=list(ET.parse(p).getroot().iter("testcase"))
          assert len(cases)==2, len(cases)
          assert not any(c.find(k) is not None for c in cases
                         for k in ("failure","error","skipped"))
          print("D06_REAL_PG16_CASES=2 PASS skipped=0")
          PY

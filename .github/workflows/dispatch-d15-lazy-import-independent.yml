name: D15 #919 independent lazy JS and real content gate

on:
  push:
    branches: ["worker2/d15-919-lazy-import-independent-final"]

permissions:
  contents: read

jobs:
  real-d15-lazy-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WANASAH_DISPATCH_D14_BROWSER_GATE: "1"
      WANASAH_DISPATCH_P0_PG_GATE: "1"
      WANASAH_DISPATCH_D07_PG_GATE: "1"
      WANASAH_SHOP_FINANCE_PG_GATE: "1"
      ENVIRONMENT: test
      SECRET_KEY: D14SyntheticRealBrowserPG16Key1234567890123456789012345
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://d14_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://d14_dispatch_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_DISPATCH_D14_BROWSER_STATE: /tmp/dispatch-d14-browser-private.json
      PYTHONPATH: ${{ github.workspace }}/wa_backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Immutable exact Worker1 source plus test-only ownership
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          source="d3d29e380c90f879b01f4a5bda306f1ff977b0e8"
          changed=subprocess.check_output(["git","diff","--name-only",source,"HEAD"],text=True).splitlines()
          expected=[".github/workflows/dispatch-d15-lazy-import-independent.yml","dashboard/e2e/dispatch-d15-lazy-import-independent.spec.ts"]
          assert sorted(changed)==sorted(expected),(source,changed)
          print("D15_919_EXACT_PRODUCTION="+source+"; only test-only files="+str(changed))
          PY
      - name: Install canonical dependencies
        run: |
          python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx
          python -m py_compile wa_backend/tests/test_dispatch_d14_browser_fixture.py
      - name: Start temporary PostgreSQL16
        run: |
          docker run --detach --name dispatch-d14-pg \
            --env POSTGRES_USER=d14_dispatch_admin \
            --env POSTGRES_DB=wanasah_no_lot_contract_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 127.0.0.1:55439:55439 postgres:16 -p 55439
          for attempt in $(seq 1 35); do
            if docker exec dispatch-d14-pg pg_isready -U d14_dispatch_admin -d wanasah_no_lot_contract_test -p 55439; then exit 0; fi
            sleep 1
          done
          docker logs dispatch-d14-pg
          exit 1
      - name: Create restricted non-bypass database role
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS")
          PY
      - name: Migrate canonical schema
        working-directory: wa_backend
        run: |
          alembic upgrade head
          alembic check
      - name: Grant restricted runtime DML
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          dsn = make_url(os.environ["DATABASE_URL_MIGRATION"]).set(drivername="postgresql").render_as_string(hide_password=False)
          with psycopg.connect(dsn, autocommit=True) as db:
              db.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              db.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO wanasah_app")
              db.execute("GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app")
          PY
      - name: Seed ONE real PG16 company Shop finance and route-scoped fixture
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s --tb=short
          tests/test_dispatch_d14_browser_fixture.py
          --junitxml=d14-real-pg16.xml
      - name: Start real FastAPI
        working-directory: wa_backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 4174 > /tmp/dispatch-d14-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4174/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dispatch-d14-api.log
          exit 1
      - name: Install Dashboard and real Chromium
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build actual immutable HEAD production Dashboard
        working-directory: dashboard
        env:
          VITE_API_URL: http://127.0.0.1:4174
        run: |
          npm run build
      - name: Independent asset sizes and HTML bootstrap by actual gzip bytes
        run: |
          python - <<'PY'
          import gzip,json,re
          from pathlib import Path
          dist=Path("dashboard/dist")
          html=(dist/"index.html").read_text()
          scripts=re.findall(r'<script\b[^>]*\bsrc="([^"]+\.js)"',html)
          preloads=re.findall(r'<link\b[^>]*rel="modulepreload"[^>]*href="([^"]+\.js)"',html)
          if len(scripts)!=1: raise AssertionError(("entry count",scripts))
          paths=[(dist/x.lstrip("/")) for x in scripts+preloads]
          assets=dist/"assets"
          dispatch=list(assets.glob("DispatchBoard-*.js"))
          assert len(dispatch)==1,("DispatchBoard must be a separate deferred JS chunk",dispatch)
          def describe(f):
              return {"name":f.name,"raw":f.stat().st_size,"gzip":len(gzip.compress(f.read_bytes(),compresslevel=9))}
          data={"entry":describe(paths[0]),"bootstrap":[describe(x) for x in paths],
                "bootstrapGzip":sum(describe(x)["gzip"] for x in paths),
                "dispatchChunk":describe(dispatch[0]),
                "products":[describe(f) for f in assets.glob("ProductsPage-*.js")],
                "inventory":[describe(f) for f in assets.glob("InventoryPage-*.js")],
                "preloadUrls":preloads}
          print("D15_919_BUNDLE="+json.dumps(data,ensure_ascii=False))
          assert not any("DispatchBoard" in str(f) for f in paths),"Dispatch chunk must not be HTML-preloaded"
          PY
      - name: Serve production Dashboard for Chromium
        working-directory: dashboard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/d15-919-lazy-ui.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/dispatch >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/d15-919-lazy-ui.log
          exit 1
      - name: REAL Chromium initial non-Dispatch network and deferred JS frame gate
        working-directory: dashboard
        run: |
          xvfb-run -a npx playwright test e2e/dispatch-d15-lazy-import-independent.spec.ts --headed --workers=1 --reporter=list --output=node_modules/.cache/d15-919-lazy-traces
      - name: Preserve screenshot of actual JS held/resolved, frame traces and network bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-d15-final-lazy-independent-${{ github.run_id }}
          path: |
            dashboard/node_modules/.cache/d15-919-lazy-final/
            dashboard/node_modules/.cache/d15-919-lazy-traces/
            wa_backend/d14-real-pg16.xml
            /tmp/d15-919-lazy-ui.log
            /tmp/dispatch-d14-api.log
          if-no-files-found: warn

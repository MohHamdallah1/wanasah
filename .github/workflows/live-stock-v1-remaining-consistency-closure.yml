name: Live Stock V1 remaining business and read consistency closure

on:
  pull_request:
    branches: [main]
    paths:
      - "wa_backend/tests/test_live_stock_v1_two_purchase_stocktake_continuous_postgres.py"
      - "wa_backend/tests/test_live_stock_v1_remaining_consistency_postgres.py"
      - ".github/workflows/live-stock-v1-remaining-consistency-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-stock-v1-remaining-consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuous-two-purchase-accounting:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: field_gate_admin
          POSTGRES_DB: wanasah_field_contracts
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55475:5432"]
        options: >-
          --health-cmd "pg_isready -U field_gate_admin -d wanasah_field_contracts"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: RemainingAccountingClosureKey123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://field_gate_runtime@127.0.0.1:55475/wanasah_field_contracts
      DATABASE_URL_MIGRATION: postgresql+asyncpg://field_gate_admin@127.0.0.1:55475/wanasah_field_contracts
      WANASAH_FIELD_CONTRACT_PG_GATE: "1"
      WANASAH_REMAINING_ACCOUNTING_PG_GATE: "1"
      PYTHONPATH: ".:tests"

    defaults:
      run:
        working-directory: wa_backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned backend and test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1

      - name: Compile continuous accounting acceptance
        run: >-
          python -m py_compile
          tests/test_live_stock_v1_two_purchase_stocktake_continuous_postgres.py
          tests/test_costed_driver_sale_correction_real_c2_db.py
          tests/test_costed_driver_customer_return_c2_db.py
          tests/field_contract_postgres_fixture.py

      - name: Create restricted disposable runtime role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://field_gate_admin@127.0.0.1:55475/wanasah_field_contracts",
              autocommit=True,
          ) as db:
              db.execute(
                  "CREATE ROLE field_gate_runtime LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Canonical fresh Alembic schema and parity
        run: |
          alembic upgrade head
          alembic check

      - name: Seed isolated synthetic C2 fixture
        run: python -m tests.field_contract_postgres_fixture

      - name: Run one continuous FIFO and moving-average history
        run: >-
          python -m pytest -q -s
          tests/test_live_stock_v1_two_purchase_stocktake_continuous_postgres.py
          --junitxml=remaining-accounting-postgres.xml

      - name: Reject skips failures and empty execution
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("remaining-accounting-postgres.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No remaining-accounting PostgreSQL acceptance executed"
          assert not list(root.iter("skipped")), "Remaining-accounting acceptance must not skip"
          assert not list(root.iter("failure")) and not list(root.iter("error")),               "Remaining-accounting PostgreSQL acceptance failed"
          print("REMAINING_ACCOUNTING_POSTGRES_EXECUTED=" + str(len(cases)))
          PY

      - name: Retain continuous accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-accounting-postgres-${{ github.sha }}
          path: wa_backend/remaining-accounting-postgres.xml
          if-no-files-found: error

  committed-read-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: RemainingReadConsistencyKey123456789012345678901234567890
      DATABASE_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      DATABASE_URL_MIGRATION: postgresql+asyncpg://remaining_read_admin@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_GATE: "1"
      WANASAH_REMAINING_CONSISTENCY_PG_GATE: "1"
      WANASAH_NO_LOT_PG_URL: postgresql+asyncpg://wanasah_app@127.0.0.1:55439/wanasah_no_lot_contract_test
      WANASAH_NO_LOT_PG_ADMIN_URL: postgresql+asyncpg://remaining_read_admin@127.0.0.1:55439/wanasah_no_lot_contract_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused backend dependencies
        run: python -m pip install -r wa_backend/requirements.txt alembic pytest pytest-asyncio httpx

      - name: Compile remaining consistency acceptance
        working-directory: wa_backend
        run: >-
          python -m py_compile
          tests/test_live_stock_v1_remaining_consistency_postgres.py
          tests/live_stock_r1_support.py
          tests/test_inbound_no_lot_frozen_postgres.py

      - name: Start disposable PostgreSQL 16
        run: |
          docker run --detach --name remaining-read-postgres             --env POSTGRES_USER=remaining_read_admin             --env POSTGRES_DB=wanasah_no_lot_contract_test             --env POSTGRES_HOST_AUTH_METHOD=trust             --publish 127.0.0.1:55439:55439             postgres:16 -p 55439
          for attempt in $(seq 1 30); do
            if docker exec remaining-read-postgres pg_isready               -U remaining_read_admin -d wanasah_no_lot_contract_test -p 55439; then
              exit 0
            fi
            sleep 1
          done
          docker logs remaining-read-postgres
          exit 1

      - name: Create restricted runtime role
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = (
              make_url(os.environ["DATABASE_URL_MIGRATION"])
              .set(drivername="postgresql")
              .render_as_string(hide_password=False)
          )
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(
                  "CREATE ROLE wanasah_app LOGIN NOSUPERUSER NOCREATEDB "
                  "NOCREATEROLE NOINHERIT NOBYPASSRLS"
              )
          PY

      - name: Migrate disposable database
        working-directory: wa_backend
        run: alembic upgrade head

      - name: Grant restricted runtime DML
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          dsn = (
              make_url(os.environ["DATABASE_URL_MIGRATION"])
              .set(drivername="postgresql")
              .render_as_string(hide_password=False)
          )
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute("GRANT USAGE ON SCHEMA public TO wanasah_app")
              conn.execute(
                  "GRANT SELECT, INSERT, UPDATE, DELETE "
                  "ON ALL TABLES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT USAGE, SELECT, UPDATE "
                  "ON ALL SEQUENCES IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO wanasah_app"
              )
              conn.execute(
                  "INSERT INTO permissions(code) VALUES "
                  "('inventory.read'), ('inbound.create') "
                  "ON CONFLICT(code) DO NOTHING"
              )
          PY

      - name: Run committed read freshness disclosure and company-day proof
        working-directory: wa_backend
        run: >-
          python -B -m pytest -p no:cacheprovider -q -s
          tests/test_live_stock_v1_remaining_consistency_postgres.py
          --junitxml=remaining-read-postgres.xml

      - name: Reject skips failures and empty execution
        if: always()
        working-directory: wa_backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("remaining-read-postgres.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No remaining-read PostgreSQL acceptance executed"
          assert not list(root.iter("skipped")), "Remaining-read acceptance must not skip"
          assert not list(root.iter("failure")) and not list(root.iter("error")),               "Remaining-read PostgreSQL acceptance failed"
          print("REMAINING_READ_POSTGRES_EXECUTED=" + str(len(cases)))
          PY

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Retain committed-read evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-read-postgres-${{ github.sha }}
          path: wa_backend/remaining-read-postgres.xml
          if-no-files-found: error

name: Flutter V1 Auth Session Recovery

on:
  push:
    branches:
      - sol/flutter-v1-auth-session-recovery
  workflow_dispatch:
  pull_request:
    paths:
      - "wanasah_frontend/lib/blocs/auth/**"
      - "wanasah_frontend/lib/features/auth/**"
      - "wanasah_frontend/test/features/auth/**"
      - "wanasah_frontend/test/offline_owner_guard_test.dart"
      - "wanasah_frontend/lib/core/network/**"
      - "wanasah_frontend/lib/core/sync/**"
      - "wanasah_frontend/lib/repositories/sync_repository.dart"
      - "wanasah_frontend/lib/features/custody/data/transfer_decision_store.dart"
      - "wanasah_frontend/test/core/sync/**"
      - ".github/workflows/flutter-v1-auth-session-recovery.yml"

permissions:
  contents: read

jobs:
  auth-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wanasah_frontend

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Prepare CI-only environment asset
        run: printf 'API_BASE_URL=http://127.0.0.1:8000\n' > .env

      - name: Resolve locked Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Focused Auth and session tests
        run: >-
          flutter test
          test/features/auth
          test/offline_owner_guard_test.dart
          test/core/network/auth_interceptor_test.dart
          test/core/sync/durable_command_owner_test.dart

      - name: Offline, Visit correction and Transfer handshake regressions
        run: >-
          flutter test
          test/offline_durable_command_test.dart
          test/core/visit/visit_command_correction_test.dart
          test/features/custody/transfer_handshake_closure_test.dart

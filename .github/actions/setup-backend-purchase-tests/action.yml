name: Set up pinned Backend purchase tests
description: Install the existing Python and pinned test dependencies for purchase-reference acceptance.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install backend and focused test dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: python -m pip install -r wa_backend/requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1
